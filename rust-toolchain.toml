# The workspace's Rust toolchain, which rustup installs and selects for every
# cargo command in the tree and in the Build Server's snapshot of it: a release,
# so the compiler that builds a cargo package (the engine, a scheduling policy)
# is the one stated here, which the package's snapshot carries and the identity
# its modules are stored under records; no package manifest restates it.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
# Scheduling policies are WebAssembly modules: the Build Server builds a policy
# package for this target from its workspace snapshot, and the scheduler's tests
# build the arrival policy for it.
targets = ["wasm32-unknown-unknown"]
