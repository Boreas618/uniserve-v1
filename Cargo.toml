[workspace]
resolver = "3"
members = [
    "crates/cuda",
    "crates/daemon",
    "crates/engine",
    "crates/ipc",
    "crates/manager",
    "crates/models",
    "crates/nixl",
    "crates/proto",
    "crates/storage",
    "crates/storage-server",
    "crates/uniserve",
    "crates/worker",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
readme = "README.md"

[workspace.dependencies]
cuda = { path = "crates/cuda" }
daemon = { path = "crates/daemon" }
engine = { path = "crates/engine" }
ipc = { path = "crates/ipc" }
models = { path = "crates/models" }
nixl = { path = "crates/nixl" }
proto = { path = "crates/proto" }
storage = { path = "crates/storage" }
storage-server = { path = "crates/storage-server" }
worker = { path = "crates/worker" }

# ---- engine third-party deps ----
crossbeam-channel = "0.5"
sha2 = "0.10"
signal-hook-registry = "1.4.8"

# ---- daemon third-party deps ----
anyhow = "1.0.100"
async-stream = "0.3.6"
async-trait = "0.1.89"
arc-swap = "1.9.0"
asynk-strim-attr = "0.1.0"
axum = { version = "0.8.4", features = ["multipart"] }
base64 = "0.22.1"
# Byte views of plain numeric slices handed to device copies.
bytemuck = "1.25.0"
# Stable 64-bit FNV-1a, which keys pages and cache isolation across builds.
fnv = "1.0.7"
bitflags = { version = "2.10.0", features = ["serde"] }
bytes = "1.11.1"
clap = { version = "4.5.38", features = ["derive", "env"] }
criterion = "0.5.1"
educe = "0.6.0"
expect-test = "1.5.1"
fastokens = "0.3.2"
futures = "0.3.31"
hf-hub = { version = "0.5.0", default-features = false, features = ["tokio", "ureq", "rustls-tls"] }
http-body = "1.0.1"
humantime = "2.4.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
indexmap = "2.13.0"
itertools = "0.14.0"
libc = "0.2.177"
libloading = "0.8.9"
nvtx = { version = "2.0.0", default-features = false, features = ["std"] }
llm-multimodal = { git = "https://github.com/vllm-project/llm-multimodal", rev = "5b558989844d1c7af3e43d0f604069ffd9c06320" }
# Keep scheduler heap mappings out of transparent-huge-page collapse.
mimalloc = { version = "0.1.52", features = ["no_thp"] }
minijinja = { version = "2.0", features = ["unstable_machinery", "json", "builtins", "loader", "loop_controls", "preserve_order"] }
minijinja-contrib = { version = "2.0", features = ["pycompat"] }
# Mooncake Store's C API, loaded at run time (`libmooncake_store.so`, built
# with `WITH_STORE_C_SHARED`), so nothing links Mooncake.
mooncake_store = { git = "https://github.com/kvcache-ai/Mooncake", tag = "v0.3.13.post1", default-features = false, features = ["dlopen"] }
prometheus-client = "0.24.0"
png = "0.18.1"
# The cross-build interfaces' Protobuf messages and their compiler, which needs
# no `protoc`.
prost = "0.14.1"
prost-build = "0.14.1"
protox = "0.9.0"
# Image URL fetching shares the rustls/webpki TLS backend `hf-hub` already uses.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rmp-serde = "1.3.1"
# A profiling session's file: SQLite, built from its amalgamation so the
# worker library depends on no system SQLite.
rusqlite = { version = "0.41.0", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["event", "net"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
serde-json-fmt = "0.1.0"
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde_path_to_error = "0.1.20"
serde_with = "3.18.0"
socket2 = "0.6.3"
tempfile = "3.23.0"
thiserror = "2.0.16"
thiserror-ext = "0.3.0"
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros"] }
tokenizers = "0.22.0"
tokio = { version = "1.47.1", features = [
    "process",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.18", features = ["rt"] }
toml = "1.1.3"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }
tracing-futures = { version = "0.2.5", features = ["futures-03"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.22.0", features = ["v4"] }
validator = { version = "0.20.0", features = ["derive"] }
winnow = "1.0.2"

# The worker's only interface to Python; must match the apache-tvm-ffi
# release pinned in pyproject.toml.
tvm-ffi = "=0.1.14-post1"

[workspace.lints.clippy]
clone_on_ref_ptr = "warn"
large_futures = "warn"
mem_forget = "warn"
# Library code propagates errors; an invariant that makes a panic impossible
# is stated with `#[expect(.., reason = "..")]` at the site. Tests unwrap
# freely (`clippy.toml`).
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"

[profile.dev]
panic = "abort"

[profile.release]
lto = "thin"
panic = "abort"
