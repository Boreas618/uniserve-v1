# The workspace's root package is the `uniserve` executable, the fixed base of
# a deployment: the daemon, the Storage Server and the Build Server are its
# commands, each a module under `src/`. The engine is the executable of its own
# package (`crates/engine`, `uniserve-engine`), which the Build Server builds.
# The libraries are the members under `crates/`, a crate per process boundary
# or interface.
[workspace]
resolver = "3"
members = [
    "crates/platform",
    "crates/daemon",
    "crates/engine",
    "crates/manager",
    "crates/media",
    "crates/models",
    "crates/nn",
    "crates/ops",
    "crates/processing",
    "crates/build-server",
    "crates/proto",
    "crates/scheduling",
    "crates/scheduling/policies/arrival",
    "crates/service",
    "crates/storage",
    "crates/storage-server",
    "crates/tensor",
    "crates/testkit",
]

[package]
name = "uniserve"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
daemon.workspace = true
libc.workspace = true
# The FFmpeg libraries the daemon links through the media crate; `build.rs` reads their
# directories from its `links` metadata for the executable's run path.
media.workspace = true
mimalloc.workspace = true
# The request-processing side of the families, which the daemon serves.
processing.workspace = true
# The host's devices, whose architectures a Build Server this executable runs builds for.
platform.workspace = true
build-server.workspace = true
serde.workspace = true
serde_json.workspace = true
service.workspace = true
storage-server.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The process's own memory mappings, which the allocator test reads through the kernel's
# process file system.
procfs.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros"] }

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
readme = "README.md"

[workspace.dependencies]
platform = { path = "crates/platform" }
tensor = { path = "crates/tensor" }
daemon = { path = "crates/daemon" }
engine = { path = "crates/engine" }
media = { path = "crates/media" }
nn = { path = "crates/nn" }
ops = { path = "crates/ops" }
models = { path = "crates/models" }
processing = { path = "crates/processing" }
build-server = { path = "crates/build-server" }
proto = { path = "crates/proto" }
scheduling = { path = "crates/scheduling" }
testkit = { path = "crates/testkit" }
service = { path = "crates/service" }
storage = { path = "crates/storage" }
storage-server = { path = "crates/storage-server" }

# ---- engine third-party deps ----
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
sha2 = "0.10"
signal-hook-registry = "1.4.8"

# ---- tensor element types ----
# The FP8 and 16-bit float types of the tensor library's element types. The crates that compute
# host values of those elements take the same versions, so they round as the library does.
float8 = "0.7.0"
half = "2.5.0"

# ---- daemon third-party deps ----
# A push JSON parser, which reads a streamed tool call's object byte by byte as it is generated.
actson = "2.1.0"
anyhow = "1.0.100"
async-stream = "0.3.6"
async-trait = "0.1.89"
arc-swap = "1.9.0"
asynk-strim-attr = "0.1.0"
axum = { version = "0.8.4", features = ["multipart"] }
base64 = "0.22.1"
# Byte views of plain numeric slices handed to device copies.
bytemuck = "1.25.0"
bitflags = { version = "2.10.0", features = ["serde"] }
bytes = "1.11.1"
clap = { version = "4.5.38", features = ["derive", "env"] }
criterion = "0.5.1"
educe = "0.6.0"
expect-test = "1.5.1"
fastokens = "0.3.2"
futures = "0.3.31"
hf-hub = { version = "0.5.0", default-features = false, features = ["tokio", "ureq", "rustls-tls"] }
http-body = "1.0.1"
http-body-util = "0.1.3"
httparse = "1.10.1"
hyper = "1.10.1"
hyper-util = "0.1.20"
humantime = "2.4.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
indexmap = "2.13.0"
# The IANA special-purpose address registries, which the media connector refuses fetches into.
iprfc = "1.0.0"
itertools = "0.14.0"
# JSON Schema validation of tool-call arguments against the schemas a request's tools declare;
# a schema is the request's own, so no reference is resolved over the network or the file system.
jsonschema = { version = "0.61.2", default-features = false }
libc = "0.2.177"
libloading = "0.8.9"
nvtx = { version = "2.0.0", default-features = false, features = ["std"] }
llm-multimodal = { git = "https://github.com/vllm-project/llm-multimodal", rev = "5b558989844d1c7af3e43d0f604069ffd9c06320" }
# Keep scheduler heap mappings out of transparent-huge-page collapse.
mimalloc = { version = "0.1.52", features = ["no_thp"] }
# `stacker` grows a rendering thread's stack as a template recurses, so a deeply nested chat
# template renders on any thread at minijinja's own recursion bound.
minijinja = { version = "2.0", features = ["unstable_machinery", "json", "builtins", "loader", "loop_controls", "preserve_order", "stacker"] }
minijinja-contrib = { version = "2.0", features = ["pycompat"] }
# Mooncake Store's C API, loaded at run time (`libmooncake_store.so`, built
# with `WITH_STORE_C_SHARED`), so nothing links Mooncake.
mooncake_store = { git = "https://github.com/kvcache-ai/Mooncake", tag = "v0.3.13.post1", default-features = false, features = ["dlopen"] }
# The greatest common divisor a video's display aspect is reduced by.
num-integer = "0.1.46"
prometheus-client = "0.24.0"
png = "0.18.1"
# The cross-build interfaces' Protobuf messages and their compiler, which needs
# no `protoc`.
prost = "0.14.1"
prost-build = "0.14.1"
protox = "0.9.0"
# Image URL fetching shares the rustls/webpki TLS backend `hf-hub` already uses.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rmp-serde = "1.3.1"
# A profiling session's file: SQLite, built from its amalgamation so the
# engine depends on no system SQLite.
rusqlite = { version = "0.41.0", features = ["bundled"] }
# The safetensors format: the header a checkpoint file starts with, and its tensors.
safetensors = "0.8.0"
procfs = { version = "0.18", default-features = false }
rustix = { version = "1.1.4", features = ["event", "net", "system"] }
serde = { version = "1.0.228", features = ["derive"] }
# The field names a derived `Deserialize` takes, which the video request's multipart form and
# its capability report read from the schema.
serde-aux = { version = "4.7.0", default-features = false }
serde_bytes = "0.11"
serde-json-fmt = "0.1.0"
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde_path_to_error = "0.1.20"
serde_with = "3.18.0"
socket2 = "0.6.3"
# Names derived from enum variants (a storage request's name in the server's log), and the count
# and iteration of an enum whose variants index a layout, derived from its declaration.
strum = { version = "0.27.2", features = ["derive"] }
tempfile = "3.23.0"
thiserror = "2.0.16"
thiserror-ext = "0.3.0"
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros"] }
tokenizers = "0.22.0"
tokio = { version = "1.47.1", features = [
    "process",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.18", features = ["rt"] }
toml = "1.1.3"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = { version = "0.1.44", features = ["release_max_level_debug"] }
tracing-futures = { version = "0.2.5", features = ["futures-03"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.22.0", features = ["v4"] }
validator = { version = "0.20.0", features = ["derive"] }
# The runtime of the scheduling policy modules: the engine's policy host
# (`engine::scheduler::policy`) configures it, compiles the wasm32 modules the Build Server
# builds, instantiates them and calls them. Only the JIT, the runtime and `std`: no WASI, no
# async.
wasmtime = { version = "50.0.1", default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
] }
# The WebAssembly text assembler the policy host's tests build their fault modules with.
wat = "1.263.0"

[workspace.lints.clippy]
clone_on_ref_ptr = "warn"
large_futures = "warn"
mem_forget = "warn"
# Library code propagates errors; an invariant that makes a panic impossible
# is stated with `#[expect(.., reason = "..")]` at the site. Tests unwrap
# freely (`clippy.toml`).
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"

[profile.dev]
panic = "abort"

[profile.release]
lto = "thin"
panic = "abort"
