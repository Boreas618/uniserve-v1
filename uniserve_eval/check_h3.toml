# MiniMax-H3 check set: the fixed requests that confirm every combination
# the service offers by watching and listening to the generated MP4s.
#
# One point per cell: FastH3 DMD (FastVideo/FastVideo-FastH3-8-Step-V2)
# serves t2va and fl2va, FastH3 OmniRef
# (FastVideo/FastVideo-FastH3-Omni-8-Step-V1) serves ref2va, and base
# MiniMax-H3 (MiniMaxAI/MiniMax-H3) serves t2va and fl2va through its
# transformer partition and ref2va through its transformer_ref partition.
# Each point first sends one unmeasured warmup at seed 42 and then measures
# one request at seed 0. The rows are frozen in
# uniserve_eval/workloads/minimax_h3/check-*.jsonl as exact copies of the
# seed-0 rows of W1 (t2va, official prompt, 16:9, 5 s), W3 (fl2va, official
# first keyframe, auto canvas, 8 s) and W4 (ref2va, reference image and
# voice, auto canvas, 5 s) and of their seed-42 warmup rows, so the check set
# does not depend on the order or content of the performance manifests.
#
# Every point writes its MP4 to a fixed per-cell directory, so a confirmed cell
# keeps the same path for people to watch: artifacts/minimax_h3/check/
# <checkpoint>-<task>/<request id>.mp4 in check-h3, and
# artifacts/minimax_h3/check-reversed/<checkpoint>-<task>/<request id>.mp4 in
# check-h3-reversed. Both suites' result bundles go to artifact_root, under
# the point's own name. The automatic checks are exactly the ones the video
# task already makes (MP4 validity: size, frame count, frame rate, stereo
# soundtrack, and the shape the server reports generating) and the protected
# performance metrics; nothing else is added.
#
# The launch's default dtype is bfloat16 and an empty quantization loads
# the model's first precision preset, quality (DiT and text encoder BF16, video
# VAE decoder FP16), so no server states either: every cell measures the
# representation the shipped performance profiles serve, and a cell states only
# what its own path was measured to need.
#
# No server pins --worker-executable either: the worker processes must run the
# same build as the daemon, so a deployment launched with --executable runs the
# new build end to end. Without the flag each worker runs the daemon's own
# executable, which is the binary UNISERVE_EXECUTABLE names.
#
# Environment:
# - The servers read FastVideo/FastVideo-FastH3-8-Step-V2,
#   FastVideo/FastVideo-FastH3-Omni-8-Step-V1 and MiniMaxAI/MiniMax-H3
#   from the local Hugging Face cache that HF_HOME locates: MiniMax-H3 at revision
#   42ed227ee7df40d41602854ae760620d6eb651fe, and the MiniMax-H3 revision the
#   OmniRef export pins.
# - UNISERVE_MINIMAX_H3_INPUTS names the protocol inputs directory, whose
#   media/ holds the keyframe, reference image and reference voice the check
#   rows name.
# - UNISERVE_MINIMAX_H3_FFMPEG names the bin directory of the FFmpeg 8.1.2
#   build whose ffprobe probes condition media and whose ffmpeg decodes them.
#
# Run the points serially, one server at a time; --reuse-deployment keeps
# one server up for the consecutive points that name it, so each checkpoint
# loads once:
#
#   .venv/bin/uniserve-eval --config uniserve_eval/check_h3.toml plan check-h3
#   .venv/bin/uniserve-eval --config uniserve_eval/check_h3.toml run check-h3 \
#     --reuse-deployment
#
# and then, on the delivered service, the same six points reversed:
#
#   .venv/bin/uniserve-eval --config uniserve_eval/check_h3.toml plan check-h3-reversed
#   .venv/bin/uniserve-eval --config uniserve_eval/check_h3.toml run check-h3-reversed \
#     --reuse-deployment
root = ".."
artifact_root = "artifacts/minimax_h3/check/results"

# ------------------------------------------------------------------ FastH3 DMD
# The 8-step student's transformer partition on four GB200 GPUs, sized for
# the two cells it serves: W1's 1024-token text capacity and W3's 2048-token
# capacity with the keyframe media its conditions name.
[servers.fasth3-dmd]
host = "127.0.0.1"
port = 18083
ready_path = "/health"
command = ["${UNISERVE_EXECUTABLE}", "serve", "FastVideo/FastVideo-FastH3-8-Step-V2", "--served-model-name", "FastH3", "--host", "127.0.0.1", "--port", "18083", "--worker-groups", "configs/minimax_h3/ulysses4.toml", "--max-running-requests", "2", "--max-model-len", "2048", "--set", "video_config.text_capacities=1024,2048", "--set", "video_config.max_seconds=8", "--set", "media_config.directory=${UNISERVE_MINIMAX_H3_INPUTS}", "--set", "media_config.ffprobe=${UNISERVE_MINIMAX_H3_FFMPEG}/ffprobe", "--set", "media_config.ffmpeg=${UNISERVE_MINIMAX_H3_FFMPEG}/ffmpeg", "--mem-fraction-static", "0.70"]

# ----------------------------------------------------------------- FastH3 OmniRef
# The OmniRef student's transformer_ref partition on four GB200 GPUs, sized
# for W4: an 8192-token text capacity (the subject image's vision tokens are
# prompt tokens), 49,152 condition rows and the released pipeline's
# reference sizing.
[servers.fasth3-omniref]
host = "127.0.0.1"
port = 18083
ready_path = "/health"
command = ["${UNISERVE_EXECUTABLE}", "serve", "FastVideo/FastVideo-FastH3-Omni-8-Step-V1", "--served-model-name", "MiniMax-H3", "--host", "127.0.0.1", "--port", "18083", "--worker-groups", "configs/minimax_h3/ulysses4-reference.toml", "--max-running-requests", "2", "--max-model-len", "8192", "--set", "video_config.text_capacities=8192", "--set", "video_config.max_seconds=5", "--set", "video_config.max_condition_rows=49152", "--set", "media_config.directory=${UNISERVE_MINIMAX_H3_INPUTS}", "--set", "media_config.ffprobe=${UNISERVE_MINIMAX_H3_FFMPEG}/ffprobe", "--set", "media_config.ffmpeg=${UNISERVE_MINIMAX_H3_FFMPEG}/ffmpeg", "--mem-fraction-static", "0.70", "--set", "mm_processor_kwargs.enlarge_references=true"]

# ------------------------------------------------------------ base transformer
# The base release's transformer partition on four GB200 GPUs, sized for the
# two cells it serves: W1's 1024-token text capacity and W3's 2048-token
# capacity with the keyframe media its conditions name.
[servers.base-transformer]
host = "127.0.0.1"
port = 18083
ready_path = "/health"
command = ["${UNISERVE_EXECUTABLE}", "serve", "MiniMaxAI/MiniMax-H3", "--served-model-name", "MiniMax-H3", "--host", "127.0.0.1", "--port", "18083", "--worker-groups", "configs/minimax_h3/ulysses4.toml", "--max-running-requests", "2", "--max-model-len", "2048", "--set", "video_config.text_capacities=1024,2048", "--set", "video_config.max_seconds=8", "--set", "media_config.directory=${UNISERVE_MINIMAX_H3_INPUTS}", "--set", "media_config.ffprobe=${UNISERVE_MINIMAX_H3_FFMPEG}/ffprobe", "--set", "media_config.ffmpeg=${UNISERVE_MINIMAX_H3_FFMPEG}/ffmpeg", "--mem-fraction-static", "0.70"]

# -------------------------------------------------------- base transformer_ref
