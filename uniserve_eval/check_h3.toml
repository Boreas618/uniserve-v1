# -------------------------------------------------------------------- t2va cells
# W1's seed-0 row: the official t2va prompt at 16:9, 5 seconds.

# The base-reference cell runs FIRST in `points` **for the baseline**. Today's
# implementation keys `base-transformer` and `base-reference` under one load
# identity (one checkpoint, one `--set` set), and a weight the loader computes
# has no file, so two deployments computing different numbers under one label
# got one key. The candidate inherits no such ordering: it must pass these six
# cells in any order on retained weights, and its procedure carries a
# reversed-order run with the reference cell last.
#
# That ordering is one ordering
# this check set depends on. Its warmup fails with
# `invalid_video_output: nonzero_video_variance` — a constant frame and silence,
# no MP4 — when it runs after the other five cells on a host whose Storage
# Server still holds their retained pages and 61 GiB per GPU; it passes on a
# fresh host, and fails again on the same host once another cell has run.
#
# What it inherits is that retained state, not a selector: `base-transformer`
# and `base-reference` share the whole load identity on the same checkpoint
# (same defaults, and of the `--set` keys they have in common the media paths
# are identical and only the video capacities and durations are sized
# differently), so the two differ by retention alone. Running it first measures
# it on the clean host the protocol promises every cell; the other five keep
# the order they were measured in, and none of them is sensitive to the
# retention. The inheritance itself is a serving defect, not a property of this
# check set.
[benchmarks.check-base-ref2va]
server = "base-reference"
task = "video"
model = "MiniMax-H3"
dataset = "jsonl"
dataset_path = "uniserve_eval/workloads/minimax_h3/check-ref2va.jsonl"
endpoint = "/v1/videos/sync"

[benchmarks.check-base-ref2va.video]
size = "1344x768"
fps = 24
audio_sample_rate = 32000
audio_channels = 2
reference_root = "${UNISERVE_MINIMAX_H3_INPUTS}"
media_dir = "artifacts/minimax_h3/check/base-ref2va"

[benchmarks.check-base-ref2va.load]
num_prompts = 1
request_rate = inf
max_concurrency = 1
request_timeout_s = 3600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/check-ref2va-warmup.jsonl"

[benchmarks.check-base-ref2va.metrics]
videos_per_second = "higher"
"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

[benchmarks.check-base-ref2va.provenance]
checkpoint = "MiniMaxAI/MiniMax-H3"
task = "ref2va"

