request_timeout_s = 3600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/check-t2va-warmup.jsonl"

[benchmarks.check-base-t2va.metrics]
videos_per_second = "higher"
"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

[benchmarks.check-base-t2va.provenance]
checkpoint = "MiniMaxAI/MiniMax-H3"
task = "t2va"

