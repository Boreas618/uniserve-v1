num_prompts = 1
request_rate = inf
max_concurrency = 1
request_timeout_s = 3600
warmup_manifest = "uniserve_eval/workloads/minimax_h3/check-ref2va-warmup.jsonl"

[benchmarks.check-fasth3-omniref-ref2va-reversed.metrics]
videos_per_second = "higher"
"video_latency_ms.p50" = "lower"
"video_latency_ms.p95" = "lower"

[benchmarks.check-fasth3-omniref-ref2va-reversed.provenance]
checkpoint = "FastVideo/FastVideo-FastH3-Omni-8-Step-V1"
task = "ref2va"

# The six cells in two orders. `check-h3` is the order today's implementation is measured in: the
# reference cell first, because that implementation shares one Storage Server key between the two base
# servers on one checkpoint and a weight its loader computes has no file, so whichever of them runs
# second inherits the first's pages. That ordering is how the baseline is measured, not a property the
# delivered service is allowed to need.
#
# `check-h3-reversed` is the same six points with the reference cell last, and it is the candidate's
# obligation: the delivered service must pass every cell in any order, on retained weights. A run of
# `check-h3` alone says the baseline still measures what it measured; a run of `check-h3-reversed` that
# passes says the ordering requirement is gone.
[suites.check-h3]
points = ["check-base-ref2va", "check-fasth3-dmd-t2va", "check-fasth3-dmd-fl2va", "check-fasth3-omniref-ref2va", "check-base-t2va", "check-base-fl2va"]

[suites.check-h3-reversed]
points = ["check-fasth3-dmd-t2va-reversed", "check-fasth3-dmd-fl2va-reversed", "check-fasth3-omniref-ref2va-reversed", "check-base-t2va-reversed", "check-base-fl2va-reversed", "check-base-ref2va-reversed"]
