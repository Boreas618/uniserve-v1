# Eight one-GPU denoiser replicas sharing one TP8 text encoder on the same
# eight RTX PRO 6000 GPUs, under the throughput points' workload. A replica
# keeps its denoising local, so no denoiser collective crosses PCIe. A
# replica's workspace holds a whole 15-second sequence on one 96 GB GPU, so
# these deployments bound prompts at 10240 tokens (the workload's longest is
# 10000) and prepare only the workload's 16:9 canvas.
[servers.rtx-pro-6000-8-dp8-nvfp4]
host = "127.0.0.1"
port = 18083
command = [".venv/bin/uniserve", "serve", "${UNISERVE_FAST_H3_NVFP4_MODEL}", "--served-model-name", "FastH3", "--host", "127.0.0.1", "--port", "18083", "--worker-executable", ".venv/bin/uniserve", "--worker-groups", "configs/minimax_h3/fasth3-dp8-text-tp8.toml", "--max-running-requests", "8", "--max-model-len", "10240", "--set", "video_config.max_seconds=15", "--mem-fraction-static", "0.92", "--set", "dtype=bfloat16", "--set", "cuda_graph_config.policy=off", "--set", "video_config.text_capacities=1024", "--set", "video_config.aspect_ratios=16:9"]

[benchmarks.rtx-pro-6000-8-dp8-nvfp4-throughput-c8]
