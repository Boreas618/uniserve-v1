# FastH3 on NVIDIA H200 GPUs: the deployments and workload of the H200
# measurements in docs/minimax_h3/evaluation.md. The servers read
# FastVideo/FastVideo-FastH3-8-Step-V2 from the local Hugging Face cache that HF_HOME locates. BF16 servers select the
# quality tier (BF16 transformer and text, FP16 video projections); FP8
# servers override only the denoiser MLPs. Every request is a t2va request
# for a 1344x768, 24 fps output of the point's frame count (124, 243 or 362
# frames for 5, 10 and 15 s), under the checkpoint's own schedule. Run
# points serially, one server at a time.
# UNISERVE_EXECUTABLE names the uniserve binary every server runs, and its workers run the
# daemon's own executable; `--executable` names another for one run.
root = ".."
artifact_root = "artifacts/minimax_h3/fasth3-h200"

[servers.h200-ulysses4]
host = "127.0.0.1"
port = 18083
command = ["${UNISERVE_EXECUTABLE}", "serve", "FastVideo/FastVideo-FastH3-8-Step-V2", "--served-model-name", "FastH3", "--worker-groups", "configs/minimax_h3/ulysses4.toml", "--port", "18083", "--max-model-len", "1024", "--set", "video_config.text_capacities=1024", "--set", "video_config.max_seconds=5", "--max-running-requests", "2", "--mem-fraction-static", "0.92", "--set", "quantization.mode=quality"]

[servers.h200-ulysses4.environment]
CUDA_VISIBLE_DEVICES = "0,1,2,3"
OMP_NUM_THREADS = "1"
MAX_JOBS = "8"
NCCL_CUMEM_HOST_ENABLE = "1"

[benchmarks.h200-ulysses4-5s-1k]
server = "h200-ulysses4"
task = "video"
model = "FastH3"
dataset = "minimax-h3"
tokenizer = "FastVideo/FastVideo-FastH3-8-Step-V2/tokenizer"

[benchmarks.h200-ulysses4-5s-1k.video]
size = "1344x768"
num_frames = 124
fps = 24
audio_sample_rate = 32000
audio_channels = 2
prompt_tokens = 1000

[benchmarks.h200-ulysses4-5s-1k.load]
num_prompts = 3
request_rate = inf
max_concurrency = 1
warmup_requests = 1

[benchmarks.h200-ulysses4-5s-1k.metrics]
videos_per_second = "higher"
"video_latency_ms.mean" = "lower"

[suites.h200-ulysses4]
points = ["h200-ulysses4-5s-1k"]

[servers.h200-ulysses8]
