# Relative paths below are written against the repository that contains
# this file, which is its parent directory.
# UNISERVE_EXECUTABLE names the uniserve binary every server runs, and its workers run the
# daemon's own executable; `--executable` names another for one run.
root = ".."

# Declares serial benchmark servers, workload points, and named benchmark suites.
# Model and tokenizer placeholders resolve from the launch environment.
artifact_root = "artifacts/benchmark"

[servers.qwen]
host = "127.0.0.1"
port = 18081
command = ["${UNISERVE_EXECUTABLE}", "serve", "${UNISERVE_QWEN3_MODEL}", "--served-model-name", "Qwen3-30B-A3B", "--host", "127.0.0.1", "--port", "18081", "--tensor-parallel-size", "${UNISERVE_QWEN_TENSOR_PARALLEL_SIZE:-1}", "--set", "kv_cache_config.max_tokens=131072", "--max-running-requests", "128", "--set", "max_num_batched_tokens=16384", "--set", "scheduler_config.chunked_prefill_size=16384", "--set", "kv_cache_config.block_size=64", "--mem-fraction-static", "0.70", "--set", "dtype=bfloat16", "--set", "kv_cache_config.dtype=bfloat16", "--set", "flashinfer_config.workspace_size=${UNISERVE_QWEN_FLASHINFER_WORKSPACE_SIZE:-536870912}", "--set", "device_config.queue_depth=3", "--set", "chat_config.reasoning_parser=none"]

[servers.qwen.environment]
CUDA_VISIBLE_DEVICES = "${UNISERVE_QWEN_CUDA_VISIBLE_DEVICES:-0}"

[benchmarks.qwen-uniserve-sharegpt-r16]
server = "qwen"
task = "text"
model = "Qwen3-30B-A3B"
dataset = "sharegpt"
dataset_revision = "192ab2185289094fc556ec8ce5ce1e8e587154ca"
dataset_path = "${UNISERVE_SHAREGPT_DATASET:-}"
tokenizer = "${UNISERVE_QWEN3_MODEL}"

[benchmarks.qwen-uniserve-sharegpt-r16.load]
num_prompts = 200
request_rate = 16.0
warmup_requests = 1
seed = 42

[benchmarks.qwen-uniserve-sharegpt-r16.sampling]
temperature = 0.0
top_p = 1.0
top_k = 20
min_p = 0.0
repetition_penalty = 1.0
frequency_penalty = 0.0
presence_penalty = 0.0
sampling_seed = 42
ignore_eos = true
stream = true

[benchmarks.qwen-uniserve-sharegpt-r16.metrics]
output_throughput = "higher"
mean_ttft_ms = "lower"
mean_tpot_ms = "lower"

[benchmarks.qwen-uniserve-sharegpt-r32]
server = "qwen"
task = "text"
model = "Qwen3-30B-A3B"
dataset = "sharegpt"
dataset_revision = "192ab2185289094fc556ec8ce5ce1e8e587154ca"
tokenizer = "${UNISERVE_QWEN3_MODEL}"

[benchmarks.qwen-uniserve-sharegpt-r32.load]
num_prompts = 200
request_rate = 32.0
warmup_requests = 1
seed = 42

[benchmarks.qwen-uniserve-sharegpt-r32.sampling]
temperature = 0.0
top_p = 1.0
top_k = 20
min_p = 0.0
repetition_penalty = 1.0
frequency_penalty = 0.0
presence_penalty = 0.0
sampling_seed = 42
ignore_eos = true
stream = true

[benchmarks.qwen-uniserve-sharegpt-r32.metrics]
output_throughput = "higher"
mean_ttft_ms = "lower"
mean_tpot_ms = "lower"

[suites.decode-runtime]
points = ["qwen-uniserve-sharegpt-r16"]

[suites.serving-runtime]
points = ["qwen-uniserve-sharegpt-r16"]
