name: Nightly GPU Benchmarks

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  gpu-e2e:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 180
    env:
      PCRE2_SYS_STATIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra test --extra bench --extra gpu
      - run: cargo build -p uniserve
      - run: UNISERVE_BINARY=$PWD/target/debug/uniserve UNISERVE_RUN_GPU_E2E=1 uv run --no-sync pytest -m "e2e and gpu"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-e2e-artifacts
          path: e2e-artifacts/
