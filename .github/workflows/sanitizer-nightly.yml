name: Nightly compute-sanitizer

# The end-to-end cases marked `missing_state` (`just test-python-sanitizer`), with every main
# process under compute-sanitizer's memcheck, so that code assuming an optional derived state is
# present fails here first. The runner's environment states the host's facts, as for the nightly
# GPU end-to-end workflow (docs/testing.md).

on:
  schedule:
    - cron: "43 9 * * *"
  workflow_dispatch:

jobs:
  missing-state:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 1440
    env:
      UNISERVE_E2E_ARTIFACTS: ${{ github.workspace }}/artifacts/e2e/sanitizer-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12 --extra test --extra bench --extra gpu
      - run: uv sync --locked --python 3.12 --project crates/build-server/python
      - run: PYTHON=.venv/bin/python tools/gpu_e2e.sh --memcheck -m "e2e and gpu and missing_state"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memcheck
          path: ${{ env.UNISERVE_E2E_ARTIFACTS }}
