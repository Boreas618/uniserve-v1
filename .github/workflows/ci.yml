name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain, its components and the wasm32 target scheduling policies
      # are built for, as rust-toolchain.toml states them.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      # The runner has no FFmpeg 8.1, so the media crate builds the pinned FFmpeg 8.1.2 and
      # libx264 from source (its `vendored` feature), which assembles x86-64 kernels with nasm;
      # bindgen loads libclang to generate the NVTX and NIXL bindings.
      - run: sudo apt-get update && sudo apt-get install -y nasm libclang-18-dev
      - run: just fmt
      - run: just clippy --features media/vendored
      # Every test package runs past a failure, so one does not hide the others.
      - run: just test-rust --no-fail-fast --features media/vendored
      - run: just bench-build --features media/vendored

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The environment is synced without building the project: the `uniserve`
      # executable's build needs FFmpeg 8.1, which the runner lacks, and the
      # vendored FFmpeg serves builds that run from cargo's target directory
      # alone. The kernel checks that launch through the installed `uniserve`
      # (`tests/python/kernels/tensor`) need it.
      - run: uv sync --locked --no-install-project --extra dev --extra test
      - run: .venv/bin/python -m ruff check tests
      - run: .venv/bin/python -m ruff format --check tests
      - run: .venv/bin/python -m pytest -m "unit and not gpu"
