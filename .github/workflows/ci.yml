name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      # The tokenizer's PCRE2 is linked statically, as the shipped image links it.
      PCRE2_SYS_STATIC: "1"
      # The shared FFmpeg 8.1.2 with libx264 the media crate links, built below.
      UNISERVE_FFMPEG_DIR: ${{ github.workspace }}/../ffmpeg-prefix
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # nvtx-sys generates its bindings with libclang; x264 assembles with nasm.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev nasm pkg-config zlib1g-dev
      - id: ffmpeg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../ffmpeg-prefix
          key: ffmpeg-8.1.2-${{ runner.os }}-${{ hashFiles('crates/media/native/build.sh') }}
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          curl -L --fail -o "$RUNNER_TEMP/ffmpeg.tar.xz" https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz
          echo "464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP"
          FFMPEG_SOURCE="$RUNNER_TEMP/ffmpeg-8.1.2" crates/media/native/build.sh "$UNISERVE_FFMPEG_DIR"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo bench --workspace --no-run

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The project builds with uv: `uniserve-eval` is a workspace package that uv finds through
      # its sources and pip looks for on PyPI. The checks need the tools, not the Rust build.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-install-project --extra dev --extra test --extra bench
      - run: uv run --no-sync ruff check uniserve_eval tests
      - run: uv run --no-sync ruff format --check uniserve_eval tests
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -m "unit and not gpu"
