name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain, its components and the wasm32 target scheduling policies are built for
      # come from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The runner has no FFmpeg 8.1, so the media crate builds the pinned FFmpeg 8.1.2 and
      # libx264 from source (its `vendored` feature), which assembles x86-64 kernels with nasm.
      - run: sudo apt-get update && sudo apt-get install -y nasm
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features media/vendored -- -D warnings
      - run: cargo test --workspace --features media/vendored
      - run: cargo bench --workspace --no-run --features media/vendored

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The job checks the Python sources and needs no `uniserve` executable, so the locked
      # environment is synced without building the project itself (the rust job builds it).
      - run: uv sync --locked --python 3.12 --no-install-project --extra dev --extra test --extra bench
      - run: .venv/bin/python -m ruff check uniserve_eval tests
      - run: .venv/bin/python -m ruff format --check uniserve_eval tests
      - run: .venv/bin/python -m mypy
      - run: .venv/bin/python -m pytest -m "unit and not gpu"
