name: Nightly GPU end-to-end

# The GPU end-to-end tests (`just test-python-gpu`) on the self-hosted GPU runner. The runner's
# environment states the host's facts: `UNISERVE_FFMPEG_DIR` and the checkpoints and inputs
# docs/testing.md lists; a test whose asset the runner does not name is reported skipped.

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  gpu-e2e:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 360
    env:
      UNISERVE_E2E_ARTIFACTS: ${{ github.workspace }}/artifacts/e2e/nightly-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12 --extra test --extra bench --extra gpu
      - run: uv sync --locked --python 3.12 --project crates/build-server/python
      - run: PYTHON=.venv/bin/python tools/gpu_e2e.sh -m "e2e and gpu"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-e2e
          path: ${{ env.UNISERVE_E2E_ARTIFACTS }}
