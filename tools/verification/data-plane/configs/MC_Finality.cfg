SPECIFICATION FairSpec
CONSTANTS
    r1 = r1  r2 = r2  n1 = n1  n2 = n2
    d1 = d1  d2 = d2  d3 = d3  d4 = d4  h1 = h1  h2 = h2
    q1 = q1  f1 = f1  a = a  s1 = s1
    Replicas = {r1, r2}
    Nodes = {n1, n2}
    ReplicaNode <- MCReplicaNode
    Frames = {d1, d2, d3, d4}
    FrameReplica <- MCFrameReplica
    Slots = {h1, h2}
    SlotNode <- MCSlotNode
    Requests = {q1}
    Full <- MCFull
    Prefix <- MCPrefix
    Last <- MCLast
    Unkeyed = {"tail"}
    Prefixes = {a}
    Seeds = {s1}
    InitialSeed <- MCSeed
    InitialRole <- MCRole
    MaxSwitches = 0
    MaxMoves = 3
    Hazards = {}
INVARIANTS
    TypeOK
    Faithful Filled Integrity Reserved LeaseHeld Holding UnkeyedPushed OneKey
PROPERTIES
    Finality Released
CHECK_DEADLOCK FALSE
