[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# A node's main process for one epoch: its control thread, one scheduler per
# data-parallel rank, the executor each scheduler hands its batches to, one
# worker thread per device with the runners, captured graphs, sampler and device
# memory it serves from, and the generation update between them
# (`engine → nn → ops → platform`, beside the tensor library). The library
# dispatches by computational capability and names no concrete model; the
# package's executable, `uniserve-engine` (`src/main.rs`), registers the model
# families it loads.
#
# The crate is the engine package (`package.toml`): the Build Server builds
# the executable from a snapshot of this crate and the crates it depends on.
[[bin]]
name = "uniserve-engine"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# Byte views of plain numeric slices handed to device copies.
bytemuck.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
# A shadow comparison reads 16-bit floating elements as the tensor library does.
half.workspace = true
indexmap.workspace = true
libc.workspace = true
libloading.workspace = true
# The encoders, muxers and readers a media rank's host work runs on (`media::MediaRunner`), one
# per process.
media.workspace = true
mimalloc.workspace = true
# The model families the executable loads.
models.workspace = true
service.workspace = true
nn.workspace = true
nvtx.workspace = true
# The execution context a runner's forwards compute under, and tensors over memory a rank owns:
# weights, cache planes, recurrent state and a graph's inputs; the operators it launches.
ops.workspace = true
# Tensors: a runner's inputs and a forward's outputs, and the element type of a kernel operand
# (`DType`).
tensor.workspace = true
platform.workspace = true
# The one rule a checkpoint's root files resolve to a model family by (`process::catalogue`).
processing.workspace = true
build-server.workspace = true
proto.workspace = true
# The peer link's messages between the engine processes of an epoch, in MessagePack.
rmp-serde.workspace = true
# A profiling session's file.
rusqlite.workspace = true
rustix = { workspace = true, features = ["fs", "pipe", "system"] }
# The scheduling policy's interface: its parameters, limits and messages, and the phase a batch
# computes.
scheduling.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_bytes.workspace = true
serde_json.workspace = true
storage.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["sync"] }
# A package's arguments, which the daemon's `Prepare` carries as the TOML text of each value
# (`proto::module::PackageRevision::arguments`).
toml.workspace = true
tracing.workspace = true
# The runtime a scheduler compiles and instantiates its policy module in, configured by the
# policy host (`scheduler::policy`).
wasmtime.workspace = true

[dev-dependencies]
# A rank's start opens its session with a Storage Server the test runs in its own process, as do
# the device tests of the weight store.
storage-server.workspace = true
# A toy policy module in a test is written as `wat`.
wasmtime = { workspace = true, features = ["wat"] }
tempfile.workspace = true

[lints]
workspace = true
