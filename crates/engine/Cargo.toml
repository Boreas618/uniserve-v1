[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# A node's main process for one epoch: its control thread, its schedulers,
# one executor per device and its blocking pool, and the generation
# update between them. The library dispatches by computational capability and
# names no concrete model; the package's executable, `uniserve-engine`
# (`src/main.rs`), registers the model families it loads.
#
# The crate is the engine package (`package.toml`): the Build Server builds
# the executable from a snapshot of this crate and the crates it depends on.
[[bin]]
name = "uniserve-engine"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# The collective group a rank's runner issues its tensor group's collectives through.
backend.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
ipc.workspace = true
libc.workspace = true
# The encoders, muxers and readers a media rank's host work runs on (`media::MediaRunner`), one
# per process.
media.workspace = true
mimalloc.workspace = true
# The model families the executable loads.
models.workspace = true
service.workspace = true
nn.workspace = true
ops.workspace = true
# The element type of a kernel operand (`DType`).
tensor.workspace = true
platform.workspace = true
build-server.workspace = true
proto.workspace = true
# The engine policy modules are compiled for: the module set's policy is loaded with it, and a
# scheduler's tests load the packaged policies and their own toy modules with it.
scheduling.workspace = true
# The scheduling policy's interface: its parameters, limits and messages.
scheduling-guest.workspace = true
serde_json.workspace = true
storage.workspace = true
tokio = { workspace = true, features = ["sync"] }
# A package's arguments, which the daemon's `Prepare` carries as the TOML text of each value
# (`proto::module::PackageRevision::arguments`).
toml.workspace = true
tracing.workspace = true
# The runtime a scheduler instantiates its policy module in; the modules are compiled by the
# engine `scheduling::Engine` configures, at the workspace's one pin.
wasmtime.workspace = true
worker.workspace = true

[dev-dependencies]
# A test states the serving a family it resolves names.
processing.workspace = true
# A rank's start opens its session with a Storage Server the test runs in its own process.
storage-server.workspace = true
# A toy policy module in a test is written as `wat`.
wasmtime = { workspace = true, features = ["wat"] }
tempfile.workspace = true

[lints]
workspace = true
