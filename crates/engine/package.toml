# The engine package: the main process of an epoch, as the executable
# `uniserve-engine`.
#
# The package is this crate in a snapshot of its whole workspace, as an
# installation takes it. The Build Server builds it from that snapshot with the
# workspace's lockfile and vendored registry sources, offline, and stores the
# executable for the host's Rust target triple under the package's one key. A deployment selects it by
# `worker_config.engine` (and a revision by `worker_config.engine_revision`),
# and a change to any engine code is a new revision of this package, applied
# as an epoch.

op = "engine"
backend = "uniserve"
# The operators the executable launches the kernel packages of, with the version
# of each one's interface it launches, a file of the workspace: the executable
# compiles its operators' names and versions from it (`proto::module::operator`),
# and the Build Server lists it with each installed revision, so the daemon fixes
# an epoch's kernel packages, and validates its `[kernels]` pins, over the
# operators of the epoch's own engine revision, each among the package revisions
# of the version that revision launches.
operators = "crates/proto/src/module/operators.toml"
# The versions of the engine interface the executable speaks, its messages with
# the daemon (`proto::ENGINE_INTERFACE`), are stated by the executable itself as
# a window (`build_server::interface_section!` in `src/main.rs`), and the Build
# Server records the window it reads there; the Storage Server's protocol and
# the buffer pool's runtime interface have windows of their own, agreed at their
# own hellos.

# cargo at the release the workspace's `rust-toolchain.toml` selects.
[toolchain]
kind = "cargo"

[module]
form = "executable"

# The crate's files are the ones cargo packages, so none is listed here.
[source]
kind = "cargo"
files = []
binary = "uniserve-engine"
