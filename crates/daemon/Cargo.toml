[package]
name = "daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The persistent process of one node: process supervision, the node's
# Storage Server claim and the process interface between nodes and engines;
# on the leader, the HTTP server and its connections, the served model's
# facade over the engine processes, and the client of their request
# interface. The API and every request's input and output processing are the
# frontend's (`frontend::openai::Server` is what the daemon supplies).
[dependencies]
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
frontend.workspace = true
futures.workspace = true
http-body.workspace = true
libc.workspace = true
# The Build Server's client, which an epoch's modules are selected with
# (`epoch`, the generation layer of a change).
build-server.workspace = true
prometheus-client.workspace = true
prost.workspace = true
processing.workspace = true
proto.workspace = true
service.workspace = true
reqwest = { workspace = true, features = ["http2", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
storage.workspace = true
tempfile.workspace = true
thiserror.workspace = true
thiserror-ext.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# The application crate's test fixtures, such as the byte tokenizer.
frontend = { workspace = true, features = ["testing"] }
# The schedulers a test engine runs, over the batch-interface fake.
scheduler.workspace = true
# The batch-interface fake, the engine's request-interface stand-in and the
# packaged policy a test epoch installs.
testkit.workspace = true
# Tests drive the request interface with in-process schedulers and build
# their worker values.
ipc.workspace = true
# The supervisor's stand-in rank process creates an interprocess event on a
# device, as a rank does.
platform.workspace = true

[lints]
workspace = true
