[package]
name = "daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The persistent process of one node: process supervision, the node's
# Storage Server claim and the process interface between nodes and engines;
# on the leader, the HTTP server and its connections, the API server (`api`:
# the OpenAI-compatible routes, input processing, output processing,
# tokenizers and the wire protocol), the served model over the engine
# processes, and the client of their request interface. The API server runs
# no numerical code and links no model family: a family's request side is the
# epoch's processing program (`api::program`), which the daemon loads with each
# epoch's module set.
[dependencies]
anyhow.workspace = true
# The record batches of the observation tables and their JSON and Arrow IPC encodings.
arrow.workspace = true
asynk-strim-attr.workspace = true
# The `TableProvider` trait of DataFusion, which the observation tables implement, is an async trait.
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
# The SQL engine the observation tables are queried with (`observation`).
datafusion.workspace = true
# The tokenizer's decoder chain, which the served tokenizer loads.
fastokens.workspace = true
futures.workspace = true
# The times a revision's record states, in RFC 3339.
humantime.workspace = true
# The checkpoint's own files and the Hub's cache layout.
hf-hub.workspace = true
http-body.workspace = true
# The HTTP/1.1 request heads, chunk sizes and trailer sections the daemon's
# own connections parse (`http::conn`).
httparse.workspace = true
image.workspace = true
# The ordered tables of a checkpoint's tokenizer files, read in the order the file states them.
indexmap = { workspace = true, features = ["serde"] }
# The IANA special-purpose address registries: the destinations a media fetch may not reach.
iprfc.workspace = true
itertools.workspace = true
libc.workspace = true
# This host's name (`uname(2)`), the default host identity; a handed
# connection's socket family; the monotonic clock a handoff's pause is
# measured on.
rustix = { workspace = true, features = ["net", "time"] }
llm-multimodal.workspace = true
# The media decoders condition media is probed with, the ones that read it.
media.workspace = true
# The Build Server's client, which an epoch's modules are selected with
# (`epoch`, the generation layer of a change).
build-server.workspace = true
# The OTLP messages of the observation store's push (`observation::export`).
opentelemetry-proto.workspace = true
prost.workspace = true
# The program host, which runs the policy package's control and routing programs and each
# epoch's processing program on the leader (`programs`, `api::program`), and the program SDK
# whose inputs and outputs they read and give.
program.workspace = true
scheduling.workspace = true
proto.workspace = true
service.workspace = true
reqwest = { workspace = true, features = ["http2", "rustls-tls"] }
# The header of a checkpoint's safetensors file, read without its tensors.
safetensors.workspace = true
serde.workspace = true
# The video request schema's field names (`protocol::video`).
serde-aux.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
# The form-encoded parameters of `/admin/query`.
serde_urlencoded.workspace = true
# The archive a policy package travels in (`PUT /admin/policy`, `GET /admin/policy`).
tar.workspace = true
serde_with.workspace = true
sha2.workspace = true
# The Storage Server's claim and protocol; content digests of media, in the key chain the cache
# stores pages under.
storage.workspace = true
thiserror.workspace = true
thiserror-ext.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-futures.workspace = true
url.workspace = true
uuid.workspace = true
# The Dynamo sidecar (`sidecar`): the checksums its model cards state of the checkpoint's files
# (BLAKE3), the hash Dynamo's router keys a page's tokens by (XXH3), and the ZMQ sockets it reads
# the schedulers' KV events from and publishes Dynamo's events on.
blake3.workspace = true
rmp-serde.workspace = true
serde_bytes.workspace = true
xxhash-rust.workspace = true
zeromq.workspace = true
validator.workspace = true

[dev-dependencies]
criterion.workspace = true
# The wasm32 modules of the processing programs the tests serve (`api::test_support::program`),
# built by the cargo that runs the tests.
program-testing.workspace = true
# The paused clock of the tests that wait on a deadline (`tokio::time::pause`).
tokio = { workspace = true, features = ["test-util"] }
expect-test.workspace = true
# The client side of the HTTP/1.1 connections the fixtures serve their requests over
# (`test_support::send`): the requests go through the daemon's own connection.
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
# Test images with chunks placed where a test states them (an `eXIf` before or after the image
# data, a header of a size no decoder would allocate).
png.workspace = true
# The scratch directories of the tests' files and sockets.
tempfile.workspace = true
# Builds the deterministic serving tokenizers of the test fixtures (`api::test_support`).
tokenizers.workspace = true
# The test engine: the engine's own control thread over a fake executor and
# an in-process buffer pool; and the fake engine and node daemon at the
# process interface an update's tests drive.
testkit.workspace = true
# The supervisor's stand-in rank process creates an interprocess event on a
# device, as a rank does.
platform.workspace = true

[[bench]]
name = "tokenizer_hf"
harness = false


# Helper binaries of the integration tests (`tests/it`), which reach them through
# `CARGO_BIN_EXE_<name>`: the stand-in engine a node starts as it starts an engine, and a node's
# daemon in a process of its own.
[[bin]]
name = "stand-in-engine"
path = "tests/bin/stand_in_engine.rs"
test = false
doc = false

[[bin]]
name = "daemon-host"
path = "tests/bin/daemon_host.rs"
test = false
doc = false

[lints]
workspace = true
