[package]
name = "program-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The Program Server: the object model, module store, compile queue, package
# manifest and protobuf protocol of design section 6, its client (the daemon
# prepares programs with it, the main process resolves them), and the
# `uniserve program-server` command. Sources and toolchains compile a program
# package with the Program Server's own Python environment under `python/`.
#
# `ops` is the one edge into the computation library, and only for the phase
# vocabulary: the phase is part of an operator's descriptor and of the epoch
# record's key alike, so it is defined once there and re-exported here
# (design 5.1, 5.2).
[dependencies]
clap.workspace = true
libc.workspace = true
ops.workspace = true
# `cubin-launch` is the crate's one device-side member: it loads an installed module with
# `platform::Library` and launches it with `Function::launch_ex`, which is the worker's own
# route. Nothing of the Program Server itself reaches `platform`; the dependency exists for that
# binary, and for the reason in `src/cubin_launch.rs`.
platform = { path = "../platform" }
prost.workspace = true
rustix = { workspace = true, features = ["net"] }
serde.workspace = true
serde_json.workspace = true
service.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[build-dependencies]
prost-build.workspace = true
protox.workspace = true

[lints]
workspace = true

# The cubin launcher: one installed module, one recipe, one launch on a device.
[[bin]]
name = "cubin-launch"
path = "src/bin/cubin_launch.rs"
