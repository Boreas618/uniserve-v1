[package]
name = "program-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The Program Server: the object model, module store, compile queue, package
# manifest and protobuf protocol of design section 6, its client (the daemon
# prepares programs with it, the main process resolves them), and the
# `uniserve program-server` command. Sources and toolchains compile a program
# package with the Program Server's own Python environment under `python/`.
#
# The programs, slots and phases it serves are `proto::program`'s, which the
# daemon, the main process and the kernel library name them with (design 5.1,
# 5.2); the server links no part of the computation library.
[dependencies]
clap.workspace = true
libc.workspace = true
# `platform` reads the host's device count and each device's compute capability, the
# architecture targets the server builds for when no `--target` names them (`Target::of`).
platform = { path = "../platform" }
prost.workspace = true
# The program vocabulary: programs, slots and phases (`proto::program`).
proto.workspace = true
rustix = { workspace = true, features = ["net"] }
serde.workspace = true
serde_json.workspace = true
service.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
# `check_packages` states the element types of the kernel library's descriptors.
ops.workspace = true

[build-dependencies]
prost-build.workspace = true
protox.workspace = true

[lints]
workspace = true
