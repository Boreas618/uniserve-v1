# The fixture generators of the models crate's reference tests
# (`crates/models/tests/it`).
#
# Each generator runs a reference implementation over tiny random weights and
# writes the checkpoint and the reference's tensors that a Rust test compares
# the crate with. The references are installed packages, each pinned to one
# revision by this project's lock (`uv.lock` beside this file): the
# `reference` dependency group holds vLLM-Omni and the vLLM release it is
# written against, with the Transformers release they require.
#
# This project keeps its own lock rather than the root project's: the
# references' PyTorch and Transformers releases conflict with the root's
# `test` extra, and uv's resolution of a shared lock moves the root
# environments' own pins (the root's Transformers among them) to the
# references' releases. Its environment is installed apart:
#
#     UV_PROJECT_ENVIRONMENT=<directory> \
#         uv sync --locked --project crates/models/python --group reference
[project]
name = "uniserve-model-fixtures"
version = "2.0.0"
description = "The reference fixture generators of UniServe's model families"
# vLLM-Omni supports Python 3.11 to 3.13.
requires-python = ">=3.11,<3.14"
# What every generator imports itself; the references come from the
# `reference` group.
dependencies = [
    "safetensors",
    "torch",
]

[project.scripts]
qwen3-fixtures = "model_fixtures.qwen3:main"
minimax-h3-packing-fixtures = "model_fixtures.minimax_h3_packing:main"

[dependency-groups]
reference = [
    "vllm; sys_platform == 'linux'",
    "vllm-omni; sys_platform == 'linux'",
]

# vLLM v0.33.0, the release vLLM-Omni's revision states it is written against
# (its `requirements/common.txt`), and vLLM-Omni at the revision the committed
# fixtures were generated from.
[tool.uv.sources]
vllm = { git = "https://github.com/vllm-project/vllm.git", rev = "4ba787ec9959e566d3b587a796dff07673324da5" }
vllm-omni = { git = "https://github.com/vllm-project/vllm-omni.git", rev = "9f95053f95b65d072b37a8bbaea9ff8551266e9a" }

# vLLM's supported installation from a source revision without compiling its
# kernels: its build fetches the extensions vLLM's CI compiled for that
# revision.
[tool.uv.extra-build-variables]
vllm = { VLLM_USE_PRECOMPILED = "1", VLLM_PRECOMPILED_WHEEL_COMMIT = "4ba787ec9959e566d3b587a796dff07673324da5" }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "model_fixtures"
module-root = "src"
