[package]
name = "qwen4-exp"
description = "Qwen3.8 Flash Next (Qwen4ExpForConditionalGeneration): its configuration, the hyper-connected decoder layer with gated delta networks, indexed attention and routed experts, the n-gram hash embedding, the MTP drafter and the family value"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# A model crate computes on tensors and composes `nn` modules: it lists the neural-network
# library, the tensor library, request processing and the sibling family whose vision tower and
# configuration readers it shares, and nothing of the kernels, the device backend or the
# platform.
[dependencies]
nn.workspace = true
uniserve-tensor.workspace = true
processing.workspace = true
qwen3.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The profile runs install a meta context and make their meta inputs; the library target names
# neither.
backend.workspace = true

[lints]
workspace = true
