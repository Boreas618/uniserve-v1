[package]
name = "minimax-h3"
description = "MiniMax-H3: configuration, partition and the numerical model (base, FastH3 DMD, OmniRef)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The numerical model composes `nn` layers; `nn` re-exports the `ops` kernel ABI. The loader reads
# checkpoint metadata at this boundary, so the model's own types stay plain and typed.
[dependencies]
nn = { path = "../../nn" }
ops = { path = "../../ops" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The request rules, which count a request's condition rows before the request reaches a rank: the
# tests hold that count against this crate's packing.
models = { path = "../rules" }
# The slice harness (`examples/dit_layer.rs`) is the thing that owns runtime objects -- the device,
# the allocator, the stream -- because a model may not. It sits in a dev-dependency so the library's
# own dependency list stays `nn` and `ops`.
platform = { path = "../../platform" }

[lints]
workspace = true
