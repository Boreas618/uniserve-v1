[package]
name = "models"
description = "The model families: Qwen3 (Qwen3-MoE, Qwen3.5-MoE, Qwen3-VL), Qwen3.8 Flash Next (Qwen4ExpForConditionalGeneration), MiniMax-H3 and FastH3: their configurations, module trees, checkpoint names and family values"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# A model family computes on tensors and composes `nn` modules: the crate lists the
# neural-network library, the tensor library and request processing, and nothing of the kernels,
# the device backend or the platform.
[dependencies]
nn.workspace = true
tensor.workspace = true
processing.workspace = true
# The latent layout a video family's packing and decoders state (`proto::video::Layout`), which
# `nn` does not re-export beside the tensor library's own `Layout`.
proto.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The tokenizer a checkpoint ships, whose tokens DeepSeek-V4.1's n-gram memories normalize at
# load with the tokenizer library's own normalizers, as the reference does.
tokenizers.workspace = true

# The integration tests' checkpoints, fixtures, released checkpoints and meta forwards
# (`crates/nn/testing`), and the temporary directories they write tiny checkpoints into. The
# denoiser's unit test installs a meta context of its own, which the library target names
# nothing of.
[dev-dependencies]
# The kernel packages' manifests, which the profile runs hold the stated keys to.
build-server.workspace = true
nn-testing.workspace = true
ops.workspace = true
# The digest of DeepSeek-V4.1's normalized vocabulary, which its reference fixture states.
sha2.workspace = true
tempfile.workspace = true

[features]
# The paths of the tiny checkpoints this crate's tests hold (`models::fixtures`), for the tests
# of the crates that serve them; a development feature, so no serving build names this source
# tree.
fixtures = []

[lints]
workspace = true
