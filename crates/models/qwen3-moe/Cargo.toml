[package]
name = "qwen3-moe"
description = "Qwen3MoeForCausalLM: configuration, partition and the causal-LM model"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The numerical model composes `nn` layers; `nn` re-exports the `ops` kernel ABI. The loader reads
# checkpoint metadata at this boundary, so the model's own types stay plain and typed.
[dependencies]
nn = { path = "../../nn" }
ops = { path = "../../ops" }
processing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The keys' own test builds a layer's geometry to ask which row a cache type compiles, and a layer
# is `nn`'s type: the test names it directly rather than through a re-export the library does not
# otherwise owe.
nn = { path = "../../nn" }
# The slice harness (`examples/qwen3_moe_slice.rs`) is the thing that owns runtime objects -- the
# device, the allocator, the stream -- because a model may not. They are here, in a dev-dependency,
# so the library's own dependency list stays `nn` and `ops`.
platform = { path = "../../platform" }

# The encoded-checkpoint test writes its own shards byte for byte (header JSON and payload), so it
# needs a directory to write them in and nothing of the safetensors crate: the payload is padded to
# the declared width, which is what lets the test declare a dtype the tensor does not have.
tempfile.workspace = true

[lints]
workspace = true
