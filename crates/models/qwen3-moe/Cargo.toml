[package]
name = "qwen3-moe"
description = "Qwen3MoeForCausalLM: configuration, partition and the causal-LM model"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The numerical model composes `nn` layers; `nn` re-exports the `ops` kernel ABI. The loader reads
# checkpoint metadata at this boundary, so the model's own types stay plain and typed.
[dependencies]
nn = { path = "../../nn" }
ops = { path = "../../ops" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The encoded-checkpoint test writes its own shards, the way `crates/nn/tests/loading.rs` does: a
# synthetic NVFP4 expert stack has to be a real safetensors file for the loader to read.
safetensors = "0.3"
tempfile.workspace = true

[lints]
workspace = true
