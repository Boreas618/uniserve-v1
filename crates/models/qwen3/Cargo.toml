[package]
name = "qwen3"
description = "The Qwen3 family: its configuration, decoder layer, the Qwen3-MoE and Qwen3.5-MoE causal LMs, the MTP drafter, the Qwen3-VL encoder and vision tower"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# A model crate computes on tensors and composes `nn` modules: it lists the neural-network
# library, the tensor library and request processing, and nothing of the kernels, the device
# backend or the platform.
[dependencies]
nn.workspace = true
uniserve-tensor.workspace = true
processing.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The profile runs install a meta context and make their meta inputs; the library target names
# neither.
backend.workspace = true

[lints]
workspace = true
