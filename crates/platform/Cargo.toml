[package]
name = "platform"
description = "The CUDA boundary: driver, virtual memory and allocator, graphs, kernel launch, tensor maps, NVML, NCCL and CUPTI, loaded at runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
libc.workspace = true
libloading.workspace = true
# The ELF reader of `NativeLibrary::defined_functions` and `NativeLibrary::run_path`.
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
# Joins a driver call's name to its generated CUPTI callback id, so the id and the name the
# collectors report are one token (`cupti::blocking`, `cupti::range_profiler`).
paste = "1.0.15"
thiserror.workspace = true

[dev-dependencies]
# The generator of the committed bindings under `src/sys/` (`examples/bindings.rs`).
bindgen = "0.72.1"
pkg-config = "0.3.33"
tempfile.workspace = true

[lints]
workspace = true

# The process half of the device test that checks interprocess event storage is released with
# its contexts (`tests/it/gpu.rs`), which starts it as a child (`CARGO_BIN_EXE_interprocess-event`).
[[bin]]
name = "interprocess-event"
path = "tests/helpers/interprocess_event.rs"
test = false
bench = false
doc = false
