[package]
name = "service"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# A host service: one server per host and serving user on a Unix socket in
# the user's runtime directory, owned by a lock, started detached from its
# starter when absent. The Storage Server and the Build Server are both
# host services. The framing and the one connection every process interface
# runs on are here too. This crate depends on no workspace crate and links no
# CUDA.
[dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["net"] }
signal-hook-registry.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
