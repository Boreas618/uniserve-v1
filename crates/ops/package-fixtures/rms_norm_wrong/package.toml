# A package the delivery test installs to exercise a generation
# update: the same descriptor and launch structure with a
# deliberately wrong result, so shadow execution refuses it.
#
# It names the operator and backend the deployment already serves
# (`rms_norm`/`triton`) and the same descriptor keys, so installing it is a new
# revision of that backend, not a new backend, and the deployment's unchanged
# configuration resolves it. The descriptor values are the serving deployment's keys.

op = "rms_norm"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

# The serving package's launch, without its alignment statements and its zero-centred and grouped
# weights.
[launch]
kernel = "_rms_norm_kernel"
warps = { field = "tile", steps = [[2048, 8]], otherwise = 4 }

[launch.types]
x_ptr = { pointer = "dtype" }
w_ptr = { pointer = "dtype" }
y_ptr = { pointer = "dtype" }
columns = "i32"
eps = "fp32"
pdl = "i32"

[launch.constants]
BLOCK = { field = "tile" }

# `dtype_bf16_columns_2048_tile_2048_pdl_false`, the serving key.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16"], columns = ["2048", "128"], tile = ["2048", "128"], pdl = ["false"] }

[parameters]
eps = 1e-06
