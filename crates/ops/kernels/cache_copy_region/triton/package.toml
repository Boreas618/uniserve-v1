# The cache_copy_region operator's Triton backend: design 5.2's package.
#
# This is the prefix cache's second conversion step: a span of K/V a loading rank decoded into
# FP32 (layer-major `[layers, count, heads, head_dim]`, the host page encoding's order) goes into
# the destination page's units, each layer's rows into its own unit and column, in the pool's
# stored element type, and the column's initialized flag is raised.
#
# The key names the field, the pool's own geometry (`columns`, `units_per_page`, `plane_bytes`,
# `heads`, `head_dim`), the stored element type and whether the destination stores FP8. The *span* is
# not in the key: the token count, the page offset and the unit ids are launch words, so one module
# serves every span size.
#
# Both halves are here, and both run one program per (column, unit slot) -- grid
# `(columns, units_per_page, 1)`. An FP8 destination grows the unit's scale to cover the span and
# rescales the unit's resident values first (one amax over the
# whole span, floored at 1e-12, ceiling 448.0, growth only when the cell is initialized). A grid with a
# token axis could not do that: every token's program would compute its own partial amax and race
# several scales into one cell, which is a different tensor rather than a different last bit.

op = "cache_copy_region"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

# The pool's geometry is compiled in. The derivation gives a token row's elements (`row_size`,
# `heads · head_dim`), the lanes a program walks it with (`row_pow2`, its next power of two) and the
# plane's stored elements (`plane_elements`), and refuses a plane that is not whole elements and
# whole token rows. A row of more than 1024 elements takes eight warps.
[launch]
kernel = "_cache_copy_region_kernel"
warps = { field = "row_size", steps = [[1025, 8]], otherwise = 4 }
derive = "derive"

# An FP8 pool is addressed as bytes, which the kernel bitcasts to E4M3 itself. A dense pool passes
# no scale view: its scale slot carries the initialized view's address, which the kernel never reads
# because `SCALED` is false.
[launch.types]
values_ptr = { field = "element", values = { bf16 = "*bf16", f16 = "*fp16", f8e4m3 = "*u8" } }
scale_ptr = { field = "scaled", values = { true = "*fp32", false = "*u8" } }
initialized_ptr = "*u8"
source_ptr = "*fp32"
units_ptr = "*i32"
offset = "i64"
count = "i64"
units_total = "i32"

# The FP8 rescale walks the plane a row's lanes at a time.
[launch.constants]
ROW_SIZE = { field = "row_size" }
ROW_POW2 = { field = "row_pow2" }
PLANE_ELEMENTS = { field = "plane_elements" }
COLUMNS = { field = "columns" }
BF16 = { field = "element", values = { bf16 = 1, f16 = 0, f8e4m3 = 0 } }
SCALED = { field = "scaled", values = { true = 1, false = 0 } }
BLOCK = { field = "row_pow2" }

# `field_key_columns_48_units_per_page_1_plane_bytes_65536_heads_4_head_dim_128_element_bf16_scaled_false_pdl_true`.
#
# `plane_bytes` is the pool's unit size (`block_size · heads · head_dim · element bytes`), so it and
# `heads`/`head_dim`/`element` are one geometry stated twice; both are in the key because both are
# launch arithmetic the kernel performs and neither is derivable from the other at compile time.
#
# A dense pool stores the values themselves and the FP8 pool is the scaled one, so `scaled` is false
# for a BF16 or F16 element and true for `f8e4m3`, one table each. The geometry's extents compile
# for any positive value.
[[kernel.descriptors]]
dimensions = { field = ["key", "value"], columns = { min = 1 }, units_per_page = { min = 1 }, plane_bytes = { min = 1 }, heads = { min = 1 }, head_dim = { min = 1 }, element = ["bf16", "f16"], scaled = ["false"], pdl = ["true", "false"] }

[[kernel.descriptors]]
dimensions = { field = ["key", "value"], columns = { min = 1 }, units_per_page = { min = 1 }, plane_bytes = { min = 1 }, heads = { min = 1 }, head_dim = { min = 1 }, element = ["f8e4m3"], scaled = ["true"], pdl = ["true", "false"] }
