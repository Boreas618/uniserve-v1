# The fp8_quantize operator's Triton backend: design 5.2's package.
#
# One program encodes one block of one row of a 16-bit activation into
# per-tensor E4M3: each element times the encoder's multiplier, an FP32 device
# word, clamped to ±448 and rounded to nearest even. The row's width and the
# activation's row stride are launch words, both multiples of sixteen, so one
# module serves every projection of one activation type. The key is the one `Descriptor`'s
# `Display` prints, e.g. `dtype_bf16_block_1024`.

op = "fp8_quantize"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

# The operator refuses a row width or a row stride that is not a multiple of sixteen, so whole
# vectors of a row are loaded and stored.
[launch]
kernel = "_fp8_quantize_kernel"
warps = { field = "block", steps = [[2048, 8]], otherwise = 4 }
aligned = ["x_ptr", "out_ptr", "k", "x_row_stride"]

[launch.types]
x_ptr = { pointer = "dtype" }
out_ptr = "*fp8e4nv"
k = "i64"
x_row_stride = "i64"
encode_ptr = "*fp32"

[launch.constants]
BLOCK = { field = "block" }

[kernel]
requires = ["fp8"]

[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16"], block = { power_of_two = true, min = 16 } }
