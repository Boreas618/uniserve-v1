# The copy_strided operator's Triton backend: design 5.2's package.
#
# `destination[i] = source[i]`: a source read through its strides, moved into a
# row-major window — a contiguous tensor, or a block of a larger one. That is a
# strided tensor made contiguous at an element offset, a two-dimensional copy
# whose row strides differ on the two sides, and a concatenation, a padding or a
# slice assignment writing its block. No element is converted, so the operator's
# tolerance is `exact()`, and an FP8 (`f8e4m3`) element moves as the byte it is.
# The element type and the number of axes the call
# traverses are compiled in; the shape and both stride vectors are launch words.
# The key is the one `Descriptor`'s `Display` prints, e.g.
# `dtype_bf16_rank_2_block_1024_pdl_false`.
#
# `src/strided.py` links the address arithmetic every tensor primitive shares,
# under `kernels/tensor/triton/src/`; an installation copies the file the link
# names.

op = "copy_strided"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_copy_strided_kernel"
warps = { field = "block", steps = [[2048, 8]], otherwise = 4 }
derive = "strided.addressed"

# The source's strides `s`, the destination's `t`, over the destination's extents `d`.
[launch.types]
source = { pointer = "address" }
destination = { pointer = "address" }
elements = "i64"
d1 = "i64"
d2 = "i64"
d3 = "i64"
d4 = "i64"
d5 = "i64"
s0 = "i64"
s1 = "i64"
s2 = "i64"
s3 = "i64"
s4 = "i64"
s5 = "i64"
t0 = "i64"
t1 = "i64"
t2 = "i64"
t3 = "i64"
t4 = "i64"
t5 = "i64"
pdl = "i32"

[launch.constants]
RANK = { field = "rank" }
BLOCK = { field = "block" }

[[kernel.descriptors]]
dimensions = { dtype = ["u8", "u32", "i16", "i32", "i64", "f16", "bf16", "f32", "f64", "f8e4m3"], rank = { min = 1, max = 6 }, block = { power_of_two = true }, pdl = ["false", "true"] }
