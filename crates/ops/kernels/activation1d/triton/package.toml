# The activation1d operator's Triton backend: design 5.2's package.
#
# One cubin per descriptor: the BigVGAN decoder's activation block as one program — the
# replicate pad, the transposed convolution that upsamples, the crop, SnakeBeta and the
# low-pass, fused so that the `ratio`-times-larger intermediate never exists in memory.
#
# The tap count, the ratio and the block width are the compilation, because the kernel
# unrolls both convolutions from them; the channel count and both lengths are launch words,
# since an audio length follows the request's duration.

op = "activation1d"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_activation1d_kernel"
warps = { field = "block", steps = [[1024, 8]], otherwise = 4 }

# The two filters are of the signal's element type and SnakeBeta's two log-space parameters are
# FP32. The kernel has no dependent-launch prologue, so its launch never carries the attribute.
[launch.types]
values_ptr = { pointer = "dtype" }
alpha_ptr = "*fp32"
beta_ptr = "*fp32"
filter_up_ptr = { pointer = "dtype" }
filter_down_ptr = { pointer = "dtype" }
out_ptr = { pointer = "dtype" }
channels = "i32"
kernel = "i32"
ratio = "i32"
length = "i32"
out_length = "i32"
block = "i32"

[launch.constants]
KERNEL = { field = "kernel" }
RATIO = { field = "ratio" }
BLOCK = { field = "block" }

[[kernel.descriptors]]
dimensions = { dtype = ["f32", "bf16", "f16"], channels = { min = 1 }, kernel = { min = 1 }, ratio = { min = 1 }, block = { power_of_two = true }, pdl = ["false", "true"] }
