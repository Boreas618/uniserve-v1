# The vsa_scores operator's Triton backend: design 5.2's package.
#
# The step between VSA's pooling and its selection: one dot product per (head, query tile, key tile)
# over the pooled per-head means, written as the contiguous FP32
# [heads, query tiles, key tiles] matrix the selection reads. No scale and no softmax — the caller
# applies both — so the value is the raw sum of `width` products, accumulated in FP32. The products
# are Triton's three-pass TF32 ones, each within (20 + 2^-7)·2^-24 of exact, and the operator's
# tolerance is the contraction's bound with that excess counted.

op = "vsa_scores"
backend = "triton"
interface_version = 1

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/vsa_scores.py", "src/build.py"]
script = "src/build.py"

[kernel]
architectures = ["sm_100a", "sm_90a"]

# `dtype_bf16_heads_56_width_128_block_128_pdl_false`.
[[kernel.descriptors]]
# `block` is a `tl.arange` extent; `heads` and `width` compile for any positive value, the lanes past
# `width` masked.
dimensions = { heads = { min = 1 }, width = { min = 1 }, block = { power_of_two = true }, pdl = ["false", "true"] }

[parameters]
