# The frame_pad operator's Triton backend: design 5.2's package.
#
# The descriptor is the padding's own tile: the element type, whether the rows and
# columns beside the source are mirrored rather than replicated, and the columns
# and channels one program writes. `FramePadDescriptor::tiles` derives the tile
# from the source's strides and the output's layout, so a caller and the compiled
# program agree on the variant. The key is the one `FramePadDescriptor`'s
# `Display` prints, e.g.
# `dtype_bf16_reflect_true_block_pixels_512_block_channels_4`.
#
# A contiguous output walks whole rows of up to 512 pixels; any other output walks
# the 32-column, 64-channel tile.

op = "frame_pad"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_frame_pad_kernel"
warps = 4

# Every stride, extent and padding is an `i32` word, as the operator packs them: five source
# strides, five output strides, then the extents and the padding.
[launch.types]
values = { pointer = "dtype" }
out = { pointer = "dtype" }
stride_batch = "i32"
stride_channel = "i32"
stride_frame = "i32"
stride_height = "i32"
stride_width = "i32"
out_batch = "i32"
out_channel = "i32"
out_frame_stride = "i32"
out_height_stride = "i32"
out_width_stride = "i32"
height = "i32"
width = "i32"
out_frames = "i32"
out_height = "i32"
out_width = "i32"
channels = "i32"
pad_top = "i32"
pad_left = "i32"
pad_front = "i32"

[launch.constants]
reflect = { field = "reflect" }
block_pixels = { field = "block_pixels" }
block_channels = { field = "block_channels" }

[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], reflect = ["true", "false"], block_pixels = { power_of_two = true }, block_channels = { power_of_two = true } }
