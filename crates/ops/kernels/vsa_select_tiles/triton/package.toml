# The vsa_select_tiles operator's Triton backend: design 5.2's package.
#
# The descriptor is the selection's own: the lane width that bounds the key tiles
# one query tile ranks and keeps. The key is the one `SelectTilesDescriptor`'s
# `Display` prints, e.g. `block_1024`. The tile count, the query-tile count and the
# window offset are launch words, so one module serves any sequence that fits its
# lanes.

op = "vsa_select_tiles"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_select_tiles_kernel"
warps = 4

# The scores are the FP32 matrix `vsa_scores` writes and the tables are `i32`, so no type is a
# dimension.
[launch.types]
scores = "*fp32"
tile_segments = "*i32"
variable_block_sizes = "*i32"
segment_keep = "*i32"
indices = "*i32"
counts = "*i32"
query_tiles = "i32"
tiles = "i32"
query_offset = "i32"

[launch.constants]
block = { field = "block" }

[[kernel.descriptors]]
# `block` is a `tl.arange` extent.
dimensions = { block = { power_of_two = true } }
