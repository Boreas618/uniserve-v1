# The embedding operator's Triton backend: design 5.2's package.
#
# One program copies the hidden rows of `block` tokens out of this shard's
# vocabulary weight; the token count is a launch value.

op = "embedding"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

# The inner tile is the package's `tile` parameter.
[launch]
kernel = "_embedding_kernel"
warps = 4

# A model's token ids are `u32` (`nn::functional::embedding`), and a fused embedding table arrives
# as `i32` or `i64` ids. A `u32` id widens to `i64` by zero extension, so an id past the shard is
# outside it, never negative.
[launch.types]
ids_ptr = { pointer = "ids" }
weight_ptr = { pointer = "dtype" }
out_ptr = { pointer = "dtype" }
tokens = "i64"
hidden = "i32"
first = "i32"
rows = "i32"

[launch.constants]
BLOCK = { field = "block" }
TILE = { parameter = "tile" }

# `dtype_bf16_ids_i64_hidden_2048_first_0_rows_151936_block_4_pdl_true`.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], ids = ["u32", "i64", "i32"], hidden = { min = 1 }, first = { min = 0 }, rows = { min = 1 }, block = { power_of_two = true }, pdl = ["true", "false"] }

[parameters]
# Columns one inner tile copies.
tile = 256
