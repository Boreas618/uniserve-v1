# The embedding operator's triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the
# compile driver the Program Server runs for one descriptor and target).

op = "embedding"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/embedding.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
dimensions = { ids = ["i64", "i32"], dtype = ["bf16", "fp16", "fp32"], width = ["2048"] }

[parameters]
block = 1024
warps = 4
