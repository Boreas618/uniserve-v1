# The embedding operator's Triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py`.
#
# One program copies the hidden rows of `block` tokens out of this shard's
# vocabulary weight; the token count is a launch value.

op = "embedding"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/embedding.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

# `dtype_bf16_ids_i64_hidden_2048_first_0_rows_151936_block_4_pdl_true`.
[kernel.descriptors]
dimensions = { dtype = ["bf16", "f16", "f32"], ids = ["i64", "i32"], hidden = ["2048", "4096", "7168", "5120"], first = ["0", "151936", "75968"], rows = ["151936", "75968", "248320", "152064"], block = ["1", "2", "4", "8"], pdl = ["true", "false"] }

[parameters]
# Columns one inner tile copies.
tile = 256
