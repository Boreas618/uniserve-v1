# The elementwise_binary operator's Triton backend: design 5.2's
# package.
#
# `out[i] = lhs[i] o rhs[i]` over two inputs read through their strides, into a
# contiguous output: arithmetic in the inputs' element type, a comparison
# writing `u8`, or one of the functions of the integer element types alone
# (`remainder`, the three `bitwise_` combinations and the two shifts), which
# `src/build.py` refuses for a floating element type. A broadcast operand is a
# zero stride, so the function, the
# element type and the number of axes the call traverses are all a compilation
# holds; the shape and the strides are launch words. The key is the one
# `BinaryDescriptor`'s `Display` prints, e.g.
# `function_add_dtype_bf16_rank_2_block_1024_pdl_false`.
#
# `src/strided.py` links the address arithmetic every tensor primitive shares,
# under `kernels/tensor/triton/src/`; an installation copies the file the link
# names.

op = "elementwise_binary"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_elementwise_binary_kernel"
warps = { field = "block", steps = [[2048, 8]], otherwise = 4 }
derive = "derive"

# A comparison's output is a `u8` truth value.
[launch.types]
lhs = { pointer = "dtype" }
rhs = { pointer = "dtype" }
out = { pointer = "output" }
elements = "i64"
d1 = "i64"
d2 = "i64"
d3 = "i64"
d4 = "i64"
d5 = "i64"
l0 = "i64"
l1 = "i64"
l2 = "i64"
l3 = "i64"
l4 = "i64"
l5 = "i64"
r0 = "i64"
r1 = "i64"
r2 = "i64"
r3 = "i64"
r4 = "i64"
r5 = "i64"
pdl = "i32"

[launch.constants]
FUNCTION = { field = "function" }
COMPARES = { field = "compares" }
COMPUTE = { field = "compute" }
SIGNED = { field = "signed" }
RANK = { field = "rank" }
BLOCK = { field = "block" }

[[kernel.descriptors]]
dimensions = { function = ["add", "sub", "mul", "div", "maximum", "minimum", "eq", "ne", "lt", "le", "gt", "ge", "remainder", "bitwise_and", "bitwise_or", "bitwise_xor", "bitwise_left_shift", "bitwise_right_shift"], dtype = ["u8", "u32", "i16", "i32", "i64", "f16", "bf16", "f32", "f64"], rank = { min = 1, max = 6 }, block = { power_of_two = true }, pdl = ["false", "true"] }
