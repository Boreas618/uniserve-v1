# The gemm operator's cuBLASLt backend: design 5.2's package.
#
# One native module per descriptor: the module's host code runs one dense
# product through cuBLASLt, and the element types, the weight order and the
# epilogue are compile-time choices the declared compilation binds to the
# descriptor's fields (design 9: the dense layers' GEMM).
#
# The algorithm choice and its workspace are the package's tuning data (design
# 5.4): each shape asks cuBLASLt's heuristic once when it is first used, and the
# matmul it builds is then reused for every call of that shape. Serving never
# times anything. An offline tuner records its choices by publishing a new
# revision of this package, which is why no algorithm choice is written outside
# the package.

op = "gemm"
backend = "cublas_lt"
interface_version = 1

[source]
kind = "cuda"

# Host code alone, in C++20: cuBLASLt brings its own kernels. The data types are cuBLASLt's names
# of what a field states, and the accumulation its compute type; the weight order (`[k, n]`, or
# `[n, k]`, the checkpoint's own) and whether the bias is added are the generated ABI header's
# enumerators (`uniserve_gemm.h`).
[compile]
units = ["src/gemm.cpp"]
standard = "c++20"
libraries = ["cublasLt"]

[compile.definitions]
UNISERVE_INPUT_TYPE = { field = "input", values = { bf16 = "CUDA_R_16BF", f16 = "CUDA_R_16F", f32 = "CUDA_R_32F" } }
UNISERVE_WEIGHT_TYPE = { field = "weight", values = { bf16 = "CUDA_R_16BF", f16 = "CUDA_R_16F", f32 = "CUDA_R_32F" } }
UNISERVE_ACCUMULATE_TYPE = { field = "accumulate", values = { f32 = "CUBLAS_COMPUTE_32F", bf16 = "CUBLAS_COMPUTE_32F_FAST_16BF", f16 = "CUBLAS_COMPUTE_32F_FAST_16F" } }
UNISERVE_OUTPUT_TYPE = { field = "output", values = { bf16 = "CUDA_R_16BF", f16 = "CUDA_R_16F", f32 = "CUDA_R_32F" } }
UNISERVE_WEIGHT_ORDER = { field = "order", enumeration = "uniserve_weight_order" }
UNISERVE_EPILOGUE = { field = "epilogue", enumeration = "uniserve_epilogue" }

# `input_bf16_weight_bf16_accumulate_f32_output_bf16_order_nxk_epilogue_none_k_2048`.
[[kernel.descriptors]]
dimensions = { input = ["bf16", "f16", "f32"], weight = ["bf16", "f16", "f32"], accumulate = ["f32", "bf16", "f16"], output = ["bf16", "f16", "f32"], order = ["kxn", "nxk"], epilogue = ["none", "bias"] }
