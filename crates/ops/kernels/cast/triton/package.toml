# The cast operator's Triton backend: design 5.2's package.
#
# `out[i] = convert(x[i])` over an input read through its strides, into a
# contiguous output of another element type: low bits between integers, a
# truncation toward zero from a float into an integer, a rounding to nearest
# even into a float. The two element types and the number of axes the call
# traverses are compiled in; the shape and the strides are launch words. The key
# is the one `Descriptor`'s `Display` prints, e.g.
# `input_f32_output_bf16_rank_1_block_1024_pdl_false`.
#
# The two types differ: a conversion from a type to itself moves elements, which
# is `copy_strided`, and the compile script refuses it.
#
# `src/strided.py` links the address arithmetic every tensor primitive shares,
# under `kernels/tensor/triton/src/`; an installation copies the file the link
# names.

op = "cast"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_cast_kernel"
warps = { field = "block", steps = [[2048, 8]], otherwise = 4 }
derive = "derive"

[launch.types]
x = { pointer = "input" }
out = { pointer = "output" }
elements = "i64"
d1 = "i64"
d2 = "i64"
d3 = "i64"
d4 = "i64"
d5 = "i64"
s0 = "i64"
s1 = "i64"
s2 = "i64"
s3 = "i64"
s4 = "i64"
s5 = "i64"

[launch.constants]
THROUGH = { field = "through" }
NARROWS = { field = "narrows" }
RANK = { field = "rank" }
BLOCK = { field = "block" }

[[kernel.descriptors]]
dimensions = { input = ["u8", "u32", "i16", "i32", "i64", "f16", "bf16", "f32", "f64"], output = ["u8", "u32", "i16", "i32", "i64", "f16", "bf16", "f32", "f64"], rank = { min = 1, max = 6 }, block = { power_of_two = true }, pdl = ["false", "true"] }
