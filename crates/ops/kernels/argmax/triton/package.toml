# The argmax operator's Triton backend: design 5.2's package.
#
# One program reads one row of candidates and stores its largest value's index;
# the row count comes from the grid.

op = "argmax"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_argmax_kernel"
warps = { field = "width", steps = [[2048, 8]], otherwise = 4 }

[launch.types]
values_ptr = { pointer = "dtype" }
out_ptr = { pointer = "ids" }
rows = "i64"

# The width is compiled in, and the tile a row is walked in is the package's: 1024 f32 values fill
# one program's registers comfortably, and a block that divides no width wastes nothing because
# every load is masked.
[launch.constants]
WIDTH = { field = "width" }
BLOCK = 1024

# `dtype_f32_width_2048_ids_i32_pdl_false`.
[[kernel.descriptors]]
dimensions = { dtype = ["f32", "bf16", "f16"], width = { min = 1 }, ids = ["i32", "i64"], pdl = ["true", "false"] }
