# The filter_candidates operator's Triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py`.
#
# One program filters one row of candidates in place; the row count comes from the
# grid, and the row is walked in `tile`-sized chunks, so the candidate width is a
# runtime value: one module serves every count, a vocabulary-sized row included.

op = "filter_candidates"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/filter_candidates.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

# `width_151936_tile_4096_ids_i32_pdl_false`.
#
# The width and the tile are both compilation fields: the width is the deployment's
# candidate bound, and the tile is the chunk its program walks the row in.
[kernel.descriptors]
dimensions = { width = ["128", "1024", "2048", "4096", "151936"], tile = ["1024", "2048", "4096", "8192"], ids = ["i32", "i64"], pdl = ["true", "false"] }

[parameters]
