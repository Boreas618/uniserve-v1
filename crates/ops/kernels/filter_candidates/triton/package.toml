# The filter_candidates operator's Triton backend: design 5.2's package.
#
# One program filters one row of candidates in place; the row count comes from the
# grid, and the row is walked in `tile`-sized chunks, so the candidate width is a
# runtime value: one module serves every count, a vocabulary-sized row included.

op = "filter_candidates"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_filter_candidates_kernel"
warps = { field = "tile", steps = [[2048, 8]], otherwise = 4 }

# The ids are read by the operators after this one; `valid` receives whether each row's remaining
# candidates form a usable distribution.
[launch.types]
values_ptr = "*fp32"
ids_ptr = { pointer = "ids" }
parameters_ptr = "*fp32"
valid_ptr = "*i32"
rows = "i64"
width = "i32"

[launch.constants]
BLOCK = { field = "tile" }

# `width_151936_tile_4096_ids_i32_pdl_false`.
#
# The width, the row's candidate bound, is a launch word; the tile is the power-of-two
# chunk the program walks the row in.
[[kernel.descriptors]]
dimensions = { width = { min = 1 }, tile = { power_of_two = true }, ids = ["i32", "i64"], pdl = ["true", "false"] }
