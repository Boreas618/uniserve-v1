# The rms_norm operator's Triton backend: design 5.2's package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the compile
# driver the Build Server runs for one descriptor and target).
#
# One program normalizes one contiguous row in FP32 statistics and rounds once.
# `columns` is a launch value and `tile` the program's row block, so one module
# serves any row count whose columns fit the tile.

op = "rms_norm"
backend = "triton"
interface_version = 1

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/rms_norm.py", "src/build.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

# `dtype_bf16_columns_2048_tile_2048_pdl_true`.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], columns = { min = 1 }, tile = { power_of_two = true }, pdl = ["true", "false"] }

# A zero-centred weight (Gemma, Qwen3-Next, Qwen3.5): the row is scaled by `1 + w`, the one added in
# FP32. The operator names `centred` only when set, so the plain key keeps its shape.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], columns = { min = 1 }, tile = { power_of_two = true }, pdl = ["true", "false"], centred = ["true"] }

# A weight of several rows, row `i` of the input reading weight row `i mod groups` (the streams
# of a hyper-connected residual); the operator names `groups` only above one.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], columns = { min = 1 }, tile = { power_of_two = true }, pdl = ["true", "false"], centred = ["true"], groups = { min = 2 } }

[parameters]
eps = 1e-06
