# The swiglu operator's Triton backend: design 5.2's package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the compile
# driver the Build Server runs for one descriptor and target).
#
# The descriptor is SwiGLU's own: the element type, the output row width, the
# tile one program walks, the value and gate row strides, whether each half adds
# its own bias, and whether each program records its largest magnitude. The key
# is the one `SwigluDescriptor`'s `Display` prints, e.g.
# `dtype_bf16_width_3072_block_4096_value_stride_3072_gate_stride_3072_value_bias_true_gate_bias_true_absmax_false`.
#
# The row strides are whole multiples of the row width: each half is written by
# its own projection. The width and both strides are compiled in for any
# positive value; the block is a `tl.arange` extent, so a power of two.

op = "swiglu"
backend = "triton"
interface_version = 1

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/swiglu.py", "src/build.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
dimensions = { dtype = ["bf16", "f16", "f32"], width = { min = 1 }, block = { power_of_two = true }, value_stride = { min = 1 }, gate_stride = { min = 1 }, value_bias = ["true", "false"], gate_bias = ["true", "false"], absmax = ["true", "false"] }

[parameters]
