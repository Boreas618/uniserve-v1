# The swiglu operator's Triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the compile
# driver the Program Server runs for one descriptor and target).
#
# The descriptor is SwiGLU's own: the element type, the output row width, the
# tile one program walks, the value and gate row strides, whether each half adds
# its own bias, and whether each program records its largest magnitude. The key
# is the one `SwigluDescriptor`'s `Display` prints, e.g.
# `dtype_bf16_width_3072_block_4096_value_stride_3072_gate_stride_3072_value_bias_true_gate_bias_true_absmax_false`.
#
# The row strides are whole multiples of the row width: each half is written by
# its own projection. The values narrow to the keys `model` publishes for H3.

op = "swiglu"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/swiglu.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
dimensions = { dtype = ["bf16", "fp16", "f32"], width = ["1024", "1536", "2048", "3072", "4096", "6144", "7168", "8192", "12288", "16384"], block = ["1024", "2048", "4096", "8192", "32768"], value_stride = ["1024", "1536", "2048", "3072", "4096", "4608", "6144", "7168", "8192", "9216", "12288", "14336", "16384", "18432", "21504", "24576", "28672", "32768", "36864", "43008", "49152", "65536", "73728", "98304"], gate_stride = ["1024", "1536", "2048", "3072", "4096", "4608", "6144", "7168", "8192", "9216", "12288", "14336", "16384", "18432", "21504", "24576", "28672", "32768", "36864", "43008", "49152", "65536", "73728", "98304"], value_bias = ["true", "false"], gate_bias = ["true", "false"], absmax = ["true", "false"] }

[parameters]
