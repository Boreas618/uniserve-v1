# The logprob_gather operator's Triton backend: design 5.2's package.
#
# One program reads one row's selected log-probability and counts the row's
# entries above it for its rank, so the row count is a launch value and the
# module serves every batch.

op = "logprob_gather"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

# The rank's count walks a row in steps of `min(tile, 4096)` lanes (`step`, which `derive`
# gives).
[launch]
kernel = "_logprob_gather_kernel"
warps = { field = "step", steps = [[2048, 8]], otherwise = 4 }
derive = "derive"

# `tokens` is the token a sampler selected for each row, in its id type.
[launch.types]
logprobabilities_ptr = "*fp32"
tokens_ptr = { pointer = "ids" }
out_ptr = "*fp32"
ranks_ptr = "*i32"
rows = "i64"
columns = "i32"

[launch.constants]
STEP = { field = "step" }

# `columns_151936_ids_i64_tile_4096_pdl_true`.
# A step is a `tl.arange` extent, so a tile below 4096 must be a power of two.
[[kernel.descriptors]]
dimensions = { columns = { min = 1 }, ids = ["i64", "i32"], tile = { min = 1 }, pdl = ["true", "false"] }
