# The patch operator's Triton backend: design 5.2's program package.
#
# One cubin per descriptor: the diffusion transformer's packed rows against its latent, in
# the direction the descriptor names. The move is a permutation of elements — a `1×2×2`
# patch's four values per channel, either gathered into a row or scattered back — so the
# operator's tolerance is exact and the kernel does no arithmetic at all.
#
# The frame count is a launch value, not a field: one program serves every request of a
# geometry. The mode is a compilation, because the two directions read and write the views
# the other way round.

op = "patch"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"

[source]
kind = "triton"
files = ["src/patch.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
# The latents of the H3 deployment's decoding resolutions: one key per geometry and mode.
dimensions = { dtype = ["bf16", "f16", "f32"], channels = ["24"], height = ["30", "40", "42", "48", "52", "62", "64", "84", "96"], width = ["26", "30", "40", "42", "48", "52", "64"], mode = ["patchify", "unpatchify"], block = ["1024"], pdl = ["false", "true"] }

[parameters]
