# The patch operator's Triton backend: design 5.2's program package.
#
# One cubin per descriptor: the diffusion transformer's latent packed into its rows. The move is
# a permutation of elements — a `1×2×2` patch's four values per channel, gathered into one row —
# so the operator's tolerance is exact and the kernel does no arithmetic at all.
#
# One direction, because the operator has one: the inverse raster is `unpatchify_video`, whose
# package owns that direction. The frames, the channels and the canvas are launch values, not
# fields, so one program serves every request of every raster.

op = "patch"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/patch.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
# One module per element type: the program reads the channels, the frames and the canvas as words,
# so a raster is a launch value and never a reason to compile. A key cannot name a mode either,
# because the operator has no mode to name.
dimensions = { dtype = ["bf16", "f16", "f32"], block = ["1024"], pdl = ["false"] }

[parameters]
