# The vsa_compose_gated_rows operator's Triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the compile
# driver the Program Server runs for one descriptor and target).
#
# The descriptor is the composition's own: the element type, the heads, the rows of
# one tile, the width, the row block and the member slots the payload addresses
# (the key prints one slot per member, comma-joined). The key is the one
# `ComposeGatedRowsDescriptor`'s `Display` prints, e.g.
# `dtype_bf16_heads_32_tile_rows_64_width_128_block_rows_16_slots_0,1,2,3_members_4`.

op = "vsa_compose_gated_rows"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/vsa_compose_gated_rows.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
dimensions = { dtype = ["bf16", "f16", "f32"], heads = ["8", "16", "24", "32", "64"], tile_rows = ["64", "128"], width = ["64", "128"], block_rows = ["16"], slots = ["0", "0,1", "0,1,2,3", "0,1,2,3,4,5,6,7"], members = ["1", "2", "4", "8"] }

[parameters]
