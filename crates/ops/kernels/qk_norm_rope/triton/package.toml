# The qk_norm_rope operator's Triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py`.
#
# One program normalizes and rotates every query and key head of `rows` tokens;
# the token count is a launch value and the head geometry is the descriptor's.
# `block` is the head width the program loads in one tile, so a descriptor's
# block must cover `head_dim`.

op = "qk_norm_rope"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/qk_norm_rope.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

# `dtype_bf16_output_bf16_head_dim_128_q_heads_32_k_heads_4_rotation_half_epsilon_0x358637bd_rows_1_block_128_pdl_false`.
# The operator prints `rotated` only when the rotation is narrower than the
# head, so the package declares the two key shapes: the full-width weighted form
# a text decoder compiles, and the narrowed form a multimodal transformer does
# (H3 turns 96 of 128 channels). One backend, because a deployment names a
# backend and not a key shape.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], output = ["bf16", "f16", "f32"], head_dim = ["128", "64", "256"], q_heads = ["32", "24", "16", "8", "56", "64"], k_heads = ["2", "4", "8", "32", "56", "1"], rotation = ["half", "interleaved"], epsilon = ["0x358637bd", "0x3727c5ac"], rows = ["1", "2", "4", "8"], block = ["64", "128", "256"], pdl = ["true", "false"], affine = ["false", "true"]}

[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], output = ["bf16", "f16", "f32"], head_dim = ["128", "64", "256"], q_heads = ["16", "24", "28", "32", "56", "64", "8"], k_heads = ["1", "2", "28", "32", "4", "56", "8"], rotation = ["half", "interleaved"], epsilon = ["0x358637bd", "0x3727c5ac"], rows = ["1", "2", "4", "8"], block = ["64", "128", "256"], pdl = ["true", "false"], affine = ["false", "true"], rotated = ["48", "64", "96", "128"]}

# The strided form the video VAE's decoder launches: heads read through a row stride, a factor table
# of the activation's type that repeats per tile. Named by `factors` and `strided`.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], output = ["bf16", "f16", "f32"], head_dim = ["128", "64", "256"], q_heads = ["16", "24", "28", "32", "56", "64", "8"], k_heads = ["1", "2", "28", "32", "4", "56", "8"], rotation = ["half", "interleaved"], epsilon = ["0x358637bd", "0x3727c5ac"], rows = ["1", "2", "4", "8"], block = ["64", "128", "256"], pdl = ["true", "false"], affine = ["false", "true"], rotated = ["48", "64", "96", "128"], factors = ["f16", "f32"], strided = ["true"] }

[parameters]
