# The qk_norm_rope operator's Triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py`.
#
# One program normalizes and rotates `rows` head rows of the query or the key;
# the token count is a launch value and the head geometry is the descriptor's.
# `block` is the head width the program loads in one tile, so a descriptor's
# block must cover `head_dim`.

op = "qk_norm_rope"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/qk_norm_rope.py", "src/build.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

# `dtype_bf16_output_bf16_head_dim_128_q_heads_32_k_heads_4_rotation_half_epsilon_0x358637bd_rows_16_block_128_pdl_false`.
# The operator prints `rotated` only when the rotation is narrower than the head, and `affine` only
# for the form with no learned scale, so the fields a key holds differ by variant and each variant
# is a key shape of its own: the full-width weighted form a text decoder compiles, the narrowed
# weighted form a multimodal transformer does (an even `rotated` below `head_dim`), and the
# weightless form of each. `affine` has one value, because a learned scale is the form that prints
# no field. One backend, because a deployment names a backend and not a key shape.
# `head_dim`, `rows` and `block` are `tl.arange` extents, so powers of two; the head counts are
# compiled in for any positive value, and the epsilon is a launch word.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], output = ["bf16", "f16", "f32"], head_dim = { power_of_two = true }, q_heads = { min = 1 }, k_heads = { min = 1 }, rotation = ["half", "interleaved"], epsilon = { bits = 32 }, rows = { power_of_two = true }, block = { power_of_two = true }, pdl = ["true", "false"] }

[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], output = ["bf16", "f16", "f32"], head_dim = { power_of_two = true }, q_heads = { min = 1 }, k_heads = { min = 1 }, rotation = ["half", "interleaved"], epsilon = { bits = 32 }, rows = { power_of_two = true }, block = { power_of_two = true }, pdl = ["true", "false"], affine = ["false"] }

[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], output = ["bf16", "f16", "f32"], head_dim = { power_of_two = true }, q_heads = { min = 1 }, k_heads = { min = 1 }, rotation = ["half", "interleaved"], epsilon = { bits = 32 }, rows = { power_of_two = true }, block = { power_of_two = true }, pdl = ["true", "false"], rotated = { multiple = 2 } }

[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], output = ["bf16", "f16", "f32"], head_dim = { power_of_two = true }, q_heads = { min = 1 }, k_heads = { min = 1 }, rotation = ["half", "interleaved"], epsilon = { bits = 32 }, rows = { power_of_two = true }, block = { power_of_two = true }, pdl = ["true", "false"], affine = ["false"], rotated = { multiple = 2 } }

# The strided form the video VAE's decoder launches: heads read through a row stride, a factor table
# of the activation's type that repeats per tile. Named by `factors` and `strided`, and weightless:
# the operator refuses the strided form a learned scale.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], output = ["bf16", "f16", "f32"], head_dim = { power_of_two = true }, q_heads = { min = 1 }, k_heads = { min = 1 }, rotation = ["half", "interleaved"], epsilon = { bits = 32 }, rows = { power_of_two = true }, block = { power_of_two = true }, pdl = ["true", "false"], affine = ["false"], rotated = { multiple = 2 }, factors = ["f16", "f32"], strided = ["true"] }

