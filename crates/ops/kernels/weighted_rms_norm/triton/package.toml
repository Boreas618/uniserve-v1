# The weighted_rms_norm operator's Triton backend: design 5.2's package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the compile
# driver the Build Server runs for one descriptor and target).
#
# The descriptor is the normalization's own: the element type, the row width, the
# lane tile that covers it, and whether each program publishes its row's largest
# magnitude. The key is the one `WeightedRmsNormDescriptor`'s `Display` prints,
# e.g. `dtype_bf16_columns_3072_tile_4096_absmax_false`.

op = "weighted_rms_norm"
backend = "triton"
interface_version = 1

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/weighted_rms_norm.py", "src/build.py"]
script = "src/build.py"

[kernel]
architectures = ["sm_100a", "sm_90a"]

[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], columns = { min = 1 }, tile = { power_of_two = true }, absmax = ["true", "false"] }

# A residual held wider than the rows a projection reads: the update and the normalized rows are
# `activation`, and the key names it only then. The video VAE's decoder keeps an FP32 stream.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], columns = { min = 1 }, tile = { power_of_two = true }, absmax = ["true", "false"] , activation = ["bf16", "f16"] }

[parameters]
