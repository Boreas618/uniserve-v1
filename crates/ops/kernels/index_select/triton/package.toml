# The index_select operator's Triton backend: design 5.2's package.
#
# One program per row keeps the row's `kept` best pooled scores by four radix
# passes over the row and one compaction pass in column order, and writes the
# entry each names, -1 for a score of -inf: a column, a block of `pool`
# columns (the row's newest visible block pinned), or the group of a candidate
# block a column scored. The row is read in chunks of `tile` scores, so one
# module serves rows of any length; the column count and the kept count are
# launch values. The scores are FP32 or BF16, ranked by their FP32 values.

op = "index_select"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

# The derivation gives the pooled entries one chunk holds, `tile / pool`, and
# the scores' type, FP32 when a key does not state it.
[launch]
kernel = "_index_select_kernel"
warps = 8
derive = "derive"

[launch.types]
scores = { field = "scores", values = { f32 = "*fp32", bf16 = "*bf16" } }
visible = "*i32"
candidates = "*i32"
out = "*i32"
columns = "i64"
kept = "i64"

[launch.constants]
POOL = { field = "pool" }
CANDIDATES = { field = "candidates" }
LANES = { field = "lanes" }

# `pool_8_candidates_0_tile_4096_scores_bf16`.
#
# `tile / pool` is a `tl.arange` extent, so a power of two the derivation
# checks; `candidates` is zero for scores of the request's own groups; `scores`
# appears only for BF16 scores.
[[kernel.descriptors]]
dimensions = { pool = { power_of_two = true }, candidates = { min = 0 }, tile = { power_of_two = true }, scores = ["f32", "bf16"] }
