# The slot_commit operator's Triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py`.
#
# One program applies the whole step's commit rows with `block` lanes, so the
# row count is a runtime word and one module serves every step of that shape.

op = "slot_commit"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/slot_commit.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

# `index_i32_verified_i32_penalties_i32_stride_8_future_stride_1_vocab_151936_block_8`.
[kernel.descriptors]
# The descriptor a launch passes: the table and the sampled ids are i32 end to end
# (`nn::Sampler` emits i32), one next-input token per slot, and the block is the
# smallest power of two covering a bucket's rows. `stride` is the *table capacity*
# - the largest bucket's rows for every bucket - so a deployment with a wider
# decode bucket declares its own value here.
dimensions = { index = ["i32"], verified = ["i32"], penalties = ["i32"], stride = ["8"], future_stride = ["1"], vocab = ["151936", "248320"], block = ["1", "2", "4", "8"] }

[parameters]
