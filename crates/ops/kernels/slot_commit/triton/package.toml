# The slot_commit operator's Triton backend: design 5.2's package.
#
# One program applies the whole step's commit rows with `block` lanes, so the
# row count is a runtime word and one module serves every step of that shape.

op = "slot_commit"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

# The commit is latency-bound state movement, not a throughput kernel. The element types the
# kernel's constexprs take are Triton types (`index_type`, `verified_type` and `penalties_type`,
# which `derive` gives).
[launch]
kernel = "_slot_commit_kernel"
warps = 4
derive = "derive"

# Both flags are read as bytes: 0 and 1 are 0 and 1 in the low byte of any integer element the
# caller may hold them in.
[launch.types]
columns = { pointer = "index" }
tokens = { pointer = "index" }
valid = "*u8"
active = "*u8"
continuation = "*u8"
points = { pointer = "index" }
future = { pointer = "index" }
predicates = "*u8"
logical = { pointer = "index" }
sampling = { pointer = "index" }
verified = { pointer = "verified" }
penalties = { pointer = "penalties" }
count = "i64"

[launch.constants]
INDEX = { field = "index_type" }
VERIFIED = { field = "verified_type" }
PENALTY_DTYPE = { field = "penalties_type" }
STRIDE = { field = "stride" }
FUTURE_STRIDE = { field = "future_stride" }
VOCAB = { field = "vocab" }
BLOCK = { field = "block" }

# `index_i32_verified_i32_penalties_i32_stride_8_future_stride_1_vocab_151936_block_8`.
[[kernel.descriptors]]
# The descriptor a launch passes: the table and the sampled ids are i32 end to end
# (`nn::Sampler` emits i32), one next-input token per slot, and the block is the
# smallest power of two covering a bucket's rows (`tl.arange`'s extent). `stride`
# is the table capacity, the largest bucket's rows for every bucket; it, the next
# input's slot stride and the vocabulary are compiled in for any positive value.
dimensions = { index = ["i32"], verified = ["i32"], penalties = ["i32"], stride = { min = 1 }, future_stride = { min = 1 }, vocab = { min = 1 }, block = { power_of_two = true } }
