# The attention_gather_decode_inputs operator's Triton backend: design 5.2's package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one architecture
# of `[kernel.architectures]`, built by `src/build.py` (the compile driver the
# Program Server runs for one descriptor and target).
#
# This is a decode step's inputs: one launch per call gather the batch's per-row
# token ids, positions, cache and query lengths, exclusive offsets, block tables,
# start pages and append addresses out of the request pool, so a captured graph
# replays a batch whose rows changed without a host round trip. Every output is an
# index, a copy of one, or an offset sum, so the checks compare bits.
#
# The seven strides that only place the caller's tensors are runtime arguments, so
# one module serves any storage; `position_axes` is compiled in because it is the
# length of a `tl.static_range`, and `row_block` because `tl.arange` needs a
# power-of-two extent while the row capacity itself is a runtime value.
#
# The declared configuration is one decode shape: a 256-row bucket (`row_block`
# 256), 256 selected columns of a 257-wide block-table row, one table, 256 units per
# slot, 512 slots, 4096-element request rows, and both position layouts — one text
# axis and three spatial axes.

op = "attention_gather_decode_inputs"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/attention_gather_decode_inputs.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a", "sm_100f"]

[kernel.descriptors]
dimensions = { index = ["i32"], tables = ["1"], unit_table_stride = ["131072"], unit_row_stride = ["256"], request_width = ["256"], start_group_stride = ["512"], request_token_stride = ["4096"], request_position_stride = ["4096"], position_axis_stride = ["256"], position_axes = ["1", "3"], block_table_stride = ["65536"], block_table_row_stride = ["257"], start_page_stride = ["256"], write_stride = ["256"], row_block = ["256"], block = ["256"] }

[parameters]
