# The scaled_residual_rms_norm operator's Triton backend: design 5.2's package.
#
# The descriptor is the fused residual's own: the element type, the row width, the
# lane tile that covers it, whether the update carries a bias, and whether each
# program publishes its row's largest magnitude. The key is the one
# `ScaledResidualRmsNormDescriptor`'s `Display`
# prints, e.g. `dtype_bf16_columns_3072_tile_4096_update_bias_true_absmax_false`.

op = "scaled_residual_rms_norm"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

# A program with a magnitude buffer takes one more pointer, so the two variants are two kernels.
# The derivation gives `activation`, the update's and the normalized rows' element type, the
# residual's when the key names none. The operator rounds the gated product before the residual
# sum, so the two must not fuse into one multiply-add.
[launch]
kernel = { field = "absmax", values = { true = "_scaled_residual_rms_norm_absmax_kernel", false = "_scaled_residual_rms_norm_kernel" } }
warps = { field = "columns", steps = [[2048, 8]], otherwise = 4 }
derive = "derive"
options = { enable_fp_fusion = false }

# The operator's scale is `[columns]` or `[1]`, and `scale_width` says which.
[launch.types]
hidden_ptr = { pointer = "dtype" }
update_ptr = { pointer = "activation" }
update_bias_ptr = { pointer = "dtype" }
scale_ptr = { pointer = "dtype" }
weight_ptr = { pointer = "dtype" }
output_ptr = { pointer = "activation" }
partials_ptr = "*fp32"
eps = "fp32"
scale_width = "u32"

[launch.constants]
HAS_UPDATE_BIAS = { field = "update_bias" }
WIDTH = { field = "columns" }
BLOCK = { field = "tile" }

[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], columns = { min = 1 }, tile = { power_of_two = true }, update_bias = ["true", "false"], absmax = ["true", "false"] }

# A residual held wider than the rows a projection reads: the update and the normalized rows are
# `activation`, and the key names it only then. The video VAE's decoder keeps an FP32 stream.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], columns = { min = 1 }, tile = { power_of_two = true }, update_bias = ["true", "false"], absmax = ["true", "false"] , activation = ["bf16", "f16"] }
