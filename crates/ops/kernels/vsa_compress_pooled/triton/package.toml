# The vsa_compress_pooled operator's Triton backend: design 5.2's package.
#
# The compression VSA's gate adds to every query row: one softmax over the key tiles, weighted into
# the pooled per-head means `vsa_prepare_tiles` writes, narrowed once into the attention's row type.
# The pooled scores and values are FP32 and only the result narrows, so `dtype` names the compressed
# rows and no operand is a dimension.
#
# `max_tiles` is the bound the operator refuses a tile count past, and this package compiles it as
# the block the softmax reduces in, rounded up to a power of two; `width` is the feature block and
# `block` the lanes it uses; `heads` sizes the pooled values' layout and a program is one head, so
# the grid carries the count.

op = "vsa_compress_pooled"
backend = "triton"
interface_version = 1

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/vsa_compress_pooled.py", "src/build.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

# `dtype_bf16_heads_56_width_128_max_tiles_1024_block_128_pdl_false`.
[kernel.descriptors]
# `max_tiles` is a **class**, not a count: the key names the bound's next power of two, so a bound
# of 640 tiles and one of 1024 are one module. `block` is a `tl.arange` extent; `heads` and `width`
# compile for any positive value, the lanes past `width` masked.
dimensions = { dtype = ["bf16", "f16", "f32"], heads = { min = 1 }, width = { min = 1 }, max_tiles = { power_of_two = true }, block = { power_of_two = true }, pdl = ["false", "true"] }

[parameters]
