# The sampler_shape operator's triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the
# compile driver the Program Server runs for one descriptor and target).

op = "sampler_shape"
backend = "triton"

[toolchain]
kind = "python"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/sampler_shape.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
dimensions = { dtype = ["bf16", "fp16", "fp32"], extras = ["0", "1", "4"], divide = ["true", "false"] }

[parameters]
block = 2048
warps = 4
