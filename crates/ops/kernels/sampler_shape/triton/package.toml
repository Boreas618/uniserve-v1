# The sampler_shape operator's Triton backend.
#
# One program penalizes one block of one row's logits over its slot's committed
# token counts and the row's extra tokens, then divides by the row's
# temperature. Every FP32 step is a separately rounded intrinsic, so the result
# is the tensor composition's, bit for bit.
op = "sampler_shape"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "triton"

[source]
kind = "triton"
files = ["src/sampler_shape.py", "src/build.py", "src/_compile.py"]

architectures = ["sm_100a", "sm_90a"]
target = "arch"

# `dtype_bf16_extras_0_divide_true`.
[descriptors]
dtype = ["bf16", "fp16", "fp32"]
extras = ["0", "1", "4"]
divide = ["true", "false"]

[parameters]
# Elements one program covers of a row.
block = 2048
warps = 4
