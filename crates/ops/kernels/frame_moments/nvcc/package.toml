# The frame_moments operator's CUDA backend: design 5.2's package.
#
# One native module per descriptor: the per-frame group statistics of a video
# convolution's input (`ops::frame::FrameMomentsCall`, 600 bytes), computed with
# PyTorch's own Welford operator, block reduction and launch width so the mean and the
# variance are bit for bit `torch.var_mean`'s over the same row.
#
# The module is a shared object compiled against the headers of the two ATen reductions
# the reference reuses, from the torch distribution the Build Server's environment locks;
# they are templates of their headers, so the module links nothing of torch. The
# descriptor names the element type.

op = "frame_moments"
backend = "nvcc"
interface_version = 1

# ATen's headers, which the unit includes.
[toolchain]
packages = ["torch"]

[source]
kind = "cuda"

[[kernel.descriptors]]
dimensions = { dtype = ["f32"] }
