# The expert_exchange operator's megamoe backend: design 5.2's package.
#
# FlashInfer's fused MegaMoE kernel: one launch per layer exchanges the tokens, runs the
# experts and combines. Its sources are the `megamoe` pin of `uniserve_build_server.fetch`
# (FlashInfer 0.6.18's `moe_ep/kernel_src/cutedsl_megamoe/src`, from the distribution the
# Build Server's environment locks) with `patches/megamoe.patch` applied: the
# tanh-approximated GELU gate and the token exchange's peer-metadata stride.
# The `flashinfer-python` version is the pin's, so it is declared below and a change of it
# is a new revision. `src/build.py` compiles it with the CuTe DSL
# for one group and one shape and exports it with its host launcher; `src/entry.cpp` and
# `src/stage.cu` are the transport around it. The kernel's tuning table is in
# `src/build.py`, so a revision of this package fixes it (design 5.4).
#
# One native module per descriptor, with the entries of the operator's header.

op = "expert_exchange"
backend = "megamoe"

[toolchain]
kind = "cute_dsl"
version = "4.6.2"
packages = [{ name = "flashinfer-python", version = "0.6.18" }]

[module]
form = "native"

[module.entries]
launch = "uniserve_expert_exchange_launch"
create = "uniserve_expert_exchange_create"
step = "uniserve_expert_exchange_step"
suspend = "uniserve_expert_exchange_suspend"
restore = "uniserve_expert_exchange_restore"
release = "uniserve_expert_exchange_release"
info = "uniserve_expert_exchange_info"

[source]
kind = "cute_dsl"
files = [
    "include/uniserve_expert_exchange.h",
    "patches/megamoe.patch",
    "src/build.py",
    "src/entry.cpp",
    "src/stage.cu",
]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a"]

# `mode_fused_hidden_2048_intermediate_768_top_8_experts_128_max_tokens_512_ranks_2_attention_0_dtype_bf16`.
# The extents are the kernel's static expert shape `(local, 2 * intermediate, hidden)`,
# compiled for any value its tiles divide: the block-scaled operands' contiguous extents are
# whole 128-element runs (`is_valid_tensor_alignment`), and a weight's rows are whole
# 256-row two-CTA tiles, so `hidden` is a multiple of 256 and `intermediate` of 128.
[kernel.descriptors]
dimensions = { mode = ["fused"], hidden = { multiple = 256 }, intermediate = { multiple = 128 }, top = { min = 1 }, experts = { min = 1 }, max_tokens = { min = 1 }, ranks = { min = 1 }, attention = ["0"], dtype = ["bf16"] }

[parameters]
