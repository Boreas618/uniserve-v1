# The expert_exchange operator's deepep backend: design 5.2's package.
#
# DeepEP's elastic dispatch and combine, its kernels unchanged at deepseek-ai/DeepEP
# commit b306af0 (the `deepep` pin of `uniserve_build_server.fetch`), with the host
# code `src/exchange.cu` states in place of its Python extension and its run-time
# compiler: a descriptor fixes every template argument, so a serving host compiles
# nothing. The kernels are built against the device communicator of the NCCL this
# project pins, whose headers are the `nccl` pin (the `nvidia-nccl-cu13` 2.30.4 wheel;
# `crates/platform` refuses an older NCCL when it loads the serving process's).
#
# One native module per descriptor, with the operator's eight entries. The group
# is one NVLink domain, whose ranks may be threads of one process.

op = "expert_exchange"
backend = "deepep"
interface_version = 1

[module.entries]
launch = "uniserve_expert_exchange_launch"
create = "uniserve_expert_exchange_create"
step = "uniserve_expert_exchange_step"
suspend = "uniserve_expert_exchange_suspend"
restore = "uniserve_expert_exchange_restore"
release = "uniserve_expert_exchange_release"
info = "uniserve_expert_exchange_info"
footprint = "uniserve_expert_exchange_footprint"

[source]
kind = "cuda"

# The transport's choices of how much of the device its kernels take, which DeepEP takes
# per call and its kernels as template arguments.
[parameters]
# Multiprocessors the dispatch and combine run on (DeepEP's `num_sms`), of the device's
# `multiprocessors`: the rest are left to the work beside the exchange. DeepEP estimates
# one from the links' bandwidth when a call states none; the transport states it. Their
# copy and reduce epilogues run on every multiprocessor of the device.
exchange_multiprocessors = 24
# RDMA queue pairs the kernels address (DeepEP's `num_qps`), the allocation DeepEP makes
# for a buffer that may span RDMA ranks without fast RDMA atomics. A group of this
# transport is one NVLink domain, whose kernels move every row through peer-mapped
# windows and use no queue pair.
queue_pairs = 129

# `mode_dispatch_hidden_2048_intermediate_768_top_8_experts_128_max_tokens_512_ranks_2_attention_0_multiprocessors_148_dtype_bf16`.
# The extents are DeepEP's template arguments, which compile for any value its static
# assertions admit: a hidden row of whole 256-element combine vectors and at most 32
# routes per token (DeepEP's `impls/combine.cuh`, `dispatch.cuh`). The expert
# count's division over the expert ranks is the operator's to check. `multiprocessors`
# is the device's, at least `exchange_multiprocessors`.
[[kernel.descriptors]]
dimensions = { mode = ["dispatch", "combine"], hidden = { multiple = 256 }, intermediate = { min = 1 }, top = { min = 1, max = 32 }, experts = { min = 1 }, max_tokens = { min = 1 }, ranks = { min = 1 }, attention = { min = 0 }, multiprocessors = { min = 1 }, dtype = ["bf16"] }
