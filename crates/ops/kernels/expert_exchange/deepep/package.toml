    "vendor/nccl/nccl_device/ptr.h",
    "vendor/nccl/nccl_device/reduce_copy.h",
    "vendor/nccl/nccl_device/utility.h",
    "vendor/nccl/nccl_device_wrapper.h",
]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a"]

# `mode_dispatch_hidden_2048_intermediate_768_top_8_experts_128_max_tokens_512_ranks_2_attention_0_dtype_bf16`.
[kernel.descriptors]
dimensions = { mode = ["dispatch", "combine"], hidden = ["2048", "7168", "4096"], intermediate = ["768", "1536", "512"], top = ["8", "4", "2"], experts = ["128", "256", "64"], max_tokens = ["512", "8192", "4096", "16384"], ranks = ["2", "3", "4", "8"], attention = ["0", "1", "2"], dtype = ["bf16"] }

[parameters]
