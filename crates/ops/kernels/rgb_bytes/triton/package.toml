# The rgb_bytes operator's Triton backend: design 5.2's package.
#
# This is the video path's last step: an ImageNet-normalized, channel-major float
# raster to packed 8-bit RGB, `round_half_to_even(clamp((x · std + mean) · 255, 0,
# 255))` in FP32 whatever the input's element type. The rounding is visible in the
# artifact: a tie goes to the even neighbour, written as an addition and subtraction
# of 2^23 (where an FP32's ulp is one) rather than as a library call, so the arithmetic
# also runs under Triton's interpreter and can be checked without a GPU. The check
# scripts compare bytes, their samples including ties.
#
# The key names the input's element type, the channel count, the block and whether
# the module was compiled for programmatic dependent launch. The raster's frame
# count, sides and strides are launch values — a clip's geometry varies while the
# arithmetic does not — so no resolution makes a new module, e.g.
# `dtype_f16_channels_3_block_1024_pdl_false`.

op = "rgb_bytes"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

# A warp for every 512 output bytes, up to eight: a byte is three loads and a store.
[launch]
kernel = "_rgb_bytes_kernel"
warps = { field = "block", steps = [[4096, 8], [2048, 4], [1024, 2]], otherwise = 1 }

# `mean` and `std` are the checkpoint's FP32 constants, one per channel, and the output is always
# packed `u8`. The extents and strides are 64-bit, because a long clip outgrows 32 bits.
[launch.types]
input = { pointer = "dtype" }
mean = "*fp32"
std = "*fp32"
out = "*u8"
frames = "i64"
rows = "i64"
columns = "i64"
channels = "i32"
in0 = "i64"
in1 = "i64"
in2 = "i64"
out0 = "i64"
out1 = "i64"
out2 = "i64"

[launch.constants]
CHANNELS = { field = "channels" }
BLOCK = { field = "block" }

[[kernel.descriptors]]
# `f16` is the video VAE's raster dtype; `bf16` and `f32` are accepted because the
# arithmetic is the same either way: the values convert to FP32 before the
# de-normalization.
dimensions = { dtype = ["f16", "bf16", "f32"], channels = { min = 1 }, block = { power_of_two = true }, pdl = ["true", "false"] }
