# The replicate_pad operator's Triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py`.
#
# One program covers one block of the output, one element per lane, and maps
# each output index to its input index by the clamped `o - left` rule, which
# repeats the edge value outward. The element type and the number of padded
# axes are the descriptor's; the extents and the pads are launch scalars.

op = "replicate_pad"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/replicate_pad.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

# `dtype_f32_axes_1_block_1024_pdl_false`.
[kernel.descriptors]
dimensions = { dtype = ["f32", "bf16", "f16", "u8", "i32", "i64"], axes = ["1", "2", "3"], block = ["1024", "2048", "512", "256"], pdl = ["true", "false"] }
