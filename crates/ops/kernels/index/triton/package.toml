# The index operator's Triton backend: design 5.2's package.
#
# Elements read or written at the positions an index tensor names along one
# axis. `gather` reads the source at the indexed positions; `scatter_set` and
# `scatter_add` store or add the source at the indexed positions of a
# contiguous destination. An index vector that serves every position off the
# axis is indices with a zero stride off it, so `index_select` is a `gather`
# and `index_add` a `scatter_add`. Indices are `u8`, `u32` or `i64`, and the
# largest value of the type names no element.
#
# A gather's programs are independent. A scatter's traverse the indexed axis in
# order within each column, so a repeated index is well defined and the
# operator's tolerance is `exact()` for all three functions.
#
# A `gather` and a `scatter_set` convert nothing, so an FP8 (`f8e4m3`) element
# moves as the byte it is; a `scatter_add` computes, and `src/build.py` refuses
# it for that element type.
#
# The function, both element types and the number of axes the call traverses are
# compiled in; extents, strides and the axis's steps are launch words. The key
# is the one `Descriptor`'s `Display` prints, e.g.
# `function_gather_dtype_bf16_indices_u32_rank_2_block_1024_pdl_false`.
#
# `src/strided.py` links the address arithmetic every tensor primitive shares,
# under `kernels/tensor/triton/src/`; an installation copies the file the link
# names.

op = "index"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

# A gather is one program per block of elements; a scatter one per block of columns.
[launch]
kernel = { field = "function", values = { gather = "_gather_kernel", scatter_set = "_scatter_kernel", scatter_add = "_scatter_kernel" } }
warps = { field = "block", steps = [[2048, 8]], otherwise = 4 }
derive = "derive"

# The gather's words, over the destination's extents `d`; then the scatter's, over the columns'
# extents `c`. The strides are the source's `s`, the indices' `i` and the destination's `t`.
[launch.types]
source = { pointer = "address" }
indices = { pointer = "indices" }
destination = { pointer = "address" }
elements = "i64"
columns = "i64"
length = "i64"
d1 = "i64"
d2 = "i64"
d3 = "i64"
d4 = "i64"
d5 = "i64"
c1 = "i64"
c2 = "i64"
c3 = "i64"
c4 = "i64"
c5 = "i64"
s0 = "i64"
s1 = "i64"
s2 = "i64"
s3 = "i64"
s4 = "i64"
s5 = "i64"
i0 = "i64"
i1 = "i64"
i2 = "i64"
i3 = "i64"
i4 = "i64"
i5 = "i64"
t0 = "i64"
t1 = "i64"
t2 = "i64"
t3 = "i64"
t4 = "i64"
t5 = "i64"
step = "i64"
source_step = "i64"
indices_step = "i64"
destination_step = "i64"

[launch.constants]
ADDS = { field = "adds" }
COMPUTE = { field = "compute" }
ABSENT = { field = "absent" }
RANK = { field = "rank" }
BLOCK = { field = "block" }

[[kernel.descriptors]]
dimensions = { function = ["gather", "scatter_set", "scatter_add"], dtype = ["u8", "u32", "i16", "i32", "i64", "f16", "bf16", "f32", "f64", "f8e4m3"], indices = ["u8", "u32", "i64"], rank = { min = 1, max = 6 }, block = { power_of_two = true }, pdl = ["false", "true"] }
