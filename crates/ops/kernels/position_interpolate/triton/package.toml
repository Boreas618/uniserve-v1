# The position_interpolate operator's Triton backend: design 5.2's package.
#
# A learned [in_side², channels] position table resampled to another grid: the caller hands four tap
# indices (i32) and four FP32 weights per output point, and the program gathers four table rows and
# writes their weighted sum. No alignment rule, no clamp and no division live here — a shared operator
# must not bake one caller's convention in — and the weights are the caller's normalization.
#
# `channels` and `block` are compiled tiles; `points`, `channels`, `block` and the PDL flag travel at
# launch, so one module serves every target grid.

op = "position_interpolate"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_position_interpolate_kernel"
warps = { field = "block", steps = [[1024, 8]], otherwise = 4 }

# The table and the output are stored in the descriptor's element type; the taps accumulate in
# FP32. `points`, `channels`, `block` and `pdl` are the launch's words.
[launch.types]
table_ptr = { pointer = "dtype" }
indices_ptr = "*i32"
weights_ptr = "*fp32"
out_ptr = { pointer = "dtype" }
points = "u32"
channels = "u32"
block = "u32"
pdl = "i32"

[launch.constants]
CHANNELS = { field = "channels" }
BLOCK = { field = "block" }

# `dtype_bf16_channels_1152_in_side_48_block_1024_pdl_false`.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], channels = { min = 1 }, in_side = { min = 1 }, block = { power_of_two = true }, pdl = ["false", "true"] }
