# The gather_gemm operator's CuTe DSL backend.
#
# FC1 of a mixture of experts over FlashInfer's MoE sort metadata: every tile of
# permuted (token, route) rows belongs to one expert; the kernel gathers the
# tile's hidden-state rows, multiplies them by that expert's up and gate rows
# with tcgen05 MMA accumulating in FP32, applies the gated activation and
# stores the product in BF16 at the permuted row.
#
# The module is a native library: the CuTe DSL export gives the host launch
# entry and the embedded cubin, and the package's `src/entry.cpp` is the stable
# C ABI (`uniserve_gather_gemm`). Its sources are UniServe's own CuTe DSL FC1
# kernel, derived from FlashInfer 0.6.18's blockscaled gather grouped GEMM with
# the block-scaled MMA replaced by BF16 tcgen05 MMA.
op = "gather_gemm"
backend = "cute_dsl"

[toolchain]
kind = "cute_dsl"
version = "4.6.2"
packages = ["cutlass-dsl==4.6.2", "flashinfer-python==0.6.18"]

[module]
form = "native"

[source]
kind = "cute_dsl"
files = [
    "src/gather_gemm.py",
    "src/build.py",
    "src/_compile.py",
    "src/entry.cpp",
    "src/entry.h",
]
entry = "uniserve_gather_gemm"

architectures = ["sm_100a"]
target = "arch"

# `tactic_m128n128_topk_8_activation_silu_k_2048_n_1536_experts_128`.
[descriptors]
# The MMA tile and cluster: the tactic the operator's tuning data chooses.
tactic = ["m128n128", "m256n128", "m128n256", "m256n256"]
# The sort metadata's routing expansion.
topk = ["8"]
activation = ["silu", "gelu_tanh"]
# The problem's contraction width and FC1 output width (up and gate rows).
k = ["2048"]
n = ["1536"]
experts = ["128"]

[parameters]
# Representative problem sizes the module is compiled for; pointers and sizes
# are runtime arguments, so one module serves every bucket.
tokens = 4096
rows = 32768
max_active_clusters = 1
