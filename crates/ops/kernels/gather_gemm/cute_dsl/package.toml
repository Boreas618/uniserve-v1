# The gather_gemm operator's CuTe DSL backend: design 5.2's package.
#
# One native module per descriptor: the compiled CuTe DSL specialization, its
# cubin and the exported host launcher, behind the C entry `entry.h` declares for
# the operator's `moe::grouped::GatherCall`.

op = "gather_gemm"
backend = "cute_dsl"
interface_version = 1

[source]
kind = "cute_dsl"

[kernel]
requires = ["tensor_memory"]

# `hidden_2048_intermediate_1536_experts_128_top_8_activation_silu_dtype_bf16_tile_128x128_cluster_1x1`.
# `tile` and `cluster` are the MMA shapes the kernel is written for. The widths are launch
# values: the activation rows load in whole 64-element K steps with no K predicate, so
# `hidden` is a multiple of 64, and the weights interleave 64-row up and gate blocks, so
# `intermediate` is a multiple of 64.
[[kernel.descriptors]]
dimensions = { hidden = { multiple = 64 }, intermediate = { multiple = 64 }, experts = { min = 1 }, top = { min = 1 }, activation = ["silu", "gelu_tanh"], dtype = ["bf16"], tile = ["128x128", "256x128", "128x256", "256x256"], cluster = ["1x1", "2x1", "1x2", "2x2"] }

[parameters]
# The persistent grid's bound, one cluster per multiprocessor. It is the largest multiprocessor
# count of the parts this architecture serves, GB200's 152: a smaller bound leaves multiprocessors
# idle, and on a part with fewer the CTAs past its count start as the first ones exit.
max_active_clusters = 152
