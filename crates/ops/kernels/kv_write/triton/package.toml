# The kv_write operator's Triton backend: design 5.2's package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py`.
#
# One program writes one tile of one token's cache row and raises the page's
# initialization flag, so one module serves every token count. The cache's dtype
# is the keys' own or another of BF16, FP16 and FP32, each element rounded to
# nearest even into it by the store; an FP8 page needs a per-page scale this
# operator does not carry, and is `kv_write_scaled`'s.

op = "kv_write"
backend = "triton"
interface_version = 1

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/kv_write.py", "src/build.py"]
script = "src/build.py"

[kernel]
architectures = ["sm_100a", "sm_90a"]

# `dtype_bf16_kv_bf16_page_64_heads_4_head_dim_128_tile_128_pdl_false`.
#
# `page`, `heads` and `head_dim` are launch words; the tile is a `tl.arange` extent.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], kv = ["bf16", "f16", "f32"], page = { min = 1 }, heads = { min = 1 }, head_dim = { min = 1 }, tile = { power_of_two = true }, pdl = ["true", "false"] }

[parameters]
