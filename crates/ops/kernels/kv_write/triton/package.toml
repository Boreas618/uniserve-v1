# The kv_write operator's Triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py`.
#
# One program writes one tile of one token's cache row and raises the page's
# initialization flag, so one module serves every token count. The cache's dtype
# equals the keys' here; an FP8 page needs a per-page scale the operator's
# arguments do not carry, so no descriptor declares one yet.

op = "kv_write"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/kv_write.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

# `dtype_bf16_kv_bf16_page_64_heads_4_head_dim_128_tile_128_pdl_false`.
[kernel.descriptors]
dimensions = { dtype = ["bf16", "f16", "f32"], kv = ["bf16", "f16", "f32"], page = ["64", "16", "32", "128"], heads = ["4", "8", "1", "2"], head_dim = ["128", "64", "256"], tile = ["128", "256", "512", "1024"], pdl = ["true", "false"] }

[parameters]
