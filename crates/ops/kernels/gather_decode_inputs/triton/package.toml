# The gather_decode_inputs operator's triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the
# compile driver the Program Server runs for one descriptor and target).

op = "gather_decode_inputs"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/gather_decode_inputs.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
dimensions = { tables = ["1"], request_width = ["640"], slots = ["256"], rows = ["1", "2", "4", "8", "16", "32", "64", "128", "256"] }

[parameters]
block = 256
request_fields = 1
tokens = 256
