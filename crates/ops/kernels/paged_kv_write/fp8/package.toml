# The paged_kv_write operator's FP8 backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the
# compile driver the Program Server runs for one descriptor and target).
#
# The backend `fp8` scatters the operator's same rows as E4M3 codes under one
# scale per page: a page's codes decode as `code * scale`, which the `fp8`
# backend of `paged_attention` reads. A page's scale grows only through
# `rescale_fp8_blocks` before a write.

op = "paged_kv_write"
backend = "fp8"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/paged_kv_write.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

# `dtype_bf16_heads_4_head_dim_128_block_size_64_pages_4096_flags_blocks`.
[kernel.descriptors]
dimensions = { dtype = ["bf16", "fp16"], heads = ["4", "8"], head_dim = ["128"], block_size = ["64", "16", "128"], pages = ["4096", "1024", "16384", "65536"], flags = ["blocks", "none"] }

[parameters]
tile = 256
