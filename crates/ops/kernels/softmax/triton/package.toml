# The softmax operator's Triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the compile
# driver the Program Server runs for one descriptor and target).
#
# The key is the one `SoftmaxDescriptor`'s `Display` prints, e.g.
# `dtype_bf16_columns_2048_tile_2048_pdl_false`.

op = "softmax"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/softmax.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
dimensions = { dtype = ["bf16", "f16", "f32"], columns = ["16", "32", "64", "128", "256", "512", "1024", "2048"], tile = ["16", "32", "64", "128", "256", "512", "1024", "2048"], pdl = ["true", "false"] }

[parameters]
