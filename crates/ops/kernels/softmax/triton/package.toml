# The softmax operator's Triton backend: design 5.2's package.
#
# The key is the one `SoftmaxDescriptor`'s `Display` prints, e.g.
# `dtype_bf16_columns_2048_tile_2048_pdl_false`.

op = "softmax"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_softmax_kernel"
warps = { field = "tile", steps = [[2048, 8]], otherwise = 4 }

# The row width is a launch word. `pdl` is a word the kernel does not read: the dependent launch
# is compiled in.
[launch.types]
x_ptr = { pointer = "dtype" }
out_ptr = { pointer = "dtype" }
columns = "i32"
pdl = "i32"

# `tile` is the lane block the program walks a row in.
[launch.constants]
BLOCK = { field = "tile" }

[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], columns = { min = 1 }, tile = { power_of_two = true }, pdl = ["true", "false"] }
