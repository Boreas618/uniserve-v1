# The rows operator's Triton backend: design 5.2's package.
#
# Place or accumulate the rows a model picks out by index. `replace` copies a source row into the
# destination row its index names; `add` accumulates it with one rounding into the destination's
# dtype. The mode is a compilation because the two are different arithmetic with different
# tolerances, and `columns` is the row width the program addresses with.
#
# One program is one (source row, block of columns), which is the operator's own grid. A repeated
# index is allowed by the operator and lands two source rows in two blocks with no order between
# them: the package states that rather than pretending the scheduler preserves it.

op = "rows"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_rows_kernel"
warps = { field = "block", steps = [[1024, 8]], otherwise = 4 }

# `count`, `columns` and `block` also travel at launch, so one module serves every row count.
[launch.types]
source_ptr = { pointer = "dtype" }
destination_ptr = { pointer = "dtype" }
indices_ptr = "*i32"
count = "u32"
columns = "u32"
block = "u32"

# `place` is `replace` whose negative index stores nothing.
[launch.constants]
COLUMNS = { field = "columns" }
REPLACE = { field = "mode", values = { replace = true, add = false, place = true } }
BLOCK = { field = "block" }
SKIP = { field = "mode", values = { replace = false, add = false, place = true } }

# `dtype_bf16_mode_replace_columns_5120_block_1024_pdl_false`, and the slice's own widths.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32", "i32"], mode = ["replace", "add", "place"], columns = { min = 1 }, block = { power_of_two = true }, pdl = ["false", "true"] }
