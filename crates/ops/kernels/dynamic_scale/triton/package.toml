# The dynamic_scale operator's Triton backend: design 5.2's package.
#
# One program folds an activation's partial largest magnitudes into its
# largest magnitude and writes the two factors a product over the activation,
# encoded at that measured scale, reads: the encoder's multiplier
# `range / amax` and the product's `(amax / range) · (weight_amax / range)`.
# The partials' element type, the tile one step reads and the dependent-launch
# flag are compiled in; the count, the range and the floor are launch words.
# The key is the one `Descriptor`'s `Display` prints, e.g.
# `dtype_bf16_tile_1024_pdl_false`.

op = "dynamic_scale"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_dynamic_scale_kernel"
warps = { field = "tile", steps = [[2048, 8]], otherwise = 4 }

[launch.types]
partials = { pointer = "dtype" }
weight_amax = "*fp32"
encode = "*fp32"
alpha = "*fp32"
count = "i64"
range_ = "fp32"
floor = "fp32"

[launch.constants]
TILE = { field = "tile" }

[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], tile = { power_of_two = true }, pdl = ["false", "true"] }
