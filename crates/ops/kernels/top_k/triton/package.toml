# The top_k operator's Triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py`.
#
# One program per row selects the row's `width` largest logits by four radix
# passes, compacts them into its scratch and orders them with eight stable radix
# passes. The vocabulary, the row count and the kept count are launch values; the
# key names the element types and the chunk one pass reads.

op = "top_k"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/top_k.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

# `dtype_f32_tile_2048_ids_i32_pdl_false`.
[kernel.descriptors]
dimensions = { dtype = ["f32", "bf16", "f16"], tile = ["1024", "2048", "4096", "8192"], ids = ["i32", "i64"], pdl = ["true", "false"] }

[parameters]
