# The paged_attention operator's trtllm backend: design 5.2's package.
#
# One native module per descriptor: trtllm-gen's FMHA launch code and kernel table,
# compiled against the artifact's generated header, with the cubins this
# descriptor's configurations can select published beside the module under
# `cubins/`. The entry is the operator's `attention::paged::Call`.
#
# It serves both phases over a cache of the queries' own type: decode with
# trtllm-gen's generation kernels and prefill with its context kernels. Its
# `priority` puts it ahead of the Triton package, which declares the same keys as a
# fallback, wherever both cover a key.
#
# `[toolchain] packages` names the FlashInfer distribution that carries the
# launch code; the build stages the pinned trtllm-gen FMHA library it launches
# (`uniserve_build_server.trtllm.FMHA`).

op = "paged_attention"
backend = "trtllm"
interface_version = 1
priority = 1

[toolchain]
packages = ["flashinfer-python"]

[source]
kind = "cuda"
unit = "src/entry.cu"

[kernel]
requires = ["tensor_memory"]

# `phase_decode_dtype_bf16_kv_bf16_out_bf16_head_dim_128_page_64_q_heads_32_kv_heads_4_mask_causal_window_false_len_40960`.
#
# No attention window is declared: the sliding kernels read a window size the
# operator's call states, and that path has not been checked against exact
# attention here.
#
# An FP8 E4M3 cache is not declared: trtllm-gen reads one E4M3 block scale per
# sixteen elements of the head dimension per key, per head and per page, and the
# operator's call carries one FP32 scale per page, so the module could not read
# the scales the kernel asks for.
#
# A dense cache is declared only in the queries' own type, with an output of that
# type: the artifact's dense kernels are `QkvBfloat16OBfloat16` and `QkvFp16OFp16`
# and nothing else, so a BF16 query over an FP16 cache has no kernel here. One table
# per element type states exactly those pairs, and a key of another pair is the
# Triton package's at selection rather than a build that fails.
#
# `head_dim` and `page` select the artifact's cubins, which exist for the listed
# values; the head counts are call words the entry checks and `len` changes no
# program.
[[kernel.descriptors]]
dimensions = { phase = ["decode", "prefill"], dtype = ["bf16"], kv = ["bf16"], out = ["bf16"], head_dim = ["128", "64", "256"], page = ["64", "16", "32"], q_heads = { min = 1 }, kv_heads = { min = 1 }, mask = ["causal", "dense"], window = ["false"], len = { min = 1 } }

[[kernel.descriptors]]
dimensions = { phase = ["decode", "prefill"], dtype = ["f16"], kv = ["f16"], out = ["f16"], head_dim = ["128", "64", "256"], page = ["64", "16", "32"], q_heads = { min = 1 }, kv_heads = { min = 1 }, mask = ["causal", "dense"], window = ["false"], len = { min = 1 } }
