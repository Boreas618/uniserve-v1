# The paged_attention operator's FP8 backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the
# compile driver the Program Server runs for one descriptor and target).
#
# Decode attention over FP8 KV pages: one program serves one query head of one
# decode row, walks the row's block table, decodes each page's E4M3 codes with
# that page's scale and accumulates in FP32 with the online-softmax recurrence.
# The prefill call over the same pages is a separate phase of this operator and
# is not in this package yet.

op = "paged_attention"
backend = "fp8"

[toolchain]
kind = "python"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/paged_attention.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

# `dtype_bf16_q_heads_32_kv_heads_4_head_dim_128_page_size_64_pages_4096_max_pages_640`.
[kernel.descriptors]
dimensions = { dtype = ["bf16", "fp16"], q_heads = ["32"], kv_heads = ["4", "8"], head_dim = ["128"], page_size = ["64", "16", "128"], pages = ["4096", "16384", "65536"], max_pages = ["640", "1280"] }

[parameters]
# `1 / sqrt(head_dim)` for the checkpoint's attention, times any YaRN factor.
softmax_scale = 0.08838834764831845
