# The rotary_factors operator's Triton backend: design 5.2's package.
#
# One program stores a block of scaled cosine and sine factors; the token count
# is a launch value, so one module serves every sequence length.

op = "rotary_factors"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

# A sectioned call's words carry the axes and the width each owns, so the two forms are two
# programs over one body. The derivation gives the axis count (one when the key names none), the
# frequencies each axis owns and the contiguous cut's thresholds, which the module compiles in.
[launch]
kernel = { field = "sectioned", values = { false = "_rotary_factors_kernel", true = "_rotary_factors_sectioned_kernel" } }
warps = 4
derive = "derive"

# A sectioned program's `axes` and section widths are the words the operator always passes; the
# module compiled its own from the key, so the words are taken for the call's order and not read.
[launch.types]
positions = { pointer = "positions" }
frequencies = "*fp32"
cosine = { pointer = "dtype" }
sine = { pointer = "dtype" }
total = "u64"
columns = "u32"
scale = "fp32"
axes = "u32"
section_0 = "u32"
section_1 = "u32"
section_2 = "u32"
section_3 = "u32"

[launch.constants]
AXES = { field = "axes" }
HALVES = { field = "halves" }
CUTS = { field = "cuts" }
INTERLEAVED = { field = "interleaved", absent = false }
BLOCK = { field = "block" }

# `dtype_fp32_positions_i64_columns_64_block_256_scale_0x3f800000_pdl_true`.
# The operator prints `axes`, `sections` and `interleaved` only for a sectioned
# rotation, so the package declares the two key shapes: positions are `[tokens]`
# for one axis, and `[axes, tokens]` — one coordinate per axis — for M-RoPE.
[[kernel.descriptors]]
dimensions = { dtype = ["f32"], positions = ["f32", "i32", "i64"], columns = { min = 1 }, block = { power_of_two = true }, scale = { bits = 32 }, pdl = ["true", "false"] }

# An interleaved rotation cycles its frequencies over at least two axes.
[[kernel.descriptors]]
dimensions = { dtype = ["f32", "f16"], positions = ["f32", "i32", "i64"], columns = { min = 1 }, block = { power_of_two = true }, scale = { bits = 32 }, pdl = ["false"], axes = { min = 2, max = 4 }, sections = { multiple = 2, separator = "-" }, interleaved = ["true"] }

# A sectioned rotation of half-width pairs prints no `interleaved`, so it is a key shape of its own.
[[kernel.descriptors]]
dimensions = { dtype = ["f32", "f16"], positions = ["f32", "i32", "i64"], columns = { min = 1 }, block = { power_of_two = true }, scale = { bits = 32 }, pdl = ["false"], axes = { min = 1, max = 4 }, sections = { multiple = 2, separator = "-" } }
