# The cross_fade operator's Triton backend: design 5.2's package.
#
# One module per descriptor: the seam between two decoded video tiles, blended over the leading
# `extent` positions of the height (axis 2) or the width (axis 3) of a
# [channels, frames, height, width] tile. The weights are the decoded dtype's own arithmetic, so the
# operator's tolerance is exact and one implementation produces the reference's bits.
#
# Each of the three views' three outer strides is a launch word, because a source may be a view
# inside the raster the tiles were decoded into — the seam the decoder passes is one — and `out`
# may still alias `current`.

op = "cross_fade"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_cross_fade_kernel"
warps = { field = "block", steps = [[1024, 8]], otherwise = 4 }

# `axis` and `block` are words the kernel does not read: it reads the compiled values.
[launch.types]
previous_ptr = { pointer = "dtype" }
current_ptr = { pointer = "dtype" }
out_ptr = { pointer = "dtype" }
extent = "u32"
axis = "u32"
channels = "u32"
frames = "u32"
rows = "u32"
columns = "u32"
previous_stride0 = "u32"
previous_stride1 = "u32"
previous_stride2 = "u32"
current_stride0 = "u32"
current_stride1 = "u32"
current_stride2 = "u32"
out_stride0 = "u32"
out_stride1 = "u32"
out_stride2 = "u32"
block = "u32"

# The axis is compiled because the blend's position is the row on axis 2 and the column on axis 3,
# and the previous tile's band sits at the far end of that axis, so the read and the mask both
# follow from it.
[launch.constants]
AXIS = { field = "axis" }
BLOCK = { field = "block" }

# `dtype_f16_extent_5_axis_2_block_1024_pdl_false`.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], extent = { min = 1 }, axis = ["2", "3"], block = { power_of_two = true }, pdl = ["false", "true"] }
