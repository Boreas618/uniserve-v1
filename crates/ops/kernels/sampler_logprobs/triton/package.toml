# The sampler_logprobs operator's Triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the
# compile driver the Program Server runs for one descriptor and target).
#
# One program scores one output row in three streaming passes over its logits
# row: the maximum, the log-sum-exp normalizer, then the selected token's score
# and its competition rank. The top-k logprob fields of the operator need a
# device top-k selection, which this package does not have yet.

op = "sampler_logprobs"
backend = "triton"

[toolchain]
kind = "python"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/sampler_logprobs.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

# `dtype_fp32`.
[kernel.descriptors]
dimensions = { dtype = ["fp32", "bf16", "fp16"] }

[parameters]
# Elements one pass step reads.
block = 4096
warps = 8
