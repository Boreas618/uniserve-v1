# The unpatchify_video operator's Triton backend: design 5.2's program package.
#
# One cubin per descriptor: the video VAE decoder's planar raster built from the diffusion
# transformer's packed tokens, a token's channel-major patch scattered into place, with the
# checkpoint's per-channel scale and bias when the descriptor asks for them.
#
# The affine form is its own program because its launch carries two more pointers; everything else
# the operator reads — the channels, the token grid and the patch — travels as words, so one module
# of a form serves every raster.

op = "unpatchify_video"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/unpatchify_video.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
# The affine form is its own program because its launch carries two more pointers; everything else
# the operator reads — the channels, the token grid and the patch — travels as words, so one module
# of a form serves every raster.
dimensions = { dtype = ["bf16", "f16", "f32"], affine = ["true", "false"], block = ["1024"], pdl = ["false"] }

[parameters]
