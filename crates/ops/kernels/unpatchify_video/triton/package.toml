# The unpatchify_video operator's Triton backend: design 5.2's program package.
#
# One cubin per descriptor: the video VAE decoder's planar raster built from the diffusion
# transformer's packed tokens, a token's channel-major patch scattered into place, with the
# checkpoint's per-channel scale and bias when the descriptor asks for them.
#
# The grid, the patch and the affine flag are the model's geometry, so they are the
# compilation; the affine form's launch carries two more operands and is its own variant.

op = "unpatchify_video"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"

[source]
kind = "triton"
files = ["src/unpatchify_video.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
# `patch` is the `frames×height×width` voxels one token carries; the grid follows the model's
# latents and the decoder's output raster.
dimensions = { dtype = ["bf16", "f16", "f32"], channels = ["3", "24"], frames = ["2", "4", "8", "16", "32"], height = ["8", "16", "30", "32", "40", "48", "64"], width = ["8", "16", "30", "32", "40", "48", "64"], patch = ["1x2x2", "1x4x4", "4x16x16"], affine = ["true", "false"], block = ["1024"], pdl = ["false", "true"] }

[parameters]
