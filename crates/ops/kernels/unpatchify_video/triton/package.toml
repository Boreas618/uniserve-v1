# The unpatchify_video operator's Triton backend: design 5.2's package.
#
# One cubin per descriptor: the video VAE decoder's planar raster built from the diffusion
# transformer's packed tokens, a token's channel-major patch scattered into place, with the
# checkpoint's per-channel scale and bias when the descriptor asks for them.
#
# The affine form is its own program because its launch carries two more pointers; everything else
# the operator reads — the channels, the token grid and the patch — travels as words, so one module
# of a form serves every raster.

op = "unpatchify_video"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = { field = "affine", values = { true = "_unpatchify_video_affine_kernel", false = "_unpatchify_video_kernel" } }
warps = { field = "block", steps = [[1024, 8]], otherwise = 4 }

# `scale_ptr` and `bias_ptr` are the affine kernel's alone. `block` and `pdl` are words neither
# kernel reads: the block width is compiled in.
[launch.types]
tokens_ptr = { pointer = "dtype" }
scale_ptr = { pointer = "dtype" }
bias_ptr = { pointer = "dtype" }
out_ptr = { pointer = "dtype" }
channels = "i32"
frames = "i32"
height = "i32"
width = "i32"
patch_frames = "i32"
patch_height = "i32"
patch_width = "i32"
out_stride0 = "i64"
out_stride1 = "i64"
out_stride2 = "i64"
block = "i32"
pdl = "i32"

[launch.constants]
BLOCK = { field = "block" }

[[kernel.descriptors]]
# The affine form is its own program because its launch carries two more pointers; everything else
# the operator reads — the channels, the token grid and the patch — travels as words, so one module
# of a form serves every raster.
dimensions = { dtype = ["bf16", "f16", "f32"], affine = ["true", "false"], block = { power_of_two = true }, pdl = ["false"] }
