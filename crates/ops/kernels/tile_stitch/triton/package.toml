# The tile_stitch operator's Triton backend: design 5.2's package.
#
# One module per descriptor: a clip's decoded tiles from their tokens into its raster, with the seam
# blends and the crop on the way. The element type, the channels and the patch are compiled; the
# raster's extents, its strides and the grid's numbers are the launch's words, and the grid itself
# arrives as two tables, so one module serves every canvas.

op = "tile_stitch"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_tile_stitch_kernel"
warps = 8

# The grid's two tables are rows of three `i32` words, `[tile, position, seam]`, one per raster
# row and one per raster column.
[launch.types]
tokens_ptr = { pointer = "dtype" }
rows_ptr = "*i32"
columns_ptr = "*i32"
out_ptr = { pointer = "dtype" }
frames = "u32"
width = "u32"
out_stride0 = "i64"
out_stride1 = "i64"
out_stride2 = "i64"
tile_columns = "u32"
token_rows = "u32"
tile_height = "u32"
tile_width = "u32"

[launch.constants]
CHANNELS = { field = "channels" }
PATCH_FRAMES = { field = "patch_frames" }
PATCH_SIDE = { field = "patch_side" }
BLOCK = { field = "block" }

# `dtype_f16_channels_3_patch_frames_4_patch_side_16_block_1024`.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], channels = { min = 1 }, patch_frames = { min = 1 }, patch_side = { min = 1 }, block = { power_of_two = true } }
