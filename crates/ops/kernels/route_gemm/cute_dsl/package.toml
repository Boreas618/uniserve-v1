# The route_gemm operator's CuTe DSL backend: design 5.2's package.
#
# One native module per descriptor: the compiled CuTe DSL specialization, its
# cubin and the exported host launcher, behind the C entry `entry.h` declares for
# the operator's `moe::grouped::RouteCall`.

op = "route_gemm"
backend = "cute_dsl"
interface_version = 1

# The kernel is a `uniserve_kernels.grouped_gemm.GroupedGemm`, derived from FlashInfer's MoE
# grouped GEMMs (that module states the provenance), and calls the pipelines and device
# functions of the FlashInfer distribution the Build Server's environment locks.
[toolchain]
packages = ["flashinfer-python"]

[source]
kind = "cute_dsl"

[kernel]
requires = ["tensor_memory"]

# `hidden_2048_intermediate_768_experts_128_top_8_dtype_bf16_tile_128x128_cluster_1x1`.
# `tile` and `cluster` are the MMA shapes the kernel is written for. The widths are launch
# values whose rows the tensor-memory loads and the bulk-copy epilogue need on 16-byte
# bounds: `hidden` and `intermediate` are multiples of 8 elements.
[[kernel.descriptors]]
dimensions = { hidden = { multiple = 8 }, intermediate = { multiple = 8 }, experts = { min = 1 }, top = { min = 1 }, dtype = ["bf16"], tile = ["128x128", "256x128", "128x256", "256x256"], cluster = ["1x1", "2x1", "1x2", "2x2"] }

[parameters]
# The persistent grid's bound, one cluster per multiprocessor. It is the largest multiprocessor
# count of the parts this architecture serves, GB200's 152: a smaller bound leaves multiprocessors
# idle, and on a part with fewer the CTAs past its count start as the first ones exit.
max_active_clusters = 152
