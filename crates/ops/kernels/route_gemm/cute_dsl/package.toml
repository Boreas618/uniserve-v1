# The route_gemm operator's CuTe DSL backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the
# compile driver the Program Server runs for one descriptor and target).
#
# FC2 of a mixture of experts: multiply each permuted row by its expert's down
# projection and store the unweighted result at the row's expanded index, so
# the output holds every token's uncombined routes and the MoE unpermute
# combines them. UniServe's own CuTe DSL FC2 kernel (derived from FlashInfer
# 0.6.18's contiguous grouped GEMM).

op = "route_gemm"
backend = "cute_dsl"

[toolchain]
kind = "python"
version = "4.6.2"
packages = [{ name = "cutlass-dsl", version = "4.6.2" }, { name = "flashinfer-python", version = "0.6.18" }]

[module]
form = "native"
entry = "uniserve_route_gemm"

[source]
kind = "cute_dsl"
files = ["src/route_gemm.py", "src/build.py", "src/_compile.py", "src/entry.cpp", "src/entry.h"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a"]

# `tactic_m128n128_k_768_n_2048_experts_128`.
[kernel.descriptors]
dimensions = { tactic = ["m128n128", "m128n256", "m256n128", "m256n256"], k = ["768"], n = ["2048"], experts = ["128"] }

[parameters]
# Representative problem sizes the module is compiled for; pointers and sizes
# are runtime arguments, so one module serves every bucket.
rows = 32768
max_active_clusters = 1
