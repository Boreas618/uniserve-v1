# The route_gemm_nvfp4 operator's trtllm-gen backend: design 5.2's package.
#
# One native module per descriptor: the trtllm-gen batched-GEMM launch code that
# FLASHINFER_MOE calls for a routed, block-scaled second matrix (`Gemm2::Runner`),
# compiled out of the FlashInfer distribution against the pinned `trtllm-gen-bmm`
# artifact, with the artifact's cubins this descriptor's options select published
# beside the module under `cubins/`. The entry is the operator's `RouteNvfp4Call`.
#
# Both operands are encoded E2M1: FC1's epilogue is a BF16 row, so `nvfp4_quantize`
# runs between the two products and this operator reads the encoded row it produced.
# The weights must be in the block-swizzled layout the kernels read, which the
# descriptor's `layout` states for both stacks' block scales.

op = "route_gemm_nvfp4"
backend = "trtllm"
interface_version = 1

[toolchain]
packages = ["flashinfer-python"]

[module.entries]
# The cubin loader's load entry (`uniserve_trtllm/cubins.h`): `ops` hands it the directory of the
# module's files once it has opened the library, and the module reads its cubins from there.
load = "uniserve_trtllm_load"

[source]
kind = "cuda"
unit = "src/entry.cu"

[kernel]
requires = ["tensor_memory"]

# `hidden_2048_intermediate_768_experts_128_top_8_dtype_bf16_scale_f8e4m3_layout_swizzled_128x4_tile_128x128_cluster_1x1`.
#
# `tile` and `cluster` are the MMA tactic's, and they are enforced where a tactic is
# chosen: the build publishes only the library's kernels built with this tile and
# cluster (`mTileM`, `mTileN`, `mClusterDimX`, `mClusterDimY`), so the runner's
# configuration list is exactly this geometry.
# This product fuses no activation, so the descriptor has none to name.
#
# The manifest's `[parameters.selected]` states the options a kernel must have been
# built with. The BF16-output E2M1 kernels of this artifact all carry a per-expert,
# per-column f32 bias (`mBiasType = M`); this operator has none, and the entry hands
# them a null pointer, which the runner takes as no bias.
# The widths are the runner's problem size. A weight's rows are whole 128-row tiles,
# `hidden` a multiple of 128, and the contraction's block scales are whole 128x4 atoms,
# `intermediate` a multiple of 64; the runner refuses at launch a size no published
# tactic divides.
[[kernel.descriptors]]
dimensions = { hidden = { multiple = 128 }, intermediate = { multiple = 64 }, experts = { min = 1 }, top = { min = 1 }, dtype = ["bf16"], scale = ["f8e4m3", "u8"], layout = ["swizzled_128x4", "linear"], tile = ["128x8", "128x16", "128x32", "128x64", "128x128", "128x192", "128x256"], cluster = ["1x1", "2x1", "1x2"] }

# The options the published kernels were built with, as the library's table states
# them: a literal, or `Enum::Name`, an enumerator of the library's headers. An option
# the descriptor decides names its field and the value each of the field's values
# selects. A kernel built with another value of any of these is not published, so a
# tactic the operator's geometry cannot use is not offerable.
[parameters.selected]
mDtypeA = "Dtype::E2m1"
mDtypeB = "Dtype::E2m1"
mDtypeC = "Dtype::Bfloat16"
mDtypeAcc = "Dtype::Fp32"
mSfLayoutA = "SfLayout::R128c4"
# The plain family this product selects is the one whose *activation* scales are the 128x4
# swizzled form (`SfLayout::R128c4` on both operands); the gated family beside it takes them
# linear. The model encodes this product's input with the swizzled layout, which is the
# form the kernel reads.
mSfLayoutB = { field = "layout", values = { swizzled_128x4 = "SfLayout::R128c4", linear = "SfLayout::Linear" } }
mSfBlockSizeA = 16
mSfBlockSizeB = 16
mUsePerTokenSfA = 0
mUsePerTokenSfB = 1
mPerTokenSfDtype = "Dtype::Fp32"
mUseShuffledMatrix = 1
mBiasType = "BiasType::M"
mBiasDtype = "Dtype::Fp32"
mFusedAct = 0
# The down product applies no activation of its own: the gate and the up product are the first
# GEMM's, and this one is linear. Stating it is what separates the plain cubin family from the
# `relu2` one, which the filter otherwise kept because both match every other option.
mEltwiseActType = "EltwiseActType::None"
