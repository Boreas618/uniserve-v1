# The sparse_attention operator's `wgmma` backend: design 5.2's package, on the warpgroup matrix
# instructions only Hopper's specific instruction set carries (`requires = ["warpgroup_mma"]`).
#
# One native module per descriptor: Video Sparse Attention, attention over the key
# blocks a caller selected (`ops::attention::sparse::SparseCall`, 704 bytes), on Hopper.
# The kernel is this package's warpgroup-pipelined SM90a block-sparse forward pass, written
# with CuTe on the CUTLASS headers the locked FlashInfer distribution installs (the
# package's one third-party source, used where the distribution installs it); the package
# also owns the operator's side — the call structure, the geometry checks its TMA copies
# need, and the one thing this backend does not do, which is write the softmax normalizer.
#
# The kernel's query tile and key block are both fixed at 128 rows, so this backend serves
# the descriptor's block 128 and only that.

op = "sparse_attention"
backend = "wgmma"
interface_version = 1

# CUTLASS and CuTe, which the kernel is written with, are headers of FlashInfer's distribution.
[toolchain]
packages = ["flashinfer-python"]

[source]
kind = "cuda"

# The kernel is CuTe and CUTLASS source, compiled against the CUTLASS headers the locked
# FlashInfer distribution installs (`cute/` beside `cutlass/`), with the relaxed constexpr every
# CUTLASS unit is compiled with; CuTe encodes the kernel's tensor maps through the driver API.
[compile]
units = ["src/attention.cu"]
standard = "c++17"
relaxed_constexpr = true
libraries = ["cuda"]
headers = [{ distribution = "flashinfer-python", path = "flashinfer/data/cutlass/include" }]

[kernel]
requires = ["warpgroup_mma"]

[[kernel.descriptors]]
dimensions = { block = ["128"], dtype = ["bf16"], output = ["bf16"], head_dim = ["128"], lse = ["false"] }
