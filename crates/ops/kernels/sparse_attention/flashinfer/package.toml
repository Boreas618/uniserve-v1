# The sparse_attention operator's `flashinfer` backend: design 5.2's package, FlashInfer's kernel
# for the sm_120 family (`requires = ["sm_120f"]`).
#
# One native module per descriptor: Video Sparse Attention on SM120/SM121, through
# FlashInfer's CuTe DSL block-sparse kernel (`BlockSparseAttnForwardSm120Blk64`). The vendor
# ships the kernel and a torch-shaped wrapper; this package constructs the kernel class and
# compiles it for fake tensors in the kernel's own layouts (`src/bsa_sm120.py`), exports it to
# C, and fills the generated structs from the operator's call.
#
# The kernel's tile is 64 rows in both the query and the key domain and its head is 128 wide,
# so this backend serves block 64 and head_dim 128. It always writes the softmax normalizer,
# so a call must carry one: the operator's `lse = false` form is not a launch this kernel has.

op = "sparse_attention"
backend = "flashinfer"
interface_version = 1

# The distribution whose kernel the build module imports.
[toolchain]
packages = ["flashinfer-python"]

[source]
kind = "cute_dsl"

[kernel]
requires = ["sm_120f"]

# The kernel writes its output in the queries' element type, so each element type is a cell of
# its own.
[[kernel.descriptors]]
dimensions = { block = ["64"], dtype = ["bf16"], output = ["bf16"], head_dim = ["128"], lse = ["true"] }

[[kernel.descriptors]]
dimensions = { block = ["64"], dtype = ["f16"], output = ["f16"], head_dim = ["128"], lse = ["true"] }
