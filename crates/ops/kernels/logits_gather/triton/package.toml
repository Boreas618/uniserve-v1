# The logits_gather operator's Triton backend: design 5.2's package.
#
# One program copies a block of elements of the rows a decode step keeps; the
# row count is a launch value.

op = "logits_gather"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_logits_gather_kernel"
warps = 4

# The gathered rows keep the hidden state's element type; `rows` holds one row index per output
# row.
[launch.types]
hidden_ptr = { pointer = "dtype" }
rows_ptr = "*i32"
out_ptr = { pointer = "dtype" }
count = "i64"
columns = "i32"

[launch.constants]
BLOCK = { field = "block" }

# `dtype_bf16_columns_2048_block_1024_pdl_true`.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32", "i32"], columns = { min = 1 }, block = { power_of_two = true }, pdl = ["false", "true"] }
