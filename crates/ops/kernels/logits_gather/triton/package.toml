# The logits_gather operator's Triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py`.
#
# One program copies a block of elements of the rows a decode step keeps; the
# row count is a launch value.

op = "logits_gather"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/logits_gather.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

# `dtype_bf16_columns_2048_block_1024_pdl_true`.
[kernel.descriptors]
dimensions = { dtype = ["bf16", "f16", "f32"], columns = ["2048", "4096", "7168", "151936"], block = ["512", "1024", "2048", "4096"], pdl = ["true", "false"] }

[parameters]
