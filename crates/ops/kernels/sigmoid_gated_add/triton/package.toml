# The sigmoid_gated_add operator's Triton backend: design 5.2's package.
#
# One program walks `block` elements of one row: it reads the row's scalar gate
# logit, and adds `sigmoid(gate) · update` into the target in FP32, rounding once.
# `columns` is a launch value, the row count the grid's second axis.

op = "sigmoid_gated_add"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

# The target and the update are arena rows on sixteen-byte bounds; the gate column is not. The
# columns are aligned where the key's width is a multiple of sixteen.
[launch]
kernel = "_sigmoid_gated_add_kernel"
warps = 4
aligned = ["target_ptr", "update_ptr", "columns"]

[launch.types]
target_ptr = { pointer = "dtype" }
update_ptr = { pointer = "dtype" }
gate_ptr = { pointer = "dtype" }
columns = "i32"

[launch.constants]
BLOCK = { field = "block" }

# `dtype_bf16_columns_2048_block_1024`.
[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], columns = { min = 1 }, block = { power_of_two = true } }
