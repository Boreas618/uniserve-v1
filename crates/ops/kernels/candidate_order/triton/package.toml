# The candidate_order operator's Triton backend: design 5.2's package.
#
# One program orders one row's candidates by token id. The row count comes from
# the grid and the candidate count arrives as the launch's last scalar, because
# the reference's width follows the request's top-k: a descriptor extent would
# recompile the sampler for every request.

op = "candidate_order"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_candidate_order_kernel"
warps = 4

# The values are permuted unchanged and the ids compared and moved unchanged; `counts` is the
# program's `[rows, vocabulary]` scratch of ranks.
[launch.types]
values_ptr = { pointer = "values" }
ids_ptr = { pointer = "ids" }
ordered_values_ptr = { pointer = "values" }
ordered_ids_ptr = { pointer = "ids" }
counts_ptr = "*i32"
rows = "i64"
width = "i32"
vocabulary = "i32"

# The row tile the program walks a candidate row in; the candidate count is a launch value, so the
# program loops over the row in tiles of this width.
[launch.constants]
BLOCK = 256

# `values_f32_ids_i32_pdl_false`.
[[kernel.descriptors]]
dimensions = { values = ["f32"], ids = ["i32", "i64"], pdl = ["true", "false"] }
