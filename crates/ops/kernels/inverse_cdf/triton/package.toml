# The inverse_cdf operator's Triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py`.
#
# One program draws one row's token from one uniform draw over the row's
# candidates, ordered by vocabulary id; the row count comes from the grid.

op = "inverse_cdf"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/inverse_cdf.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

# `width_2048_ids_i32_tokens_i32_pdl_false`.
[kernel.descriptors]
dimensions = { width = ["2048", "4096", "1024", "128"], ids = ["i32", "i64"], tokens = ["i32", "i64"], pdl = ["true", "false"] }

[parameters]
