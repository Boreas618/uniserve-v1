# The inverse_cdf operator's Triton backend: design 5.2's package.
#
# One program draws one row's token from one uniform draw over the row's
# candidates, ordered by vocabulary id; the row count comes from the grid.

op = "inverse_cdf"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_inverse_cdf_kernel"
warps = { field = "tile", steps = [[2048, 8]], otherwise = 4 }

# `ids` are the candidates' token ids and `tokens` the drawn token of each row.
[launch.types]
probabilities_ptr = "*fp32"
ids_ptr = { pointer = "ids" }
draws_ptr = "*fp32"
tokens_ptr = { pointer = "tokens" }
rows = "i64"
width = "i32"

[launch.constants]
BLOCK = { field = "tile" }

# `width_151936_tile_8192_ids_i32_tokens_i32_pdl_false`.
#
# The width, the row's candidate bound, is a launch word; the tile is the power-of-two
# chunk the program walks the row in.
[[kernel.descriptors]]
dimensions = { width = { min = 1 }, tile = { power_of_two = true }, ids = ["i32", "i64"], tokens = ["i32", "i64"], pdl = ["true", "false"] }
