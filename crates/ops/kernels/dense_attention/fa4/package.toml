# The dense_attention operator's fa4 backend: design 5.2's package.
#
# One native module per descriptor: FlashAttention-4's Blackwell dense forward pass
# over packed sequences, the vendor's kernel class constructed with an explicit
# configuration (`src/fa4.py`) and exported to C. The entry is the operator's
# `attention::dense::Call`.
#
# No cache and no page table: each sequence's rows are a contiguous run of the packed
# tensors, named by the two offset tables. A geometry FA4 cannot serve at this shape is
# a cell this manifest does not declare: no window (FA4 reads a window size as a
# distance, and the operator's window is a left bound the module is not compiled for),
# and one element type for query, key, value and output.

op = "dense_attention"
backend = "fa4"
interface_version = 1
# The forward pass's tile, query stages and tile scheduler per descriptor (`Request.tuned`).
tuning = ["tuning/forward.toml"]

# The distribution whose kernel the build module imports.
[toolchain]
packages = ["flash-attn-4"]

[source]
kind = "cute_dsl"

[kernel]
requires = ["tensor_memory"]

# `dtype_bf16_kv_bf16_out_bf16_head_dim_128_q_heads_32_kv_heads_4_mask_causal_window_false`.
#
# The offsets path only: `cu_seq_lens = true` is what the descriptor prints for a packed
# launch and prints nothing for it, so a package that serves packed sequences names no such
# field. The longest key sequence of a call is a launch value the entry checks, not a
# compile-time one.
#
# `head_dim` is the head widths FA4's forward pass compiles on SM100: `_validate_head_dims`
# admits every multiple of the alignment (16 bytes = 8 elements) in 8..128. A square head of
# 256 is FA4's dedicated two-CTA kernel, another class with another call, which this package
# does not carry. The head counts are the call's shapes; the entry refuses `q_heads` that
# `kv_heads` does not divide, which is the condition of FA4's grouped-query path
# (`num_head % num_head_kv == 0`).
[[kernel.descriptors]]
dimensions = { dtype = ["bf16"], kv = ["bf16"], out = ["bf16"], head_dim = ["8", "16", "24", "32", "40", "48", "56", "64", "72", "80", "88", "96", "104", "112", "120", "128"], q_heads = { min = 1 }, kv_heads = { min = 1 }, mask = ["causal", "dense"], window = ["false"] }

[[kernel.descriptors]]
dimensions = { dtype = ["f16"], kv = ["f16"], out = ["f16"], head_dim = ["8", "16", "24", "32", "40", "48", "56", "64", "72", "80", "88", "96", "104", "112", "120", "128"], q_heads = { min = 1 }, kv_heads = { min = 1 }, mask = ["causal", "dense"], window = ["false"] }
