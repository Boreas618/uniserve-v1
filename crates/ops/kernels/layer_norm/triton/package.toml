# The layer_norm operator's Triton backend: design 5.2's package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the compile
# driver the Build Server runs for one descriptor and target).
#
# Whether the layer has a bias is part of the compilation: a program without one
# reads two affine parameters and skips an addition. The key is the one
# `LayerNormDescriptor`'s `Display` prints, e.g.
# `dtype_bf16_tile_2048_bias_true_pdl_false`: the row width is a launch word
# within the tile, so one module serves every width the tile covers.

op = "layer_norm"
backend = "triton"
interface_version = 1

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/layer_norm.py", "src/build.py"]
script = "src/build.py"

[kernel]
architectures = ["sm_100a", "sm_90a"]

[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], tile = { power_of_two = true }, bias = ["false", "true"], pdl = ["false", "true"] }
[parameters]
