# The vsa_add_gated_tiles operator's Triton backend: design 5.2's package.
#
# The descriptor is the row pass's own: the element type, the rows of one tile, the
# features per head and the rows one program handles; the heads are a launch
# extent, not a compiled one. The key is the one `AddGatedTilesDescriptor`'s
# `Display` prints, e.g. `dtype_bf16_tile_rows_64_width_128_block_rows_16`.

op = "vsa_add_gated_tiles"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_add_gated_tiles_kernel"
# The product and the sum round separately, as the reference's two eager operations do, so the
# compiler may not contract them into a fused multiply-add.
options = { enable_fp_fusion = false }
warps = 4

[launch.types]
output = { pointer = "dtype" }
compressed = { pointer = "dtype" }
gate = { pointer = "dtype" }
output_stride_row = "i32"
output_stride_head = "i32"
gate_stride_row = "i32"
gate_stride_head = "i32"
compressed_stride_head = "i32"
compressed_stride_tile = "i32"

[launch.constants]
tile_rows = { field = "tile_rows" }
width = { field = "width" }
block_rows = { field = "block_rows" }

[[kernel.descriptors]]
# The width and the rows one program handles are `tl.arange` extents; the tile rows compile for any
# positive value the program's rows divide.
dimensions = { dtype = ["bf16", "f16", "f32"], tile_rows = { min = 1 }, width = { power_of_two = true }, block_rows = { power_of_two = true } }
