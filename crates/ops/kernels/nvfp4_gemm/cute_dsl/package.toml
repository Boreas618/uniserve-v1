# The nvfp4_gemm operator's CuTe DSL backend: design 5.2's package.
#
# The kernel is CUTLASS's block-scaled dense FP4 product: a CTA computes a
# 128x256 tile of `[m, n]`, reducing over whole 256 element steps with the
# Blackwell block-scaled tensor-core instructions, and the epilogue applies the
# call's alpha in FP32 before the one rounding that writes the tile.

op = "nvfp4_gemm"
backend = "cute_dsl"
interface_version = 1

[source]
kind = "cute_dsl"

[kernel]
requires = ["tensor_memory"]

# `packed_u8_scale_f8e4m3_accumulate_f32_output_bf16_layout_swizzled_128x4_epilogue_none_m_128_n_256_k_2048_pdl_true`.
#
# The scale fields are the checkpoint's own dtype, E4M3, one byte per sixteen
# elements: the kernel decodes each byte as an E4M3 value, so a `u8` cell would
# describe a buffer nothing here interprets.
#
# The layout is the one both operands' scale fields carry: Blackwell's block
# scaled tensor-core instructions read the 128x4 interleaved atom, so CUTLASS's
# `tile_atom_to_shape_SF` — which this module builds both scale tensors with — is
# a `tile_to_shape` of that atom, not a row-major view. A row-major matrix would
# need a conversion pass before the MMA; nothing here declares one.
#
# The extents compile for any problem of whole 128x256 output tiles reducing over whole
# 256-element steps (`src/build.py` refuses any other).
[[kernel.descriptors]]
dimensions = { packed = ["u8"], scale = ["f8e4m3"], accumulate = ["f32"], output = ["bf16", "f16"], layout = ["swizzled_128x4"], epilogue = ["none"], m = { multiple = 128 }, n = { multiple = 256 }, k = { multiple = 256 } }
