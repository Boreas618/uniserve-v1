# The conv3d operator's cudnn backend: design 5.2's program package.
#
# One native module per descriptor. The module is the convolution itself, through
# cuDNN 9's backend API: an engine per shape, chosen once (`tuning/engines.json`
# when a tuning pass has run, cuDNN's first proposal until then) and executed on
# the caller's stream, workspace from the stream's pool so a captured graph
# records it.
#
# The descriptor carries the element types only: the geometry, the strides, the padding, the
# dilation, the groups, the bias, the TF32 permission and the direction travel in the call
# structure the entry reads, so one compilation serves every shape a request brings — a
# descriptor that named them would compile one module per clip length and per filter shape.
# The key is the operator crate's: `input_f32_weight_f32_output_f32`.
#
# `tf32` is a permission, not a setting: it says whether the engine *may* use TF32
# tensor cores for an FP32 convolution, which is what design 9 asks the video VAE
# to keep. cuDNN 9's backend API chooses the engine's arithmetic itself and exposes
# no math-type knob (`cudnnSetConvolutionMathType` is the legacy path, and the
# heuristic's numerical notes no longer carry a TF32 note), so this module cannot
# turn TF32 on inside an engine that would not use it and cannot turn it off. It
# does the part that matters: `tf32` is validated against the input type — true for
# FP32, false otherwise — and a descriptor that disagrees is refused at launch
# instead of run. Do not go looking for a setting in this package; there is none.
#
# The video VAE's spatial convolutions are FP32 with TF32 allowed; the cube's
# filter is 3x3x3, stride one, padding one, one group, no bias.

op = "conv3d"
backend = "cudnn"

[toolchain]
kind = "nvcc"
version = "13.0.48"
packages = []

[module]
form = "native"

[module.entries]
launch = "uniserve_conv3d"

[source]
kind = "cuda"
files = [
    "include/uniserve_conv.h",
    "src/conv.cu",
    "src/build.py",
]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_100f"]

[kernel.descriptors]
dimensions = { input = ["bf16", "f32"], weight = ["bf16", "f32"], output = ["bf16", "f32"] }

[parameters]
