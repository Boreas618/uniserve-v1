# The channel_affine operator's Triton backend: design 5.2's package.
#
# One cubin per descriptor: `out = x · scale[c] + shift[c]` over a contiguous
# `[batch, channels, positions]` view, the product and the sum each one IEEE
# round-to-nearest FP32 operation that the compiler cannot fuse into one
# multiply-add. The geometry is launch words, so the key is the element type, the
# block and the PDL option, e.g. `dtype_f32_block_1024_pdl_false`.

op = "channel_affine"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_channel_affine_kernel"
# The product and the sum round separately, as the reference's two tensor operations do, so the
# compiler may not contract them into a fused multiply-add.
options = { enable_fp_fusion = false }
warps = { field = "block", steps = [[2048, 8]], otherwise = 4 }

# `pdl` is a word the kernel does not read: the dependent launch is compiled in.
[launch.types]
x = { pointer = "dtype" }
scale = { pointer = "dtype" }
shift = { pointer = "dtype" }
out = { pointer = "dtype" }
channels = "i64"
positions = "i64"
elements = "i64"
pdl = "i32"

[launch.constants]
BLOCK = { field = "block" }

[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], block = { power_of_two = true }, pdl = ["true", "false"] }
