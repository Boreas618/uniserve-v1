# The silu operator's Triton backend: design 5.2's program package.
#
# One cubin per descriptor: the plain sigmoid linear unit, `out = x / (1 + exp(−x))` over a
# contiguous `[rows, columns]` buffer. One formula, so one program — the element type and the
# block width are the compilation, the element count and the row width are launch words, so the
# key names no width: `dtype_bf16_block_1024_pdl_false` serves every row width.

op = "silu"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/silu.py", "src/build.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
dimensions = { dtype = ["bf16", "f16", "f32"], block = { power_of_two = true }, pdl = ["false", "true"] }

[parameters]
