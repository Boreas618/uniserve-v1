# The elementwise_where operator's Triton backend: design 5.2's package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the compile
# driver the Build Server runs for one descriptor and target).
#
# `out[i] = condition[i] != 0 ? on_true[i] : on_false[i]` over three inputs
# read through their strides, into a contiguous output. A selection converts
# nothing, so the operator's tolerance is `exact()`. The values' element type,
# the condition's and the number of axes the call traverses are compiled in; the
# shape and the strides are launch words. The key is the one
# `WhereDescriptor`'s `Display` prints, e.g.
# `dtype_bf16_condition_u8_rank_1_block_1024_pdl_false`.
#
# `src/strided.py` links the address arithmetic every tensor primitive shares,
# under `kernels/tensor/triton/src/`; an installation copies the file the link
# names.

op = "elementwise_where"
backend = "triton"
interface_version = 1

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/elementwise_where.py", "src/strided.py", "src/build.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
dimensions = { dtype = ["u8", "u32", "i16", "i32", "i64", "f16", "bf16", "f32", "f64"], condition = ["u8", "u32", "i64"], rank = { min = 1, max = 6 }, block = { power_of_two = true }, pdl = ["false", "true"] }

[parameters]
