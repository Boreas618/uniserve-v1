# The elementwise_where operator's Triton backend: design 5.2's package.
#
# `out[i] = condition[i] != 0 ? on_true[i] : on_false[i]` over three inputs
# read through their strides, into a contiguous output. A selection converts
# nothing, so the operator's tolerance is `exact()`, and an FP8 (`f8e4m3`) value
# is selected as the byte it is. The values' element type,
# the condition's and the number of axes the call traverses are compiled in; the
# shape and the strides are launch words. The key is the one
# `WhereDescriptor`'s `Display` prints, e.g.
# `dtype_bf16_condition_u8_rank_1_block_1024_pdl_false`.
#
# `src/strided.py` links the address arithmetic every tensor primitive shares,
# under `kernels/tensor/triton/src/`; an installation copies the file the link
# names.

op = "elementwise_where"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_elementwise_where_kernel"
warps = { field = "block", steps = [[2048, 8]], otherwise = 4 }
derive = "strided.addressed"

# The strides of the condition `c`, the true values `t` and the false values `f`.
[launch.types]
condition = { pointer = "condition" }
on_true = { pointer = "address" }
on_false = { pointer = "address" }
out = { pointer = "address" }
elements = "i64"
d1 = "i64"
d2 = "i64"
d3 = "i64"
d4 = "i64"
d5 = "i64"
c0 = "i64"
c1 = "i64"
c2 = "i64"
c3 = "i64"
c4 = "i64"
c5 = "i64"
t0 = "i64"
t1 = "i64"
t2 = "i64"
t3 = "i64"
t4 = "i64"
t5 = "i64"
f0 = "i64"
f1 = "i64"
f2 = "i64"
f3 = "i64"
f4 = "i64"
f5 = "i64"
pdl = "i32"

[launch.constants]
RANK = { field = "rank" }
BLOCK = { field = "block" }

[[kernel.descriptors]]
dimensions = { dtype = ["u8", "u32", "i16", "i32", "i64", "f16", "bf16", "f32", "f64", "f8e4m3"], condition = ["u8", "u32", "i64"], rank = { min = 1, max = 6 }, block = { power_of_two = true }, pdl = ["false", "true"] }
