# The elementwise_unary operator's Triton backend: design 5.2's package.
#
# `out[i] = f(x[i])` over an input read through its strides, into a contiguous
# output. The function, the element type and the number of axes the call
# traverses are compiled in; the shape, the strides and the function's scalars
# are launch words, so a module serves every shape of its rank. The key is the
# one `UnaryDescriptor`'s `Display` prints, e.g.
# `function_exp_dtype_bf16_rank_1_block_1024_pdl_false`.
#
# `src/strided.py` links the address arithmetic every tensor primitive shares,
# under `kernels/tensor/triton/src/`; an installation copies the file the link
# names.

op = "elementwise_unary"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_elementwise_unary_kernel"
warps = { field = "block", steps = [[2048, 8]], otherwise = 4 }
derive = "strided.computed"

# The function's scalars `a` and `b` travel in the computing type.
[launch.types]
x = { pointer = "dtype" }
out = { pointer = "dtype" }
elements = "i64"
d1 = "i64"
d2 = "i64"
d3 = "i64"
d4 = "i64"
d5 = "i64"
s0 = "i64"
s1 = "i64"
s2 = "i64"
s3 = "i64"
s4 = "i64"
s5 = "i64"
a = { field = "compute", values = { fp32 = "fp32", fp64 = "fp64", int = "i64" } }
b = { field = "compute", values = { fp32 = "fp32", fp64 = "fp64", int = "i64" } }
pdl = "i32"

[launch.constants]
FUNCTION = { field = "function" }
COMPUTE = { field = "compute" }
RANK = { field = "rank" }
BLOCK = { field = "block" }

# Every function exists on a floating element.
[[kernel.descriptors]]
dimensions = { function = ["exp", "log", "sin", "cos", "tanh", "neg", "recip", "sqr", "sqrt", "abs", "gelu", "gelu_erf", "erf", "relu", "silu", "sigmoid", "ceil", "floor", "round", "sign", "affine", "powf", "elu"], dtype = ["f16", "bf16", "f32", "f64"], rank = { min = 1, max = 6 }, block = { power_of_two = true }, pdl = ["false", "true"] }

# On an integer element, the functions closed over the integers.
[[kernel.descriptors]]
dimensions = { function = ["neg", "sqr", "abs", "relu", "ceil", "floor", "round", "sign", "affine"], dtype = ["u8", "u32", "i16", "i32", "i64"], rank = { min = 1, max = 6 }, block = { power_of_two = true }, pdl = ["false", "true"] }
