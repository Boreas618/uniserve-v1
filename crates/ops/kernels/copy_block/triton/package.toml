# The copy_block operator's Triton backend: design 5.2's package.
#
# One module per descriptor, and the descriptor is the two element types: the four extents and both
# stride vectors are launch words, because a clip's tile geometry changes per request and a program
# per canvas would break a captured call on the next one. There is no permutation dimension: a
# permutation is the source's strides permuted, which is a launch value like any other.
#
# The element block is compiled into the module and is the operator's own constant, so a change of
# block is a change of this package rather than a new key.

op = "copy_block"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

# A wide copy's rows are unit-stride and start on sixteen-element bounds on both sides, which its
# launch refuses otherwise (`Op::launch` checks the same words); a general copy states nothing.
[launch]
kernel = "_copy_block_kernel"
warps = 4
aligned = { field = "wide", values = { true = ["source_ptr", "out_ptr", "e3", "s0", "s1", "s2", "d0", "d1", "d2"], false = [] } }

# The descriptor names the two element types, and they are equal at launch: a copy converts
# nothing.
[launch.types]
source_ptr = { pointer = "source" }
out_ptr = { pointer = "out" }
e0 = "u64"
e1 = "u64"
e2 = "u64"
e3 = "u64"
s0 = "i64"
s1 = "i64"
s2 = "i64"
s3 = "i64"
d0 = "i64"
d1 = "i64"
d2 = "i64"
d3 = "i64"
total = "u64"
block = "u32"

[launch.constants]
BLOCK = { field = "wide", values = { true = 2048, false = 1024 } }
WIDE = { field = "wide" }

# `source_bf16_out_bf16_wide_false`.
[[kernel.descriptors]]
dimensions = { source = ["bf16", "f16", "f32"], out = ["bf16", "f16", "f32"], wide = ["false", "true"] }
