# The snake operator's Triton backend: design 5.2's package.
#
# The key is the one `Descriptor`'s `Display` prints, e.g.
# `dtype_bf16_channels_512_block_1024_pdl_false`. The channel count is the parameter
# count, so a second channel layout is a second module.

op = "snake"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_snake_kernel"
warps = { field = "block", steps = [[2048, 8]], otherwise = 4 }

# The signal's row count, channel count and width are launch words. `pdl` is a word the kernel
# does not read: the dependent launch is compiled in.
[launch.types]
x_ptr = { pointer = "dtype" }
alpha_ptr = { pointer = "dtype" }
out_ptr = { pointer = "dtype" }
rows = "i64"
channels = "i32"
width = "i32"
pdl = "i32"

# `block` is the program's lane width.
[launch.constants]
BLOCK = { field = "block" }

[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], channels = { min = 1 }, block = { power_of_two = true }, pdl = ["true", "false"] }
