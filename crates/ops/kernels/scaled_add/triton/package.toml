# The scaled_add operator's Triton backend: design 5.2's program package.
#
# One cubin per descriptor: a diffusion solver's Euler step, `target ← β · target + α ·
# source`, in place on the target. The two operands keep their own element types — a BF16
# accumulator stepped by an FP32 source — so the descriptor names both and each pair is a
# compilation. The coefficients are launch scalars.

op = "scaled_add"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"

[source]
kind = "triton"
files = ["src/scaled_add.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
dimensions = { target = ["bf16", "f16", "f32"], source = ["bf16", "f16", "f32"], columns = ["1", "16", "32", "52", "56", "64", "96", "104", "128", "208", "256", "280", "416", "512", "832", "1024", "1280", "1400", "2048", "2688", "4096", "5376", "5600", "6400", "8192", "12800", "16384", "22400", "25600", "32768", "44800", "51200", "65536", "102400", "131072", "204800", "399360", "798720", "1179648", "1572864", "1597440", "2064384", "2359296", "2822400", "3145728", "3194880", "3993600", "4128768", "4718592", "5644800", "5898240", "6291456", "6389760", "7864320", "7987200", "8257536", "9437184", "10321920", "11289600", "11796480", "12582912", "15728640", "15974400", "16515072", "20643840", "22579200", "23592960", "25559040", "31457280", "37748736", "41287680", "45158400", "50331648", "51118080", "57507840", "66060288", "75497472", "84934656", "90316800", "100663296", "113246208", "132120576", "148635648", "434503680", "641728512", "855638016", "869007360", "1123024896", "1283457024", "1711276032", "2246049792"], block = ["1024"] }
[parameters]
