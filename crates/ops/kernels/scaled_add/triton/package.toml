# The scaled_add operator's Triton backend: design 5.2's program package.
#
# One cubin per descriptor: a diffusion solver's Euler step, `target ← β · target + α ·
# source`, in place on the target. The two operands keep their own element types — a BF16
# accumulator stepped by an FP32 source — so the descriptor names both and each pair is a
# compilation. The coefficients are launch scalars.

op = "scaled_add"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"

[source]
kind = "triton"
files = ["src/scaled_add.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
dimensions = { target = ["bf16", "f16", "f32"], source = ["bf16", "f16", "f32"], columns = ["1", "32", "52", "96", "104", "128", "208", "256", "416", "512", "832", "1024", "2048", "2688", "4096", "5376", "8192", "16384", "32768", "65536", "131072", "399360", "798720", "1597440", "2822400", "3194880", "3993600", "5644800", "6389760", "7987200", "11289600", "15974400", "22579200", "25559040", "45158400", "51118080", "57507840", "90316800", "434503680", "869007360", "102400", "51200", "44800", "25600", "22400", "12800", "6400", "5600", "1400", "1280", "280", "56", "204800"], block = ["1024"] }
[parameters]
