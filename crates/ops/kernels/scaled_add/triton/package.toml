# The scaled_add operator's Triton backend: design 5.2's package.
#
# One cubin per descriptor: a diffusion solver's Euler step, `target ← β · target + α ·
# source`, in place on the target. The two operands keep their own element types — a BF16
# accumulator stepped by an FP32 source — so the descriptor names both and each pair is a
# compilation. The coefficients are launch scalars.

op = "scaled_add"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_scaled_add_kernel"
warps = { field = "block", steps = [[1024, 8]], otherwise = 4 }

[launch.types]
target_ptr = { pointer = "target" }
source_ptr = { pointer = "source" }
alpha = "fp32"
beta = "fp32"
elements = "i64"

[launch.constants]
BLOCK = { field = "block" }

[[kernel.descriptors]]
dimensions = { target = ["bf16", "f16", "f32"], source = ["bf16", "f16", "f32"], block = { power_of_two = true } }
