# The scaled_add operator's Triton backend: design 5.2's program package.
#
# One cubin per descriptor: a diffusion solver's Euler step, `target ← β · target + α ·
# source`, in place on the target. The two operands keep their own element types — a BF16
# accumulator stepped by an FP32 source — so the descriptor names both and each pair is a
# compilation. The coefficients are launch scalars.

op = "scaled_add"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"

[source]
kind = "triton"
files = ["src/scaled_add.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
dimensions = { target = ["bf16", "f16", "f32"], source = ["bf16", "f16", "f32"], columns = ["1", "16", "32", "40", "42", "48", "52", "56", "64", "84", "96", "104", "128", "140", "168", "192", "200", "208", "210", "256", "280", "336", "384", "400", "410", "416", "512", "672", "700", "768", "800", "832", "1010", "1024", "1050", "1280", "1344", "1400", "1536", "1600", "2048", "2050", "2100", "2135", "2688", "2800", "3200", "4096", "4100", "4200", "5050", "5376", "5600", "6400", "8192", "8200", "8400", "8535", "10100", "10675", "11200", "12800", "16384", "16400", "16800", "20200", "21350", "22400", "25600", "32768", "32800", "33600", "40400", "42675", "42700", "44800", "51200", "65536", "65600", "80800", "85350", "85400", "102400", "131072", "161600", "170700", "170800", "204800", "341400", "341600", "399360", "589824", "682800", "786432", "798720", "1032192", "1365600", "1597440", "2822400", "3194880", "3993600", "5644800", "6389760", "7987200", "11289600", "15974400", "22579200", "25559040", "45158400", "51118080", "57507840", "90316800", "434503680", "869007360"], block = ["1024"] }
[parameters]
