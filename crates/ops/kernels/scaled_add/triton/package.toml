# The scaled_add operator's Triton backend: design 5.2's program package.
#
# One cubin per descriptor: a diffusion solver's Euler step, `target ← β · target + α ·
# source`, in place on the target. The two operands keep their own element types — a BF16
# accumulator stepped by an FP32 source — so the descriptor names both and each pair is a
# compilation. The coefficients are launch scalars.

op = "scaled_add"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"

[source]
kind = "triton"
files = ["src/scaled_add.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
dimensions = { target = ["bf16", "f16", "f32"], source = ["bf16", "f16", "f32"], columns = ["1", "1010", "10100", "1024", "102400", "1032192", "1035", "10350", "104", "1050", "11200", "11289600", "128", "1280", "12800", "13000", "131072", "1344", "1344000", "1365600", "140", "1400", "14800", "1536", "1597440", "15974400", "16", "1600", "161600", "1625", "16384", "16400", "165600", "168", "16800", "168000", "170700", "185", "1850", "18600", "192", "200", "20200", "2048", "204800", "2050", "20700", "208", "210", "2100", "22400", "22579200", "2325", "25559040", "256", "25600", "26000", "2688", "280", "2800", "2822400", "29600", "3194880", "32", "3200", "325", "3250", "32768", "32800", "336", "33600", "336000", "341400", "3700", "37200", "384", "399360", "3993600", "40", "400", "40400", "4096", "410", "4100", "41400", "416", "42", "4200", "42000", "42675", "434503680", "44800", "45158400", "465", "4650", "48", "5050", "51118080", "512", "51200", "5175", "52", "52000", "5376", "56", "5600", "5644800", "57507840", "589824", "6389760", "64", "6400", "6500", "65536", "65600", "672", "672000", "682800", "700", "7400", "74400", "768", "786432", "798720", "7987200", "800", "80800", "8192", "8200", "82800", "832", "84", "8400", "84000", "8535", "85350", "869007360", "90316800", "925", "9300", "96"], block = ["1024"] }
