# The gated_residual operator's Triton backend: design 5.2's package.
#
# The descriptor bakes the row width,
# because the kernel recovers each element's row from it; the row count arrives as
# the launch's last scalar and the gate row stride is an int32 launch argument. The key is
# the one `GatedResidualDescriptor`'s `Display` prints, e.g.
# `dtype_bf16_indices_i32_width_3072_gate_stride_3072`.
#
# The program compiles for any width; the module states sixteen-element
# alignment for the gate row stride.
#
# The row indices are `u32` as the model library passes them
# (`nn::modules::adaln`, whose parameter rows are `U32`), or `i32` and `i64`. A
# parameter row times its stride stays far below 2^31 elements, so the index's
# signedness never changes an address.

op = "gated_residual"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

# Every operand is an arena tensor or a weight, whose rows start on sixteen-byte bounds. The gated
# update rounds to the activation dtype before the residual sum, so the two must not fuse into one
# rounding.
[launch]
kernel = "_gated_residual_kernel"
warps = 4
aligned = ["hidden_ptr", "update_ptr", "gate_ptr", "row_indices_ptr", "gate_row_stride"]
options = { enable_fp_fusion = false }

# The row count is the one thing a request changes: the operator appends it as its last scalar,
# so the program multiplies it by the width it was compiled for instead of holding an element
# count of its own.
[launch.types]
hidden_ptr = { pointer = "dtype" }
update_ptr = { pointer = "dtype" }
gate_ptr = { pointer = "dtype" }
row_indices_ptr = { pointer = "indices" }
gate_row_stride = "i32"
rows = "i64"

# The tile one launch walks is the operator's `GATED_BLOCK`.
[launch.constants]
WIDTH = { field = "width" }
BLOCK = 1024

[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], indices = ["u32", "i32", "i64"], width = { min = 1 }, gate_stride = { multiple = 16 } }
