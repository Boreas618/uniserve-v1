# The gated_residual operator's Triton backend: design 5.2's package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the compile
# driver the Build Server runs for one descriptor and target).
#
# The descriptor bakes the row width,
# because the kernel recovers each element's row from it; the row count arrives as
# the launch's last scalar and the gate row stride is an int32 launch argument. The key is
# the one `GatedResidualDescriptor`'s `Display` prints, e.g.
# `dtype_bf16_indices_i32_width_3072_gate_stride_3072`.
#
# The program compiles for any width; the module states sixteen-element
# alignment for the gate row stride.
#
# The row indices are `u32` as the model library passes them
# (`nn::modules::adaln`, whose parameter rows are `U32`), or `i32` and `i64`. A
# parameter row times its stride stays far below 2^31 elements, so the index's
# signedness never changes an address.

op = "gated_residual"
backend = "triton"
interface_version = 1

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/gated_residual.py", "src/build.py"]
script = "src/build.py"

[kernel]
architectures = ["sm_100a", "sm_90a"]

[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], indices = ["u32", "i32", "i64"], width = { min = 1 }, gate_stride = { multiple = 16 } }

[parameters]
