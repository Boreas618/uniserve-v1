# The gated_residual operator's Triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the compile
# driver the Program Server runs for one descriptor and target).
#
# The descriptor bakes the row width,
# because the kernel recovers each element's row from it; the row count arrives as
# the launch's last scalar and the gate row stride is an int32 launch argument. The key is
# the one `GatedResidualDescriptor`'s `Display` prints, e.g.
# `dtype_bf16_indices_i32_width_3072_gate_stride_3072`.
#
# The widths are the H3 transformer's hidden sizes; the values narrow to exactly the
# keys `model` publishes for H3.

op = "gated_residual"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/gated_residual.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
dimensions = { dtype = ["bf16", "f16", "f32"], indices = ["i32", "i64"], width = ["1024", "2048", "3072", "4096", "6144", "7168", "8192"], gate_stride = ["1024", "2048", "3072", "4096", "6144", "7168", "8192", "9216", "12288", "14336", "16384", "18432", "21504", "24576", "28672", "32768", "36864", "43008", "49152"] }

[parameters]
