# The act_and_mul operator's Triton backend: design 5.2's package.
#
# The descriptor is the gating's own: the element type, the output row width,
# the tile one program walks, the activation, the two input row strides, whether
# the views span 2**31 elements (the module then addresses in 64 bits), and the
# dependent-launch and stepwise flags. The key is the one
# `ActAndMulDescriptor`'s `Display` prints, e.g.
# `dtype_bf16_width_3072_block_4096_activation_silu_gate_stride_6144_value_stride_3072_wide_false_pdl_false_stepwise_false`.
#
# The row strides are whole multiples of the row width — the two halves of one
# packed projection, or two separately written ones. The module states
# sixteen-element alignment for the width and both strides, and `block` is a
# `tl.arange` extent, so a power of two.

op = "act_and_mul"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

# Every operand is an arena tensor or a weight, whose rows start on sixteen-byte bounds; the
# element count is a whole number of rows of `width`.
[launch]
kernel = "_act_and_mul_kernel"
warps = 8
aligned = ["gate_ptr", "value_ptr", "out_ptr", "elements", "gate_row_stride", "value_row_stride"]

# A wide descriptor counts elements and rows in 64 bits, a narrow one in 32.
[launch.types]
gate_ptr = { pointer = "dtype" }
value_ptr = { pointer = "dtype" }
out_ptr = { pointer = "dtype" }
elements = { field = "wide", values = { true = "i64", false = "i32" } }
gate_row_stride = { field = "wide", values = { true = "i64", false = "i32" } }
value_row_stride = { field = "wide", values = { true = "i64", false = "i32" } }

[launch.constants]
n_cols = { field = "width" }
ACTIVATION = { field = "activation" }
BLOCK = { field = "block" }
WIDE = { field = "wide" }
stepwise = { field = "stepwise" }

[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], width = { multiple = 16 }, block = { power_of_two = true }, activation = ["gelu", "gelu_tanh", "silu", "sigmoid"], gate_stride = { multiple = 16 }, value_stride = { multiple = 16 }, wide = ["false", "true"], pdl = ["false", "true"], stepwise = ["false", "true"] }
