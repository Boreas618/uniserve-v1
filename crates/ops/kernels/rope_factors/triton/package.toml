# The rope_factors operator's triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the
# compile driver the Program Server runs for one descriptor and target).

op = "rope_factors"
backend = "triton"

[toolchain]
kind = "python"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/rope_factors.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
dimensions = { positions = ["i32", "i64"], factors = ["fp32", "bf16"], half_dim = ["64", "128"], layout = ["sequence"] }

[parameters]
scale = 1.0
block = 256
