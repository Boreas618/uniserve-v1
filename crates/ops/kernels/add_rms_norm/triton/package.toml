# The add_rms_norm operator's Triton backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py`.
#
# One program adds a residual row, keeps the FP32 sum, normalizes it and rounds
# once into each output. `columns` is a launch value and `tile` the program's
# row block.

op = "add_rms_norm"
backend = "triton"

[toolchain]
kind = "triton"
version = "3.7.1"
packages = []

[module]
form = "cubin"
metadata = "metadata.json"

[source]
kind = "triton"
files = ["src/add_rms_norm.py", "src/build.py", "src/_compile.py"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

# `dtype_bf16_columns_2048_tile_2048_pdl_true`.
[kernel.descriptors]
dimensions = { dtype = ["bf16", "fp16", "fp32"], columns = ["768", "2048", "4096", "6144", "7168"], tile = ["1024", "2048", "4096", "8192"], pdl = ["true", "false"] }

[parameters]
eps = 1e-06
