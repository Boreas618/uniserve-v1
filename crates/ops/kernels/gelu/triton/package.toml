# The gelu operator's Triton backend: design 5.2's package.
#
# The approximation is part of the compilation: PyTorch's exact erf form and its
# tanh form evaluate different formulas, and the module holds one. The key is the
# one `Descriptor`'s `Display` prints, e.g.
# `dtype_bf16_block_1024_approximate_tanh_pdl_false`: the row width is a launch
# word, so one module serves every width.

op = "gelu"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

[launch]
kernel = "_gelu_kernel"
warps = { field = "block", steps = [[2048, 8]], otherwise = 4 }

# `pdl` is a word the kernel does not read: the dependent launch is compiled in.
[launch.types]
x_ptr = { pointer = "dtype" }
out_ptr = { pointer = "dtype" }
elements = "i64"
columns = "i32"
pdl = "i32"

[launch.constants]
APPROXIMATE = { field = "approximate" }
BLOCK = { field = "block" }

[[kernel.descriptors]]
dimensions = { dtype = ["bf16", "f16", "f32"], block = { power_of_two = true }, approximate = ["exact", "tanh"], pdl = ["false", "true"] }
