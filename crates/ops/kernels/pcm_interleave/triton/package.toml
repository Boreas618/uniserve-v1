# The pcm_interleave operator's Triton backend: design 5.2's package.
#
# This is the audio decoder's last step: two float channels to interleaved 16-bit
# PCM, `round_half_to_even(clamp(x, -1, 1) · 32767)` with ties to the even
# neighbour, which the operator states as an exact tolerance and this module
# reproduces with one PTX rounding instruction. The output is always i16, and the
# sample count is a launch value rather than a descriptor field — a request's
# duration varies while the arithmetic does not — so the key names only the input
# type, the block and whether the module was compiled for programmatic dependent
# launch, e.g. `dtype_f32_block_1024_pdl_false`.

op = "pcm_interleave"
backend = "triton"
interface_version = 1

[source]
kind = "triton"

# A warp for every 512 samples, up to eight: a sample is two loads and two stores.
[launch]
kernel = "_pcm_interleave_kernel"
warps = { field = "block", steps = [[4096, 8], [2048, 4], [1024, 2]], otherwise = 1 }

# `block` is a word the kernel does not read: it reads the compiled block.
[launch.types]
left = { pointer = "dtype" }
right = { pointer = "dtype" }
out = "*i16"
samples = "i32"
block = "i32"
pdl = "i32"

# The block is compiled so the grid a launch computes and the module agree.
[launch.constants]
BLOCK = { field = "block" }

[[kernel.descriptors]]
dimensions = { dtype = ["f32"], block = { power_of_two = true }, pdl = ["true", "false"] }
