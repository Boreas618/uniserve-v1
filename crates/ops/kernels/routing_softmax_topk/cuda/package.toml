# The routing_softmax_topk operator's cuda backend: design 5.2's program package.
#
# One module covers one descriptor of `[kernel.descriptors]` for one
# architecture of `[kernel.architectures]`, built by `src/build.py` (the
# compile driver the Program Server runs for one descriptor and target).

op = "routing_softmax_topk"
backend = "cuda"

[toolchain]
kind = "nvcc"
version = "13.0.48"
packages = []

[module]
form = "native"
entry = "uniserve_routing_softmax_topk"

[source]
kind = "cuda"
files = ["src/topk_softmax.cu", "src/topk_softmax.h"]
script = "src/build.py"

[kernel]
target = "arch"
architectures = ["sm_100a", "sm_90a"]

[kernel.descriptors]
dimensions = { scores = ["bf16", "fp16", "fp32"], experts = ["128", "256"], top = ["8"], scale = ["none", "present"] }

[parameters]
standard = "c++20"
optimization = "-O3"
link = "shared"
