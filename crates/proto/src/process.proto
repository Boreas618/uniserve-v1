// The process interface: how daemons and engine processes start, stop and
// supervise the processes of a deployment.
//
// Every node runs one daemon (`uniserve serve`). The leader (node rank 0)
// accepts two kinds of peers on its process socket: the other nodes'
// daemons, which join it, and the engine processes, which ask it to start
// their workers on any node. The leader serves an engine's requests for its
// own node and forwards the others to the node's daemon; exits come back the
// same way.
//
// The interface is versioned across builds: a persistent daemon serves
// engines of successive builds. Messages change only by additions: a new
// field has a default, a peer skips fields it does not know, and the hello
// exchange compares major versions.

syntax = "proto3";

package uniserve.process;

// The first message on a connection, from the connecting side.
message Hello {
  // `PROTOCOL_MAJOR` of the sender's build; the peers refuse each other on a
  // difference.
  uint32 major = 1;
  // `PROTOCOL_MINOR` of the sender's build: which additions it knows.
  uint32 minor = 2;
  // The sender's build: package version and source digest.
  string build = 3;
  oneof peer {
    // A daemon of another node joining the leader.
    Join join = 4;
    // An engine process asking the leader to supervise its processes.
    Engine engine = 5;
    // A frontend process of the deployment, which the daemon commands down
    // this connection (minor 4).
    Frontend frontend = 6;
  }
}

// A frontend process of a deployment: the application on the leader node,
// which the leader's daemon starts and commands (`Serve`, `Drain`, `Pause`).
message Frontend {
  // The deployment: the served model name.
  string deployment = 1;
}

// A daemon of another node joining the leader.
message Join {
  // The node's rank; the leader is rank 0.
  uint32 node_rank = 1;
  // The node's host identity, as placements name it.
  string host = 2;
}

// An engine process of a deployment.
message Engine {
  // The deployment: the served model name.
  string deployment = 1;
}

// The answer to a `Hello`.
message Welcome {
  uint32 major = 1;
  uint32 minor = 2;
  string build = 3;
  // Why the peer is refused; empty when it is accepted.
  string refusal = 4;
  // Every node of the deployment, by rank (to an engine).
  repeated Node nodes = 5;
}

// One node as the leader knows it.
message Node {
  uint32 node_rank = 1;
  string host = 2;
  // The address other nodes reach this node at (an IP address without a
  // port); empty for a deployment of one node, whose processes reach each
  // other over loopback.
  string address = 3;
}

// A request to a daemon. The leader forwards a request for another node to
// that node's daemon, which answers it.
message Request {
  // Chosen by the sender; the reply repeats it.
  uint64 id = 1;
  oneof kind {
    Spawn spawn = 2;
    Stop stop = 3;
    Reserve reserve = 4;
    Claim claim = 5;
    LedgerQuery ledger = 6;
    KeepWeights keep_weights = 7;
    ThrottleTransfers throttle_transfers = 8;
    NodesQuery nodes = 9;
    DeviceQuery devices = 10;
    PublishWorlds publish_worlds = 11;
  }
}

// The answer to one request.
message Reply {
  uint64 id = 1;
  // Why the request failed; empty when it succeeded.
  string error = 2;
  oneof kind {
    Spawned spawned = 3;
    Stopped stopped = 4;
    Reserved reserved = 5;
    Claimed claimed = 6;
    LedgerReport ledger = 7;
    WeightsKept weights_kept = 8;
    TransfersThrottled transfers_throttled = 9;
    NodesKnown nodes = 10;
    DeviceInventory devices = 11;
    WorldsPublished worlds_published = 12;
  }
}

// The deployment's nodes as the leader knows them now, a node that joined
// the running deployment included (minor 1). The leader answers it itself.
message NodesQuery {}

message NodesKnown {
  repeated Node nodes = 1;
}

// CUDA-visible devices available for an independent replica's successor.
message DeviceQuery {
  string host = 1;
}

message DeviceInventory {
  repeated uint32 available = 1;
}
// Publish the immutable pages of a committed set of worlds at one node.
// Every successor is published before any predecessor is retired.
message PublishWorlds {
  string host = 1;
  string deployment = 2;
  repeated uint64 worlds = 3;
}

message WorldsPublished {}

// Start one process of a worker group on a node, as a child of its daemon.
message Spawn {
  // The node, by host identity.
  string host = 1;
  // The worker group, its rank within the group and the generation of the
  // group's launch the process belongs to; its exit names them.
  string group = 2;
  uint32 rank = 3;
  uint64 generation = 4;
  // The executable and its arguments, after the program name.
  string executable = 5;
  repeated string arguments = 6;
  // Variables set over the daemon's environment; an empty value is set
  // empty rather than removed.
  map<string, string> environment = 7;
  // Reservations of this node whose sockets the process inherits, each at
  // the descriptor number its `Reserved` named.
  repeated uint64 inherit = 8;
}

message Spawned {
  // The process id on its node.
  uint32 pid = 1;
}

// Stop every process of one worker group on every node; their exits are not
// reported.
message Stop {
  string group = 1;
  // The one launch generation to end; every generation of the group when
  // absent.
  optional uint64 generation = 2;
}

message Stopped {}

// Bind and hold a listening TCP socket on a node for a worker group, which a
// process the group spawns there inherits.
message Reserve {
  string host = 1;
  string group = 2;
  // Whether processes on other nodes connect to it: it then binds every
  // interface, and loopback otherwise.
  bool routable = 3;
}

message Reserved {
  // Names the reservation in a `Spawn` of the same node.
  uint64 reservation = 1;
  // `address:port`, at the node's address when routable and loopback
  // otherwise.
  string address = 2;
  // The descriptor number a process that inherits the socket finds it at.
  int32 descriptor = 3;
}

// Have a node's daemon hold the deployment's claim at its Storage Server,
// starting the server when the node has none. The claim lasts as long as the
// daemon: a later claim of the same scopes answers the claim held. The
// world's weights that an earlier `KeepWeights` moved to host storage return
// to the GPUs they left before the claim is answered (the server's
// `Restore`), so that a world starting again at a rollback finds them where
// its workers map them.
message Claim {
  string host = 1;
  string deployment = 2;
  // The `(worker group, rank)` scopes `world` keeps on the node; the world's
  // retention of every other scope of the deployment ends.
  repeated Scope scopes = 3;
  // Arguments a server the daemon starts is given beyond its socket: the
  // deployment's Mooncake connector settings.
  repeated string server_arguments = 4;
  // The world whose scopes these are: the daemon's identity of the
  // processes that execute one configuration of the deployment.
  uint64 world = 5;
  // Worlds of the deployment whose storage on the node ends: a world the
  // claiming one superseded at a commit, or one a rollback discarded.
  repeated uint64 retire = 6;
  reserved 7;
}

message Scope {
  string group = 1;
  uint32 rank = 2;
}

message Claimed {
  // The server's socket on the node.
  string socket = 1;
  // The claim's token, which the deployment's workers state.
  bytes claim = 2;
  // `address:port` other nodes reach the server's page requests at; empty
  // when it accepts none.
  string tcp = 3;
}

// Read the storage ledgers the node's Storage Server keeps for the
// deployment: one per GPU of the node it uses, with every item booked
// there. The daemon reads them over the claim it holds.
message LedgerQuery {
  string host = 1;
  string deployment = 2;
}

// Retain weights and the exact completed rollback cache copies of `worlds`
// after their processes exit. Their other exclusive storages are released.
message KeepWeights {
  string host = 1;
  string deployment = 2;
  repeated uint64 worlds = 3;
  // The worlds keep their weights in host storage
  // (`update_config.previous_world = "host"`): the weights each world alone
  // retains then move there through the server's Transfer Server (the
  // server's `Offload`). A node whose server cannot move them (it runs no
  // Transfer Server, or the host cannot hold them) keeps them on its GPUs
  // and says why.
  bool to_host = 4;
  repeated bytes cache_keys = 5;
}

message WeightsKept {
  // The storages the server released.
  uint64 released = 1;
  // With `to_host`: the bytes of weights moved to host storage, and why the
  // node kept them on its GPUs instead (empty when they moved).
  uint64 moved_bytes = 2;
  string refused = 3;
}

// Have a node's daemon halve, or restore, the byte budgets of the links the
// deployment's transfers use at its Storage Server's Transfer Server: a
// halving takes every link a task of the deployment copies over now, a
// restoration every link a halving reduced (`Request::Throttle` with no
// links).
message ThrottleTransfers {
  string host = 1;
  string deployment = 2;
  // A halving; a restoration when false.
  bool halve = 3;
}

message TransfersThrottled {}

message LedgerReport {
  // The Storage Server's `Ledger` answer as JSON: `{"ledgers": [...],
  // "host_storage": {...}}` (the `storage` crate's `GpuLedger` and
  // `HostStorage`).
  string ledgers = 1;
}

// What a daemon tells an engine, unasked.
message Event {
  oneof kind {
    Exit exit = 1;
    // A command for the main process of one epoch (minor 4).
    Command command = 2;
  }
}

// A program: the backend that fills an operator or the scheduling interface,
// the revision of its package the upstream Program Server numbered, and its
// parameters (`specs/worker.md` §5.1). The Rust type is `crates/program-server`'s
// `Program`; this is only its wire form, which the daemon records and sends.
message Program {
  // The backend's name, from the configuration field that selects it.
  string backend = 1;
  // The revision the upstream Program Server gave the package: the same
  // content on every host, and never overwritten.
  uint32 revision = 2;
  // The program's parameters as TOML key/value pairs: each value is the TOML
  // representation of that parameter's configured value, so `chunked_prefill_size
  // = 4096` arrives as `chunked_prefill_size = "4096"`. A main process of
  // another build reads them back as TOML values.
  map<string, string> arguments = 3;
}

// The phase of an operator's calls that a kernel program fills. An operator
// is filled once for all its phases unless the configuration fills it per
// phase, which attention allows (`prefill_attention_backend`,
// `decode_attention_backend`, §5.2).
enum PhaseKind {
  PHASE_KIND_UNSPECIFIED = 0;
  PHASE_KIND_PREFILL = 1;
  PHASE_KIND_DECODE = 2;
  PHASE_KIND_ENCODE = 3;
  PHASE_KIND_DENOISE = 4;
}

// One operator's kernel program, or one phase's of it: the epoch record's
// key is the operator and the phase, `phase` absent for every phase.
message KernelProgram {
  // The operator's name, as the `ops` crate names it.
  string op = 1;
  optional PhaseKind phase = 2;
  Program program = 3;
}

// A command for the main process of one epoch, from the daemon that manages
// it. Commands go only downward: the main process reports on `Upstream`'s
// `Report` and never commands the daemon (`specs/worker.md` §2.3).
message Command {
  oneof kind {
    // Park every request at a step boundary and execute nothing more: a
    // standby that mapped its weights read-only, captured its graphs on
    // scratch and is ready to be promoted (§2.5, §7.4).
    Park park = 1;
    // Promote this parked standby in place, on the addresses its graphs
    // already use: map the storage it mapped read-only writable and serve
    // (§2.5).
    Promote promote = 2;
    // Prepare the next generation of kernels and the next scheduling policy
    // while serving: resolve and load the modules, instantiate the policy on
    // the current snapshot and trial every decision, rebind or recapture the
    // graphs, and run the shadow execution of every replaced operator
    // (§7.3 step 2). Answered with `Report::Precopied` when it succeeded.
    Precopy precopy = 3;
    // Use generation `generation` from the next batch boundary: rebind the
    // graphs or point at the recaptured ones, and switch the scheduling
    // policy (§7.3 step 3).
    Switchover switchover = 4;
    // End the probation: the previous generation is the last resort no
    // longer (§7.3 step 5).
    Commit commit = 5;
    // Return to the previous generation: the reverse of the switchover
    // (§7.3 step 5).
    Revert revert = 6;
    // Drop everything older than `generation` once no batch uses it: rebind
    // or destroy the graphs that still reference the old kernels, whose last
    // reference then unloads their libraries (§7.3 step 6).
    Purge purge = 7;
    // Stop admitting to the frontend, end the requests in flight as
    // migratable at their step boundary with their facts kept, and report
    // `Report::Drained` (§2.3, §7.4 step 2).
    Drain drain = 8;
    // Epoch `epoch` serves from now on: the frontend submits to the main
    // process at `requests` and resubmits the facts the drain kept (§2.3,
    // §7.4 step 2).
    Serve serve = 9;
    // Hold or release the frontend's admissions, the `/admin/pause_generation`
    // gate, without ending any request (§2.3).
    Pause pause = 10;
  }
}

// The programs an epoch's main process is to switch to: one kernel program
// per operator (and, for attention, per phase), and the scheduling policy.
message Precopy {
  repeated KernelProgram kernels = 1;
  Program policy = 2;
  // The generation this precopy prepares; `Report::Precopied` echoes it, so
  // a daemon matches an answer to the epoch it was preparing. The main
  // process's own counter is not a substitute: the number is the daemon's.
  uint64 generation = 3;
}

message Park {}
message Promote {}

message Switchover {
  uint64 generation = 1;
}

message Commit {}

// Return to the previous generation: the reverse of the switchover (§7.3
// step 5). The reason is the main process's own account of why, such as the
// first error of a probation; empty when the daemon states none.
message Revert {
  string reason = 1;
}

message Purge {
  uint64 generation = 1;
}

message Drain {
  uint64 epoch = 1;
}

message Serve {
  uint64 epoch = 1;
  // The main process's request socket, `unix:<path>` or `host:port`.
  string requests = 2;
}

message Pause {
  bool paused = 1;
}

// What a daemon tells an engine, unasked: a report of one epoch's main
// process (§7.3). The design names `Precopied`, `PolicyReverted` and the
// switchover's, commit's, revert's and purge's answers; the acks and the
// fault reports are what lets the daemon apply the probation's rules and
// record the first error that marks an update unavailable (§7.3 step 4,
// §7.2).
message Report {
  oneof kind {
    // `Precopy` succeeded: generation `generation` is ready for the
    // switchover.
    Precopied precopied = 1;
    // The scheduling policy failed after a commit: the main process
    // reinstantiated the previous policy on the current snapshot, and the
    // daemon's record takes it back.
    PolicyReverted policy_reverted = 2;
    // `Switchover` took effect at the batch boundary: generation
    // `generation` executes from now on (§7.3 step 3).
    Switched switched = 3;
    // `Commit` took effect: the previous generation is no longer kept
    // (§7.3 step 5).
    Committed committed = 4;
    // `Revert` took effect: the previous generation executes again, and the
    // reason is the main process's own account of why.
    Reverted reverted = 5;
    // `Purge` took effect: no batch or graph uses a generation older than
    // `generation` (§7.3 step 6).
    Purged purged = 6;
    // A job ran past half the watchdog timeout in an executor (§2.4).
    Stalled stalled = 7;
    // A failure the main process itself observed, such as an error that
    // makes an executor unusable (§7.3 step 4).
    Fault fault = 8;
    // The precopy failed: the new generation was not loaded, trialled or
    // prepared, and is dropped; service goes on with the current one (§7.3
    // step 2, "preparation or precopy failed"). A revert condition of §7.3
    // step 4 only when it happens during a probation.
    PrecopyFailed precopy_failed = 9;
    // The main process computed non-finite logits for `request` (§7.3 step
    // 4), which rolls the epoch back.
    NonFiniteLogits non_finite_logits = 10;
    // The frontend drained epoch `epoch`: it admits nothing, and the facts
    // of the requests in flight are kept for `Serve` (§2.3, §7.4 step 2).
    Drained drained = 11;
  }
}

message Precopied {
  uint64 generation = 1;
}

// The scheduling policy failed (§4.4): the main process reinstantiated the
// previous policy on the current snapshot. During a probation this marks the
// update unusable with this, the first error; after a commit with `fatal`
// set, no previous policy module is left and the daemon treats it as the
// main process's failure (§7.3).
message PolicyReverted {
  // The scheduler thread whose policy call failed; absent for the route
  // instance the engine's control thread runs.
  optional uint32 scheduler = 1;
  string backend = 2;
  uint32 revision = 3;
  string reason = 4;
  bool fatal = 5;
}

message Switched {
  uint64 generation = 1;
}

message Committed {}

message Reverted {
  string reason = 1;
}

message Purged {
  uint64 generation = 1;
}

// A job ran past half the watchdog timeout in an executor (§2.4): the epoch
// it belongs to, the executor's batch (not a scheduler step), the job kind
// and how long it has run. `job` is one of `forward`, `replay`, `capture`,
// `rebind`, `copy`, `fence`; a string rather than an enum keeps the
// executor's kinds extensible without a protocol revision, and a daemon of
// another build records what its main process says.
message Stalled {
  uint64 generation = 1;
  string batch = 2;
  string job = 3;
  uint64 elapsed_ms = 4;
}

// A fatal condition the main process observed (§7.3 step 4). `kind` is one
// of `sticky`, `illegal_address`, `launch_failed`, `out_of_memory`,
// `process_exit`; `device` the CUDA ordinal it happened on, when it names
// one; `reason` the driver's message.
message Fault {
  string kind = 1;
  string reason = 2;
  uint32 device = 3;
}

message PrecopyFailed {
  string reason = 1;
}

message NonFiniteLogits {
  string request = 1;
}

message Drained {
  uint64 epoch = 1;
}

// A supervised process exited.
message Exit {
  string host = 1;
  string group = 2;
  uint32 rank = 3;
  uint64 generation = 4;
  // Its exit status, or why the status could not be read.
  string status = 5;
}

// What travels from a connecting peer after its `Hello`.
message Upstream {
  oneof kind {
    Request request = 1;
    // The main process's report of its own state, unasked (minor 4).
    Report report = 2;
  }
}

// What travels to a connecting peer after its `Welcome`.
message Downstream {
  oneof kind {
    Reply reply = 1;
    Event event = 2;
  }
}

// What travels from the leader to a member daemon: the engines' requests for
// the member's node, each tagged with the engine connection it serves.
message ToMember {
  oneof kind {
    Forwarded forwarded = 1;
    // An engine connection closed: the member terminates its processes.
    uint64 released = 2;
  }
}

message Forwarded {
  uint64 engine = 1;
  Request request = 2;
}

// What travels from a member daemon to the leader.
message FromMember {
  oneof kind {
    Answered answered = 1;
    Exited exited = 2;
  }
}

message Answered {
  uint64 engine = 1;
  Reply reply = 2;
}

message Exited {
  uint64 engine = 1;
  Exit exit = 2;
}
