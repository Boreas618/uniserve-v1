// The process interface: how daemons and engine processes start, stop and
// supervise the processes of a deployment.
//
// Every node runs one daemon (`uniserve serve`). The leader (node rank 0)
// accepts two kinds of peers on its process socket: the other nodes'
// daemons, which join it, and the engine processes, which ask it to start
// their workers on any node. The leader serves an engine's requests for its
// own node and forwards the others to the node's daemon; exits come back the
// same way.
//
// The interface is versioned (`proto::ENGINE_INTERFACE`, shared with the
// request interface): a peer states the window of versions it speaks in its
// hello, the daemon agrees on the newest version both speak and states it in
// its welcome, and a peer whose window shares no version with the daemon's is
// refused in the welcome with a typed `Refusal` that names both windows. The
// `Hello` and the `Welcome` change only by additions, so that a peer of any
// version reads its refusal: a hello that states no `newest` speaks its
// `oldest` alone, and a welcome that states no `version` agreed on the
// hello's `oldest`.

syntax = "proto3";

package uniserve.process;

// The first message on a connection, from the connecting side.
message Hello {
  // The oldest version of the engine interface the sender speaks: its build's
  // (`ENGINE_INTERFACE`), or for an engine process the one version its first hello agreed,
  // which it speaks on every link for its whole life.
  uint32 oldest = 1;
  // The newest version the sender speaks; unset, it speaks `oldest` alone.
  uint32 newest = 7;
  // The sender's build: package version and source digest.
  string build = 3;
  reserved 6;
  reserved "frontend";
  oneof peer {
    // A daemon of another node joining the leader.
    Join join = 4;
    // An engine process asking the leader to supervise its processes.
    Engine engine = 5;
  }
}

// A daemon of another node joining the leader.
message Join {
  // The node's rank; the leader is rank 0.
  uint32 node_rank = 1;
  // The node's host identity, as rank layouts name it.
  string host = 2;
  // The address the deployment's other nodes reach this node at (an IP address without a port):
  // the address of the member's end of its connection to the leader, which the member's kernel
  // routes towards the leader. The leader states it as this node's in every `Node`.
  string address = 3;
}

// An engine process of a deployment.
message Engine {
  // The deployment: the served model name.
  string deployment = 1;
  // The engine number the daemon started this process under, which the launch
  // file states as `engine` and the updater addresses commands by. The
  // daemon keys this connection by it, so a command reaches the process it
  // names rather than the one that happened to connect in that order; zero
  // states no number, and a daemon refuses it rather than guessing.
  uint64 engine = 2;
  // Which of a process's links this connection is. One engine has two:
  // the process link, which receives the epoch's generation commands, the
  // storage claim and the reports, and the request link, which carries the
  // epoch's requests and metrics. The two are separate sockets and both state
  // the same engine number, so the number alone cannot tell them apart.
  Interface interface = 3;
}

// The link of an engine a connection is.
enum Interface {
  // Not stated: the daemon keeps the connection under the order it accepted it
  // in and refuses nothing, which is how every client that is not an engine
  // connects.
  INTERFACE_UNSPECIFIED = 0;
  // The process link: the epoch's generation commands, its storage claim and
  // its reports travel here.
  INTERFACE_PROCESS = 1;
  // The request link: the epoch's requests, their events and its metrics travel
  // here.
  INTERFACE_REQUESTS = 2;
}

// The response to a `Hello`.
message Welcome {
  reserved 1, 4;
  // The daemon's build: package version and source digest.
  string build = 3;
  // Every node of the deployment, by rank (to an engine).
  repeated Node nodes = 5;
  // Why the peer is refused; absent when it is accepted.
  Refusal refusal = 6;
  // The version of the engine interface the daemon serves the peer in: the newest both speak.
  // Unset, it is the hello's `oldest`, as a daemon of one version accepts it.
  uint32 version = 7;
}

// Why the daemon refuses a peer's hello.
message Refusal {
  oneof reason {
    // The peer speaks no version of the engine interface the daemon speaks.
    VersionRefusal version = 1;
    // The peer is not one the socket it reached serves: an engine on the
    // members' address, a joining node on a process socket, or no peer at all.
    Unserved unserved = 2;
    // A joining node states the rank of the leader or of a node that joined.
    uint32 rank_taken = 3;
    // An engine's process link states no engine number, so no command could
    // be addressed to it.
    Unnumbered unnumbered = 4;
    // The engine of this number holds the link this connection states
    // already: each process has one process link and one request link.
    uint64 linked = 5;
  }
}

// The windows of a refusal for the engine interface's version: the peer's and the daemon's,
// which share no version.
message VersionRefusal {
  // The oldest version the peer's hello states.
  uint32 offered = 1;
  // The newest version the daemon speaks.
  uint32 spoken = 2;
  // The newest version the peer's hello states; unset, `offered` alone.
  uint32 offered_newest = 3;
  // The oldest version the daemon speaks; unset, `spoken` alone.
  uint32 spoken_oldest = 4;
}

// A peer the socket it reached does not serve.
message Unserved {}

// An engine's process link that states no engine number.
message Unnumbered {}

// One node as the leader knows it.
message Node {
  uint32 node_rank = 1;
  string host = 2;
  // The address other nodes reach this node at (an IP address without a
  // port); empty for a deployment of one node, whose processes reach each
  // other over loopback.
  string address = 3;
}

// A request to a daemon. The leader forwards a request for another node to
// that node's daemon, which replies to it.
message Request {
  // Chosen by the sender; the reply repeats it.
  uint64 id = 1;
  reserved 10;
  reserved "devices";
  oneof kind {
    Spawn spawn = 2;
    Stop stop = 3;
    Reserve reserve = 4;
    Claim claim = 5;
    UsageQuery usage = 6;
    KeepWeights keep_weights = 7;
    ThrottleTransfers throttle_transfers = 8;
    NodesQuery nodes = 9;
    PublishEpochs publish_epochs = 11;
    PrepareModules prepare_modules = 12;
    ConfigureStorage configure_storage = 13;
    ConfigureProgram configure_program = 14;
    ProgramRecordsQuery program_records = 15;
    SpansQuery spans = 16;
  }
}

// The reply to one request.
message Reply {
  uint64 id = 1;
  // Why the request failed; empty when it succeeded.
  string error = 2;
  reserved 11;
  reserved "devices";
  oneof kind {
    Spawned spawned = 3;
    Stopped stopped = 4;
    Reserved reserved = 5;
    Claimed claimed = 6;
    UsageReport usage = 7;
    WeightsKept weights_kept = 8;
    TransfersThrottled transfers_throttled = 9;
    NodesKnown nodes = 10;
    EpochsPublished epochs_published = 12;
    ModulesPrepared modules_prepared = 13;
    StorageConfigured storage_configured = 14;
    ProgramConfigured program_configured = 15;
    ProgramRecords program_records = 16;
    NodeSpans spans = 17;
  }
}

// The deployment's nodes as the leader knows them now, a node that joined
// the running deployment included. The leader replies to it itself.
message NodesQuery {}

message NodesKnown {
  repeated Node nodes = 1;
}

// Publish the immutable pages of a committed set of epochs at one node.
// Every successor is published before any predecessor is retired.
message PublishEpochs {
  string host = 1;
  string deployment = 2;
  repeated uint64 epochs = 3;
}

message EpochsPublished {}

// Have a node's daemon prepare an epoch's module set at its own host's Build Server (`prepare`):
// every package at the revision the set fixes, with each module the node's main process starts
// from (the engine's executable for the node's platform) committed to the node's store. The
// leader's daemon asks every host of an epoch before it spawns any of the epoch's processes, at a
// start and at every apply, so a spawn reads its engine from the store and builds nothing. A node
// prepares off its service: its other requests and its processes' exits are served while its Build
// Server builds, which takes minutes for a store that misses the engine. The reply comes once
// every module is committed, or with the Build Server's failure; a node whose daemon is lost first
// fails it.
message PrepareModules {
  string host = 1;
  // The module set, every revision fixed.
  ModuleSet modules = 2;
}

message ModulesPrepared {
  // The module set as the node's Build Server prepared it: each package at its revision, with
  // the parameters its manifest gives it under the deployment's arguments. Every host of an
  // epoch answers the same set.
  ModuleSet modules = 1;
}

// A module set (`proto::module::ModuleSet`): the package of every interface an epoch uses, each
// at the revision the daemon fixed when the epoch's configuration was applied.
message ModuleSet {
  // The engine package, whose executable the epoch's main processes run as.
  PackageRevision engine = 1;
  // The scheduling policy's package.
  PackageRevision policy = 2;
  // The kernel packages, one per slot: an operator, the descriptor key a pin names, and the
  // backend when the operator's packages divide its descriptors between them.
  repeated KernelPackage kernels = 3;
}

// Start one engine process of a worker group on a node, as a child of its daemon.
message Spawn {
  reserved 5, 6, 7;
  reserved "executable", "arguments", "environment";
  // The node, by host identity.
  string host = 1;
  // The worker group, its rank within the group and the generation of the
  // group's launch the process belongs to; its exit names them.
  string group = 2;
  uint32 rank = 3;
  uint64 generation = 4;
  // Reservations of this node whose sockets the process inherits, each at
  // the descriptor number its `Reserved` named.
  repeated uint64 inherit = 8;
  // The engine's launch (`proto::config::EngineArgs` as JSON). The node's
  // daemon states its own node's facts in it (its Build Server's socket),
  // runs the engine package its module set names, resolved at that Build
  // Server, and passes the launch as an inherited sealed memfd
  // (`--launch <fd>`), so an engine starts on any node of the deployment from
  // the same request.
  bytes launch = 9;
}

message Spawned {
  // The process id on its node.
  uint32 pid = 1;
}

// Stop every process of one worker group on every node; their exits are not
// reported.
message Stop {
  string group = 1;
  // The one launch generation to end; every generation of the group when
  // absent.
  optional uint64 generation = 2;
}

message Stopped {}

// Bind and hold a listening TCP socket on a node for a worker group, which a
// process the group spawns there inherits.
message Reserve {
  string host = 1;
  string group = 2;
  // The engine that will spawn the process inheriting this socket, when it is not the owner the
  // asking connection is served for. A reservation is filed under this number rather than under
  // the connection that asked for it: the asking connection may be the deployment's own client,
  // which is not the engine that spawns, and it may be re-established between the reservation and
  // the launch without changing whose socket it is.
  optional uint64 engine = 4;
  // Whether processes on other nodes connect to it: it then binds every
  // interface, and loopback otherwise.
  bool routable = 3;
}

message Reserved {
  // Names the reservation in a `Spawn` of the same node.
  uint64 reservation = 1;
  // `address:port`, at the node's address when routable and loopback
  // otherwise.
  string address = 2;
  // The descriptor number a process that inherits the socket finds it at.
  int32 descriptor = 3;
}

// Have a node's daemon hold the deployment's claim at the deployment's Storage
// Server on the node, starting the server when the node has none. The claim lasts as long as the
// daemon: a later claim of the same scopes returns the claim held. The
// epoch's weights that an earlier `KeepWeights` moved to host storage return
// to the GPUs they left before the claim gets its reply (the server's
// `Restore`), so that an epoch starting again at a rollback finds them where
// its workers map them.
message Claim {
  string host = 1;
  string deployment = 2;
  // The `(worker group, rank)` scopes `epoch` keeps on the node; the epoch's
  // retention of every other scope of the deployment ends.
  repeated Scope scopes = 3;
  // The settings of the deployment's Storage Server on the node: a server the
  // daemon starts serves with them, and one that serves with others is
  // configured or restarted in place with them. Unset, the leader's daemon
  // states the deployment's.
  StorageSettings storage = 4;
  // The epoch whose scopes these are: the daemon's identity of the
  // processes that execute one configuration of the deployment.
  uint64 epoch = 5;
  // Epochs of the deployment whose storage on the node ends: an epoch the
  // claiming one superseded at a commit, or one a rollback discarded.
  repeated uint64 retire = 6;
  // Scopes `epoch` keeps no more on the node, whichever of its claimants
  // named them: the replicas an update moved to another epoch while `epoch`
  // serves the deployment's other replicas (`Request::Unclaim`).
  repeated Scope release = 7;
}

message Scope {
  string group = 1;
  uint32 rank = 2;
}

// A Storage Server's settings (`storage::Settings`), each in its canonical
// form.
message StorageSettings {
  // The TCP endpoint the server accepts other hosts on (`host:port`); empty
  // for local connections only.
  string tcp = 1;
  uint64 host_reserve_gib = 2;
  uint64 transfer_chunk_us = 3;
  uint64 transfer_deadline_s = 4;
  uint64 put_deadline_s = 5;
  reserved 6;
  // The directory of the buffer pools' traces; empty for none.
  string buffer_pool_trace = 7;
  reserved 8;
  // The Mooncake connector the server runs; none when unset.
  MooncakeConnector connector = 9;
  uint64 child_restart_s = 10;
  uint64 child_restart_max_s = 11;
  reserved 12;
  // The host's transfer calibration file; empty for none (no Transfer Server).
  string transfer_calibration = 13;
  uint64 transfer_progress_ms = 14;
  NixlTransports nixl_transports = 15;
  uint64 shoot_down_s = 16;
  // The TCP endpoint of the leader node's Storage Server, which holds the
  // cluster directory this server reports its node's pages to; empty on the
  // leader's node.
  string directory = 17;
  uint64 directory_period_ms = 18;
  // The transports a handoff's pages may cross hosts by, in order.
  repeated HandoffTransport handoff_transports = 19;
}

enum HandoffTransport {
  HANDOFF_TRANSPORT_NIXL = 0;
  HANDOFF_TRANSPORT_MOONCAKE = 1;
}

enum NixlTransports {
  NIXL_TRANSPORTS_SELECTED = 0;
  NIXL_TRANSPORTS_RDMA = 1;
}

// A Mooncake connector's settings (`storage::connector::Settings`).
message MooncakeConnector {
  // The master's endpoint (`host:port`).
  string master = 1;
  // `P2PHANDSHAKE`, or the metadata server's URL.
  string metadata = 2;
  MooncakeTransport transport = 3;
  string device = 4;
  uint64 segment_gib = 5;
  // The master's KV event publisher (`host:port`); empty for none.
  string events = 6;
}

enum MooncakeTransport {
  MOONCAKE_TRANSPORT_TCP = 0;
  MOONCAKE_TRANSPORT_RDMA = 1;
}

message Claimed {
  // The server's socket on the node.
  string socket = 1;
  // The claim's token, which the deployment's workers state.
  bytes claim = 2;
  // `address:port` other nodes reach the server's page requests at; empty
  // when it accepts none.
  string tcp = 3;
}

// Read the quotas the node's Storage Server keeps for the
// deployment: one per GPU of the node it uses, with every item reserved
// there. The daemon reads them over the claim it holds.
message UsageQuery {
  string host = 1;
  string deployment = 2;
}

// Retain weights and the exact completed rollback cache copies of `epochs`
// after their processes exit. Their other exclusive storages are released.
message KeepWeights {
  string host = 1;
  string deployment = 2;
  repeated uint64 epochs = 3;
  // The epochs keep their weights in host storage
  // (`update_config.previous_epoch = "host"`): the weights each epoch alone
  // retains then move there through the server's Transfer Server (the
  // server's `Offload`). A node whose server cannot move them (it runs no
  // Transfer Server, or the host cannot hold them) keeps them on its GPUs
  // and says why.
  bool to_host = 4;
  repeated bytes cache_keys = 5;
}

message WeightsKept {
  // The storages the server released.
  uint64 released = 1;
  // With `to_host`: the bytes of weights moved to host storage, and why the
  // node kept them on its GPUs instead (empty when they moved).
  uint64 moved_bytes = 2;
  string refused = 3;
}

// Have a node's daemon halve, or restore, the byte budgets of the links the
// deployment's transfers use at its Storage Server's Transfer Server: a
// halving takes every link a task of the deployment copies over now, a
// restoration every link a halving reduced (`Request::Throttle` with no
// links).
message ThrottleTransfers {
  string host = 1;
  string deployment = 2;
  // A halving; a restoration when false.
  bool halve = 3;
}

message TransfersThrottled {}

// Have the deployment's Storage Server on a node serve with `storage` from
// now on, as the deployment states its settings anew: a server that serves
// takes the settings it reads when it acts at once, and is restarted in place
// with the settings otherwise, keeping every connection, tensor and buffer
// pool; a server the node starts later starts with them, and the leader
// states them in every claim that states none.
message ConfigureStorage {
  string host = 1;
  string deployment = 2;
  StorageSettings storage = 3;
}

message StorageConfigured {}

// Have the deployment's Storage Server on a node run `program` as the
// deployment's KV program from now on, or none when it is absent
// (`storage::protocol::Request::Program`). The node's daemon names the
// directory the program's state is saved in: the deployment's
// `program-state/` on that node.
message ConfigureProgram {
  string host = 1;
  string deployment = 2;
  optional KvProgram program = 3;
}

// A deployment's KV program as the leader hands it to each node.
message KvProgram {
  // Its name in the package (`[programs.<name>]`).
  string name = 1;
  // The wasm32 module.
  bytes module = 2;
  // The package's `args` table for it, as JSON.
  string args = 3;
  // How often its periodic work runs, in milliseconds.
  uint64 period_ms = 4;
  // Whether the node's server steps the tiering hook: the leader's node.
  bool tiering = 5;
}

message ProgramConfigured {
  // How the program's instance started, as the storage protocol names it
  // (`storage::protocol::ProgramStart`: `kept`, `restored`, `created`);
  // empty when the node runs no KV program.
  string start = 1;
}

// What the deployment's KV program on a node logged and how its outputs
// fared since the last such query (`storage::protocol::Request::ProgramRecords`);
// the node's server keeps them no longer.
message ProgramRecordsQuery {
  string host = 1;
  string deployment = 2;
}

// The spans a node's daemon and the deployment's Storage Server on the node
// keep in their rings (`docs/profiling.md`).
// One page of a node's spans (`service::span::page`): its daemon's and its
// Storage Server's that ended at or after `since`, nanoseconds since the Unix
// epoch on the host clock.
message SpansQuery {
  string host = 1;
  string deployment = 2;
  uint64 since = 3;
}

message NodeSpans {
  // The MessagePack encoding of a `service::span::Span` list, each span as
  // the process that recorded it named it, within `proto::SPAN_PAGE_BYTES`.
  bytes spans = 1;
  // The `since` of the next page; unset on the last page.
  optional uint64 next = 2;
}

message ProgramRecords {
  // The records (`Vec<storage::protocol::ProgramRecord>`) in the storage
  // protocol's own encoding (`storage::protocol::encode`), relayed unchanged:
  // the message has one definition, the storage protocol's.
  bytes records = 1;
}

message UsageReport {
  // The Storage Server's `Usage` response (`storage::protocol::Usage`) in the
  // storage protocol's own encoding (`storage::protocol::encode`), relayed
  // unchanged: the message has one definition, the storage protocol's, which
  // the reading daemon decodes.
  bytes usage = 1;
}

// What a daemon tells an engine, unasked.
message Event {
  oneof kind {
    Exit exit = 1;
    // A command for the engine of one epoch.
    Command command = 2;
  }
}

// A package: the backend that fills an operator or the scheduling interface,
// the revision of its package the upstream Build Server numbered, and its
// parameters. The Rust type is `proto::module::PackageRevision`; this is its
// wire form, which the daemon records and sends.
message PackageRevision {
  // The backend's name, from the configuration field that selects it.
  string backend = 1;
  // The revision the upstream Build Server gave the package: the same
  // content on every host, and never overwritten.
  uint32 revision = 2;
  // The package's parameters, each with the type its configuration field
  // has: `chunked_prefill_size = 4096` arrives as the integer 4096.
  map<string, Value> arguments = 3;
}

// One package parameter's value, typed as the configuration states it.
message Value {
  oneof kind {
    bool boolean = 1;
    int64 integer = 2;
    double float = 3;
    string text = 4;
    Values list = 5;
    Table table = 6;
    // A TOML datetime, as its RFC 3339 text.
    string datetime = 7;
  }
}

// A list of parameter values, in order.
message Values {
  repeated Value items = 1;
}

// A table of parameter values, by name.
message Table {
  map<string, Value> entries = 1;
}

// One operator's kernel package in its slot: the descriptor key the
// deployment's `[kernels]` table pins it for, or the part of the operator's
// keys the Build Server's selection gives it.
message KernelPackage {
  reserved 2;
  reserved "phase";
  // The operator's name, as the `ops` crate names it.
  string op = 1;
  // The descriptor key, in its canonical text, the `[kernels]` table pins
  // the package for; absent for a package the selection fills keys with.
  optional string key = 5;
  PackageRevision package = 3;
  // The package itself, for a candidate the epoch's module set fixed for an
  // operator: the engine selects among the operator's candidates for each
  // descriptor key no pin names.
  optional string part = 4;
}

// A command for one engine, from the daemon that supervises it. Commands go
// only downward: the engine reports on `Upstream`'s `Report` and never
// commands the daemon.
//
// The first four move a serving engine's generation (its kernel and policy
// modules); the rest move the engine's lifecycle. An engine acknowledges each
// with the report named beside it, and a phase of the daemon's update ends
// only on those acknowledgements.
message Command {
  reserved 8;
  reserved "serve";
  oneof kind {
    // Make the next generation ready beside the serving one: resolve and load
    // the modules, instantiate the policy, begin capturing the buckets whose
    // kernels changed on each worker's capture thread, and shadow each changed
    // kernel on a paired forward. Serving is untouched. Acknowledged with
    // `Prepared`, or `PrepareFailed` when nothing changed.
    Prepare prepare = 1;
    // Execute generation `generation`: its policy from the next batch
    // boundary, its kernels bucket by bucket as every rank captured each, then
    // whole, keeping the previous one. Acknowledged with `Switched` once the
    // last bucket switched, which begins the trial.
    Switch switch = 2;
    // End the trial in favour of the generation that executes: the kept one
    // is released once no batch uses it (its graphs, and the kernels whose
    // last reference they held). Acknowledged with `Committed`.
    Commit commit = 3;
    // Return to the kept generation at the next batch boundary, or discard a
    // prepared one that never executed; the generation left is released once
    // no batch uses it. Acknowledged with `RolledBack`.
    Rollback rollback = 4;
    // Stop admitting and step the requests in flight until each ends by
    // itself or the deadline ends it as migratable, beside another epoch that
    // steps too. The engine keeps its storage and is parked afterwards.
    // Acknowledged with `Drained`.
    Drain drain = 5;
    // A parked engine opens admission and serves. Acknowledged with
    // `Serving`.
    Promote promote = 6;
    // Hold or release admissions, the `paused` gate, without
    // ending any request.
    Pause pause = 7;
    // Device memory came free on a host this engine has ranks on: a serving
    // engine gave it back (`Shrunk`), or an update released an epoch's
    // storage there (the previous epoch at a commit, the target at the end of
    // a rollback, an epoch an earlier update dropped at the next update's
    // first claim). Sent to the scheduler node's main process, which has
    // every rank it holds, on its host and on its peers' hosts, create the
    // segments of its regions their devices' quotas now hold, grants them,
    // and has its schedulers grow their regions into them. Answered by
    // nothing; a target promoted with `grow` takes each one as it comes.
    Grow grow = 9;
    // The answer to the target's `RoomWanted` of the same `id`: the serving
    // engines made the room, or `refused` states why they could not, and the
    // update is abandoned (version `proto::ROOM` of the engine interface).
    Room room = 10;
  }
}

// The modules of the next generation: one kernel package per operator (and,
// for attention, per phase), and the scheduling policy.
message Prepare {
  repeated KernelPackage kernels = 1;
  PackageRevision policy = 2;
  // Which instance of each kind of layer carries the generation's kernel
  // probes (`profiling_config.kernel_instance`); none when absent. A bucket
  // whose serving graph holds its probes elsewhere is captured again.
  optional uint32 kernel_instance = 3;
  // The module classes whose instances carry the generation's fence probes
  // (`profiling_config.fence_modules`); the family's step stack when absent.
  // A bucket whose serving graph probes other classes is captured again.
  optional FenceModules fence_modules = 4;
  // The options the generation's graphs are captured for; the serving
  // generation's when absent. A generation of other options captures every
  // bucket of the shapes they give the runners.
  optional GraphOptions graphs = 5;
}

// The options a generation's CUDA graphs are captured for: the bucket catalog
// (`cuda_graph_config`), the candidates a scored row reports
// (`max_logprobs`), the drafts a verification holds at most
// (`speculative_config.num_draft_tokens`), and whether CUPTI samples the
// graphs' program counters (`profiling_config.graph_pc_sampling`).
message GraphOptions {
  // The decode batch sizes, when `decode_stated`; the worker's catalog
  // otherwise.
  repeated uint32 decode_batch_sizes = 1;
  bool decode_stated = 2;
  // The prefill token counts, when `prefill_stated`; the worker's catalog
  // otherwise.
  repeated uint32 prefill_token_sizes = 3;
  bool prefill_stated = 4;
  uint32 max_logprobs = 5;
  uint32 num_draft_tokens = 6;
  bool graph_pc_sampling = 7;
}

message FenceModules {
  // Name patterns of module classes, `*` matching any run; empty for none.
  repeated string patterns = 1;
}

message Switch {
  uint64 generation = 1;
}

message Commit {}

// The reason is the daemon's account of why the trial ended: a threshold, the
// deadline, or the operator's own words; empty when it states none.
message Rollback {
  string reason = 1;
}

message Drain {
  // The epoch the engine executes.
  uint64 epoch = 1;
  // The drain's deadline, in milliseconds after the engine receives the
  // command: a token request still running then ends as migratable with its
  // blocks committed under their keys, the partial last one too, and a video
  // request at its next denoising step boundary with its trajectory saved.
  uint64 deadline_ms = 2;
  // The epoch that serves next has another layout: the engine gives its
  // device regions back to the quota by `Resize` as its requests end, and
  // answers `Drained` once its regions answered the last one.
  bool shrink = 3;
  // The epoch that serves next processes requests otherwise (other model
  // files): no request this engine holds can continue there, so the engine
  // runs every one to its end, admitting the queued ones in their turn, and
  // ends none as migratable; `deadline_ms` is not read.
  bool complete = 4;
}

message Promote {
  reserved 1;
  // The requests that migrate onto this engine compute their state again
  // from their tokens and read no block their previous engine committed
  // (`in_flight = recompute`); otherwise they are admitted by their keys as
  // any request is.
  bool recompute = 2;
  // The engine that drains beside this one has another layout and gives its
  // device memory back as it drains: the engine grows its regions from the
  // quota as that memory frees.
  bool grow = 3;
}

message Pause {
  bool paused = 1;
}

message Grow {}

message Room {
  // The `RoomWanted` this answers.
  uint64 id = 1;
  // Why the room could not be made; empty when it was.
  string refused = 2;
}

// What an engine tells its daemon, unasked: the acknowledgement of a command,
// the lifecycle state it reached, or a failure it observed.
message Report {
  oneof kind {
    // `Prepare` succeeded: generation `generation` is ready for the switch.
    Prepared prepared = 1;
    // `Prepare` failed: the new generation is dropped and nothing changed.
    PrepareFailed prepare_failed = 2;
    // `Switch` took effect at a batch boundary: generation `generation`
    // executes and the previous one is kept.
    Switched switched = 3;
    // A switch's capture moved on to another bucket on a device: `Switched`
    // follows once every device finished.
    Warming warming = 4;
    // `Commit` took effect: the previous generation is no longer kept, and
    // the engine releases it after its last batch.
    Committed committed = 5;
    // The kept generation executes again: `Rollback` took effect, or the
    // engine rolled back by itself on a fault during the trial, and `reason`
    // says which.
    RolledBack rolled_back = 6;
    // The engine finished starting as a parked engine: it mapped external
    // state read-only, resolved its modules, captured its graphs and executes
    // nothing until promoted.
    Parked parked = 7;
    // The engine serves: its start completed, or `Promote` took effect.
    Serving serving = 8;
    // `Drain` took effect: the engine holds no request (each ended by itself
    // or as migratable), with `shrink` its regions answered their last
    // `Resize`, and it is parked.
    Drained drained = 9;
    // A job ran past half the watchdog timeout.
    Stalled stalled = 10;
    // A failure the engine itself observed, such as a device error that makes
    // a rank unusable.
    Fault fault = 11;
    // The engine computed non-finite logits for `request`.
    NonFiniteLogits non_finite_logits = 12;
    // The scheduling policy failed and the engine instantiated the previous
    // one again on the current state.
    PolicyRolledBack policy_rolled_back = 13;
    // A draining engine released segments of its KV planes that its
    // regions, shrunk by `Drain`'s `shrink`, no longer cover: the head
    // withdrew them from the buffer pool and every rank of the region gave
    // them back to its device's quota. One per host the ranks lie on, from
    // the scheduler node's main process. The daemon sends `Grow` to the
    // scheduler node of each target engine with ranks on that host.
    Shrunk shrunk = 14;
    // A target's start lacks room in its GPUs' quotas and waits for `Room`.
    RoomWanted room_wanted = 15;
  }
}

message Prepared {
  // The number the engine gave the generation it prepared.
  uint64 generation = 1;
  // The operators this update could not compare, each with the reason (a
  // changed output shape or element type, a launch with no shadow output).
  // Empty states every replaced operator was compared.
  repeated string uncompared = 2;
}

message PrepareFailed {
  string reason = 1;
}

message Switched {
  uint64 generation = 1;
}

message Warming {
  // The generation being captured.
  uint64 generation = 1;
  // The step a device took up, as its worker names it.
  string step = 2;
}

message Committed {}

message RolledBack {
  string reason = 1;
}

// A parked engine's readiness.
message Parked {
  // The launch generation the engine was started at, which its commands are
  // addressed by.
  uint64 launch_generation = 1;
  // The generation of modules it holds and would execute once promoted.
  uint64 generation = 2;
  // Whether the device regions it opened map segments another epoch created:
  // it names the serving epoch's regions, which keep their memory through a
  // switch, rather than regions of its own, into which the serving epoch's
  // memory moves as it drains. Unset by an engine of an earlier build.
  optional bool shares_regions = 3;
}

// A target's start lacks room in its GPUs' quotas (version `proto::ROOM` of
// the engine interface): for each GPU, the bytes the quota must hold beside
// everything it reserves for the start to go on. The start waits for the
// `Room` of the same `id`.
message RoomWanted {
  // Numbers the asks of one engine, which its `Room` answers name.
  uint64 id = 1;
  repeated GpuRoom devices = 2;
}

// The room one GPU's quota must hold.
message GpuRoom {
  // The GPU's identity (its UUID's 16 bytes).
  bytes gpu = 1;
  uint64 bytes = 2;
}

// A serving engine's readiness.
message Serving {
  // The launch generation the engine was started at.
  uint64 launch_generation = 1;
  // The generation of modules it executes. The daemon compares it with the
  // epoch's own before it moves requests onto a promoted engine.
  uint64 generation = 2;
}

message Drained {
  uint64 epoch = 1;
  reserved 2;
}

// The scheduling policy failed: the engine instantiated the previous policy
// again on the current state. During a trial this is the update's first
// failure; with `fatal` set no previous policy module is left and the daemon
// treats it as the engine's failure.
message PolicyRolledBack {
  reserved 5;
  reserved "fatal";
  // The scheduler thread whose policy call failed.
  uint32 scheduler = 1;
  string backend = 2;
  uint32 revision = 3;
  string reason = 4;
}

// A job ran past half the watchdog timeout in a worker: the generation it
// belongs to, the worker's batch (not a scheduler step), the job kind and how
// long it has run. `job` is one of `forward`, `replay`, `capture`, `rebind`,
// `copy`, `range`; a string rather than an enum keeps the worker's kinds
// extensible, and a daemon of another build records what its engine says.
message Stalled {
  uint64 generation = 1;
  string batch = 2;
  string job = 3;
  uint64 elapsed_ms = 4;
}

// What part of an engine a fatal condition broke, which decides what the
// daemon does about it: a fault of the device or of a process makes the
// process's failure domain unusable, the others fail the operation or the
// engine they were observed in.
enum FaultKind {
  reserved 3;
  reserved "FAULT_KIND_POLICY";
  FAULT_KIND_UNSPECIFIED = 0;
  // A device's context holds a sticky error: nothing more runs on it.
  FAULT_KIND_DEVICE = 1;
  // A change of the ranks' weights failed part of the way.
  FAULT_KIND_WEIGHTS = 2;
  // A process of the engine exited.
  FAULT_KIND_PROCESS_EXIT = 4;
  // A scheduler thread failed or ended.
  FAULT_KIND_SCHEDULER = 5;
  // The thread of the data plane's operations failed.
  FAULT_KIND_OPERATIONS = 6;
  // The work the engine's ranks run failed.
  FAULT_KIND_WORK = 7;
  // The engine's start failed.
  FAULT_KIND_START = 8;
  // A promotion, commit, rollback, drain or release of an epoch failed.
  FAULT_KIND_PROMOTE = 9;
  FAULT_KIND_COMMIT = 10;
  FAULT_KIND_ROLLBACK = 11;
  FAULT_KIND_DRAIN = 12;
  FAULT_KIND_RELEASE = 13;
}

// A fatal condition the engine observed: its `kind`, the ordinal of the
// device it happened on when it names one, and the account given with it
// (the driver's message for a device fault).
message Fault {
  FaultKind kind = 1;
  string reason = 2;
  optional uint32 device = 3;
}

message NonFiniteLogits {
  string request = 1;
}

message Shrunk {
  // The CUDA ordinals of the devices whose quota the release freed, on
  // `host`.
  repeated uint32 devices = 1;
  // The bytes the release freed on each of those devices.
  uint64 bytes = 2;
  // The host identity of the node those devices are on, as rank layouts
  // name it.
  string host = 3;
}

// A supervised process exited. What it explained of its end is in its own log, which is its
// daemon's standard error, and the error it ended with in its exit reason.
message Exit {
  reserved 6;
  reserved "last_line";
  string host = 1;
  string group = 2;
  uint32 rank = 3;
  uint64 generation = 4;
  // Its exit status, or why the status could not be read.
  string status = 5;
  // Its exit reason: the error it stated as it ended, in the file its daemon passed it
  // (`service::exit_reason`), at most 4096 bytes; empty when it stated none.
  string reason = 7;
}

// What travels from a connecting peer after its `Hello`.
message Upstream {
  oneof kind {
    Request request = 1;
    // The engine's report of its own state, unasked.
    Report report = 2;
  }
}

// What travels to a connecting peer after its `Welcome`.
message Downstream {
  oneof kind {
    Reply reply = 1;
    Event event = 2;
  }
}

// What travels from the leader to a member daemon: the engines' requests for
// the member's node, each tagged with the engine connection it serves.
message ToMember {
  oneof kind {
    Forwarded forwarded = 1;
    // A connection at the leader closed: the member ends the processes it asked for and, when it
    // was an engine's process link, the processes owned by that engine (`Released`).
    Released released = 2;
  }
}

// Whom a request is served for: the engine of a number, which owns the processes it starts and
// whose claims are its own, or the deployment's head (the daemon's own clients and the updater),
// which claims on the epoch's behalf.
message Owner {
  oneof owner {
    uint64 engine = 1;
    Head head = 2;
  }
}

// The deployment's head as an owner.
message Head {}

message Forwarded {
  // The connection at the leader that asked, by the identity the leader's service gives it: its
  // reply and the exit report of a launch go back down it. Absent for the leader's updater, which
  // asks over no connection.
  optional uint64 connection = 1;
  Request request = 2;
  // Whom the request is served for.
  Owner owner = 3;
}

// A connection at the leader that closed.
message Released {
  uint64 connection = 1;
  // The engine whose process link it was, whose processes end with it; absent for any other
  // connection, which takes only the launches it asked for.
  optional uint64 engine = 2;
}

// What travels from a member daemon to the leader.
message FromMember {
  oneof kind {
    Replied replied = 1;
    Exited exited = 2;
  }
}

// A member's reply to a forwarded request, for the asker the request named (`Forwarded`).
message Replied {
  optional uint64 connection = 1;
  Reply reply = 2;
}

// A process a member supervises exited, reported to the asker of its launch (`Forwarded`).
message Exited {
  optional uint64 connection = 1;
  Exit exit = 2;
}
