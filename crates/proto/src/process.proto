// The process interface: how daemons and engine processes start, stop and
// supervise the processes of a deployment.
//
// Every node runs one daemon (`uniserve serve`). The leader (node rank 0)
// accepts two kinds of peers on its process socket: the other nodes'
// daemons, which join it, and the engine processes, which ask it to start
// their workers on any node. The leader serves an engine's requests for its
// own node and forwards the others to the node's daemon; exits come back the
// same way.
//
// The interface is versioned across builds: a persistent daemon serves
// engines of successive builds. Messages change only by additions: a new
// field has a default, a peer skips fields it does not know, and the hello
// exchange compares major versions.

syntax = "proto3";

package uniserve.process;

import "request.proto";

// The first message on a connection, from the connecting side.
message Hello {
  // `ENGINE_INTERFACE_VERSION` of the sender's build; the peers refuse each other on a
  // difference.
  uint32 major = 1;
  // The sender's build: package version and source digest.
  string build = 3;
  oneof peer {
    // A daemon of another node joining the leader.
    Join join = 4;
    // An engine process asking the leader to supervise its processes.
    Engine engine = 5;
    // A frontend process of the deployment, which the daemon commands down
    // this connection.
    Frontend frontend = 6;
  }
}

// A frontend process of a deployment: the application on the leader node,
// which the leader's daemon starts and commands (`Serve`, `Drain`, `Pause`).
message Frontend {
  // The deployment: the served model name.
  string deployment = 1;
}

// A daemon of another node joining the leader.
message Join {
  // The node's rank; the leader is rank 0.
  uint32 node_rank = 1;
  // The node's host identity, as rank layouts name it.
  string host = 2;
}

// An engine process of a deployment.
message Engine {
  // The deployment: the served model name.
  string deployment = 1;
  // The engine number the daemon started this process under, which the launch
  // file states as `engine` and the updater addresses commands by. The
  // daemon keys this connection by it, so a command reaches the process it
  // names rather than the one that happened to connect in that order; zero
  // states no number, and a daemon refuses it rather than guessing.
  uint64 engine = 2;
  // Which of a process's links this connection is. One engine has two:
  // the process link, which receives the epoch's generation commands, the
  // storage claim and the reports, and the request link, which carries the
  // epoch's requests and metrics. The two are separate sockets and both state
  // the same engine number, so the number alone cannot tell them apart.
  Interface interface = 3;
}

// The link of an engine a connection is.
enum Interface {
  // Not stated: the daemon keeps the connection under the order it accepted it
  // in and refuses nothing, which is how every client that is not an engine
  // connects.
  INTERFACE_UNSPECIFIED = 0;
  // The process link: the epoch's generation commands, its storage claim and
  // its reports travel here.
  INTERFACE_PROCESS = 1;
  // The request link: the epoch's requests, their events and its metrics travel
  // here.
  INTERFACE_REQUESTS = 2;
}

// The response to a `Hello`.
message Welcome {
  uint32 major = 1;
  string build = 3;
  // Why the peer is refused; empty when it is accepted.
  string refusal = 4;
  // Every node of the deployment, by rank (to an engine).
  repeated Node nodes = 5;
}

// One node as the leader knows it.
message Node {
  uint32 node_rank = 1;
  string host = 2;
  // The address other nodes reach this node at (an IP address without a
  // port); empty for a deployment of one node, whose processes reach each
  // other over loopback.
  string address = 3;
}

// A request to a daemon. The leader forwards a request for another node to
// that node's daemon, which replies to it.
message Request {
  // Chosen by the sender; the reply repeats it.
  uint64 id = 1;
  oneof kind {
    Spawn spawn = 2;
    Stop stop = 3;
    Reserve reserve = 4;
    Claim claim = 5;
    LedgerQuery ledger = 6;
    KeepWeights keep_weights = 7;
    ThrottleTransfers throttle_transfers = 8;
    NodesQuery nodes = 9;
    DeviceQuery devices = 10;
    PublishEpochs publish_epochs = 11;
  }
}

// The reply to one request.
message Reply {
  uint64 id = 1;
  // Why the request failed; empty when it succeeded.
  string error = 2;
  oneof kind {
    Spawned spawned = 3;
    Stopped stopped = 4;
    Reserved reserved = 5;
    Claimed claimed = 6;
    LedgerReport ledger = 7;
    WeightsKept weights_kept = 8;
    TransfersThrottled transfers_throttled = 9;
    NodesKnown nodes = 10;
    DeviceInventory devices = 11;
    EpochsPublished epochs_published = 12;
  }
}

// The deployment's nodes as the leader knows them now, a node that joined
// the running deployment included. The leader replies to it itself.
message NodesQuery {}

message NodesKnown {
  repeated Node nodes = 1;
}

// CUDA-visible devices available for an independent replica's successor.
message DeviceQuery {
  string host = 1;
}

message DeviceInventory {
  repeated uint32 available = 1;
}
// Publish the immutable pages of a committed set of epochs at one node.
// Every successor is published before any predecessor is retired.
message PublishEpochs {
  string host = 1;
  string deployment = 2;
  repeated uint64 epochs = 3;
}

message EpochsPublished {}

// Start one process of a worker group on a node, as a child of its daemon.
message Spawn {
  // The node, by host identity.
  string host = 1;
  // The worker group, its rank within the group and the generation of the
  // group's launch the process belongs to; its exit names them.
  string group = 2;
  uint32 rank = 3;
  uint64 generation = 4;
  // The executable and its arguments, after the executable's name.
  string executable = 5;
  repeated string arguments = 6;
  // Variables set over the daemon's environment; an empty value is set
  // empty rather than removed.
  map<string, string> environment = 7;
  // Reservations of this node whose sockets the process inherits, each at
  // the descriptor number its `Reserved` named.
  repeated uint64 inherit = 8;
  // An engine's launch file (`proto::config::EngineArgs` as JSON); empty
  // for any other process. The node's daemon states its own node's facts in
  // it (its Build Server's socket), writes it to its runtime directory and
  // passes `--launch <path>` after `arguments`, so an engine starts on
  // any node of the deployment from the same request.
  bytes launch = 9;
}

message Spawned {
  // The process id on its node.
  uint32 pid = 1;
}

// Stop every process of one worker group on every node; their exits are not
// reported.
message Stop {
  string group = 1;
  // The one launch generation to end; every generation of the group when
  // absent.
  optional uint64 generation = 2;
}

message Stopped {}

// Bind and hold a listening TCP socket on a node for a worker group, which a
// process the group spawns there inherits.
message Reserve {
  string host = 1;
  string group = 2;
  // The engine that will spawn the process inheriting this socket. A
  // reservation is filed under this number rather than under the connection
  // that asked for it: the asking connection may be the deployment's own
  // client, which is not the engine that spawns, and it may be re-established
  // between the reservation and the launch without changing whose socket it is.
  uint64 engine = 4;
  // Whether processes on other nodes connect to it: it then binds every
  // interface, and loopback otherwise.
  bool routable = 3;
}

message Reserved {
  // Names the reservation in a `Spawn` of the same node.
  uint64 reservation = 1;
  // `address:port`, at the node's address when routable and loopback
  // otherwise.
  string address = 2;
  // The descriptor number a process that inherits the socket finds it at.
  int32 descriptor = 3;
}

// Have a node's daemon hold the deployment's claim at its Storage Server,
// starting the server when the node has none. The claim lasts as long as the
// daemon: a later claim of the same scopes returns the claim held. The
// epoch's weights that an earlier `KeepWeights` moved to host storage return
// to the GPUs they left before the claim gets its reply (the server's
// `Restore`), so that an epoch starting again at a rollback finds them where
// its workers map them.
message Claim {
  string host = 1;
  string deployment = 2;
  // The `(worker group, rank)` scopes `epoch` keeps on the node; the epoch's
  // retention of every other scope of the deployment ends.
  repeated Scope scopes = 3;
  // Arguments a server the daemon starts is given beyond its socket: the
  // deployment's Mooncake connector settings.
  repeated string server_arguments = 4;
  // The epoch whose scopes these are: the daemon's identity of the
  // processes that execute one configuration of the deployment.
  uint64 epoch = 5;
  // Epochs of the deployment whose storage on the node ends: an epoch the
  // claiming one superseded at a commit, or one a rollback discarded.
  repeated uint64 retire = 6;
}

message Scope {
  string group = 1;
  uint32 rank = 2;
}

message Claimed {
  // The server's socket on the node.
  string socket = 1;
  // The claim's token, which the deployment's workers state.
  bytes claim = 2;
  // `address:port` other nodes reach the server's page requests at; empty
  // when it accepts none.
  string tcp = 3;
}

// Read the storage ledgers the node's Storage Server keeps for the
// deployment: one per GPU of the node it uses, with every item booked
// there. The daemon reads them over the claim it holds.
message LedgerQuery {
  string host = 1;
  string deployment = 2;
}

// Retain weights and the exact completed rollback cache copies of `epochs`
// after their processes exit. Their other exclusive storages are released.
message KeepWeights {
  string host = 1;
  string deployment = 2;
  repeated uint64 epochs = 3;
  // The epochs keep their weights in host storage
  // (`update_config.previous_epoch = "host"`): the weights each epoch alone
  // retains then move there through the server's Transfer Server (the
  // server's `Offload`). A node whose server cannot move them (it runs no
  // Transfer Server, or the host cannot hold them) keeps them on its GPUs
  // and says why.
  bool to_host = 4;
  repeated bytes cache_keys = 5;
}

message WeightsKept {
  // The storages the server released.
  uint64 released = 1;
  // With `to_host`: the bytes of weights moved to host storage, and why the
  // node kept them on its GPUs instead (empty when they moved).
  uint64 moved_bytes = 2;
  string refused = 3;
}

// Have a node's daemon halve, or restore, the byte budgets of the links the
// deployment's transfers use at its Storage Server's Transfer Server: a
// halving takes every link a task of the deployment copies over now, a
// restoration every link a halving reduced (`Request::Throttle` with no
// links).
message ThrottleTransfers {
  string host = 1;
  string deployment = 2;
  // A halving; a restoration when false.
  bool halve = 3;
}

message TransfersThrottled {}

message LedgerReport {
  // The Storage Server's `Ledger` response as JSON: `{"ledgers": [...],
  // "host_storage": {...}}` (the `storage` crate's `GpuLedger` and
  // `HostStorage`).
  string ledgers = 1;
}

// What a daemon tells an engine, unasked.
message Event {
  oneof kind {
    Exit exit = 1;
    // A command for the engine of one epoch.
    Command command = 2;
  }
}

// A package: the backend that fills an operator or the scheduling interface,
// the revision of its package the upstream Build Server numbered, and its
// parameters. The Rust type is `crates/build-server`'s
// `PackageRevision`; this is only its wire form, which the daemon records and sends.
message PackageRevision {
  // The backend's name, from the configuration field that selects it.
  string backend = 1;
  // The revision the upstream Build Server gave the package: the same
  // content on every host, and never overwritten.
  uint32 revision = 2;
  // The package's parameters as TOML key/value pairs: each value is the TOML
  // representation of that parameter's configured value, so `chunked_prefill_size
  // = 4096` arrives as `chunked_prefill_size = "4096"`. An engine of
  // another build reads them back as TOML values.
  map<string, string> arguments = 3;
}

// The phase of an operator's calls that a kernel package fills. An operator
// is filled once for all its phases unless the configuration fills it per
// phase, which attention allows (`prefill_attention_backend`,
// `decode_attention_backend`).
enum PhaseKind {
  PHASE_KIND_UNSPECIFIED = 0;
  PHASE_KIND_PREFILL = 1;
  PHASE_KIND_DECODE = 2;
  PHASE_KIND_ENCODE = 3;
  PHASE_KIND_DENOISE = 4;
}

// One operator's kernel package, or one phase's of it: the epoch record's
// key is the operator and the phase, `phase` absent for every phase.
message KernelPackage {
  // The operator's name, as the `ops` crate names it.
  string op = 1;
  optional PhaseKind phase = 2;
  PackageRevision package = 3;
  // The package itself, for a candidate the epoch's module set fixed for an
  // operator without naming it for a phase: the engine selects among
  // the operator's candidates for each descriptor key.
  optional string part = 4;
}

// A command for one engine, from the daemon that supervises it. Commands go
// only downward: the engine reports on `Upstream`'s `Report` and never
// commands the daemon.
//
// The first four move a serving engine's generation (its kernel and policy
// modules); the rest move the engine's lifecycle. An engine acknowledges each
// with the report named beside it, and a phase of the daemon's update ends
// only on those acknowledgements.
message Command {
  oneof kind {
    // Make the next generation ready beside the serving one: resolve and load
    // the modules, instantiate the policy, rebind the graphs whose launch
    // table is unchanged and recapture the others, and shadow each changed
    // kernel on a paired forward. Serving is untouched. Acknowledged with
    // `Prepared`, or `PrepareFailed` when nothing changed.
    Prepare prepare = 1;
    // Execute generation `generation` from the next batch boundary, keeping
    // the previous one. Acknowledged with `Switched`.
    Switch switch = 2;
    // End the trial in favour of the generation that executes: the kept one
    // is released once no batch uses it (its graphs, and the kernels whose
    // last reference they held). Acknowledged with `Committed`.
    Commit commit = 3;
    // Return to the kept generation at the next batch boundary, or discard a
    // prepared one that never executed; the generation left is released once
    // no batch uses it. Acknowledged with `RolledBack`.
    Rollback rollback = 4;
    // Stop admitting, end the requests in flight as migratable at their step
    // boundary, and execute nothing more. The engine keeps its storage and is
    // parked afterwards. Acknowledged with `Drained`, which carries the state
    // it hands over.
    Drain drain = 5;
    // A parked engine serves: it maps the storage it mapped read-only
    // writable, takes the handoff of the engine that drained when one is
    // stated, and admits. Acknowledged with `Serving`.
    Promote promote = 6;
    // Hold or release admissions, the `/admin/pause_generation` gate, without
    // ending any request.
    Pause pause = 7;
    // To a frontend process: epoch `epoch` serves from now on, and requests
    // are submitted at `requests`.
    Serve serve = 8;
  }
}

// The modules of the next generation: one kernel package per operator (and,
// for attention, per phase), and the scheduling policy.
message Prepare {
  repeated KernelPackage kernels = 1;
  PackageRevision policy = 2;
}

message Switch {
  uint64 generation = 1;
}

message Commit {}

// The reason is the daemon's account of why the trial ended: a threshold, the
// deadline, or the operator's own words; empty when it states none.
message Rollback {
  string reason = 1;
}

message Drain {
  uint64 epoch = 1;
}

message Promote {
  // What the engine that drained hands over; absent when no state follows: a
  // standby promoted after its failure domain was lost, or a parked epoch
  // that serves again.
  optional Handoff handoff = 1;
}

// The carried state one engine hands the engine that serves after it.
message Handoff {
  // The prefix cache index of the engine that drained, by worker group: its
  // pages lie in the cache segments the promoted engine maps.
  repeated uniserve.request.GroupIndex index = 1;
  // Whether the requests that migrate compute their state again from their
  // tokens: the promoted engine computes other numerics
  // (`in_flight = recompute`).
  bool recompute = 2;
  // Whether the storage of the engine that drained frees once this one
  // serves (its processes exit), so the cache grows into it at once rather
  // than at the commit.
  bool grows = 3;
}

message Pause {
  bool paused = 1;
}

message Serve {
  uint64 epoch = 1;
  // The engine's request socket, `unix:<path>` or `host:port`.
  string requests = 2;
}

// What an engine tells its daemon, unasked: the acknowledgement of a command,
// the lifecycle state it reached, or a failure it observed.
message Report {
  oneof kind {
    // `Prepare` succeeded: generation `generation` is ready for the switch.
    Prepared prepared = 1;
    // `Prepare` failed: the new generation is dropped and nothing changed.
    PrepareFailed prepare_failed = 2;
    // `Switch` took effect at a batch boundary: generation `generation`
    // executes and the previous one is kept.
    Switched switched = 3;
    // A switch's capture moved on to another bucket on a device: `Switched`
    // follows once every device finished.
    Warming warming = 4;
    // `Commit` took effect: the previous generation is no longer kept, and
    // the engine releases it after its last batch.
    Committed committed = 5;
    // The kept generation executes again: `Rollback` took effect, or the
    // engine rolled back by itself on a fault during the trial, and `reason`
    // says which.
    RolledBack rolled_back = 6;
    // The engine finished starting as a parked engine: it mapped external
    // state read-only, resolved its modules, captured its graphs and executes
    // nothing until promoted.
    Parked parked = 7;
    // The engine serves: its start completed, or `Promote` took effect.
    Serving serving = 8;
    // `Drain` took effect: the engine stopped stepping, every request in
    // flight ended as migratable, and it is parked.
    Drained drained = 9;
    // A job ran past half the watchdog timeout.
    Stalled stalled = 10;
    // A failure the engine itself observed, such as a device error that makes
    // a rank unusable.
    Fault fault = 11;
    // The engine computed non-finite logits for `request`.
    NonFiniteLogits non_finite_logits = 12;
    // The scheduling policy failed and the engine instantiated the previous
    // one again on the current state.
    PolicyRolledBack policy_rolled_back = 13;
  }
}

message Prepared {
  // The number the engine gave the generation it prepared.
  uint64 generation = 1;
  // The operators this update could not compare, each with the reason (a
  // changed output shape or element type, a launch with no shadow output).
  // Empty states every replaced operator was compared.
  repeated string uncompared = 2;
}

message PrepareFailed {
  string reason = 1;
}

message Switched {
  uint64 generation = 1;
}

message Warming {
  // The generation being captured.
  uint64 generation = 1;
  // The step a device took up, as its worker names it.
  string step = 2;
}

message Committed {}

message RolledBack {
  string reason = 1;
}

// A parked engine's readiness.
message Parked {
  // The launch generation the engine was started at, which its commands are
  // addressed by.
  uint64 launch_generation = 1;
  // The generation of modules it holds and would execute once promoted.
  uint64 generation = 2;
}

// A serving engine's readiness.
message Serving {
  // The launch generation the engine was started at.
  uint64 launch_generation = 1;
  // The generation of modules it executes. The daemon compares it with the
  // epoch's own before it moves requests onto a promoted engine.
  uint64 generation = 2;
}

message Drained {
  uint64 epoch = 1;
  // What the engine hands the one that serves after it.
  Handoff handoff = 2;
}

// The scheduling policy failed: the engine instantiated the previous policy
// again on the current state. During a trial this is the update's first
// failure; with `fatal` set no previous policy module is left and the daemon
// treats it as the engine's failure.
message PolicyRolledBack {
  // The scheduler thread whose policy call failed; absent for the route
  // instance the engine's control thread runs.
  optional uint32 scheduler = 1;
  string backend = 2;
  uint32 revision = 3;
  string reason = 4;
  bool fatal = 5;
}

// A job ran past half the watchdog timeout in a worker: the generation it
// belongs to, the worker's batch (not a scheduler step), the job kind and how
// long it has run. `job` is one of `forward`, `replay`, `capture`, `rebind`,
// `copy`, `range`; a string rather than an enum keeps the worker's kinds
// extensible, and a daemon of another build records what its engine says.
message Stalled {
  uint64 generation = 1;
  string batch = 2;
  string job = 3;
  uint64 elapsed_ms = 4;
}

// A fatal condition the engine observed. `kind` is one of `sticky`,
// `illegal_address`, `launch_failed`, `out_of_memory`, `process_exit`;
// `device` the CUDA ordinal it happened on, when it names one; `reason` the
// driver's message.
message Fault {
  string kind = 1;
  string reason = 2;
  uint32 device = 3;
}

message NonFiniteLogits {
  string request = 1;
}

// A supervised process exited.
message Exit {
  string host = 1;
  string group = 2;
  uint32 rank = 3;
  uint64 generation = 4;
  // Its exit status, or why the status could not be read.
  string status = 5;
  // The last line it wrote to its standard error: a process that ends before
  // it can state why says so there.
  string last_line = 6;
}

// What travels from a connecting peer after its `Hello`.
message Upstream {
  oneof kind {
    Request request = 1;
    // The engine's report of its own state, unasked.
    Report report = 2;
  }
}

// What travels to a connecting peer after its `Welcome`.
message Downstream {
  oneof kind {
    Reply reply = 1;
    Event event = 2;
  }
}

// What travels from the leader to a member daemon: the engines' requests for
// the member's node, each tagged with the engine connection it serves.
message ToMember {
  oneof kind {
    Forwarded forwarded = 1;
    // An engine connection closed: the member terminates its processes.
    uint64 released = 2;
  }
}

message Forwarded {
  // The connection at the leader that asked: its reply and the exit report of a launch go back
  // down it.
  uint64 engine = 1;
  Request request = 2;
  // Whom the request is served for: the engine number a process states, or the epoch's own owner
  // for a client. It differs from `engine` for a client, whose launches are the deployment's.
  uint64 owner = 3;
}

// What travels from a member daemon to the leader.
message FromMember {
  oneof kind {
    Replied replied = 1;
    Exited exited = 2;
  }
}

message Replied {
  uint64 engine = 1;
  Reply reply = 2;
}

message Exited {
  uint64 engine = 1;
  Exit exit = 2;
}
