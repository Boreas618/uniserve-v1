# The version of each operator's interface this tree launches, for every operator past its first
# version; an operator this table does not name launches version 1. An operator's interface is its
# descriptor and its argument layout: a change of either that is not an addition raises its version
# here, and a package of the operator states the version it implements in its manifest
# (`interface_version`). The build compiles the table into `proto::module::operator::version`, by
# which the engine refuses a module of another version, and the Build Server lists it with each
# installed engine revision, so the daemon fixes an epoch's kernel packages among the revisions of
# the versions its engine revision launches, never one a later engine revision's interface needs.
# The table is stated even when it names no operator, and the build refuses a vocabulary without
# it: such a vocabulary is of the previous format (`build_server::manifest::VOCABULARY_FORMATS`),
# which the Build Server still reads from the engine revisions installed in it, selecting their
# kernel packages whatever version they implement.
[interface_versions]
# The product reads an activation `fp8_quantize` encoded, and its factor from device memory, where
# a measured scale is written by a launch before it.
fp8_gemm = 2
# The gated activation clamps its halves at a limit the call passes, after the value's row stride.
act_and_mul = 2
# The router reads the batch's live count and adds each live route into the expert load, two
# pointers after the map; its descriptor states its scoring and whether it reads a selection bias,
# a pointer after the scale's kind.
topk_softmax = 3
