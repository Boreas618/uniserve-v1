# The operators of this tree: the device code one kernel package fills, by the name its packages
# are filed under (`op` of a package's `package.toml`, `crates/ops/kernels/<op>/`).
#
# This file is the one statement of the vocabulary. `crates/proto/build.rs` compiles it into
# `proto::module::operator`, one constant per operator named by its name in upper case and `ALL`
# in this order, which the kernel library (`ops::Op::NAME`) and the engine take their names from.
# The engine package names it (`operators` in `crates/engine/package.toml`): the Build Server
# reads it from each installed engine revision's own snapshot and lists it with the revision, and
# the daemon fixes an epoch's kernel packages over the vocabulary of the epoch's engine revision,
# so an operator a later engine revision adds is fixed, pinned and updated without a daemon built
# after it, and each operator's packages among the revisions of the interface version that engine
# revision launches (`interface_versions` below).
