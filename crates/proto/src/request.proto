// The request interface: what the leader daemon submits to an engine process
// and the events it receives back.
//
// The leader daemon starts each engine process, which connects to the
// daemon's request socket (a Unix socket on the leader) and says hello. The
// daemon answers with the engine's specification: everything it is to serve
// and how. The engine starts its workers, then reports its state, and from
// then on the connection carries the daemon's submissions and commands and
// the engine's events. Every request has the identity the daemon gave it;
// each of its events names it.
//
// A request's generated media reaches the daemon with its events: an
// `Artifact` event passes the shared memory holding the bytes as a file
// descriptor beside its frame.
//
// The interface has one version per release (`proto::ENGINE_INTERFACE_VERSION`,
// shared with the process interface): the daemon serves an engine of its own
// version alone, refusing any other in its welcome with a typed `Refusal`.
// The `Hello` and the `Welcome` are the one part of the interface that no
// release changes, so that an engine of any version reads its refusal.

syntax = "proto3";

package uniserve.request;

// The first message on a connection, from the engine process.
message Hello {
  uint32 major = 1;
  string build = 3;
  // The identity the daemon started the engine process under.
  uint64 engine = 4;
  // Which of the process's links this connection is, as `process.proto`'s
  // `Interface` states it: this one is always `INTERFACE_REQUESTS`.
  int32 interface = 5;
}

// The answer to a `Hello`.
message Welcome {
  reserved 1, 4;
  // The daemon's build: package version and source digest.
  string build = 3;
  // Why the engine is refused; absent when it is accepted.
  Refusal refusal = 5;
}

// Why the daemon refuses an engine's hello on its request link.
message Refusal {
  oneof reason {
    // The engine speaks another version of the engine interface than the daemon.
    VersionRefusal version = 1;
    // The engine states another engine number than the one the link was made
    // for.
    EngineMismatch engine = 2;
  }
}

// The versions of a refusal for the engine interface's version.
message VersionRefusal {
  // The version the engine's hello states.
  uint32 offered = 1;
  // The daemon's version, the one it serves.
  uint32 spoken = 2;
}

// The engine numbers of a refusal for a link made for another engine.
message EngineMismatch {
  // The number the engine's hello states.
  uint64 stated = 1;
  // The number the link was made for.
  uint64 expected = 2;
}

// What travels from the engine process after the welcome.
message FromEngine {
  reserved 8, 9;
  oneof kind {
    State state = 1;
    Accepted accepted = 2;
    Event event = 3;
    Stats stats = 4;
    Hooked hooked = 5;
    Configured configured = 6;
    // TCP artifact bytes, sent contiguously before their Artifact event.
    ArtifactPart artifact_part = 10;
    // The main process's counters for the frontend's `/metrics`.
    Metrics metrics = 11;
  }
}

// The main process's counters for the deployment's `/metrics`, which the
// frontend serves: sent once a second while the main process serves, and
// once more when it drains. They are per epoch and additive — an epoch
// starts at zero and the frontend sums the epochs it serves. `device_ns` is
// CUPTI kernel time summed over batches, in nanoseconds, when profiling is
// on and zero otherwise; `queue` is the waiting depth of each DP rank.
message Metrics {
  uint64 steps = 1;
  uint64 batches = 2;
  uint64 tokens = 3;
  uint64 kernel_launches = 4;
  uint64 device_ns = 5;
  repeated QueueDepth queue = 6;
  // Fuel the scheduling policy's calls consumed, summed over the scheduler
  // threads since the main process started: the deterministic proxy for the
  // per-step cost design §12 measures.
  uint64 policy_fuel = 7;
  // The number of those policy calls.
  uint64 policy_calls = 8;
  // The devices' allocators, for the invariant design §4.1 and §8 state:
  // a device never maps more physical memory than its budget allows.
  repeated DeviceMemory memory = 9;
}

message QueueDepth {
  uint32 rank = 1;
  uint32 depth = 2;
}

// One device's memory as the main process reports it.
message DeviceMemory {
  uint32 device = 1;
  // The bytes the device's budget allows this epoch (design §8): the limit
  // of the deployment's quota of the GPU, the shares of the ranks it places
  // there (each its group's `mem_fraction_static`, or the deployment's),
  // which the deployment's epochs and transfers account against.
  uint64 budget = 2;
  // The pools of the device's allocators (`crates/platform`'s `Allocator`,
  // design §4.1), and the planes of its KV regions.
  repeated PoolMemory pools = 3;
}

// One pool of a device's memory.
message PoolMemory {
  // The pool: an allocator's `graph`, `scratch` or `resident` (design §4.1),
  // or `kv`, the planes of the device's KV regions: the segments its ranks
  // map, with the flags, scales, index keys and state planes beside them.
  string pool = 1;
  // The bytes of physical memory the pool has mapped now.
  uint64 mapped = 2;
}

// What travels to the engine process after the welcome.
message ToEngine {
  oneof kind {
    Submit submit = 1;
    Command command = 2;
    EngineCommand engine = 3;
  }
}

// The engine's state changes.
message State {
  EngineState state = 1;
  // What the engine serves, once it is ready.
  EngineInfo info = 2;
  // Why the engine failed, when it did.
  string error = 3;
}

// Where an engine is in its life, as it announces it on every request link.
enum EngineState {
  ENGINE_STATE_UNSPECIFIED = 0;
  // Loading its ranks, resolving its modules and capturing its graphs.
  ENGINE_STATE_STARTING = 1;
  // Executes nothing and admits nothing, with its storage mapped and its
  // graphs captured: an engine started beside the serving one (a switch's
  // target, a standby), or one that drained. `Promote` makes it serve.
  ENGINE_STATE_PARKED = 2;
  // Admits and executes requests.
  ENGINE_STATE_SERVING = 3;
  // Admits nothing more; its requests in flight end as migratable at their
  // step boundaries. Parked once the last one ended.
  ENGINE_STATE_DRAINING = 4;
  // Closed its ranks on a shutdown and exits.
  ENGINE_STATE_STOPPED = 5;
  // Its start failed or its ranks are lost; it serves nothing more.
  ENGINE_STATE_FAILED = 6;
}

// What a ready engine serves.
message EngineInfo {
  // The limits every request is checked against, resolved against the
  // workers' capacities.
  GenerationLimits limits = 1;
  // The video denoiser as its model family describes it to its request
  // processing (`nn::family::Description::details`); empty when the engine
  // generates no video.
  bytes video_denoiser = 2;
  // Condition units one latent encoding call covers at once; zero when no
  // worker encodes latents.
  uint32 latent_encoding_units = 3;
  // The engine's schedulers, one per DP rank.
  uint32 schedulers = 4;
  // The largest scheduling limits the workers were started for: the
  // schedulers take any limits within them in place (`Configure`).
  BatchCapacity capacity = 6;
  // The KV cache segments of each worker group, which an engine that
  // succeeds this one on the same devices maps.
  repeated CacheSegments segments = 7;
  // The page seeds (32-byte keys) of the page chains of the cache groups
  // the engine's workers compute: equal between epochs whose models,
  // numerics and page layouts agree, whose pages a successor reuses.
  repeated bytes prefix_seeds = 11;
  reserved 10;
  // The seed of the keys of the latent trajectories the engine's denoiser
  // (a video model's) stores at preemption: equal
  // between epochs whose denoising computes the same, which continue each
  // other's trajectories exactly; zero for an engine that stores none.
  uint64 latent_seed = 9;
}

// The batch an engine's workers were started for.
message BatchCapacity {
  // Calls one step forms; zero when the workers bound none.
  uint32 max_batch = 1;
  // Tokens one step forms.
  uint64 max_num_batched_tokens = 2;
  // Requests running at once.
  uint32 max_running_requests = 3;
}

// The segments of one worker group's KV cache planes, in plane order: each
// an allocation of whole units that an epoch created, which the epoch that
// holds the planes gives back or creates again as a whole.
message CacheSegments {
  string worker_group = 1;
  repeated CacheSegment segments = 2;
  // The segments the group holds, `[0, held)`; those after were given back.
  uint32 held = 3;
  // The units of the group's planes, those of the segments given back
  // included.
  uint32 units = 4;
  // The units `1..=scratch` the group's warmup lent.
  uint32 scratch = 5;
}

message CacheSegment {
  // The epoch that created the segment's storage.
  uint64 epoch = 1;
  // The segment's ordinal among those its epoch created.
  uint32 ordinal = 2;
  // The cache units the segment holds.
  uint32 units = 3;
}

// Requests submitted together: the engine queues every one of them before it
// forms its next batch.
message Submit {
  repeated Request requests = 1;
}

// The engine took a submitted request: it passed the engine's checks and is
// queued on one of its schedulers. A request it refuses ends with a
// `Rejected` event instead.
message Accepted {
  uint64 request = 1;
  // The scheduler that serves it.
  uint32 scheduler = 2;
}

message Request {
  // The daemon's identity of the request.
  uint64 id = 1;
  int32 priority = 2;
  oneof kind {
    GenerationRequest generation = 3;
    DiffusionRequest diffusion = 4;
  }
}

// A command for one request.
message Command {
  uint64 request = 1;
  oneof kind {
    // The client went away: the request ends as cancelled.
    Cancel cancel = 2;
    // The daemon's decoder matched a stop string: the request ends as
    // stopped.
    StopRequest stop = 3;
    // The daemon's decoder found that this many public tokens complete no
    // stop string.
    Acknowledge acknowledge = 4;
    // The daemon ends the request at once.
    Abort abort = 5;
    // The daemon's consumer took this many of the request's events in all.
    // The engine sends a request at most `EVENT_WINDOW` events beyond what
    // its consumer took, so a slow consumer holds its request's output
    // back in the engine, whose scheduler then stalls the request.
    Consumed consumed = 6;
    // The connection this command arrives on takes the request's event
    // stream over from a position: a hot restart of the daemon hands the
    // response to a successor (design 7.5.1 step 4). The request keeps
    // generating in the engine that serves it; it is neither cancelled nor
    // submitted again, and the engine sends this connection again the events
    // after the position the previous consumer reached.
    Takeover takeover = 7;
  }
}

message Cancel {}
message StopRequest {}
message Acknowledge {
  uint64 output_tokens = 1;
}
message Abort {}
message Consumed {
  uint64 events = 1;
}
// One request's event stream taken over by another connection (a hot
// restart's successor daemon). The command's `request` names the request.
message Takeover {
  // The events the response's previous consumer took in all: the engine
  // sends the new consumer the events after this position, then the ones
  // the request goes on producing.
  uint64 events = 1;
}

// A command for the whole engine.
message EngineCommand {
  reserved 13, 14, 16, 17;
  oneof kind {
    // Finish every request as aborted, close the workers and exit.
    Shutdown shutdown = 1;
    // Revoke every cached prefix page; requests in flight keep theirs.
    FlushCache flush_cache = 4;
    // Run a named operation of the data plane; answered with `Hooked`.
    Hook hook = 5;
    // Take other scheduling limits and policy from each scheduler's next
    // step; answered with `Configured`.
    Configure configure = 6;
    // Connect to another daemon beside the ones the engine serves, as a hot
    // restart of the daemon starts its successor: the engine says hello to
    // it as itself, reports itself ready there, and serves both, each its
    // own requests, until the last closes its connection.
    Attach attach = 7;
    // Give back or restore KV cache storage on every scheduler; answered
    // with `Hooked`.
    ResizeCache resize_cache = 8;
    // Rewrite the weights in place from another checkpoint of the same
    // model, once no request runs; answered with `Hooked`.
    UpdateWeights update_weights = 9;
    // Install completed expert copies at the common drained step boundary.
    CommitExperts commit_experts = 18;
  }
}

message CommitExperts {
  uint64 id = 1;
  map<string, ExpertOrder> order = 2;
}

// A named operation of the data plane: an expert redistribution's stages, a
// LoRA adapter's load and unload.
message Hook {
  // Matches the `Hooked` answer.
  uint64 id = 1;
  string name = 2;
  // A JSON value.
  string payload = 3;
}

// The answer to a `Hook` and to the data plane's other commands: each rank's
// JSON result, or why it failed.
message Hooked {
  uint64 id = 1;
  repeated string results = 2;
  // Empty when every rank ran the operation.
  string error = 3;
}

// Scheduling limits and policy for every scheduler of a serving engine,
// within the batch its workers were started for.
message Configure {
  // Matches the `Configured` answer.
  uint64 id = 1;
  Scheduling scheduling = 2;
}

// The limits a `Configure` sets on every scheduler.
message Scheduling {
  // The mechanism's limits: what the engine's schedulers admit and how they
  // assemble a step. The scheduling policy's own name and parameters are its
  // package's (§5.1, §7.7), not this message's.
  uint32 max_batch = 2;
  // Absent for the engine's default.
  optional uint32 max_num_batched_tokens = 3;
  uint32 max_running_requests = 4;
  // Absent for an unbounded waiting queue.
  optional uint64 max_queued_requests = 5;
  // Absent for the engine's default.
  optional uint32 chunked_prefill_size = 6;
}

// The answer to a `Configure`.
message Configured {
  uint64 id = 1;
  // Empty when every scheduler took the limits.
  string error = 2;
}

// An in-place weight update: every worker rewrites its weights from the
// checkpoint at `model_path`, which loads the same tensors.
message UpdateWeights {
  // Matches the `Hooked` answer.
  uint64 id = 1;
  string model_path = 2;
  WeightsInFlight in_flight = 3;
}

// How the requests in flight continue through an in-place weight update.
enum WeightsInFlight {
  // Each continues on the new weights with the KV cache it reached; the
  // pages it writes afterwards reach no shared tier.
  WEIGHTS_IN_FLIGHT_KEEP = 0;
  // Each computes its state again with the new weights.
  WEIGHTS_IN_FLIGHT_RECOMPUTE = 1;
  // Each ends, aborted, as do the requests the engine queued.
  WEIGHTS_IN_FLIGHT_ABORT = 2;
}

// A change to the device storage of every scheduler's KV cache.
message ResizeCache {
  // Matches the `Hooked` answer.
  uint64 id = 1;
  CacheChange change = 2;
  // Before the change: epochs of the deployment that keep their weights
  // alone on every node (a previous epoch kept as its weights, whose
  // processes exited), so that a growth takes the rest of their storage.
  repeated uint64 keep_weights = 4;
  // With `keep_weights`: the epochs keep their weights in host storage
  // (`update_config.previous_epoch = "host"`), which moves the weights each
  // epoch alone retains there through every node's Transfer Server; a node
  // that cannot keeps them on its GPUs. The `Hooked` answer then carries
  // each node's report first, as JSON `{"kept": {"host", "released",
  // "moved_bytes", "refused"}}`, `refused` saying why a node kept the
  // weights on its GPUs.
  bool keep_in_host_storage = 7;
  // For a make-room change: the device bytes each device's quota
  // must have room for beside everything it reserves.
  uint64 room_bytes = 9;
  // Per-device allocation requirements override room_bytes on named GPUs.
  repeated DeviceBytes device_bytes = 11;
  // Completed Host cache copies retained for rollback when execution retires.
  repeated bytes cache_keys = 13;
}

message DeviceBytes {
  bytes gpu = 1;
  uint64 bytes = 2;
}

enum CacheChange {
  // No change: a command that states none is refused.
  CACHE_CHANGE_UNSPECIFIED = 0;
  // Give back the whole KV cache and the CUDA graph storage, keeping the
  // weights, once no request runs.
  CACHE_CHANGE_SLEEP = 2;
  // Restore what a sleep gave back.
  CACHE_CHANGE_WAKE = 3;
  // Create as many of the segments given back as each device's storage
  // quota has room for.
  CACHE_CHANGE_GROW = 4;
  // Give back the tail of the KV cache until each device's quota
  // has room for `room_bytes` (a profiling session's device storage): the
  // requests that hold the tail run on. Fails, changing nothing, when even
  // the segments the cache cannot give back leave too little room.
  CACHE_CHANGE_MAKE_ROOM = 7;
}

// Where the daemon an engine attaches to listens.
message Attach {
  // The daemon's request socket, `unix:<path>`.
  string requests = 1;
}

message Shutdown {}
message FlushCache {}

// The published pages of one worker group's prefix cache.
message GroupIndex {
  string worker_group = 1;
  repeated IndexedPage pages = 2;
  // The cache units the requests the scheduler ended as migratable held,
  // and how many requests they were.
  uint32 held_units = 3;
  uint32 requests = 4;
  // Of those, the units and the number of the requests that reserved their
  // whole cache at admission (a request with images), which a successor
  // reserves whole again: it computes their context anew.
  uint32 reserved_units = 5;
  uint32 reserving = 6;
  // The units of the segments the scheduler lent its successor at its drain:
  // the successor maps them writable and allocates them on
  // trial.
  repeated UnitRange lent = 7;
}

// Cache units `[start, end)` of one engine's planes.
message UnitRange {
  uint32 start = 1;
  uint32 end = 2;
}

// One published page: its cache group, its page key (32 bytes, the key of
// its page chain), its tokens and its units in the planes of the engine
// that published it.
message IndexedPage {
  uint32 group = 1;
  bytes hash = 6;
  reserved 2;
  repeated uint32 tokens = 3;
  repeated uint32 units = 4;
  // Absent for public reuse; present for a private continuation of these units.
  CacheResume resume = 5;
}

// One scheduler's statistics of the last reporting interval.
message Stats {
  uint32 scheduler = 1;
  // The snapshot (`proto::report::SchedulerStats`), JSON: observability data
  // whose fields evolve with every build, each with a default.
  bytes snapshot = 2;
}

// ---------------------------------------------------------------- requests

message GenerationRequest {
  reserved 2, 4, 6, 7, 13, 14, 17, 18;
  reserved "negative_prompt_token_ids", "constraint", "image", "max_images",
      "image_generation", "readout", "generated_images", "trajectory";
  repeated uint32 prompt_token_ids = 1;
  repeated ImageInput images = 3;
  SamplingParams sampling = 5;
  uint64 max_und_tokens = 8;
  repeated string stop_strings = 9;
  repeated uint32 stop_token_ids = 10;
  CachePolicy cache = 11;
  bool include_stop_token = 12;
  // The tokens a migrated request generated on the engines that served it
  // before, in order; empty for a new request. They continue its prompt, and
  // the engine counts them as generated: against `max_und_tokens` and
  // `min_tokens`, in its penalties and bad words, and in its usage.
  repeated uint32 generated_token_ids = 15;
  // The LoRA adapter the request computes with: the slot of the workers'
  // adapter pool the daemon loaded it into, or 0 for the base model alone.
  uint32 adapter = 16;
}

message ImageInput {
  // The SHA-256 digest of what the image's encoders read of the request
  // (its bytes, a request-dependent preprocessing parameter, its cache
  // partition), which keys their outputs.
  bytes digest = 6;
  // The encoded image file (its JPEG, PNG or other bytes as the request
  // fetched them).
  bytes encoded = 2;
  uint32 position = 3;
  uint32 num_positions = 4;
  repeated ImageEncoderInput encoders = 5;
}

enum ImageEncoder {
  IMAGE_ENCODER_VISION = 0;
  IMAGE_ENCODER_LATENT = 1;
}

message ImageEncoderInput {
  ImageEncoder encoder = 1;
  optional uint32 num_cache_tokens = 2;
  optional uint32 max_cache_tokens = 3;
  // The pixels the encoder's transform resizes the image to, when known
  // before execution: a latent encoder encodes the image at that size.
  optional uint32 height = 4;
  optional uint32 width = 5;
}

message SamplingParams {
  float temperature = 1;
  uint32 top_k = 2;
  float top_p = 3;
  bool ignore_eos = 4;
  optional uint64 seed = 5;
  float min_p = 6;
  float repetition_penalty = 7;
  float frequency_penalty = 8;
  float presence_penalty = 9;
  repeated LogitBias logit_bias = 10;
  uint64 min_tokens = 11;
  bool return_logprobs = 12;
  uint32 n_logprobs = 13;
  bool return_prompt_logprobs = 14;
  uint32 n_prompt_logprobs = 15;
  repeated TokenSequence bad_words_ids = 16;
  // Absent: every token is allowed.
  TokenSequence allowed_token_ids = 17;
  float typical_p = 18;
  repeated uint32 forced_token_ids = 19;
}

message LogitBias {
  uint32 token = 1;
  float bias = 2;
}

message TokenSequence {
  repeated uint32 tokens = 1;
}

message CachePolicy {
  bool read = 1;
  bool write = 2;
  optional uint64 isolation_key = 3;
  // The page seeds (32 bytes each) of the epoch whose state a migrated
  // request continues with (an epoch change's `in_flight = keep`).
  repeated bytes state_seeds = 7;
  reserved 6;
  CacheResume resume = 5;
}

message CacheResume {
  uint64 epoch = 1;
  uint64 request_id = 2;
}

message DiffusionRequest {
  reserved 1;
  repeated uint32 prompt_token_ids = 2;
  bytes conditioning = 3;
  repeated ConditionExtent conditions = 4;
  DiffusionSamplingParams sampling = 5;
  // The request's trajectory identity, preserved across engine migrations.
  uint64 trajectory = 6;
  // The stored denoising step; zero starts the trajectory from noise.
  uint32 denoised_steps = 7;
  // The source epoch's latent seed for in_flight=keep across numerics.
  optional uint64 state_seed = 8;
  // The digests of what each encoder computation reads, which key its
  // outputs in the host tier; absent, the engine stores and finds none.
  optional EncoderInputs encoder_inputs = 9;
  // The stored ranks' page locations and numerical layouts, read by engines.
  bytes stored_layout = 10;
}

// The SHA-256 digests of what each encoder computation of a video request
// reads, which the daemon computes from the request's facts.
message EncoderInputs {
  // The text encoding's.
  bytes text = 1;
  // The vision encoding's; absent without a vision block.
  optional bytes vision = 2;
  // Each visual condition unit's, in encoding order.
  repeated bytes video_units = 3;
  // The audio encoding's; absent without an audio track.
  optional bytes audio = 4;
}

message ConditionExtent {
  uint64 pixel_bytes = 1;
  uint64 audio_samples = 2;
  uint64 vision_patches = 3;
  uint32 vision_tokens = 4;
  repeated uint32 latent_units = 5;
  uint32 audio_rows = 6;
}

message DiffusionSamplingParams {
  uint32 num_frames = 1;
  uint32 video_units = 2;
  uint64 seed = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint32 condition_rows = 6;
}

// ------------------------------------------------------------------ events

message Event {
  reserved 4, 7, 8, 9, 10, 11, 19;
  reserved "text_tokens", "readout", "image_begin", "image_step", "image_commit",
      "image_done", "control_token";
  uint64 request = 1;
  oneof kind {
    Scheduled scheduled = 2;
    TextToken text_token = 3;
    TokenLogprobs token_logprobs = 5;
    PromptLogprobs prompt_logprobs = 6;
    MediaProgress media_progress = 12;
    Artifact artifact = 13;
    ArtifactUnavailable artifact_unavailable = 14;
    Finished finished = 15;
    Rejected rejected = 16;
    Failed error = 17;
    Migratable migratable = 18;
  }
}

// The request ends on this engine without finishing: every token it
// generated here has been sent, and the daemon may submit it again, with
// those tokens or the trajectory steps the engine stored, to the engine that
// serves next. A terminal event.
message Migratable {
  MigrationCause cause = 1;
  // For a video request, the denoising steps of its trajectory the engine
  // stored in its host latent pools at the step boundary it was preempted
  // at, which the daemon submits it again with; zero when it stored none.
  uint32 denoised_steps = 2;
  // With stored steps, where the engine put the trajectory's pages and how
  // each stored rank laid its part out (`DiffusionRequest.stored_layout`).
  bytes stored_layout = 3;
}

enum MigrationCause {
  // The engine drains for a hot update.
  MIGRATION_CAUSE_DRAIN = 0;
  // The workers that held the request were lost.
  MIGRATION_CAUSE_LOSS = 1;
}

message Scheduled {
  double queued_at = 1;
  double scheduled_at = 2;
  // The prompt tokens the admission's prefix hit found cached, over every
  // tier: the scheduler's `num_cached_tokens` once the hit is final.
  uint64 cached_tokens = 3;
}

message TextToken {
  uint32 id = 1;
  optional float logprob = 2;
}

message TokenLogprob {
  uint32 token_id = 1;
  float logprob = 2;
  uint32 rank = 3;
}

message TokenLogprobs {
  uint32 id = 1;
  repeated TokenLogprob candidates = 2;
}

message PositionLogprobs {
  repeated TokenLogprob entries = 1;
}

message PromptLogprobs {
  repeated PositionLogprobs positions = 1;
}

message MediaProgress {
  string phase = 1;
  uint32 completed_steps = 2;
}

// A generated artifact: its bytes are the shared memory whose descriptor
// travels with this frame, `bytes` long.
message Artifact {
  MediaKind media_kind = 1;
  string content_type = 2;
  uint64 bytes = 3;
}

// One bounded part of an artifact transferred between hosts. Every part
// states the complete length; the following Artifact event consumes it.
message ArtifactPart {
  uint64 size = 1;
  bytes data = 2;
}

enum MediaKind {
  MEDIA_KIND_IMAGE = 0;
  MEDIA_KIND_VIDEO = 1;
  MEDIA_KIND_AUDIO = 2;
}

message ArtifactUnavailable {
  string message = 1;
}

message Finished {
  FinishReason reason = 1;
  StopReason stop_reason = 2;
  uint64 prompt_tokens = 3;
  uint64 completion_tokens = 4;
  reserved 5;
  reserved "images";
}

enum FinishReason {
  FINISH_REASON_COMPLETED = 0;
  FINISH_REASON_EOS = 1;
  FINISH_REASON_MAX_TOKENS = 2;
  FINISH_REASON_STOP = 3;
  reserved 4;
  reserved "FINISH_REASON_IMAGE_DONE";
  FINISH_REASON_CANCELLED = 5;
  FINISH_REASON_ABORTED = 6;
  FINISH_REASON_REPETITION = 7;
  FINISH_REASON_ERROR = 8;
  FINISH_REASON_CACHE_CAPACITY = 9;
}

message StopReason {
  oneof kind {
    uint32 token = 1;
    string text = 2;
  }
}

message Rejected {
  RejectionKind kind = 1;
  string message = 2;
}

enum RejectionKind {
  REJECTION_KIND_INVALID = 0;
  REJECTION_KIND_OVERLOADED = 1;
}

message Failed {
  string message = 1;
}

// ------------------------------------------------------------ limits

message GenerationLimits {
  reserved 4, 5, 6, 7, 10, 13, 14;
  reserved "image_generation", "token_denoising", "max_latent_units", "latent_downsample",
      "latent_bytes_per_unit", "commit_marker_tokens", "max_cfg_branches";
  bool understanding = 1;
  bool vision_encode = 2;
  bool latent_encode = 3;
  uint32 max_vae_grid_tokens = 8;
  uint32 max_vit_grid_tokens = 9;
  uint64 max_latent_feature_bytes = 11;
  uint64 max_vision_feature_bytes = 12;
  uint32 encoder_cache_entries = 15;
  uint32 max_logprobs = 16;
}

// ---------------------------------------------------------------- handover

// What an engine process takes over from the one it succeeds on the same
// devices, which the daemon states in its launch file.

// Logical expert IDs in global physical-slot order for one numerical layer.
message ExpertOrder {
  repeated uint32 experts = 1;
}

// The engine an engine started beside it succeeds: a switch's target or a
// standby, which parks once it is ready and serves when it is promoted. It
// maps nothing of its predecessor: both open sessions with the host's buffer
// pool, which keeps them from writing one block.
message Predecessor {
  // The epoch the predecessor executes.
  uint64 epoch = 1;
  reserved 2;
}
