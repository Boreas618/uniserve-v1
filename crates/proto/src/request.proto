// The request interface: what the leader daemon submits to an engine process
// and the events it receives back.
//
// The leader daemon starts each engine process, which connects to the
// daemon's request socket (a Unix socket on the leader) and says hello. The
// daemon answers with the engine's specification: everything it is to serve
// and how. The engine starts its workers, then reports its state, and from
// then on the connection carries the daemon's submissions and commands and
// the engine's events. Every request has the identity the daemon gave it;
// each of its events names it.
//
// A request's generated media reaches the daemon with its events: an
// `Artifact` event passes the shared memory holding the bytes as a file
// descriptor beside its frame.
//
// The interface has one version per release (`proto::ENGINE_INTERFACE_VERSION`,
// shared with the process interface): the daemon serves an engine of its own
// version alone, refusing any other in its welcome with a typed `Refusal`.
// The `Hello` and the `Welcome` are the one part of the interface that no
// release changes, so that an engine of any version reads its refusal.

syntax = "proto3";

package uniserve.request;

// The first message on a connection, from the engine process.
message Hello {
  uint32 major = 1;
  string build = 3;
  // The identity the daemon started the engine process under.
  uint64 engine = 4;
  // Which of the process's links this connection is, as `process.proto`'s
  // `Interface` states it: this one is always `INTERFACE_REQUESTS`.
  int32 interface = 5;
}

// The answer to a `Hello`.
message Welcome {
  reserved 1, 4;
  // The daemon's build: package version and source digest.
  string build = 3;
  // Why the engine is refused; absent when it is accepted.
  Refusal refusal = 5;
  // The events of one request the daemon takes ahead of its `Consumed`
  // reports: the engine sends a request's events no further beyond the
  // position the daemon last reported. Positive.
  uint32 event_window = 6;
}

// Why the daemon refuses an engine's hello on its request link.
message Refusal {
  oneof reason {
    // The engine speaks another version of the engine interface than the daemon.
    VersionRefusal version = 1;
    // The engine states another engine number than the one the link was made
    // for.
    EngineMismatch engine = 2;
  }
}

// The versions of a refusal for the engine interface's version.
message VersionRefusal {
  // The version the engine's hello states.
  uint32 offered = 1;
  // The daemon's version, the one it serves.
  uint32 spoken = 2;
}

// The engine numbers of a refusal for a link made for another engine.
message EngineMismatch {
  // The number the engine's hello states.
  uint64 stated = 1;
  // The number the link was made for.
  uint64 expected = 2;
}

// What travels from the engine process after the welcome.
message FromEngine {
  reserved 5, 6, 8, 9;
  oneof kind {
    State state = 1;
    Accepted accepted = 2;
    Event event = 3;
    Stats stats = 4;
    Operated operated = 12;
    // TCP artifact bytes, sent contiguously before their Artifact event.
    MediaPart artifact_part = 10;
    // The main process's counters for the frontend's `/metrics`.
    Metrics metrics = 11;
  }
}

// The main process's counters for the deployment's `/metrics`, which the
// frontend serves: sent once a second while the main process serves, and
// once more when it drains. They are per epoch and additive — an epoch
// starts at zero and the frontend sums the epochs it serves. `device_ns` is
// CUPTI kernel time summed over batches, in nanoseconds, when profiling is
// on and zero otherwise; `queue` is the waiting depth of each DP rank.
message Metrics {
  uint64 steps = 1;
  uint64 batches = 2;
  uint64 tokens = 3;
  uint64 kernel_launches = 4;
  uint64 device_ns = 5;
  repeated QueueDepth queue = 6;
  // Fuel the scheduling policy's calls consumed, summed over the scheduler
  // threads since the main process started: the deterministic proxy for the
  // per-step cost design §12 measures.
  uint64 policy_fuel = 7;
  // The number of those policy calls.
  uint64 policy_calls = 8;
  // The devices' allocators, for the invariant design §4.1 and §8 state:
  // a device never maps more physical memory than its budget allows.
  repeated DeviceMemory memory = 9;
}

message QueueDepth {
  uint32 rank = 1;
  uint32 depth = 2;
}

// One device's memory as the main process reports it.
message DeviceMemory {
  uint32 device = 1;
  // The bytes the device's budget allows this epoch (design §8): the limit
  // of the deployment's quota of the GPU, the shares of the ranks it places
  // there (each its group's `mem_fraction_static`, or the deployment's),
  // which the deployment's epochs and transfers account against.
  uint64 budget = 2;
  // The pools of the device's allocators (`crates/platform`'s `Allocator`,
  // design §4.1), and the planes of its KV regions.
  repeated PoolMemory pools = 3;
}

// One pool of a device's memory.
message PoolMemory {
  // The pool: an allocator's `graph`, `scratch` or `resident` (design §4.1),
  // or `kv`, the planes of the device's KV regions: the segments its ranks
  // map, with the flags, scales, index keys and state planes beside them.
  string pool = 1;
  // The bytes of physical memory the pool has mapped now.
  uint64 mapped = 2;
}

// What travels to the engine process after the welcome.
message ToEngine {
  oneof kind {
    // Over a Unix socket the frame carries, as descriptors, the media of
    // every condition of its video requests, request by request in
    // condition order; over TCP those media precede it as `condition_part`s.
    Submit submit = 1;
    Command command = 2;
    EngineCommand engine = 3;
    // TCP condition bytes, each medium's parts contiguous, sent before the
    // `Submit` whose conditions they are.
    MediaPart condition_part = 4;
  }
}

// The engine's state changes.
message State {
  EngineState state = 1;
  // What the engine serves, once it is ready.
  EngineInfo info = 2;
  // Why the engine failed, when it did.
  string error = 3;
}

// Where an engine is in its life, as it announces it on every request link.
enum EngineState {
  ENGINE_STATE_UNSPECIFIED = 0;
  // Loading its ranks, resolving its modules and capturing its graphs.
  ENGINE_STATE_STARTING = 1;
  // Executes nothing and admits nothing, with its storage mapped and its
  // graphs captured: an engine started beside the serving one (a switch's
  // target, a standby), or one that drained. `Promote` makes it serve.
  ENGINE_STATE_PARKED = 2;
  // Admits and executes requests.
  ENGINE_STATE_SERVING = 3;
  // Admits nothing more; its requests in flight end as migratable at their
  // step boundaries. Parked once the last one ended.
  ENGINE_STATE_DRAINING = 4;
  // Closed its ranks on a shutdown and exits.
  ENGINE_STATE_STOPPED = 5;
  // Its start failed or its ranks are lost; it serves nothing more.
  ENGINE_STATE_FAILED = 6;
}

// What a ready engine serves.
message EngineInfo {
  // The limits every request is checked against, resolved against the
  // workers' capacities.
  GenerationLimits limits = 1;
  // The video denoiser as its model family describes it to its request
  // processing (`nn::family::Description::details`): the encoding of a
  // `VideoDenoiser` message, which the engine carries without reading it;
  // empty when the engine generates no video.
  bytes video_denoiser = 2;
  reserved 3;
  reserved "latent_encoding_units";
  // The engine's schedulers, one per DP rank.
  uint32 schedulers = 4;
  // The largest scheduling limits the workers were started for: the
  // schedulers take any limits within them in place, as the scheduling
  // policy's parameters a generation update moves them to.
  BatchCapacity capacity = 6;
  // The KV cache segments of each worker group, which an engine that
  // succeeds this one on the same devices maps.
  repeated CacheSegments segments = 7;
  // The page seeds (32-byte keys) of the page chains of the cache groups
  // the engine's workers compute: equal between epochs whose models,
  // numerics and page layouts agree, whose pages a successor reuses.
  repeated bytes prefix_seeds = 11;
  reserved 10;
  // The seed of the keys of the latent trajectories the engine's denoiser
  // (a video model's) stores at preemption: equal
  // between epochs whose denoising computes the same, which continue each
  // other's trajectories exactly; zero for an engine that stores none.
  uint64 latent_seed = 9;
  // How often each scheduler reports its statistics (`Stats`), in
  // milliseconds: the period whose interval each report covers. Positive.
  uint32 stats_period_ms = 12;
}

// The batch an engine's workers were started for.
message BatchCapacity {
  // Calls one step forms; zero when the workers bound none.
  uint32 max_batch = 1;
  // Tokens one step forms.
  uint64 max_num_batched_tokens = 2;
  // Requests running at once.
  uint32 max_running_requests = 3;
}

// The segments of one worker group's KV cache planes, in plane order: each
// an allocation of whole units that an epoch created, which the epoch that
// holds the planes gives back or creates again as a whole.
message CacheSegments {
  string worker_group = 1;
  repeated CacheSegment segments = 2;
  // The segments the group holds, `[0, held)`; those after were given back.
  uint32 held = 3;
  // The units of the group's planes, those of the segments given back
  // included.
  uint32 units = 4;
  // The units `1..=scratch` the group's warmup lent.
  uint32 scratch = 5;
}

message CacheSegment {
  // The epoch that created the segment's storage.
  uint64 epoch = 1;
  // The segment's ordinal among those its epoch created.
  uint32 ordinal = 2;
  // The cache units the segment holds.
  uint32 units = 3;
}

// Requests submitted together: the engine queues every one of them before it
// forms its next batch.
message Submit {
  repeated Request requests = 1;
}

// The engine took a submitted request: it passed the engine's checks and is
// queued on one of its schedulers. A request it refuses ends with a
// `Rejected` event instead.
message Accepted {
  // The identity the connection gave the request.
  uint64 request = 1;
  // The scheduler that serves it.
  uint32 scheduler = 2;
  // The engine's own identity of the request, unique among every
  // connection's requests: the identity a takeover of its stream names on
  // another connection, and the one its private cache pages are kept under.
  uint64 engine_request = 3;
}

message Request {
  // The identity this connection gives the request, which its events and
  // commands carry on this connection. Each connection numbers its own
  // requests: the engine keeps two connections' requests apart however they
  // number them.
  uint64 id = 1;
  int32 priority = 2;
  oneof kind {
    GenerationRequest generation = 3;
    DiffusionRequest diffusion = 4;
  }
  // The engine's scheduler that serves the request, by its index: the one
  // the leader's routing program chose among the deployment's replicas. Absent,
  // or naming no scheduler of the engine (a request resubmitted to another
  // epoch), the scheduler with the fewest requests in flight serves it.
  optional uint32 scheduler = 5;
  // The request's trace id, which the daemon gave it as it received it and
  // which every span of the request names (`docs/profiling.md`); it stays the
  // same when the request migrates. Zero for a request the daemon traces not.
  uint64 trace = 6;
}

// A command for one request.
message Command {
  uint64 request = 1;
  oneof kind {
    // The client went away: the request ends as cancelled.
    Cancel cancel = 2;
    // The daemon's decoder matched a stop string: the request ends as
    // stopped.
    StopRequest stop = 3;
    // The daemon's decoder found that this many public tokens complete no
    // stop string.
    Acknowledge acknowledge = 4;
    // The daemon ends the request at once.
    Abort abort = 5;
    // The daemon's consumer took this many of the request's events in all.
    // The engine sends a request at most `EVENT_WINDOW` events beyond what
    // its consumer took, so a slow consumer holds its request's output
    // back in the engine, whose scheduler then stalls the request.
    Consumed consumed = 6;
    // The connection this command arrives on takes the request's event
    // stream over from a position: a hot restart of the daemon hands the
    // response to a successor (design 7.5.1 step 4). The request keeps
    // generating in the engine that serves it; it is neither cancelled nor
    // submitted again, and the engine sends this connection again the events
    // after the position the previous consumer reached.
    Takeover takeover = 7;
  }
}

message Cancel {}
message StopRequest {}
message Acknowledge {
  uint64 output_tokens = 1;
}
message Abort {}
message Consumed {
  uint64 events = 1;
}
// One request's event stream taken over by another connection (a hot
// restart's successor daemon). The command's `request` is the identity this
// connection gives the request from now on.
message Takeover {
  // The events the response's previous consumer took in all: the engine
  // sends the new consumer the events after this position, then the ones
  // the request goes on producing. The position counts as the consumer's
  // `Consumed` report of it, which the new consumer's reports go on from: a
  // report of it the previous consumer sends on its own connection may
  // arrive before the takeover or after it, and one after it is ignored.
  uint64 events = 1;
  // The engine's identity of the request (`Accepted.engine_request`).
  uint64 engine_request = 2;
}

// A command for the whole engine. Every command that names an `id` is
// answered with an `Operated` of that id, carrying the reports its kind
// states.
message EngineCommand {
  reserved 5, 6, 9, 13, 14, 16, 17, 21;
  reserved "update_weights";
  oneof kind {
    // Finish every request as aborted, close the workers and exit.
    Shutdown shutdown = 1;
    // Revoke every cached prefix page; requests in flight keep theirs.
    FlushCache flush_cache = 4;
    // Connect to another daemon beside the ones the engine serves, as a hot
    // restart of the daemon starts its successor: the engine says hello to
    // it as itself, reports itself ready there, and serves both, each its
    // own requests, until the last closes its connection.
    Attach attach = 7;
    // Give back or restore KV cache storage on every scheduler; answered
    // with no reports.
    ResizeCache resize_cache = 8;
    // Install completed expert copies at the common drained step boundary;
    // answered with `WeightReports`.
    CommitExperts commit_experts = 18;
    // The stages of an expert redistribution, beside the batches: prepare
    // the copies of an order (answered with `ExpertAllocations`), run them
    // (answered once every rank's copies completed), or abandon them.
    PrepareExperts prepare_experts = 19;
    StartExperts start_experts = 20;
    AbortExperts abort_experts = 22;
    // Load a LoRA adapter's tensors into a slot of every rank, or release
    // a slot's; answered with `AdapterReports`.
    LoadAdapter load_adapter = 23;
    UnloadAdapter unload_adapter = 24;
    // A profiling session's changes on every rank: its start
    // (`ProfileStarts`), its end (`ProfileStops`) and the release of one of
    // its collectors (`ProfileReleases`).
    StartProfile start_profile = 25;
    StopProfile stop_profile = 26;
    ReleaseProfile release_profile = 27;
    // Switch the fence probes the graphs captured on or off in place, at
    // the next step boundary; answered with `FenceSwitches`.
    SwitchFences switch_fences = 28;
    // Replace the step values every scheduler reads from its next step on
    // (`proto::config::Tuning`); answered with no reports.
    Tune tune = 29;
    // Measure what a generation update to the kernel packages `kernels`
    // takes on every rank's device beside the serving graphs, and the KV
    // units each rank's cache gives up when the device's room does not hold
    // it; nothing is installed. Answered with `Rooms`.
    MeasureRoom measure_room = 31;
    // Read the spans every process of the engine keeps in its rings;
    // answered with `Spans`.
    ReadSpans read_spans = 30;
  }
}

// The step values of configuration revision `revision`
// (`proto::config::Tuning`); an unset value is the deployment's default.
// The scheduler node relays them to every peer of the epoch.
message Tune {
  uint64 id = 1;
  uint64 revision = 2;
  optional uint64 chunked_prefill_size = 3;
  uint64 max_batch = 4;
  optional uint64 max_num_batched_tokens = 5;
  optional uint64 max_queued_requests = 6;
  // Batches each worker group keeps in flight, by the group's id.
  map<string, uint64> queue_depths = 7;
  bool prefix_caching = 8;
  bool host_tier = 9;
  // Bytes the copies started with one batch move together over a group's ranks.
  uint64 copy_budget = 10;
  uint64 report_period_ms = 11;
  uint64 watchdog_timeout_ms = 12;
  uint64 compare_timeout_ms = 13;
  bool nvtx_ranges = 14;
  // Where and how the schedulers publish their KV events (`kv_events_config`): the endpoint
  // unset publishes none.
  optional string kv_events_endpoint = 15;
  optional string kv_events_replay_endpoint = 16;
  string kv_events_topic = 17;
  uint64 kv_events_buffer_steps = 18;
  // The role of each of the engine's schedulers, by its index: which
  // requests it takes from the next submission on (`replicas.<id>.role`).
  repeated Role roles = 19;
  // The mean tokens a verification commits under synthetic acceptance
  // (`speculative_config.synthetic_acceptance_length`); unset, a verification
  // accepts what the model selects.
  optional double synthetic_acceptance_length = 20;
}

// The requests a scheduler, a replica of the deployment, takes.
enum Role {
  // Both: it computes prompts and generates tokens.
  ROLE_MIXED = 0;
  // Prompts alone: a request it takes hands its KV off once its first token
  // is sampled.
  ROLE_PREFILL = 1;
  // Token generation alone: a request it takes imports the KV a prefill
  // replica lent.
  ROLE_DECODE = 2;
}

message CommitExperts {
  uint64 id = 1;
  map<string, ExpertOrder> order = 2;
}

// Prepare, on every rank, the copies of the routed experts that put each
// named layer's experts in `order` (`docs/admin.md`, Expert
// redistribution): allocate their storage beside the serving weights.
message PrepareExperts {
  uint64 id = 1;
  map<string, ExpertOrder> order = 2;
}

// Run the prepared copies beside the batches; answered, with no reports,
// once every rank's copies completed, or with the reason a rank's failed.
message StartExperts {
  uint64 id = 1;
}

// Abandon the redistribution prepared or copying: its allocations go back,
// and the serving order stays.
message AbortExperts {
  uint64 id = 1;
}

// Load the LoRA adapter at `path` into `slot` of every rank.
message LoadAdapter {
  uint64 id = 1;
  uint32 slot = 2;
  string path = 3;
}

// Release `slot`'s adapter on every rank; a slot that holds none is a load
// that failed part of the way, and nothing is owed.
message UnloadAdapter {
  uint64 id = 1;
  uint32 slot = 2;
}

// Start profiling session `session` on every rank it selects.
message StartProfile {
  uint64 id = 1;
  ProfileSession session = 2;
}

// End profiling session `session` for `reason` on every rank that records
// it: each writes what remains and closes its file.
message StopProfile {
  uint64 id = 1;
  uint64 session = 2;
  string reason = 3;
}

// Turn `collector` of profiling session `session` off on every rank, for
// `reason`.
message ReleaseProfile {
  uint64 id = 1;
  uint64 session = 2;
  ProfileCollector collector = 3;
  string reason = 4;
}

// Switch the fence probes on (`enabled`) or off, with the probed module
// classes `off` (patterns of their names) switched off whatever `enabled`
// says.
message SwitchFences {
  uint64 id = 1;
  bool enabled = 2;
  repeated string off = 3;
  // The kernel probes' own switch (`profiling_config.kernel_probes`): they
  // record while both it and `enabled` are on.
  bool kernels = 4;
}

// Read one page of the spans every process of the engine keeps
// (`docs/profiling.md`, `service::span::page`): those that ended at or after
// `since`, nanoseconds since the Unix epoch on the host clock. Answered with
// `Spans`.
message ReadSpans {
  uint64 id = 1;
  uint64 since = 2;
}

// A page of the engine's spans: the MessagePack encoding of a
// `service::span::Span` list, each span as the process that recorded it named
// it, within `proto::SPAN_PAGE_BYTES`.
message Spans {
  bytes spans = 1;
  // The epoch the engine executes, which qualifies its batch ids.
  uint64 epoch = 2;
  // The `since` of the next page; unset on the last page.
  optional uint64 next = 3;
}

// A profiling session as the daemon starts it (`proto::profile::SessionStart`).
message ProfileSession {
  uint64 session = 1;
  uint64 epoch = 2;
  ProfileRequest request = 3;
}

// A profiling session's request (`proto::profile::SessionRequest`).
message ProfileRequest {
  repeated ProfileCollector collectors = 1;
  uint64 start_step = 2;
  optional uint64 steps = 3;
  optional double seconds = 4;
  repeated string stages = 5;
  repeated uint32 workers = 6;
  repeated string modules = 7;
  string output_dir = 8;
  ProfileGraphTrace timeline_graphs = 9;
  repeated string pm_metrics = 10;
  uint64 pm_interval_ns = 11;
  repeated string range_metrics = 12;
  ProfileMetricRanges metric_ranges = 13;
  uint64 pass_ranges = 14;
  uint32 pc_period = 15;
  optional double max_slowdown = 16;
  // The PC sampling hardware buffer, in MiB.
  uint32 pc_hardware_buffer_mib = 17;
  // How often each worker reads its armed samplers, in milliseconds.
  uint64 sampler_read_ms = 18;
  double baseline_s = 19;
  double guard_window_s = 20;
}

enum ProfileCollector {
  // No collector: a command that states none is refused.
  PROFILE_COLLECTOR_UNSPECIFIED = 0;
  PROFILE_COLLECTOR_TIMELINE = 1;
  PROFILE_COLLECTOR_FENCE_TIMELINE = 2;
  PROFILE_COLLECTOR_PM_SAMPLING = 3;
  PROFILE_COLLECTOR_RANGE_METRICS = 4;
  PROFILE_COLLECTOR_PC_SAMPLING = 5;
}

enum ProfileGraphTrace {
  PROFILE_GRAPH_TRACE_WHOLE = 0;
  PROFILE_GRAPH_TRACE_NODES = 1;
}

enum ProfileMetricRanges {
  PROFILE_METRIC_RANGES_KERNEL = 0;
  PROFILE_METRIC_RANGES_MODULE = 1;
}

// The answer to an engine command that names an `id`: what every rank
// reported, of the kind the command states, or why the command failed.
message Operated {
  reserved 4;
  uint64 id = 1;
  // Empty when every rank ran the command.
  string error = 2;
  // Unset for a command that reports nothing, and with an error.
  oneof reports {
    ExpertAllocations expert_allocations = 3;
    AdapterReports adapter_reports = 5;
    ProfileStarts profile_starts = 6;
    ProfileStops profile_stops = 7;
    ProfileReleases profile_releases = 8;
    FenceSwitches fence_switches = 9;
    WeightReports weight_reports = 10;
    Rooms rooms = 12;
    Spans spans = 11;
  }
}


// The kernel packages of a generation update whose room is measured: each
// package by its slot (the operator, the descriptor key a pin names, the
// part of a candidate) and its fixed revision.
message MeasureRoom {
  uint64 id = 1;
  repeated RoomKernel kernels = 2;
  // The generation places the probes elsewhere, so every bucket is captured
  // again whatever kernels it replaces.
  bool recapture = 3;
  // The options the generation's graphs are captured for; the serving
  // generation's when absent. Other options capture every bucket of the
  // shapes they give the runners, beside the storage those take.
  optional GraphOptions graphs = 4;
}

// The options a generation's CUDA graphs are captured for, as the process
// interface's `Prepare` states them (`proto::config::GraphOptions`).
message GraphOptions {
  repeated uint32 decode_batch_sizes = 1;
  bool decode_stated = 2;
  repeated uint32 prefill_token_sizes = 3;
  bool prefill_stated = 4;
  uint32 max_logprobs = 5;
  uint32 num_draft_tokens = 6;
  bool graph_pc_sampling = 7;
}

message RoomKernel {
  string op = 1;
  optional string key = 2;
  optional string part = 3;
  string backend = 4;
  uint32 revision = 5;
}

// What a generation update takes on each rank's device, the scheduler
// node's ranks first and then each peer's; none when it replaces no kernel.
message Rooms {
  repeated DeviceRoom devices = 1;
}

message DeviceRoom {
  // The GPU's UUID, its sixteen bytes.
  bytes gpu = 1;
  // The bytes the update's graphs and rehearsals take beside what serves.
  uint64 extra = 2;
  // What the device holds of them now.
  uint64 room = 3;
  // The KV units the rank's cache demotes and gives back while the update
  // holds both generations' graphs; zero when the room holds them.
  uint64 kv_units = 4;
}

// Each rank's prepared allocation for a new expert order, in rank order.
message ExpertAllocations {
  repeated ExpertAllocation ranks = 1;
}

// One rank's prepared allocation: the orders it took, the GPU it allocated
// on (its UUID's sixteen bytes) and the bytes it reserves there.
message ExpertAllocation {
  map<string, ExpertOrder> order = 1;
  bytes gpu = 2;
  uint64 bytes = 3;
}

// What each rank did with an adapter's slot, in rank order.
message AdapterReports {
  repeated AdapterReport ranks = 1;
}

// One rank's adapter slot: the tensors a load mapped there; unset for a
// release.
message AdapterReport {
  uint32 slot = 1;
  optional uint32 tensors = 2;
}

message ProfileStarts {
  repeated ProfileStart ranks = 1;
}

// One rank's answer to a session's start (`proto::profile::RankStart`).
message ProfileStart {
  uint32 rank = 1;
  // Whether the session records the rank.
  bool selected = 2;
  // Why the rank refused the session; empty when it did not.
  string refused = 3;
  // The rank's file; empty when the session does not record the rank.
  string path = 4;
  // Each collector's state on the rank, by the collector's name.
  map<string, string> collectors = 5;
  // The device storage, in bytes, the rank's collectors measured they hold on
  // its GPU while the session runs; 0 on a rank the session does not record.
  uint64 device_storage = 6;
}

message ProfileStops {
  repeated ProfileStop ranks = 1;
}

// One rank's answer to a session's end (`proto::profile::RankStop`).
message ProfileStop {
  uint32 rank = 1;
  uint64 session = 2;
  // Whether the session recorded the rank; a rank of no session or another
  // answers false and nothing else.
  bool selected = 3;
  uint64 steps = 4;
  string reason = 5;
  // What the rank's file holds, or why it could not be finished; unset
  // for a rank that recorded no file.
  oneof file {
    ProfileFile written = 6;
    string failed = 7;
  }
}

// A finished profile file: where it lies, its bytes and its rows by table.
message ProfileFile {
  string path = 1;
  uint64 bytes = 2;
  map<string, uint64> rows = 3;
}

message ProfileReleases {
  repeated ProfileRelease ranks = 1;
}

// Whether one rank ran the collector a release turned off.
message ProfileRelease {
  uint32 rank = 1;
  bool released = 2;
}

// What each process of the engine switched, in process order.
message FenceSwitches {
  repeated FencesSwitched processes = 1;
}

// One process's switch: whether its graphs hold probes at all, the switch
// it applied, and the probed classes it switched off.
message FencesSwitched {
  bool probes = 1;
  bool enabled = 2;
  repeated string off = 3;
}

// Each rank's report of an expert commit (`CommitExperts`), in rank order.
message WeightReports {
  repeated WeightReport ranks = 1;
}

// One rank's report of an expert commit: the weights it mapped again.
message WeightReport {
  reserved 3, 4;
  reserved "identity", "identities";
  // The rank's worker group and rank; unset for a worker of no storage
  // scope.
  optional string group = 1;
  optional uint32 rank = 2;
  // The weights the commit mapped at the addresses of the ones they replace.
  uint64 moved = 5;
}

// A change to the device storage of every scheduler's KV cache.
message ResizeCache {
  reserved 4, 7, 13;
  // Matches the `Operated` answer.
  uint64 id = 1;
  CacheChange change = 2;
  // For a make-room change: the device bytes each device's quota
  // must have room for beside everything it reserves.
  uint64 room_bytes = 9;
  // Per-device allocation requirements override room_bytes on named GPUs.
  repeated DeviceBytes device_bytes = 11;
  // For a fraction change: the deployment's `mem_fraction_static`, and each
  // worker group's own share by its id, for a group that states one.
  double deployment_fraction = 14;
  map<string, double> group_fractions = 15;
}

message DeviceBytes {
  bytes gpu = 1;
  uint64 bytes = 2;
}

enum CacheChange {
  // No change: a command that states none is refused.
  CACHE_CHANGE_UNSPECIFIED = 0;
  // Give back the whole KV cache and the CUDA graph storage, keeping the
  // weights, once no request runs.
  CACHE_CHANGE_SLEEP = 2;
  // Restore what a sleep gave back.
  CACHE_CHANGE_WAKE = 3;
  // Create as many of the segments given back as each device's storage
  // quota has room for.
  CACHE_CHANGE_GROW = 4;
  // Give back the tail of the KV cache until each device's quota
  // has room for `room_bytes` (a profiling session's device storage): the
  // requests that hold the tail run on. Fails, changing nothing, when even
  // the segments the cache cannot give back leave too little room.
  CACHE_CHANGE_MAKE_ROOM = 7;
  // Lower every rank's share of its GPU to the fractions the command
  // states: the tail of the KV cache is given back, its blocks without a
  // host copy demoted to the host tier first, until each device's usage fits
  // the lower limit, which every rank then reserves under. Fails, changing
  // nothing, when even the segments the cache cannot give back leave a
  // device above it.
  CACHE_CHANGE_FRACTION = 8;
}

// Where the daemon an engine attaches to listens.
message Attach {
  // The daemon's request socket, `unix:<path>`.
  string requests = 1;
}

message Shutdown {}
message FlushCache {}

// The published pages of one worker group's prefix cache.
message GroupIndex {
  string worker_group = 1;
  repeated IndexedPage pages = 2;
  // The cache units the requests the scheduler ended as migratable held,
  // and how many requests they were.
  uint32 held_units = 3;
  uint32 requests = 4;
  // Of those, the units and the number of the requests that reserved their
  // whole cache at admission (a request with images), which a successor
  // reserves whole again: it computes their context anew.
  uint32 reserved_units = 5;
  uint32 reserving = 6;
  // The units of the segments the scheduler lent its successor at its drain:
  // the successor maps them writable and allocates them on
  // trial.
  repeated UnitRange lent = 7;
}

// Cache units `[start, end)` of one engine's planes.
message UnitRange {
  uint32 start = 1;
  uint32 end = 2;
}

// One published page: its cache group, its page key (32 bytes, the key of
// its page chain), its tokens and its units in the planes of the engine
// that published it.
message IndexedPage {
  uint32 group = 1;
  bytes hash = 6;
  reserved 2;
  repeated uint32 tokens = 3;
  repeated uint32 units = 4;
  // Absent for public reuse; present for a private continuation of these units.
  CacheResume resume = 5;
}

// One scheduler's statistics of the last reporting interval.
message Stats {
  uint32 scheduler = 1;
  // The snapshot (`proto::report::SchedulerStats`, whose documentation states
  // each field's meaning and whether it is an interval delta or a gauge).
  SchedulerStats snapshot = 2;
}

message SchedulerStats {
  uint64 num_running_reqs = 1;
  uint64 num_waiting_reqs = 2;
  uint64 step_counter = 3;
  uint64 current_wave = 4;
  double prefix_cache_usage = 5;
  uint64 num_admitted_reqs = 6;
  uint64 avg_queue_wait_us = 7;
  uint64 queue_wait_us_total = 8;
  uint64 max_queue_wait_us = 9;
  PrefixCacheStats prefix_cache_stats = 10;
  // Absent when no worker counter changed in the interval.
  optional ForwardStats worker_forward_stats = 11;
  uint64 worker_exec_us = 12;
  uint64 batch_roundtrip_us = 13;
  uint64 batch_count = 14;
  uint64 batch_tokens = 15;
  uint64 numerical_faults = 16;
  repeated DomainSchedulerStats domain_stats = 17;
  uint64 calls_without_blocks = 18;
  uint64 imports = 19;
  uint64 failed_imports = 20;
  uint64 imported_blocks = 21;
  uint64 preempted_requests = 22;
  uint64 evicted_blocks = 23;
  uint64 given_up_draft_blocks = 24;
  uint64 steps = 25;
  uint64 policy_calls = 26;
  uint64 policy_fuel = 27;
  // The configuration revision of the step values the scheduler last read.
  uint64 revision = 28;
  uint64 queued_tokens = 29;
  Pages device_pages = 30;
  Pages host_pages = 31;
}

// The pages of one tier of a scheduler's KV cache (`proto::report::Pages`).
message Pages {
  uint64 used = 1;
  uint64 capacity = 2;
}

message PrefixCacheStats {
  uint64 requests = 1;
  uint64 queries = 2;
  uint64 hits = 3;
  uint64 host_hits = 4;
  reserved 5;
  reserved "peer_hits";
  uint64 preempted_requests = 6;
  uint64 preempted_queries = 7;
  uint64 preempted_hits = 8;
}

message DomainSchedulerStats {
  string domain = 1;
  uint64 active_credits = 2;
  uint64 peak_credits = 3;
  uint64 launched_calls = 4;
  uint64 completed_calls = 5;
  uint64 predicated_calls = 6;
  uint64 error_calls = 7;
  uint64 backpressure_events = 8;
  uint64 reclaimed_credits = 9;
  uint64 completed_batches = 10;
  uint64 queue_us = 11;
  uint64 launch_us = 12;
  uint64 device_us = 13;
  uint64 completion_us = 14;
}

message ForwardStats {
  reserved 8;
  map<string, uint64> mode_counts = 1;
  map<string, uint64> mode_tokens = 2;
  map<string, uint64> mode_us = 3;
  repeated StreamTime stream_us = 4;
  repeated BlockingCalls blocking_calls = 5;
  repeated FenceStep fence_seconds = 6;
  uint64 fence_records_lost = 7;
  uint64 attention_launches = 9;
  uint64 attention_us = 10;
  map<string, uint64> attention_backend_counts = 11;
  uint64 cuda_graph_captures = 12;
  uint64 cuda_graph_replays = 13;
  uint64 cuda_graph_misses = 14;
  uint64 cuda_graph_fallbacks = 15;
  uint64 cuda_graph_unpadded_tokens = 16;
  uint64 cuda_graph_padded_tokens = 17;
  map<string, uint64> cuda_graph_runtime_mode_counts = 18;
  uint64 text_decode_token_relay_hits = 19;
  uint64 text_decode_token_relay_misses = 20;
  uint64 text_decode_position_relay_hits = 21;
  uint64 text_decode_position_relay_misses = 22;
  uint64 spec_verify_rows = 23;
  uint64 spec_verify_draft_tokens = 24;
  uint64 spec_verify_accepted_tokens = 25;
  uint64 spec_verify_rejected_tokens = 26;
  uint64 spec_verify_committed_tokens = 27;
  map<string, uint64> spec_verify_path_counts = 28;
  // Each profiling session's progress on the rank, by session.
  map<uint64, ProfileProgress> profile = 29;
  // The operator launches of the rank's serving forwards by operator and descriptor key.
  repeated KernelLaunches kernel_launches = 30;
  // The tokens each routed layer's experts processed, by layer.
  repeated ExpertTokens expert_tokens = 31;
}

// One profiling session's progress on a rank: the steps of its window it
// recorded, the bytes its file grew by, and 1 in the report of its window's
// end.
message ProfileProgress {
  uint64 steps = 1;
  uint64 bytes = 2;
  uint64 windows_ended = 3;
}

// A distribution of observed values (`proto::histogram::Histogram`): their count, sum and
// extremes, and the count of each nonempty bucket by key, a bucket being an interval between
// consecutive powers of 2^(1/8).
message Histogram {
  uint64 count = 1;
  double sum = 2;
  double min = 3;
  double max = 4;
  map<sint64, uint64> buckets = 5;
}

// The device time of one state of one observed stream (`ForwardStats.stream_us`).
message StreamTime {
  string stream = 1;
  string state = 2;
  uint64 us = 3;
}

// The launches of one operator under one descriptor key (`ForwardStats.kernel_launches`).
message KernelLaunches {
  string operator = 1;
  string key = 2;
  uint64 count = 3;
}

// The tokens one routed layer's experts processed (`ForwardStats.expert_tokens`): the layer's
// module path, and the count of each of the model's own experts, in expert order.
message ExpertTokens {
  string layer = 1;
  repeated uint64 tokens = 2;
}

// The driver calls one serving thread made that waited for the device
// (`ForwardStats.blocking_calls`).
message BlockingCalls {
  string thread = 1;
  string call = 2;
  uint64 count = 3;
}

// The fence probes' step durations of one stage and module class, in seconds
// (`ForwardStats.fence_seconds`).
message FenceStep {
  string stage = 1;
  string module = 2;
  Histogram histogram = 3;
}

// ---------------------------------------------------------------- requests

message GenerationRequest {
  reserved 2, 4, 6, 7, 13, 14, 17, 18;
  reserved "negative_prompt_token_ids", "constraint", "image", "max_images",
      "image_generation", "readout", "generated_images", "trajectory";
  repeated uint32 prompt_token_ids = 1;
  repeated ImageInput images = 3;
  SamplingParams sampling = 5;
  uint64 max_und_tokens = 8;
  repeated string stop_strings = 9;
  repeated uint32 stop_token_ids = 10;
  CachePolicy cache = 11;
  bool include_stop_token = 12;
  // The tokens a migrated request generated on the engines that served it
  // before, in order; empty for a new request. They continue its prompt, and
  // the engine counts them as generated: against `max_und_tokens` and
  // `min_tokens`, in its penalties and bad words, and in its usage.
  repeated uint32 generated_token_ids = 15;
  // The LoRA adapter the request computes with: the slot of the workers'
  // adapter pool the daemon loaded it into, or 0 for the base model alone.
  uint32 adapter = 16;
  // The request hands off once its first token is sampled: the engine lends
  // the KV of its prompt and ends it as migratable with the lend
  // (`MIGRATION_CAUSE_HANDOFF`), and the replica the route names for its
  // tokens continues it.
  bool hand_off = 19;
  // The KV of the request's prompt, which a prefill replica lent: the
  // engine imports it into the request's pages, and computes what the
  // import does not bring.
  Lend lend = 20;
}

// The KV of a request's prompt that a prefill replica's engine lent: its
// owner in the buffer pool of its host (`storage::runtime::Lender`).
message Lend {
  // The TCP endpoint of the Storage Server of the lender's host; absent for a
  // server that listens on none.
  optional string endpoint = 1;
  // The lender's session in that server's buffer pool.
  uint32 session = 2;
  // The lent owner.
  uint64 owner = 3;
  // The prefix of the prompt the lent pages hold, in tokens.
  uint32 tokens = 4;
  // The leading pages of the prompt the lender put in the remote store.
  uint32 stored = 5;
}

message ImageInput {
  // The SHA-256 digest of what the image's encoders read of the request
  // (its bytes, a request-dependent preprocessing parameter, its cache
  // partition), which keys their outputs.
  bytes digest = 6;
  // The encoded image file (its JPEG, PNG or other bytes as the request
  // fetched them).
  bytes encoded = 2;
  uint32 position = 3;
  uint32 num_positions = 4;
  repeated ImageEncoderInput encoders = 5;
}

enum ImageEncoder {
  IMAGE_ENCODER_VISION = 0;
  IMAGE_ENCODER_LATENT = 1;
}

message ImageEncoderInput {
  ImageEncoder encoder = 1;
  optional uint32 num_cache_tokens = 2;
  optional uint32 max_cache_tokens = 3;
  // The pixels the encoder's transform resizes the image to, when known
  // before execution: a latent encoder encodes the image at that size.
  optional uint32 height = 4;
  optional uint32 width = 5;
}

message SamplingParams {
  float temperature = 1;
  uint32 top_k = 2;
  float top_p = 3;
  bool ignore_eos = 4;
  optional uint64 seed = 5;
  float min_p = 6;
  float repetition_penalty = 7;
  float frequency_penalty = 8;
  float presence_penalty = 9;
  repeated LogitBias logit_bias = 10;
  uint64 min_tokens = 11;
  bool return_logprobs = 12;
  uint32 n_logprobs = 13;
  bool return_prompt_logprobs = 14;
  uint32 n_prompt_logprobs = 15;
  repeated TokenSequence bad_words_ids = 16;
  // Absent: every token is allowed.
  TokenSequence allowed_token_ids = 17;
  float typical_p = 18;
  repeated uint32 forced_token_ids = 19;
}

message LogitBias {
  uint32 token = 1;
  float bias = 2;
}

message TokenSequence {
  repeated uint32 tokens = 1;
}

message CachePolicy {
  bool read = 1;
  bool write = 2;
  optional uint64 isolation_key = 3;
  // The page seeds (32 bytes each) of the epoch whose state a migrated
  // request continues with (an epoch change's `in_flight = keep`).
  repeated bytes state_seeds = 7;
  reserved 6;
  CacheResume resume = 5;
}

message CacheResume {
  uint64 epoch = 1;
  uint64 request_id = 2;
}

message DiffusionRequest {
  reserved 1;
  repeated uint32 prompt_token_ids = 2;
  // The request's conditions as its model's request processing prepared
  // them: the encoding of a `VideoConditions` message, which the engine
  // carries to its workers without reading and the workers decode.
  bytes conditioning = 3;
  repeated ConditionExtent conditions = 4;
  DiffusionSamplingParams sampling = 5;
  // The request's trajectory identity, preserved across engine migrations;
  // zero for a request no engine stores a trajectory of.
  uint64 trajectory = 6;
  // The stored denoising step; zero starts the trajectory from noise.
  uint32 denoised_steps = 7;
  // The source epoch's latent seed for in_flight=keep across numerics.
  optional uint64 state_seed = 8;
  // The digests of what each encoder computation reads, which key its
  // outputs in the host tier; absent, the engine stores and finds none.
  optional EncoderInputs encoder_inputs = 9;
  // The stored ranks' page locations and numerical layouts, read by engines.
  bytes stored_layout = 10;
}

// What a placed video denoiser serves, as its model family describes it to
// the family's request processing (`EngineInfo.video_denoiser` carries its
// encoding): the tasks it serves, its fixed schedule, the canvases the
// deployment prepared, the references one request may carry and how a
// request's conditions are packed into its rows.
message VideoDenoiser {
  // The names of the tasks it serves, in the family's canonical order.
  repeated string tasks = 1;
  // Sigma points of the fixed schedule, the clean endpoint included: one
  // more than the network evaluations of every request.
  uint32 schedule_points = 2;
  // Shift of the video schedule.
  double video_shift = 3;
  // Shift of the audio schedule.
  double audio_shift = 4;
  // The canvases the deployment serves, in the order the deployment names
  // them; the first is the canvas of a request that states no size.
  repeated ServedCanvas canvases = 5;
  // The references one request may carry.
  ReferenceLimits references = 6;
  // How the denoiser packs a request's conditions into its rows.
  ConditionPacking condition_packing = 7;
}

// A canvas a deployment serves, with the pair its model names it by.
message ServedCanvas {
  // The resolution class in pixels: the canvas's short edge as the model
  // names it.
  uint32 short_edge = 1;
  // The display ratio as `W:H`.
  string aspect_ratio = 2;
  // The raster the pair selects.
  Canvas canvas = 3;
}

// The references one request may carry, of each kind and in all, and the
// largest short edge an image reference is encoded at; zeros for a denoiser
// that takes none.
message ReferenceLimits {
  uint32 images = 1;
  uint32 videos = 2;
  uint32 audios = 3;
  uint32 total = 4;
  uint32 image_short_edge = 5;
}

// How a denoiser lays a request's conditions into its rows: the rows they may
// take, and the tile each condition's rows fill whole.
message ConditionPacking {
  // Rows one request's conditions may take; zero for a denoiser that takes
  // none.
  uint32 capacity = 1;
  // Rows of one tile, at least one.
  uint32 tile_rows = 2;
  // Tokens of one video tile along time, height and width, each at least
  // one.
  repeated uint32 video_tile = 3;
}

// The conditions of a video request (`proto::video::Conditions`): each
// condition in request order, the prompt tokens the text encoder encodes and
// the prompt rows each block of vision content occupies.
message VideoConditions {
  repeated VideoCondition conditions = 1;
  uint32 prompt_tokens = 2;
  repeated VisionSpan vision_spans = 3;
}

// The prompt rows `[first, first + rows)` one block of vision content
// occupies.
message VisionSpan {
  uint32 first = 1;
  uint32 rows = 2;
}

// One condition of a video request, as its model planned it.
message VideoCondition {
  ConditionRole role = 1;
  reserved 2;
  // The length of the condition's fetched media, which travel beside the
  // request (`ToEngine.submit`).
  uint64 bytes = 9;
  // What the media reader decodes them into.
  oneof media {
    ImageFit image = 3;
    VideoReference video = 4;
    AudioClip audio = 5;
  }
  // What the conditioner reads, for a condition it reads.
  optional ConditionVision vision = 6;
  // Denoiser rows each temporal unit of the condition's pixels encodes to.
  repeated uint32 latent_units = 7;
  // Denoiser audio rows of the condition's audio track.
  uint32 audio_rows = 8;
}

enum ConditionRole {
  // States no role: refused.
  CONDITION_ROLE_UNSPECIFIED = 0;
  CONDITION_ROLE_FIRST_FRAME = 1;
  CONDITION_ROLE_LAST_FRAME = 2;
  CONDITION_ROLE_REFERENCE = 3;
}


message Canvas {
  uint32 width = 1;
  uint32 height = 2;
}

// A still image resized to `resized`, then the `size` window at
// (`left`, `top`) kept.
message ImageFit {
  Canvas resized = 1;
  uint32 left = 2;
  uint32 top = 3;
  Canvas size = 4;
}

message VideoClip {
  Canvas canvas = 1;
  uint32 start_frame = 2;
  uint32 frames = 3;
  uint32 vae_frames = 4;
}

message AudioClip {
  uint32 sample_rate = 1;
  uint64 start_sample = 2;
  uint64 source_samples = 3;
  uint64 samples = 4;
}

// A reference video and, when the request conditions on it, its soundtrack.
message VideoReference {
  VideoClip clip = 1;
  optional AudioClip soundtrack = 2;
}

message ConditionVision {
  VisionGrid grid = 1;
  uint32 tokens = 2;
  repeated uint32 frame_indices = 3;
}

message VisionGrid {
  uint32 t = 1;
  uint32 h = 2;
  uint32 w = 3;
}

// The SHA-256 digests of what each encoder computation of a video request
// reads, which the daemon computes from the request's facts.
message EncoderInputs {
  // The text encoding's.
  bytes text = 1;
  // The vision encoding's; absent without a vision block.
  optional bytes vision = 2;
  // Each visual condition unit's, in encoding order.
  repeated bytes video_units = 3;
  // The audio encoding's; absent without an audio track.
  optional bytes audio = 4;
}

message ConditionExtent {
  uint64 pixel_bytes = 1;
  uint64 audio_samples = 2;
  uint64 vision_patches = 3;
  uint32 vision_tokens = 4;
  repeated uint32 latent_units = 5;
  uint32 audio_rows = 6;
}

message DiffusionSamplingParams {
  uint32 num_frames = 1;
  uint32 video_units = 2;
  uint64 seed = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint32 condition_rows = 6;
}

// ------------------------------------------------------------------ events

message Event {
  reserved 4, 7, 8, 9, 10, 11, 19;
  reserved "text_tokens", "readout", "image_begin", "image_step", "image_commit",
      "image_done", "control_token";
  uint64 request = 1;
  oneof kind {
    Scheduled scheduled = 2;
    TextToken text_token = 3;
    TokenLogprobs token_logprobs = 5;
    PromptLogprobs prompt_logprobs = 6;
    MediaProgress media_progress = 12;
    Artifact artifact = 13;
    ArtifactUnavailable artifact_unavailable = 14;
    Finished finished = 15;
    Rejected rejected = 16;
    Failed error = 17;
    Migratable migratable = 18;
  }
}

// The request ends on this engine without finishing: every token it
// generated here has been sent, and the daemon may submit it again, with
// those tokens or the trajectory steps the engine stored, to the engine that
// serves next. A terminal event.
message Migratable {
  MigrationCause cause = 1;
  // For a video request, the denoising steps of its trajectory the engine
  // stored in its host latent pools at the step boundary it was preempted
  // at, which the daemon submits it again with; zero when it stored none.
  uint32 denoised_steps = 2;
  // With stored steps, where the engine put the trajectory's pages and how
  // each stored rank laid its part out (`DiffusionRequest.stored_layout`).
  bytes stored_layout = 3;
  // For a handoff, the KV of the request's prompt the engine lent.
  Lend lend = 4;
}

enum MigrationCause {
  // The engine drains for a hot update.
  MIGRATION_CAUSE_DRAIN = 0;
  // The workers that held the request were lost.
  MIGRATION_CAUSE_LOSS = 1;
  // A crossing of a product of the request between processes failed. Its
  // groups serve on, and a video request's trajectory is stored; the
  // engine does not try the copy again, and the daemon counts the migration
  // against the request's limit as it counts a loss, since the request's
  // next attempt may take the same path.
  MIGRATION_CAUSE_TRANSFER = 2;
  // The request's prompt is computed and its first token sampled on a
  // prefill replica, which lent its KV: it continues on the replica its
  // route names for its tokens. Not counted against the request's limit.
  MIGRATION_CAUSE_HANDOFF = 3;
}

message Scheduled {
  double queued_at = 1;
  double scheduled_at = 2;
  // The prompt tokens the admission's prefix hit found cached, over every
  // tier: the scheduler's `num_cached_tokens` once the hit is final.
  uint64 cached_tokens = 3;
}

message TextToken {
  uint32 id = 1;
  optional float logprob = 2;
}

message TokenLogprob {
  uint32 token_id = 1;
  float logprob = 2;
  uint32 rank = 3;
}

message TokenLogprobs {
  uint32 id = 1;
  repeated TokenLogprob candidates = 2;
}

message PositionLogprobs {
  repeated TokenLogprob entries = 1;
}

message PromptLogprobs {
  repeated PositionLogprobs positions = 1;
}

message MediaProgress {
  string phase = 1;
  uint32 completed_steps = 2;
}

// A generated artifact: its bytes are the shared memory whose descriptor
// travels with this frame, `bytes` long.
message Artifact {
  MediaKind media_kind = 1;
  string content_type = 2;
  uint64 bytes = 3;
}

// One bounded part (`proto::media::PART_BYTES`) of a medium transferred
// between hosts: a request's condition or an artifact. Every part states the
// medium's complete length, and the frame that follows the last part states
// the medium.
message MediaPart {
  uint64 size = 1;
  bytes data = 2;
}

enum MediaKind {
  MEDIA_KIND_IMAGE = 0;
  MEDIA_KIND_VIDEO = 1;
  MEDIA_KIND_AUDIO = 2;
}

message ArtifactUnavailable {
  string message = 1;
}

message Finished {
  FinishReason reason = 1;
  StopReason stop_reason = 2;
  uint64 prompt_tokens = 3;
  uint64 completion_tokens = 4;
  reserved 5;
  reserved "images";
}

enum FinishReason {
  FINISH_REASON_COMPLETED = 0;
  FINISH_REASON_EOS = 1;
  FINISH_REASON_MAX_TOKENS = 2;
  FINISH_REASON_STOP = 3;
  reserved 4;
  reserved "FINISH_REASON_IMAGE_DONE";
  FINISH_REASON_CANCELLED = 5;
  FINISH_REASON_ABORTED = 6;
  FINISH_REASON_REPETITION = 7;
  FINISH_REASON_ERROR = 8;
  FINISH_REASON_CACHE_CAPACITY = 9;
}

message StopReason {
  oneof kind {
    uint32 token = 1;
    string text = 2;
  }
}

message Rejected {
  RejectionKind kind = 1;
  string message = 2;
}

enum RejectionKind {
  REJECTION_KIND_INVALID = 0;
  REJECTION_KIND_OVERLOADED = 1;
  // The scheduler's role takes no such request: the leader routes it again.
  REJECTION_KIND_ROLE = 2;
}

message Failed {
  string message = 1;
}

// ------------------------------------------------------------ limits

message GenerationLimits {
  reserved 4, 5, 6, 7, 10, 13, 14;
  reserved "image_generation", "token_denoising", "max_latent_units", "latent_downsample",
      "latent_bytes_per_unit", "commit_marker_tokens", "max_cfg_branches";
  bool understanding = 1;
  bool vision_encode = 2;
  bool latent_encode = 3;
  uint32 max_vae_grid_tokens = 8;
  uint32 max_vit_grid_tokens = 9;
  uint64 max_latent_feature_bytes = 11;
  uint64 max_vision_feature_bytes = 12;
  uint32 encoder_cache_entries = 15;
  uint32 max_logprobs = 16;
}

// ---------------------------------------------------------------- handover

// What an engine process takes over from the one it succeeds on the same
// devices, which the daemon states in its launch file.

// Logical expert IDs in global physical-slot order for one numerical layer.
message ExpertOrder {
  repeated uint32 experts = 1;
}

// The engine an engine started beside it succeeds: a switch's target or a
// standby, which parks once it is ready and serves when it is promoted. It
// maps nothing of its predecessor: both open sessions with the host's buffer
// pool, which keeps them from writing one block.
message Predecessor {
  // The epoch the predecessor executes.
  uint64 epoch = 1;
  reserved 2;
}
