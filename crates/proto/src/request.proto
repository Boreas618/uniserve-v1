// The request interface: what the leader daemon submits to an engine process
// and the events it receives back.
//
// The leader daemon starts each engine process, which connects to the
// daemon's request socket (a Unix socket on the leader) and says hello. The
// daemon answers with the engine's specification: everything it is to serve
// and how. The engine starts its workers, then reports its state, and from
// then on the connection carries the daemon's submissions and commands and
// the engine's events. Every request has the identity the daemon gave it;
// each of its events names it.
//
// A request's generated media (images inline, videos by descriptor) reaches
// the daemon with its events: an `Artifact` event passes the shared memory
// holding the bytes as a file descriptor beside its frame.
//
// The interface is versioned across builds: a persistent daemon serves
// engines of successive builds. Messages change only by additions; the hello
// exchange compares major versions.

syntax = "proto3";

package uniserve.request;

// The first message on a connection, from the engine process.
message Hello {
  uint32 major = 1;
  uint32 minor = 2;
  string build = 3;
  // The identity the daemon started the engine process under.
  uint64 engine = 4;
}

// The answer to a `Hello`.
message Welcome {
  uint32 major = 1;
  uint32 minor = 2;
  string build = 3;
  // Why the engine is refused; empty when it is accepted.
  string refusal = 4;
  // What the engine is to serve and how.
  EngineSpec spec = 5;
}

// What travels from the engine process after the welcome.
message FromEngine {
  oneof kind {
    State state = 1;
    Accepted accepted = 2;
    Event event = 3;
    Stats stats = 4;
    Hooked hooked = 5;
    Configured configured = 6;
    Parked parked = 7;
    CacheDescribed cache_described = 8;
  }
}

// What travels to the engine process after the welcome.
message ToEngine {
  oneof kind {
    Submit submit = 1;
    Command command = 2;
    EngineCommand engine = 3;
  }
}

// The engine's state changes.
message State {
  EngineState state = 1;
  // What the engine serves, once it is ready.
  EngineInfo info = 2;
  // Why the engine failed, when it did.
  string error = 3;
}

enum EngineState {
  ENGINE_STATE_UNSPECIFIED = 0;
  // Starting its workers.
  ENGINE_STATE_STARTING = 1;
  // Serving requests.
  ENGINE_STATE_READY = 2;
  // Its start failed or its workers are lost; it serves nothing more.
  ENGINE_STATE_FAILED = 3;
  reserved 4;
  reserved "ENGINE_STATE_DRAINING";
  // Prepared: an engine that succeeds a serving one loaded its workers,
  // mapped what it shares with its predecessor read-only, warmed up and
  // captured its graphs; it executes nothing until promoted.
  ENGINE_STATE_STANDBY = 5;
  // Parked: it preempted every request at a step boundary and executes
  // nothing; it keeps its workers, memory and prefix cache index until it
  // resumes or shuts down.
  ENGINE_STATE_PARKED = 6;
}

// What a ready engine serves.
message EngineInfo {
  // The limits every request is checked against, resolved against the
  // workers' capacities.
  GenerationLimits limits = 1;
  // The video denoiser as its model family describes it
  // (`models::video::DenoiserInfo`, JSON); empty when the engine generates
  // no video.
  bytes video_denoiser = 2;
  // Condition units one latent encoding call covers at once; zero when no
  // worker encodes latents.
  uint32 latent_encoding_units = 3;
  // The engine's schedulers, one per DP rank.
  uint32 schedulers = 4;
  reserved 5;
  reserved "cache_units";
  // The largest scheduling limits the workers were started for: the
  // schedulers take any limits within them in place (`Configure`).
  BatchCapacity capacity = 6;
  // The KV cache segments of each worker group, which an engine that
  // succeeds this one on the same devices maps.
  repeated CacheSegments segments = 7;
  // The root of the prefix hash chains of the pages the engine's workers
  // compute: equal between worlds whose models and numerics agree, whose
  // pages a successor reuses.
  uint64 prefix_seed = 8;
  // The seed of the keys of the latent trajectories the engine's video
  // denoiser stores at preemption: equal between worlds whose denoising
  // computes the same, which continue each other's trajectories exactly;
  // zero for an engine without a video denoiser.
  uint64 latent_seed = 9;
}

// The batch an engine's workers were started for.
message BatchCapacity {
  // Calls one step forms; zero when the workers bound none.
  uint32 max_batch = 1;
  // Tokens one step forms.
  uint64 max_num_batched_tokens = 2;
  // Requests running at once.
  uint32 max_running_requests = 3;
}

// The segments of one worker group's KV cache planes, in plane order: each
// an allocation of whole units that a world created, which the world that
// holds the planes gives back or creates again as a whole.
message CacheSegments {
  string worker_group = 1;
  repeated CacheSegment segments = 2;
  // The segments the group holds, `[0, held)`; those after were given back.
  uint32 held = 3;
  // The units of the group's planes, those of the segments given back
  // included.
  uint32 units = 4;
  // The units `1..=scratch` the group's warmup lent.
  uint32 scratch = 5;
}

message CacheSegment {
  // The world that created the segment's memory.
  uint64 world = 1;
  // The segment's ordinal among those its world created.
  uint32 ordinal = 2;
  // The cache units the segment holds.
  uint32 units = 3;
}

// Requests submitted together: the engine queues every one of them before it
// forms its next batch.
message Submit {
  repeated Request requests = 1;
}

// The engine took a submitted request: it passed the engine's checks and is
// queued on one of its schedulers. A request it refuses ends with a
// `Rejected` event instead.
message Accepted {
  uint64 request = 1;
  // The scheduler that serves it.
  uint32 scheduler = 2;
}

message Request {
  // The daemon's identity of the request.
  uint64 id = 1;
  int32 priority = 2;
  oneof kind {
    GenerationRequest generation = 3;
    DiffusionRequest diffusion = 4;
  }
}

// A command for one request.
message Command {
  uint64 request = 1;
  oneof kind {
    // The client went away: the request ends as cancelled.
    Cancel cancel = 2;
    // The daemon's decoder matched a stop string: the request ends as
    // stopped.
    StopRequest stop = 3;
    // The daemon's decoder found that this many public tokens complete no
    // stop string.
    Acknowledge acknowledge = 4;
    // The daemon ends the request at once.
    Abort abort = 5;
    // The daemon's consumer took this many of the request's events in all.
    // The engine sends a request at most `EVENT_WINDOW` events beyond what
    // its consumer took, so a slow consumer holds its request's output
    // back in the engine, whose scheduler then stalls the request.
    Consumed consumed = 6;
  }
}

message Cancel {}
message StopRequest {}
message Acknowledge {
  uint64 output_tokens = 1;
}
message Abort {}
message Consumed {
  uint64 events = 1;
}

// A command for the whole engine.
message EngineCommand {
  reserved 2;
  reserved "drain";
  oneof kind {
    // Finish every request as aborted, close the workers and exit.
    Shutdown shutdown = 1;
    // A prepared engine imports its predecessor's prefix cache index and
    // serves.
    Promote promote = 3;
    // Revoke every cached prefix page; requests in flight keep theirs.
    FlushCache flush_cache = 4;
    // Run a worker hook on every worker; answered with `Hooked`.
    Hook hook = 5;
    // Take other scheduling limits and policy from each scheduler's next
    // step; answered with `Configured`.
    Configure configure = 6;
    // Connect to another daemon beside the ones the engine serves, as a hot
    // restart of the daemon starts its successor: the engine says hello to
    // it as itself, reports itself ready there, and serves both, each its
    // own requests, until the last closes its connection.
    Attach attach = 7;
    // Give back or restore KV cache memory on every scheduler; answered
    // with `Hooked`.
    ResizeCache resize_cache = 8;
    // Rewrite the weights in place from another checkpoint of the same
    // model, once no request runs; answered with `Hooked`.
    UpdateWeights update_weights = 9;
    // Preempt every request at the next step boundary and execute nothing
    // more; answered with `Parked`.
    Park park = 10;
    // A parked engine executes and admits again; answered with `Hooked`.
    Resume resume = 11;
    // Report the KV cache segments every worker group holds now; answered
    // with `CacheDescribed`.
    DescribeCache describe_cache = 13;
    // The trial of a promoted engine ended: its predecessor is gone, so its
    // workers take the predecessor's memory they mapped read-only, and a
    // lost worker group is relaunched from then on; answered with `Hooked`.
    Commit commit = 12;
    // Read the memory ledgers every node's Storage Server keeps for the
    // deployment, each node's daemon over its claim, without asking a
    // worker; answered with `Hooked`, one JSON result per node.
    DescribeMemory describe_memory = 14;
    // Halve, or restore, the byte budgets of the links the deployment's
    // transfers use at every node's Transfer Server, each node's daemon over
    // its claim; answered with `Hooked`.
    ThrottleTransfers throttle_transfers = 15;
  }
}

message DescribeMemory {
  // Matches the `Hooked` answer.
  uint64 id = 1;
}

// A halving takes every link a task of the deployment copies over now, a
// restoration (`halve` false) every link a halving reduced, which then grows
// back gradually.
message ThrottleTransfers {
  // Matches the `Hooked` answer.
  uint64 id = 1;
  bool halve = 2;
}

// A worker hook (`uniserve.hooks`), which a plugin implements.
message Hook {
  // Matches the `Hooked` answer.
  uint64 id = 1;
  string name = 2;
  // A JSON value.
  string payload = 3;
}

// The answer to a `Hook`: each worker's JSON result, or why it failed.
message Hooked {
  uint64 id = 1;
  repeated string results = 2;
  // Empty when every worker ran the hook.
  string error = 3;
}

// Scheduling limits and policy for every scheduler of a serving engine,
// within the batch its workers were started for.
message Configure {
  // Matches the `Configured` answer.
  uint64 id = 1;
  Scheduling scheduling = 2;
}

// The answer to a `Configure`.
message Configured {
  uint64 id = 1;
  // Empty when every scheduler took the limits.
  string error = 2;
}

// An in-place weight update: every worker rewrites its weights from the
// checkpoint at `model_path`, which loads the same tensors.
message UpdateWeights {
  // Matches the `Hooked` answer.
  uint64 id = 1;
  string model_path = 2;
  WeightsInFlight in_flight = 3;
}

// How the requests in flight continue through an in-place weight update.
enum WeightsInFlight {
  // Each continues on the new weights with the KV cache it reached; the
  // pages it writes afterwards reach no shared tier.
  WEIGHTS_IN_FLIGHT_KEEP = 0;
  // Each computes its state again with the new weights.
  WEIGHTS_IN_FLIGHT_RECOMPUTE = 1;
  // Each ends, aborted, as do the requests the engine queued.
  WEIGHTS_IN_FLIGHT_ABORT = 2;
}

// A change to the device memory of every scheduler's KV cache.
message ResizeCache {
  // Matches the `Hooked` answer.
  uint64 id = 1;
  CacheChange change = 2;
  // For a shrink: how long the requests that hold the tail may run on
  // before they are recomputed; absent to let them run to their end.
  optional uint64 preempt_after_ms = 3;
  // Before the change: worlds of the deployment that keep their weights
  // alone on every node (a previous world kept as its weights, whose
  // processes exited), so that a growth takes the rest of their memory.
  repeated uint64 keep_weights = 4;
  // For a shrink or a plan, what the world that succeeds this one adds: it
  // loads its weights from the model's files (their keys differ), and it
  // maps none of this world's KV cache, so the requests in flight compute
  // their state in units of its own.
  bool successor_loads_weights = 5;
  bool successor_recomputes_cache = 6;
  // For a shrink or a plan: the successor's graph policy captures graphs,
  // so its warmup takes a graph share where its model can be captured.
  bool successor_captures_graphs = 8;
  // With `keep_weights`: the worlds keep their weights in host memory
  // (`update_config.previous_world = "host"`), which moves the weights each
  // world alone retains there through every node's Transfer Server; a node
  // that cannot keeps them on its GPUs. The `Hooked` answer then carries
  // each node's report first, as JSON `{"kept": {"host", "released",
  // "moved_bytes", "refused"}}`, `refused` saying why a node kept the
  // weights on its GPUs.
  bool keep_in_host_memory = 7;
  // For a make-room change: the device bytes each device's storage ledger
  // must have room for beside everything it books.
  uint64 room_bytes = 9;
}

enum CacheChange {
  // Give back the tail of the KV cache until each device has the memory a
  // world succeeding this one needs beside the memory they share: the
  // requests that hold the tail run on, and are recomputed only past the
  // shrink's `preempt_after_ms`.
  CACHE_CHANGE_SHRINK = 0;
  // Create the given-back tail again.
  CACHE_CHANGE_RESTORE = 1;
  // Give back the whole KV cache and the CUDA graph memory, keeping the
  // weights, once no request runs.
  CACHE_CHANGE_SLEEP = 2;
  // Restore what a sleep gave back.
  CACHE_CHANGE_WAKE = 3;
  // Create as many of the segments given back as each device's memory
  // ledger has room for: a successor world's cache grows as its
  // predecessor's memory frees.
  CACHE_CHANGE_GROW = 4;
  // Change nothing: answer, for each device, with the memory the serving
  // world and a world succeeding it hold there and the KV cache limit that
  // leaves the serving world, or fail with why such a world does not fit.
  CACHE_CHANGE_PLAN = 5;
  // For a parked world whose successor maps none of its cache: give back
  // every segment past the first, once the idle cached pages they hold
  // reached the host KV cache (verified there, or copied there again), so
  // that the successor's cache grows into them. Answered with the segments
  // and bytes evicted; a resume creates them again.
  CACHE_CHANGE_EVICT = 6;
  // Give back the tail of the KV cache until each device's storage ledger
  // has room for `room_bytes` (a profiling session's device storage): the
  // requests that hold the tail run on. Fails, changing nothing, when even
  // the segments the cache cannot give back leave too little room.
  CACHE_CHANGE_MAKE_ROOM = 7;
}

// Where the daemon an engine attaches to listens.
message Attach {
  // The daemon's request socket, `unix:<path>`.
  string requests = 1;
}

message Shutdown {}
message FlushCache {}

// The promotion of a prepared engine.
message Promote {
  // The prefix cache index of the parked predecessor, by worker group,
  // whose pages the promoted engine reads from the predecessor's segments
  // it maps read-only; empty for an engine without a predecessor.
  repeated GroupIndex index = 1;
  // Whether the requests the predecessor hands over compute their state
  // again from their tokens: the promoted engine computes other numerics,
  // and the change recomputes them (`in_flight = recompute`).
  bool recompute = 2;
  // Whether the predecessor's memory frees once the engine is promoted
  // (its processes exit), so that the cache grows into it at once and the
  // requests it hands over wait for that rather than for a commit.
  bool grows = 3;
}

// A request to park the engine.
message Park {
  // Matches the `Parked` answer.
  uint64 id = 1;
}

// The answer to a `Park`: every request ended as migratable, or why the
// engine did not park.
message Parked {
  uint64 id = 1;
  // Empty when the engine parked.
  string error = 2;
  // The pages the engine's prefix cache index publishes, by worker group,
  // which its successor reads from the segments it maps.
  repeated GroupIndex index = 3;
}

// A request to resume a parked engine.
message Resume {
  // Matches the `Hooked` answer.
  uint64 id = 1;
  // Worlds whose memory ends on every node of the engine: the one a
  // rollback discarded.
  repeated uint64 retire = 2;
}

// The end of a promoted engine's trial.
message Commit {
  // Matches the `Hooked` answer.
  uint64 id = 1;
  // Worlds whose memory ends on every node of the engine: the predecessor,
  // whose processes are gone.
  repeated uint64 retire = 2;
  // The committed world computes other numerics than its predecessor
  // (another root of its pages' keys): every node's host KV cache discards
  // the pages it did not publish, which it never hits.
  bool discard_pages = 3;
}

// A request for the engine's KV cache segments.
message DescribeCache {
  // Matches the `CacheDescribed` answer.
  uint64 id = 1;
}

// The answer to a `DescribeCache`.
message CacheDescribed {
  uint64 id = 1;
  // Empty when every worker group reported.
  string error = 2;
  repeated CacheSegments segments = 3;
}

// The published pages of one worker group's prefix cache.
message GroupIndex {
  string worker_group = 1;
  repeated IndexedPage pages = 2;
  // The cache units the requests the scheduler ended as migratable held,
  // and how many requests they were.
  uint32 held_units = 3;
  uint32 requests = 4;
}

// One published page: its cache group, its chained hash, its tokens and its
// units in the planes of the engine that published it.
message IndexedPage {
  uint32 group = 1;
  uint64 hash = 2;
  repeated uint32 tokens = 3;
  repeated uint32 units = 4;
}

// One scheduler's statistics of the last reporting interval.
message Stats {
  uint32 scheduler = 1;
  // The snapshot (`proto::report::SchedulerStats`), JSON: observability data
  // whose fields evolve with every build, each with a default.
  bytes snapshot = 2;
}

// ---------------------------------------------------------------- requests

message GenerationRequest {
  repeated uint32 prompt_token_ids = 1;
  repeated uint32 negative_prompt_token_ids = 2;
  repeated ImageInput images = 3;
  GenerationConstraint constraint = 4;
  SamplingParams sampling = 5;
  ImageParams image = 6;
  uint32 max_images = 7;
  uint64 max_und_tokens = 8;
  repeated string stop_strings = 9;
  repeated uint32 stop_token_ids = 10;
  CachePolicy cache = 11;
  bool include_stop_token = 12;
  ImageGenerationConfig image_generation = 13;
  repeated ReadoutRow readout = 14;
  // The tokens a migrated request generated on the engines that served it
  // before, in order; empty for a new request. They continue its prompt, and
  // the engine counts them as generated: against `max_und_tokens` and
  // `min_tokens`, in its penalties and bad words, and in its usage.
  repeated uint32 generated_token_ids = 15;
  // The LoRA adapter the request computes with: the slot of the workers'
  // adapter pool the daemon loaded it into, or 0 for the base model alone.
  uint32 adapter = 16;
}

enum GenerationConstraint {
  GENERATION_CONSTRAINT_DEFAULT = 0;
  GENERATION_CONSTRAINT_UND_ONLY = 1;
  GENERATION_CONSTRAINT_GEN_ONLY = 2;
}

message ImageInput {
  uint64 hash = 1;
  // The encoded image, base64.
  string b64 = 2;
  uint32 position = 3;
  uint32 num_positions = 4;
  repeated ImageEncoderInput encoders = 5;
}

enum ImageEncoder {
  IMAGE_ENCODER_VISION = 0;
  IMAGE_ENCODER_LATENT = 1;
}

message ImageEncoderInput {
  ImageEncoder encoder = 1;
  optional uint32 num_cache_tokens = 2;
  optional uint32 max_cache_tokens = 3;
  // The pixels the encoder's transform resizes the image to, when known
  // before execution: a latent encoder encodes the image at that size.
  optional uint32 height = 4;
  optional uint32 width = 5;
}

message SamplingParams {
  float temperature = 1;
  uint32 top_k = 2;
  float top_p = 3;
  bool ignore_eos = 4;
  optional uint64 seed = 5;
  float min_p = 6;
  float repetition_penalty = 7;
  float frequency_penalty = 8;
  float presence_penalty = 9;
  repeated LogitBias logit_bias = 10;
  uint64 min_tokens = 11;
  bool return_logprobs = 12;
  uint32 n_logprobs = 13;
  bool return_prompt_logprobs = 14;
  uint32 n_prompt_logprobs = 15;
  repeated TokenSequence bad_words_ids = 16;
  // Absent: every token is allowed.
  TokenSequence allowed_token_ids = 17;
  float typical_p = 18;
  repeated uint32 forced_token_ids = 19;
}

message LogitBias {
  uint32 token = 1;
  float bias = 2;
}

message TokenSequence {
  repeated uint32 tokens = 1;
}

message ImageParams {
  uint32 steps = 1;
  float cfg_text_scale = 2;
  float cfg_img_scale = 3;
  CfgRenorm cfg_renorm_type = 4;
  float cfg_renorm_min = 5;
  float cfg_interval_start = 6;
  float cfg_interval_end = 7;
  float timestep_shift = 8;
  uint32 height = 9;
  uint32 width = 10;
  optional uint64 seed = 11;
}

enum CfgRenorm {
  CFG_RENORM_GLOBAL = 0;
  CFG_RENORM_NONE = 1;
  CFG_RENORM_TEXT_CHANNEL = 2;
}

message CachePolicy {
  bool read = 1;
  bool write = 2;
  optional uint64 isolation_key = 3;
  // The prefix seed of the world whose state a migrated request continues
  // with (a world change's `in_flight = keep`).
  optional uint64 state_seed = 4;
}

message ImageGenerationConfig {
  ImageTrigger trigger = 1;
  bool requires_text_for_image = 2;
  FeedbackSource feedback_source = 3;
  repeated ImageEncoderInput feedback_encoders = 4;
  uint32 num_feedback_positions = 5;
  FeedbackNextToken feedback_next_token = 6;
  bool sample_feedback_continuation = 7;
}

message ImageTrigger {
  oneof kind {
    Disabled disabled = 1;
    uint32 token = 2;
    TokenSequence suffix = 3;
    RoundCloseThenSuffix round_close_then_suffix = 4;
  }
}

message Disabled {}

message RoundCloseThenSuffix {
  repeated uint32 close_token_ids = 1;
  repeated uint32 trigger_token_ids = 2;
}

enum FeedbackSource {
  FEEDBACK_SOURCE_NONE = 0;
  FEEDBACK_SOURCE_DEVICE_PRODUCT = 1;
  FEEDBACK_SOURCE_ARTIFACT_PRODUCT = 2;
}

message FeedbackNextToken {
  oneof kind {
    Disabled none = 1;
    Disabled bos = 2;
    Disabled end_of_image = 3;
    uint32 token = 4;
  }
}

message ReadoutRow {
  repeated uint32 token_ids = 1;
  repeated ReadoutSlot slots = 2;
}

message ReadoutSlot {
  uint32 position = 1;
  repeated uint32 candidates = 2;
}

message DiffusionRequest {
  string task = 1;
  repeated uint32 prompt_token_ids = 2;
  bytes conditioning = 3;
  repeated ConditionExtent conditions = 4;
  DiffusionSamplingParams sampling = 5;
  // The identity of the request's latent trajectory, which keys the
  // trajectory an engine stores when it preempts the request: the daemon
  // gives a request one when it first submits it and keeps it across its
  // migrations.
  uint64 trajectory = 6;
  // The denoising steps of the trajectory an engine stored when it
  // preempted the request; zero for a request that starts from noise. The
  // engine that serves it continues from that step when its store holds
  // the trajectory, and from noise otherwise.
  uint32 denoised_steps = 7;
  // The latent seed of the world whose stored trajectory the request
  // continues although the serving world's denoising computes other
  // numerics (a world change's `in_flight = keep`); absent, the engine reads
  // a trajectory of its own latent seed only.
  optional uint64 state_seed = 8;
}

message ConditionExtent {
  uint64 pixel_bytes = 1;
  uint64 audio_samples = 2;
  uint64 vision_patches = 3;
  uint32 vision_tokens = 4;
  repeated uint32 latent_units = 5;
  uint32 audio_rows = 6;
}

message DiffusionSamplingParams {
  uint32 num_frames = 1;
  uint32 video_units = 2;
  uint64 seed = 3;
  uint32 width = 4;
  uint32 height = 5;
}

// ------------------------------------------------------------------ events

message Event {
  uint64 request = 1;
  oneof kind {
    Scheduled scheduled = 2;
    TextToken text_token = 3;
    TextTokens text_tokens = 4;
    TokenLogprobs token_logprobs = 5;
    PromptLogprobs prompt_logprobs = 6;
    Readout readout = 7;
    ImageBegin image_begin = 8;
    ImageStep image_step = 9;
    ImageCommit image_commit = 10;
    ImageDone image_done = 11;
    MediaProgress media_progress = 12;
    Artifact artifact = 13;
    ArtifactUnavailable artifact_unavailable = 14;
    Finished finished = 15;
    Rejected rejected = 16;
    Failed error = 17;
    Migratable migratable = 18;
  }
}

// The request ends on this engine without finishing: every token it
// generated here has been sent, and the daemon may submit it again, with
// those tokens or the trajectory steps the engine stored, to the engine that
// serves next. A terminal event.
message Migratable {
  MigrationCause cause = 1;
  // For a video request, the denoising steps of its trajectory the engine
  // stored in its host latent pools at the step boundary it was preempted
  // at, which the daemon submits it again with; zero when it stored none.
  uint32 denoised_steps = 2;
}

enum MigrationCause {
  // The engine drains for a hot update.
  MIGRATION_CAUSE_DRAIN = 0;
  // The workers that held the request were lost.
  MIGRATION_CAUSE_LOSS = 1;
}

message Scheduled {
  double queued_at = 1;
  double scheduled_at = 2;
}

message TextToken {
  uint32 id = 1;
  optional float logprob = 2;
}

message TextTokens {
  repeated uint32 ids = 1;
}

message TokenLogprob {
  uint32 token_id = 1;
  float logprob = 2;
  uint32 rank = 3;
}

message TokenLogprobs {
  uint32 id = 1;
  repeated TokenLogprob candidates = 2;
}

message PositionLogprobs {
  repeated TokenLogprob entries = 1;
}

message PromptLogprobs {
  repeated PositionLogprobs positions = 1;
}

message Readout {
  repeated float candidate_logprobs = 1;
}

message ImageBegin {
  uint32 image_id = 1;
  uint32 height = 2;
  uint32 width = 3;
  uint32 steps = 4;
}

message ImageStep {
  uint32 image_id = 1;
  uint32 step = 2;
}

message ImageCommit {
  uint32 image_id = 1;
}

message ImageDone {
  uint32 image_id = 1;
  uint32 height = 2;
  uint32 width = 3;
  uint64 bytes = 4;
  // The PNG payload, base64.
  string png_b64 = 5;
}

message MediaProgress {
  string phase = 1;
  uint32 completed_steps = 2;
}

// A generated artifact: its bytes are the shared memory whose descriptor
// travels with this frame, `bytes` long.
message Artifact {
  MediaKind media_kind = 1;
  string content_type = 2;
  uint64 bytes = 3;
}

enum MediaKind {
  MEDIA_KIND_IMAGE = 0;
  MEDIA_KIND_VIDEO = 1;
  MEDIA_KIND_AUDIO = 2;
}

message ArtifactUnavailable {
  string message = 1;
}

message Finished {
  FinishReason reason = 1;
  StopReason stop_reason = 2;
  uint64 prompt_tokens = 3;
  uint64 completion_tokens = 4;
  uint64 images = 5;
}

enum FinishReason {
  FINISH_REASON_COMPLETED = 0;
  FINISH_REASON_EOS = 1;
  FINISH_REASON_MAX_TOKENS = 2;
  FINISH_REASON_STOP = 3;
  FINISH_REASON_IMAGE_DONE = 4;
  FINISH_REASON_CANCELLED = 5;
  FINISH_REASON_ABORTED = 6;
  FINISH_REASON_REPETITION = 7;
  FINISH_REASON_ERROR = 8;
}

message StopReason {
  oneof kind {
    uint32 token = 1;
    string text = 2;
  }
}

message Rejected {
  RejectionKind kind = 1;
  string message = 2;
}

enum RejectionKind {
  REJECTION_KIND_INVALID = 0;
  REJECTION_KIND_OVERLOADED = 1;
}

message Failed {
  string message = 1;
}

// ------------------------------------------------------------ limits

message GenerationLimits {
  bool understanding = 1;
  bool vision_encode = 2;
  bool latent_encode = 3;
  bool image_generation = 4;
  bool token_denoising = 5;
  uint64 max_latent_units = 6;
  uint32 latent_downsample = 7;
  uint32 max_vae_grid_tokens = 8;
  uint32 max_vit_grid_tokens = 9;
  uint64 latent_bytes_per_unit = 10;
  uint64 max_latent_feature_bytes = 11;
  uint64 max_vision_feature_bytes = 12;
  uint32 commit_marker_tokens = 13;
  uint32 max_cfg_branches = 14;
  uint32 encoder_cache_entries = 15;
}

// ---------------------------------------------------------------- the spec

// What an engine serves and how: the deployment's serving options that
// concern the engine, under the names the serving options give them, and
// what the daemon resolved from the model. A value an option table names by
// a word (a policy, a backend, an element type) travels as that word.
message EngineSpec {
  // The deployment: its served model name, under which the Storage Servers
  // keep its claims and pages.
  string deployment = 1;
  // The model: a local directory or a Hugging Face repository.
  string model = 2;
  // The host identity of the leader, where the engine process runs.
  string host = 3;
  Placement placement = 4;
  reserved 5;
  // Product transport per worker edge (`placement_config.transfer`); empty
  // for the defaults.
  string transfer = 6;
  Scheduling scheduling = 7;
  KvCache kv_cache = 8;
  Workers workers = 9;
  CudaGraphs cuda_graphs = 10;
  FlashInfer flashinfer = 11;
  Video video = 12;
  Experts experts = 13;
  ModelFacts model_facts = 14;
  reserved 15;
  reserved "standby";
  // The world the engine executes: the daemon's identity of the processes
  // that execute one configuration of the deployment, which keys the memory
  // they create. An engine relaunched after a loss keeps its world.
  uint64 world = 16;
  // Present for an engine that succeeds the serving one on the same
  // devices: it prepares beside it, mapping what it shares read-only, and
  // serves once promoted.
  Predecessor predecessor = 17;
  // The KV cache segments each worker group's planes are made of, which an
  // engine that replaces a lost one of its world (or restarts it at a
  // rollback) takes as its own; empty to lay the planes out afresh.
  repeated CacheSegments segments = 18;
  // Worlds of the deployment whose memory ends on every node before this
  // engine's workers start: the world on trial a rollback discards, whose
  // memory the previous world, started again on its kept weights, needs.
  repeated uint64 retire = 19;
  // Speculative decoding with the model's drafter (`speculative_config`);
  // absent for a deployment that does not speculate. A world that
  // speculates keeps the drafter's draft cache in its pool, so any change
  // of it is a world change.
  Speculation speculation = 20;
  // The always-on profiling of the workers (`profiling_config`); absent for
  // none.
  Profiling profiling = 21;
}

// Speculative decoding with the model's drafter.
message Speculation {
  // The most draft tokens one verification carries per request; at least
  // one.
  uint32 num_draft_tokens = 1;
}

// The workers' always-on profiling.
message Profiling {
  // Whether the fence probes record: the device switch every probe reads.
  bool fence_probes = 1;
  // The components whose module instances carry fence probes in the graphs
  // the workers capture, as name patterns (`*` matches any run).
  repeated string fence_components = 2;
  // Whether every worker enables CUPTI's PC sampling, stopped, before it
  // captures its CUDA graphs and keeps it enabled for its life, so that a
  // session's PC samples of graph kernels are attributed; sessions of PM
  // sampling, range metrics and whole-graph timelines are then refused.
  bool graph_pc_sampling = 3;
}

// What an engine that succeeds another maps of it.
message Predecessor {
  // The predecessor's world.
  uint64 world = 1;
  // Each worker group's KV cache segments the predecessor holds, which the
  // successor's ranks map read-only behind segments of their own.
  repeated CacheSegments segments = 2;
}

// Where the ranks run: a deployment file, or the shorthand.
message Placement {
  // A deployment file (`worker_groups`), placed on `EngineSpec.host`; empty
  // for the shorthand.
  string worker_groups = 1;
  uint32 tensor_parallel_size = 2;
  uint32 data_parallel_size = 3;
  string device = 4;
  uint32 queue_depth = 5;
  // Hosts after the leader the shorthand spreads ranks across.
  repeated string worker_hosts = 6;
  double mem_fraction_static = 7;
}

message Scheduling {
  // `fcfs` or `priority`.
  string policy = 1;
  uint32 max_batch = 2;
  // Absent for the engine's default.
  optional uint32 max_num_batched_tokens = 3;
  uint32 max_running_requests = 4;
  // Absent for an unbounded waiting queue.
  optional uint64 max_queued_requests = 5;
  // Absent for the engine's default.
  optional uint32 chunked_prefill_size = 6;
  // The draft cache refill policy of a deployment that speculates
  // (`speculative_config.expected_speedup`, `refill_token_cost`); absent
  // for the engine's defaults.
  optional double expected_speedup = 7;
  optional double refill_token_cost = 8;
}

message KvCache {
  optional uint64 max_tokens = 1;
  optional uint32 block_size = 2;
  // Empty for each layer's compute type.
  string dtype = 3;
  bool prefix_caching = 4;
  bool host_tier = 5;
  // Absent when the deployment keeps no KV storage.
  Mooncake mooncake = 6;
  // The pages of the largest block size between the aligned boundaries a
  // long prompt offloads its sliding windows before; absent for the
  // engine's default.
  optional uint32 boundary_interval = 7;
  reserved 8;
  // The host KV cache's token count over the device KV cache's, the same on
  // every rank of a world; absent for the engine's default (2.0).
  optional double host_ratio = 9;
  // The bytes of the deployment's host KV cache on each host, over the
  // ranks there, in place of `host_ratio`; absent to size it by the ratio.
  optional uint64 host_bytes = 10;
  // The decoded tokens between two checkpoints of a request's state kept
  // per request slot; absent for the engine's default.
  optional uint32 state_interval = 11;
}

message Mooncake {
  string master = 1;
  string metadata_server = 2;
  string protocol = 3;
  string device = 4;
  uint64 segment_bytes = 5;
  // Empty for the loader's search path.
  string library = 6;
}

message Workers {
  string executable = 1;
  uint64 watchdog_timeout_ms = 2;
  // Empty when unset.
  string mesh = 3;
  // Empty when unset.
  string distributed_backend = 4;
  bool standby = 5;
  string attention_backend = 6;
  string dtype = 7;
  // The precision policy, a JSON object.
  string quantization_config = 8;
  string load_format = 9;
  // Empty when unset.
  string download_dir = 10;
  optional uint32 load_threads = 11;
  // `auto`, `resident` or `suspended`; empty for `auto`.
  string standby_memory = 12;
  // A plugin's weight source (`scheme://...`) that streams the checkpoint's
  // tensors in place of its files, as an in-place weight update from it
  // left them; empty to read the files.
  string weights = 13;
  // The tensor- and expert-parallel degrees retained weight memory is
  // chunked for; empty for every degree up to the GPUs a worker sees.
  repeated uint32 parallel_degrees = 14;
}

message CudaGraphs {
  // `auto`, `full` or `off`: a worker group runs every call with CUDA
  // graphs, or every call eagerly.
  string policy = 1;
  // Prefill and image denoising always capture under graphs.
  reserved 2, 3;
  // Image denoising captures the row buckets its executor derives.
  reserved 6;
  reserved "flow_batch_sizes";
  // Each list is absent for the worker's catalog.
  Sizes decode_batch_sizes = 4;
  Sizes prefill_token_sizes = 5;
  Shapes flow_shapes = 7;
}

message Sizes {
  repeated uint32 values = 1;
}

message Shapes {
  repeated Shape shapes = 1;
}

message Shape {
  uint32 height = 1;
  uint32 width = 2;
}

message FlashInfer {
  uint64 workspace_size = 1;
  optional bool use_tensor_core = 2;
  string decode_backend = 3;
  string prefill_backend = 4;
  optional uint32 decode_split_tile_size = 5;
  optional uint32 prefill_split_tile_size = 6;
  bool split_kv = 7;
}

message Video {
  double max_seconds = 1;
  double min_seconds = 2;
  repeated string resolutions = 3;
  repeated string aspect_ratios = 4;
  // Absent for the default capacities.
  Sizes text_capacities = 5;
  optional uint32 max_condition_rows = 6;
  string ffmpeg = 7;
}

message Experts {
  bool expert_parallel = 1;
  // `alltoall`, `megamoe`, `deepep` or `dwdp`.
  string exchange = 2;
  uint32 microbatches = 3;
}

// What the daemon resolved from the model's checkpoint.
message ModelFacts {
  // The model's generation requirements, which the engine intersects with
  // its workers' capacities.
  GenerationLimits limits = 1;
  uint32 bos = 2;
  // Every end-of-sequence token, the primary one first.
  repeated uint32 eos = 3;
  uint32 end_of_image = 4;
  uint32 max_model_len = 5;
  // A block-diffusion model's canvas sampling; absent for other models.
  CanvasSampling canvas_sampling = 6;
  // Whether a prompt's prefill returns outputs, which only conditioning
  // prefills of block-diffusion models do not.
  bool prefill_outputs = 7;
}

message CanvasSampling {
  uint32 canvas_length = 1;
  uint32 max_steps = 2;
  float entropy_bound = 3;
  float t_min = 4;
  float t_max = 5;
  float confidence_threshold = 6;
  uint32 stability_threshold = 7;
}
