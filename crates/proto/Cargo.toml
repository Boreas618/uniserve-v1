[package]
name = "proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The interfaces that cross builds: the process interface between daemons and
# engine processes and the request interface between the leader daemon and an
# engine process, as Protobuf schemas compiled at build time, their codec on
# the workspace's one connection, and the request vocabulary both ends work
# with.
[dependencies]
anyhow.workspace = true
bitflags.workspace = true
humantime.workspace = true
libc.workspace = true
prost.workspace = true
# The derive of each option's declared effect (`reload::Reload`).
proto-derive.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_bytes.workspace = true
serde_json.workspace = true
serde_with.workspace = true
# The iteration of the host blocks a deployment may name (`config::HostBlock`).
strum.workspace = true
# The workspace's one connection, whose codec the interfaces' envelopes implement.
service.workspace = true
# The one phase vocabulary of operator calls and package slots (`module::Phase`).
scheduling.workspace = true
sha2.workspace = true
# The settings of the servers a deployment states: the Mooncake connector of its Storage
# Servers (`kv_cache_config.mooncake`).
storage.workspace = true
thiserror.workspace = true
toml.workspace = true

[build-dependencies]
prost-build.workspace = true
protox.workspace = true
sha2.workspace = true

[lints]
workspace = true

[dev-dependencies]
