[package]
name = "manager"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# `uniserve-manager`: the optional external manager of deployments. It knows
# the daemons only through their HTTP admin API, whose schema it reads from
# the interface crate the daemons serve it from (`proto::admin`).
[[bin]]
name = "uniserve-manager"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
# The admin API's schema (`proto::admin`).
proto.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
# Stand-in daemons' admin APIs, which serve the admin schema the update ordering is tested
# against.
axum.workspace = true
# A package's parameters in the stand-ins' dry runs (`proto::module::PackageRevision`).
toml.workspace = true

[lints]
workspace = true
