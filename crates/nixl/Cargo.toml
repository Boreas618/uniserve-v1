[package]
name = "nixl"
description = "NIXL agents with the UCX backend: storage registration, metadata exchange and READs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The crate binds NIXL's C API itself: every NIXL call resolves in
# `libnixl_capi.so` when the library loads at run time, so building needs
# no NIXL installation and no binary links NIXL; a process that never
# creates an agent never loads it.
[dependencies]
libloading.workspace = true
thiserror.workspace = true

[dev-dependencies]
cuda.workspace = true

[lints]
workspace = true
