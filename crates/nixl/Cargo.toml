[package]
name = "nixl"
description = "NIXL agents with the UCX backend: memory registration, metadata exchange and READs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Every NIXL call resolves in `libnixl_capi.so` at run time (`nixl-sys`'s
# `stub-api` build), so building needs no NIXL installation and no binary
# links NIXL; a process that never creates an agent never loads it.
[dependencies]
libloading.workspace = true
nixl-sys.workspace = true
thiserror.workspace = true

[dev-dependencies]
cuda.workspace = true

[lints]
workspace = true
