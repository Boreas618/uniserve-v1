# The `priority` scheduling policy's package (design §5.2).
#
# Requests are admitted and batched by the priority they carry, then by
# arrival; everything else is `fcfs`. The deployment selects it by naming its
# backend.

op = "scheduling"
backend = "priority"

[toolchain]
kind = "wasm"
version = "50.0.1"

[module]
form = "wasm"

# The policy's arguments and their defaults, as `scheduling_guest::limits::Parameters`
# reads them (design §7.7): a deployment that states none gets these, which are
# the current scheduler's defaults. `max_queued_requests` is absent because
# absent means unbounded, and `timeout` is absent because the guest's default is
# the mechanism's own 30 s starvation cap.
[parameters]
chunked_prefill_size = 8192
max_batch = 128
max_num_batched_tokens = 8192
prefetch_min_tokens = 256

# The package's build script: it compiles the crate to wasm32 and writes the raw
# module the Program Server precompiles (design §5.2, §6.2).
[source]
kind = "wasm"
files = ["Cargo.toml", "src/lib.rs", "src/build.py"]
script = "src/build.py"
