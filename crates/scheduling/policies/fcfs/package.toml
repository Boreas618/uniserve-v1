# The `fcfs` scheduling policy's package (design §5.2).
#
# The default policy: requests in arrival order, which reproduces the rules the
# current scheduler applies, item by item (design §4.4's table, last column).
# The deployment selects it with `scheduler_config.policy = "fcfs"`.

# What this program fills: the scheduling policy of an epoch.
op = "scheduling"
backend = "fcfs"

# The toolchain the package is built with. The Program Server precompiles the
# wasm32 module for the host CPU with this wasmtime, and only an artifact from
# the same engine configuration loads in the main process (design §5.1, §6.2).
[toolchain]
name = "wasm32"
target = "wasm32-unknown-unknown"
rust-version = "1.96"
wasmtime = "50.0.1"

# The module form: a wasm32 binary the Program Server precompiles
# (`WasmSource`, design §6.2) and the scheduler thread instantiates.
[module]
form = "wasm32"
precompiled = true

# The program's arguments and their defaults. Each is a field of
# `scheduling_guest::Parameters`; a deployment that states none gets these,
# which are the current scheduler's defaults (design §7.7).
[arguments.chunked_prefill_size]
default = 8192
description = "Tokens of one prefill chunk."

[arguments.max_queued_requests]
default = "unbounded"
description = "Bound on the waiting queue, counting token and media requests together."

[arguments.max_batch]
default = 128
description = "Calls selected by one scheduling step."

[arguments.max_num_batched_tokens]
default = 8192
description = "Token budget of one scheduling step."

[arguments.prefetch_min_tokens]
default = 256
description = "Smallest prefix-hit deepening worth prefetching from the host KV cache."

[arguments.timeout]
default = "30s"
description = "Longest a resident request may go without progressing before the mechanism treats it as starved."

# `fcfs` is the first-come-first-served policy: it has no tuning data and no
# GPU resources; its whole behaviour is the source below.
[source]
files = ["Cargo.toml", "src/lib.rs"]
