# The `fcfs` scheduling policy's package (design §5.2).
#
# The default policy: requests in arrival order, which reproduces the rules the
# current scheduler applies, item by item (design §4.4's table, last column).
# The deployment selects it by naming its backend.

op = "scheduling"
backend = "fcfs"
interface_version = 4

# The policy is built with the workspace's pinned Rust toolchain.
[toolchain]
kind = "cargo"
version = "1.99.1"

[module]
form = "wasm"

# The policy's arguments and their defaults, as `scheduling::limits::Parameters`
# reads them (design §7.7): a deployment that states none gets these, which are
# the current scheduler's defaults. `max_queued_requests` is absent because
# absent means unbounded, `timeout` is absent because the guest's default is
# the mechanism's own 30 s starvation cap, and `max_num_batched_tokens` is
# absent because absent means the scheduler's own step budget: the deployment's
# `max_num_batched_tokens`, else the widest prefill batch its workers captured.
[parameters]
chunked_prefill_size = 8192
max_batch = 128
prefetch_min_tokens = 256

# The package is this crate: the Build Server snapshots its whole workspace when
# it is installed and builds the crate for wasm32 from that snapshot; the engine
# compiles the module when it loads it. The crate's files are the ones cargo
# packages, so none is listed here.
[source]
kind = "wasm"
files = []
