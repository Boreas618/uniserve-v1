[package]
name = "scheduling"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The host side of the scheduling interface: the wasmtime engine a policy module is compiled for and loaded with."

[dependencies]
thiserror.workspace = true
# The engine a policy module is compiled for and precompiled with: the
# workspace's one pin, which the engine instantiates modules with.
wasmtime.workspace = true

# The Build Server's precompiler: a policy package's raw wasm32 module, in
# the precompiled form the engine loads.
[[bin]]
name = "scheduling-precompile"
path = "src/bin/scheduling_precompile.rs"

[lints]
workspace = true
