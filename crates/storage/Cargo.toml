[package]
name = "storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The Storage Server's protocol and its client. It depends on no workspace
# crate and never links CUDA: the Storage Server outlives builds of every
# other process, which speak to it through this crate.
[dependencies]
libc.workspace = true
rmp-serde.workspace = true
rustix = { workspace = true, features = ["net"] }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
