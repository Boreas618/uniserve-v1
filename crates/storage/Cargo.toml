[package]
name = "storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The Storage Server's protocol and its client. It depends on no workspace
# crate but `service` and never links CUDA: the Storage Server outlives
# builds of every other process, which speak to it through this crate.
[dependencies]
# The destructive interference size of the build's target, which separates the queue pair's
# words written by different sides (`queue::SEPARATION`).
crossbeam-utils.workspace = true
libc.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
service.workspace = true
sha2.workspace = true
thiserror.workspace = true
# The settings document a Storage Server reads (`settings`).
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
