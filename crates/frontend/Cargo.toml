[package]
name = "frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The application layer: the OpenAI-compatible API, input processing (chat
# templates, tokenization, media, each family's request lowering) and output
# processing (detokenization, parsers, response bodies). It runs no numerical
# code: of a family (`processing::Family`) it reads only what request
# processing serves, and the daemon supplies the engines and the HTTP
# connections (`openai::Server`).
[dependencies]
anyhow.workspace = true
asynk-strim-attr.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
# The tokenizer's decoder chain, which the served tokenizer loads.
fastokens.workspace = true
fnv.workspace = true
futures.workspace = true
# The checkpoint's own files and the Hub's cache layout.
hf-hub.workspace = true
image.workspace = true
indexmap.workspace = true
itertools.workspace = true
libc.workspace = true
llm-multimodal.workspace = true
# The media decoders condition media is probed with, the ones that read it.
media.workspace = true
minijinja.workspace = true
minijinja-contrib.workspace = true
processing.workspace = true
proto.workspace = true
reqwest = { workspace = true, features = ["http2", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
serde-json-fmt.workspace = true
serde_with.workspace = true
# Content digests of media, in the key chain the cache stores pages under.
storage.workspace = true
tempfile.workspace = true
thiserror.workspace = true
thiserror-ext.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-futures.workspace = true
url.workspace = true
uuid.workspace = true
validator.workspace = true
winnow.workspace = true
# Builds the deterministic serving tokenizer of the test fixtures.
tokenizers = { workspace = true, optional = true }

[features]
# Test fixtures (`src/test_support.rs`) for the crates whose tests serve
# requests through the frontend.
testing = ["dep:tokenizers"]

[dev-dependencies]
# Enables the crate's own test fixtures, which build the serving tokenizer.
frontend = { path = ".", features = ["testing"] }
criterion.workspace = true
expect-test.workspace = true
tokenizers.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[bench]]
name = "tokenizer_hf"
harness = false

[[bench]]
name = "tool_parsers"
harness = false

[lints]
workspace = true
