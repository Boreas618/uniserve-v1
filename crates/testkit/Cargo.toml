[package]
name = "testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Test support shared by the scheduler's and the daemon's tests: the one test
# double at the worker's batch interface (`ipc::execution::Batches`), the
# pools it states, the stand-in of an engine's request interface the daemon's
# tests serve over it, and the policy module a test epoch installs; for the
# engine's scheduler (in the engine's library), the fake executor of its worker
# groups and the Storage Server's buffer pool served in the test's process.
# Never a dependency of a serving build.
[dependencies]
anyhow.workspace = true
crossbeam-channel.workspace = true
engine.workspace = true
ipc.workspace = true
# The host's monotonic clock, which the buffer pool's task deadlines are stated in.
libc.workspace = true
storage.workspace = true
storage-server.workspace = true
scheduling.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
proto.workspace = true
tempfile.workspace = true
scheduler.workspace = true

[lints]
workspace = true
