[package]
name = "testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Test support for the engine's scheduler and control thread and their callers: the fake
# executor of the scheduler's worker groups and the Storage Server's buffer pool served in the
# test's process, the fake engine that runs the engine's own control thread over them for the
# daemon's tests, the policy module a test engine instantiates, the fake engine at the process
# interface, and the batch-interface fake (`ipc::execution::Batches`) with the inventory it
# states. Never a dependency of a serving build.
[dependencies]
anyhow.workspace = true
crossbeam-channel.workspace = true
engine.workspace = true
ipc.workspace = true
# The host's monotonic clock, which the buffer pool's task deadlines are stated in.
libc.workspace = true
storage.workspace = true
storage-server.workspace = true
# The policy engine a test engine's policy module is loaded with, and the policy's parameters
# and limits.
scheduling.workspace = true
scheduling-guest.workspace = true
uuid.workspace = true
proto.workspace = true
tempfile.workspace = true
# The runtime of the policy module a test engine's schedulers instantiate.
wasmtime.workspace = true
# The cache layout a fake engine's session is laid out for.
worker.workspace = true

[dev-dependencies]
# The policy modules the scheduler's suite states as WebAssembly text.
wasmtime = { workspace = true, features = ["wat"] }

[lints]
workspace = true
