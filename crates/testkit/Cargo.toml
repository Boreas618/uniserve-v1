[package]
name = "testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Test support for the engine's scheduler and control thread and their callers: the fake
# executor of the scheduler's worker groups and the Storage Server's buffer pool served in the
# test's process, the fake engine that runs the engine's own control thread over them for the
# daemon's tests, the policy module a test engine instantiates, the fake engine at the process
# interface, and what the engine's own unit and integration tests serve from (a Storage Server on
# a thread and the launch of a fixture checkpoint). Never a dependency of a serving build.
[dependencies]
anyhow.workspace = true
# A policy package's manifest: by it a test finds the workspace member that is the package, and
# reads the parameters a test engine's policy runs with.
build-server.workspace = true
crossbeam-channel.workspace = true
engine.workspace = true
# The released checkpoints an ignored test reads, resolved into the Hugging Face cache
# (`nn_testing::Release`).
nn-testing.workspace = true
# The tiny checkpoints the engine's tests serve (`models::fixtures`).
models = { workspace = true, features = ["fixtures"] }
# The cache fields a fake engine's model states (`pools::cache`), and the stub family the
# engine's cache tests serve (`fields`).
nn.workspace = true
# The FFmpeg libraries the engine links through the media crate; `build.rs` reads their
# directories from its `links` metadata for the test executables' run path.
media.workspace = true
# The connections of a fake engine's request and process interfaces.
service.workspace = true
storage.workspace = true
storage-server.workspace = true
# The policy's parameters and limits; a test engine's policy module is loaded with the
# engine's own policy host (`engine::scheduler::policy`).
scheduling.workspace = true
# The kernel a test's generation holds and never launches (`serving::unlaunched_kernel`).
ops.workspace = true
platform.workspace = true
# The pipe that wakes a Storage Server's loop to stop.
rustix = { workspace = true, features = ["pipe"] }
# The reports of `cargo metadata` and of a policy package's build.
serde_json.workspace = true
uuid.workspace = true
proto.workspace = true
tempfile.workspace = true
# The policy package's declared parameters, read as the policy's arguments.
toml.workspace = true
# The runtime of the policy module a test engine's schedulers instantiate.
wasmtime.workspace = true

[dev-dependencies]
# The step values a scheduler of the harness reads at every step, which a case replaces.
arc-swap.workspace = true
# The media pipeline a video deployment's groups state: MiniMax-H3's, as its family declares it
# (`nn::pipeline`).
models.workspace = true
# The policy modules the scheduler's suite states as WebAssembly text.
wasmtime = { workspace = true, features = ["wat"] }

[lints]
workspace = true
