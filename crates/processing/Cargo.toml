[package]
name = "processing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Request processing: what a model family supplies to turn public requests
# into engine requests. A chat family names the output formats its checkpoints
# write and renders requests through its chat template; a video family binds
# the request processor that validates and processes its requests. Family
# request preprocessing (the Qwen-VL processor rules, MiniMax-H3's request
# rules) lives here beside its model's numerics, not inside them. It holds no
# runtime object and reads no file of its own.
#
# The crate is the processing program (`package.toml`): built for
# `wasm32-unknown-unknown`, its module serves the families through the
# processing interface (`scheduling::processing`), which the leader daemon
# loads per epoch. The engine links it natively for its numerical facts.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["module"]
# The module's exports over the release's families. A program crate that
# serves other families with this crate's machinery builds it without them, so
# its own exports are the module's only ones.
module = []

[dependencies]
# The strict push parser a JSON tool call is read with as it streams.
actson.workspace = true
# The ordered maps a template's JSON values are, as Python dicts keep their keys.
indexmap.workspace = true
# The schemas of a request's tools, which type and check a tag tool call's arguments.
jsonschema.workspace = true
# The Jinja engine chat templates render in, with Python's string and dict methods.
minijinja.workspace = true
minijinja-contrib.workspace = true
# A video denoiser's description is the family's own Protobuf message (`minimax_h3::wire`).
prost.workspace = true
# The processing interface: its messages, its exports and its host functions, and the video
# vocabulary its messages state.
scheduling.workspace = true
serde.workspace = true
serde_json.workspace = true
# `tojson`'s Python `json.dumps` formatting.
serde-json-fmt.workspace = true
serde_with.workspace = true
thiserror.workspace = true
thiserror-ext.workspace = true

# The custom `getrandom` backend of the wasm32 module (`entropy`), which the schema validator's
# hash maps are seeded through.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom.workspace = true

[dev-dependencies]
criterion.workspace = true
expect-test.workspace = true
itertools.workspace = true
# The program host the module runs in, as the leader daemon runs it, and the build of the module
# its interface tests run (`tests/program.rs`).
program.workspace = true
program-testing.workspace = true

[[bench]]
name = "tool_parsers"
harness = false

# The render and parse cost of the module in the program host against the same calls made
# natively, on long conversations.
[[bench]]
name = "program"
harness = false

[lints]
workspace = true
