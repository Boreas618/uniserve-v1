[package]
name = "processing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Request processing: what a model family supplies to the daemon that turns
# public requests into engine requests. A chat family names the output formats
# its checkpoints write; a video family binds the request processor that
# validates and processes its requests. Family request preprocessing (the
# Qwen-VL processor rules, MiniMax-H3's request rules) lives here beside its
# model's numerics, not inside them. It holds no runtime object and reads no
# file of its own.
[dependencies]
proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
