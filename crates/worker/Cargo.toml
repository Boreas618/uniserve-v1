[package]
name = "uniserve-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

# The cdylib is the library `uniserve_models.worker` loads through TVM-FFI;
# the rlib serves Rust tests and benches.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
base64.workspace = true
crossbeam-channel.workspace = true
indexmap.workspace = true
libc.workspace = true
nvtx.workspace = true
png.workspace = true
rustix = { workspace = true, features = ["pipe", "fs", "system"] }
serde.workspace = true
serde_json.workspace = true
signal-hook-registry.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tvm-ffi.workspace = true
uniserve-core.workspace = true
uniserve-cuda.workspace = true
uniserve-ipc.workspace = true
uuid.workspace = true

# A TVM-FFI library that Python GPU tests load to drive the native KV owners
# with the real numerical interface (tests/python/integration/storage).
[[example]]
name = "storage_harness"
crate-type = ["cdylib"]

# A TVM-FFI library that Python tests load to drive the image runners with
# the real numerical interface (tests/python/integration/runtime).
[[example]]
name = "image_harness"
crate-type = ["cdylib"]

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# Expert-step agreement latency over the host group (separate processes).
[[bench]]
name = "expert_agreement"
harness = false
