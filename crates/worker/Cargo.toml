[package]
name = "worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The cdylib is the worker library `uniserve/_worker`, which the
# `uniserve` executable's `worker` command loads and calls and Python loads through
# TVM-FFI for the video rules it exports; the rlib serves Rust tests and
# benches.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
base64.workspace = true
bytemuck.workspace = true
crossbeam-channel.workspace = true
cuda.workspace = true
indexmap.workspace = true
ipc.workspace = true
libc.workspace = true
libloading.workspace = true
models.workspace = true
nvtx.workspace = true
png.workspace = true
# The C API types of the interpreter a worker hosts; its functions are
# resolved from the process at run time (`launch::python`), so nothing links
# libpython.
pyo3-ffi = { version = "0.30.1", features = ["extension-module"] }
rustix = { workspace = true, features = ["pipe", "fs", "system"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook-registry.workspace = true
storage.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tvm-ffi.workspace = true
uuid.workspace = true

# A TVM-FFI library that Python GPU tests load to drive the native cache owners
# with the real numerical interface (tests/python/integration/storage).
[[example]]
name = "storage_harness"
crate-type = ["cdylib"]

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# Fixed-width host gather latency, an expert step's agreement round
# (separate processes).
[[bench]]
name = "host_gather"
harness = false
