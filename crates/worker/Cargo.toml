[package]
name = "worker"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Execution: one executor thread per device, the runners that serve a model through its
# capability traits, their captured graphs, the sampler, and the device memory a rank holds.
# `worker → nn → backend → ops → platform`, beside the tensor library.
[dependencies]
media = { path = "../media" }
# The execution context a runner's forwards compute under, and tensors over memory the worker
# owns: weights, cache planes, recurrent state and a graph's inputs.
backend.workspace = true
base64.workspace = true
bytemuck.workspace = true
crossbeam-channel.workspace = true
platform.workspace = true
indexmap.workspace = true
ipc.workspace = true
libc.workspace = true
libloading.workspace = true
nvtx.workspace = true
nn.workspace = true
ops.workspace = true
# Tensors: a runner's inputs and a forward's outputs.
uniserve-tensor.workspace = true
proto.workspace = true
rusqlite.workspace = true
rustix = { workspace = true, features = ["fs", "pipe", "system"] }
serde.workspace = true
serde_json.workspace = true
storage.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
