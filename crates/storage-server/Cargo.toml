[package]
name = "storage-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# The integration tests are the one target `[[test]]` names; `tests/helper` is their helper
# executable, not a test.
autotests = false

# The Storage Server of one host, its Mooncake connector and its Transfer
# Server. It links no CUDA runtime: the server holds device storage only
# through descriptors and asks NVML (`platform`) which processes a GPU still
# lists, and the Transfer Server loads the CUDA driver, and NIXL for copies
# between hosts (`transfer::nixl`), at run time.
[dependencies]
anyhow.workspace = true
clap.workspace = true
platform.workspace = true
libc.workspace = true
mooncake_store.workspace = true
# The program host the deployment's KV program runs in (`programs`), and the SDK's types of its
# hooks' inputs and outputs.
program.workspace = true
scheduling.workspace = true
# NIXL's C API library, which the Transfer Server opens at run time (`transfer::nixl`).
libloading.workspace = true
rmp-serde.workspace = true
serde_bytes.workspace = true
rustix = { workspace = true, features = ["event", "fs", "mm", "net", "param", "pipe", "process", "rand", "system", "time"] }
serde.workspace = true
# `storage-server list --json`, and the host's transfer calibration document
# (`transfer::calibration`).
serde_json.workspace = true
service.workspace = true
storage.workspace = true
thiserror.workspace = true
# The cluster directory's subscription to Mooncake's object events (`directory::events`): a
# ZMQ SUB socket on a thread of its own, which runs its own single-threaded runtime.
tokio = { workspace = true, features = ["rt", "time"] }
zeromq.workspace = true
# The connector's settings document on its standard input.
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
# The master's event batches, as the tests' publishers encode them.
rmp.workspace = true
# The integration tests replay the traces their servers record (`buffer_pool::replay`).
storage-server = { path = ".", features = ["verification"] }
tempfile.workspace = true
# The device cases write the servers' records to their output (`RUST_LOG`).
tracing-subscriber.workspace = true

[features]
# The checks of the buffer pool against its design model (`buffer_pool::replay`,
# `buffer_pool::enumeration`, the `buffer-pool-verify` command): verification, not serving.
verification = []

# The integration tests' helper executable: the `storage-server` command, which a test's server
# runs its children and a restart's successor from, and the client processes a test's server
# follows (`CARGO_BIN_EXE_storage-server-helper`).
[[bin]]
name = "storage-server-helper"
path = "tests/helper/main.rs"
test = false
doc = false
bench = false

# The checks of the buffer pool against its design model (`tools/verification/buffer-pool`).
[[bin]]
name = "buffer-pool-verify"
path = "src/bin/buffer-pool-verify.rs"
required-features = ["verification"]
test = false
doc = false
bench = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
