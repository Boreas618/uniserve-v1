[package]
name = "nn"
description = "Tensor views, layers, capability traits, models and checkpoints"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The shared computation library: layers call `ops` operators and nothing below them. The stream,
# the kernels and the communicator a forward borrows are `ops` names, so the dependency stays
# `nn → ops → platform` (specs/worker.md 3).
[dependencies]
ops = { path = "../ops" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# A checkpoint shard is mapped, not loaded: the loader reads the bytes of one tensor at a time.
memmap2 = "0.9"

[dev-dependencies]
tempfile.workspace = true
# The library reads a shard header itself (a calibrated checkpoint's FP8 scales are names the
# crate's `Dtype` does not have); the tests still write fixtures with the crate, which is the
# format's own serializer.
safetensors = "0.3"

[lints]
workspace = true
