[package]
name = "nn"
description = "Tensor views, layers, capability traits, models and checkpoints"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The shared computation library: layers call `ops` operators and nothing below them. The stream,
# the kernels and the communicator a forward borrows are `ops` names, so the dependency stays
# `nn → ops → platform` (specs/worker.md 3).
[dependencies]
ops = { path = "../ops" }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# A checkpoint shard is mapped, not loaded: the loader reads the bytes of one tensor at a time.
memmap2 = "0.9"
# A computed weight has no file to name it, so its key carries a digest of the bytes it produced.
sha2.workspace = true
safetensors = "0.8.0"
# A model named by its Hugging Face repository id resolves to the local Hub cache's snapshot.
hf-hub.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
