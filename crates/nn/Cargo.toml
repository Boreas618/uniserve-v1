[package]
name = "nn"
description = "Modules, fused operators, weight loading and capability traits over the tensor library"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The neural-network library: `nn → backend → ops → platform`, beside the tensor library. A model
# crate depends on `nn`, `uniserve-tensor` and `processing` only; what it may name of the crates
# below is re-exported here.
[dependencies]
# Tensors, views and the CPU device every fused operator states its formula on.
uniserve-tensor.workspace = true
# Tensors over retained and allocated device storage, the one dispatch point, collectives and
# profiler ranges.
backend.workspace = true
# The operators a fused function launches: descriptors, arguments and keys.
ops.workspace = true
# A family states what request processing serves of it beside what execution loads.
processing.workspace = true
# The phase vocabulary of a kernel's selection key (`proto::program::PhaseKind`).
proto.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# A checkpoint shard is mapped, not loaded: the loader reads the bytes of one tensor at a time.
memmap2 = "0.9"
# A computed weight has no file to name it, so its key carries a digest of the bytes it produced.
sha2.workspace = true
safetensors = "0.8.0"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
