[package]
name = "nn"
description = "Tensor views, layers, capability traits, models and checkpoints"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The shared computation library: layers call `ops` operators and nothing below them. The stream,
# the kernels and the communicator a forward borrows are `ops` names, so the dependency stays
# `nn → ops → platform`.
[dependencies]
ops = { path = "../ops" }
# The element type of a kernel operand (`DType`).
uniserve-tensor.workspace = true
# A family states what request processing serves of it beside what execution loads.
processing.workspace = true
# The phase vocabulary of a program's selection key (`proto::module::PhaseKind`).
proto.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# A checkpoint shard is mapped, not loaded: the loader reads the bytes of one tensor at a time.
memmap2 = "0.9"
# A computed weight has no file to name it, so its key carries a digest of the bytes it produced.
sha2.workspace = true
safetensors = "0.8.0"

[dev-dependencies]
tempfile.workspace = true
# The device cases (`tests/reference.rs`, `tests/support/device.rs`) run layers on a device: they
# allocate and copy through `platform` and ask a running Build Server for the kernels their
# forwards name.
platform.workspace = true
build-server.workspace = true

[lints]
workspace = true
