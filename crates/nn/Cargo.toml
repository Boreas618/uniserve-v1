[package]
name = "nn"
description = "Tensor views, layers, capability traits, models and checkpoints"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The shared computation library: layers call `ops` operators and nothing below them. The stream,
# the kernels and the communicator a forward borrows are `ops` names, so the dependency stays
# `nn → ops → platform`.
[dependencies]
ops = { path = "../ops" }
# A family states what request processing serves of it beside what execution loads.
processing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# A checkpoint shard is mapped, not loaded: the loader reads the bytes of one tensor at a time.
memmap2 = "0.9"
# A computed weight has no file to name it, so its key carries a digest of the bytes it produced.
sha2.workspace = true
safetensors = "0.8.0"

[dev-dependencies]
tempfile.workspace = true
# The equivalence harness (`tests/equivalence.rs`) runs layers on a device: it allocates and copies
# through `platform` and asks a running Program Server for the kernels its forwards name.
platform.workspace = true
program-server.workspace = true

[lints]
workspace = true
