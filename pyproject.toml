[build-system]
requires = [
    "setuptools>=70",
    "wheel",
    "setuptools-rust>=1.7",
]
build-backend = "setuptools.build_meta"

# The repository holds no Python package of its own. This project is what
# `uv sync` builds and installs: the `uniserve` executable, onto the
# environment's `bin/`, with the development, test and evaluation tools beside
# it. The Program Server keeps its own environment
# (`crates/program-server/python`), the one place a compiler runs Python.
[project]
name = "uniserve"
version = "2.0.0"
description = "UniServe: the Rust serving runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "httpx",
    "pytest>=8.1",
    "pytest-timeout>=2.3",
    # The HTTP tests and the numeric diagnosis compare served tensors, and
    # tokenize with the checkpoint's own tokenizer.
    "numpy",
    "safetensors",
    "torch>=2.13,<2.14",
    "transformers>=4.57.1",
]
dev = [
    "build>=1.2",
    "markdown-it-py<4.0",
    "mypy>=1.11",
    "pyright>=1.1",
    "ruff>=0.6",
]
bench = [
    "uniserve-eval[datasets]",
]
# The native libraries a GPU host takes from this environment: the NCCL
# `crates/platform` opens by name (`tools/check_nccl.sh` states the directory)
# and the CUPTI that sits beside the CUDA runtime.
gpu = [
    "nvidia-cuda-cupti; sys_platform == 'linux'",
    "nvidia-nccl-cu13; sys_platform == 'linux'",
]

[tool.uv.sources]
uniserve-eval = { path = "uniserve_eval", editable = true }

[tool.uv]
# `crates/platform` opens `libnccl.so.2` by name, and `tools/check_nccl.sh`
# holds the library a host hands it to this pin: an older NCCL crashes on the
# first replay of a graph that holds a collective.
#
# PyTorch's `cuda-toolkit` 13.0.3 pins CUPTI 13.0.85, whose software kernel
# timestamps are written by the device into per-kernel host records that
# CUPTI's worker thread may already have freed; on GB200 such a write that
# reaches a page the allocator returned faults the device front end (Xid 31)
# and leaves the context unusable. CUPTI 13.4.92 records kernels, copies and
# fills on the CUDA 13.0 driver without it. Records keep the field offsets the
# reader decodes (`crates/platform/src/cupti/records.rs`).
override-dependencies = [
    "nvidia-nccl-cu13==2.30.4; sys_platform == 'linux'",
    "nvidia-cuda-cupti==13.4.92; sys_platform == 'linux'",
]

[tool.setuptools]
# The benchmark driver is packaged independently
# (`uniserve_eval/pyproject.toml`); this distribution ships the executable
# alone.
packages = []

# The one executable of every UniServe process, installed onto PATH as
# `uniserve`: `serve` (a node's daemon), `frontend` (the deployment's
# application process), `engine` (a node's main process), `storage` (a host's
# Storage Server) and `rules` (the model-family request rules a plan asks
# for), plus the `program-server` entry a Program Server starts with. It is a
# binary rather than a Python extension module, and serving runs it, so it
# builds with Cargo's release profile even for an editable install, where
# setuptools-rust would otherwise choose a debug build.
[[tool.setuptools-rust.bins]]
target = "uniserve"
path = "Cargo.toml"
debug = false

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "unit: pure local tests without server or external model files",
    "e2e: black-box server or worker tests",
    "gpu: requires a CUDA device; orthogonal to the unit and e2e layers",
    "slow: excluded from the fast local and presubmit suites",
    "model(name): selects a concrete model backend such as qwen3 or minimax_h3",
    "missing_state: a serving path without an optional derived state (weights, KV pages and recurrent checkpoints, draft cache, encoder outputs, latents); runs under compute-sanitizer in the sanitizer workflow",
]

[tool.ruff]
# Enforces the Google Python Style Guide
# (https://google.github.io/styleguide/pyguide.html) on all project Python
# modules: 80-column line limit (guide section 3.4), Google docstring
# convention, and PEP 8 naming. Local reference checkouts under the ignored
# `refs/` directory keep their own per-repository style enforcement.
line-length = 80
target-version = "py311"
extend-exclude = [
    "refs",
    "target",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "N", "C4", "UP"]
ignore = [
    # Docstring presence is not enforced; the format of every docstring is
    # checked.
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D417",
    # Rules incompatible with the Google docstring convention; mirrors the set
    # ruff disables when only `convention = "google"` drives the selection.
    "D203", "D204", "D213", "D215", "D400", "D401", "D404", "D406", "D407",
    "D408", "D409", "D413",
    # `import torch.nn.functional as F` is the established PyTorch alias
    # convention; the Google guide does not prohibit it. pep8-naming's blanket
    # ban on uppercase aliases conflicts with it, so the alias case is waived.
    "N812",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# Use the invoking Python version so installed dependency stubs match CI's runtime.
files = ["uniserve_eval"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["uniserve_eval"]
exclude = ["refs", "target", ".venv"]
reportMissingImports = "warning"
