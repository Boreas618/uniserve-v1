[build-system]
# The worker library links libtvm_ffi; its build script locates it through the
# `tvm-ffi-config` script of the pinned apache-tvm-ffi release.
requires = [
    "setuptools>=70",
    "wheel",
    "setuptools-rust>=1.7",
    "apache-tvm-ffi==0.1.14.post1",
]
build-backend = "setuptools.build_meta"

[project]
name = "uniserve"
version = "2.0.0"
description = "UniServe: Rust serving runtime with the uniserve numerical library."
readme = "README.md"
requires-python = ">=3.11"
# Keep the CUDA-13 PyTorch and torchvision release lines aligned. The locked
# Linux wheels bring their matching NCCL and NVSHMEM runtime dependencies.
dependencies = [
    # The Rust worker and the numerical library exchange functions and tensors
    # only through TVM-FFI; the Rust crate pins the same release.
    "apache-tvm-ffi==0.1.14.post1",
    "torch>=2.13,<2.14",
    "torchvision>=0.28,<0.29",
    "transformers>=4.57.1",
    "safetensors",
    "numpy",
    "pillow",
    "packaging<=25.0",
    "huggingface_hub",
    "diffusers>=0.40",
    "av>=14",
    # The media reader resamples condition audio with torchaudio's resampler,
    # the one the reference pipelines use. The 2.11 resampler runs on the
    # pinned torch through torch's own operators.
    "torchaudio>=2.11,<2.12",
    # NVML's per-process device usage, which device storage grants charge.
    "nvidia-ml-py",
    # UniServe's own Triton and CuTe device kernels. Native extensions and
    # their build tools are selected through the kernel package's extras.
    "uniserve-kernels",
]

[project.optional-dependencies]
test = [
    # Extension build tests drive torch's C++ extension build.
    "ninja>=1.13",
    "pytest>=8.1",
    "pytest-timeout>=2.3",
]
dev = [
    "build>=1.2",
    "markdown-it-py<4.0",
    "mypy>=1.11",
    "pyright>=1.1",
    "ruff>=0.6",
]
bench = [
    "uniserve-eval[datasets]",
]
# Optional accelerator kernels for GPU serving. Model bindings require their
# declared native capabilities at startup. The extras of the `uniserve-kernels`
# pack add its native extensions and FlashAttention-4 runtime. The dense,
# sparse, and quantized providers these packages back are shared runtime
# capabilities, so they are selected by hardware rather than by model; native
# builds require a CUDA 13 toolkit.
gpu = [
    "flashinfer-python==0.6.18",
    "ninja>=1.13",
    "requests[socks]>=2",
    "uniserve-kernels[host_memory,sparse_attention,flash_attn_4,megamoe]",
]

[tool.uv.sources]
uniserve-kernels = { path = "uniserve_kernels", editable = true }
uniserve-eval = { path = "uniserve_eval", editable = true }

[tool.uv]
# DeepEP's elastic transport uses the GIN request and traffic-class APIs
# supplied by NCCL 2.30.4. Keep one NCCL runtime for PyTorch and DeepEP.
override-dependencies = [
    "nvidia-nccl-cu13==2.30.4; sys_platform == 'linux'",
]

[tool.setuptools.packages.find]
# UniServe kernels and the benchmark driver are packaged independently
# (`uniserve_kernels/pyproject.toml`, `uniserve_eval/pyproject.toml`) so the
# root serving distribution cannot mask a missing kernel install and does not
# ship a console script whose dependencies it never declares.
include = ["uniserve", "uniserve.*"]

[tool.setuptools.package-data]
# Grouped-expert providers read this fixed tactic catalog at preparation.
uniserve = ["backends/moe/tactics.json"]

# Rust worker runtime. It is a TVM-FFI library rather than a Python extension
# module: `uniserve.worker` loads it with `tvm_ffi.load_module`. Serving
# runs these native targets, so they build with Cargo's release profile even
# for an editable install, where setuptools-rust would otherwise choose a
# debug build.
[[tool.setuptools-rust.ext-modules]]
target = "uniserve._worker"
path = "crates/worker/Cargo.toml"
binding = "NoBinding"
debug = false

# Server/scheduler binary, installed onto PATH as `uniserve`.
[[tool.setuptools-rust.bins]]
target = "uniserve"
path = "crates/bin/uniserve/Cargo.toml"
debug = false

# Per-host launcher for multi-host deployments, installed as `uniserve-launcher`.
[[tool.setuptools-rust.bins]]
target = "uniserve-launcher"
path = "crates/bin/uniserve-launcher/Cargo.toml"
debug = false

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "unit: pure local tests without server or external model files",
    "integration: multi-component tests using fake/simulated backends",
    "e2e: black-box server or worker tests",
    "gpu: requires a CUDA device; orthogonal to the unit, integration and e2e layers",
    "slow: excluded from the fast local and presubmit suites",
    "model(name): selects a concrete model backend such as sensenova or bagel",
    "sensenova: SenseNova-U1-specific test",
]

[tool.ruff]
# Enforces the Google Python Style Guide
# (https://google.github.io/styleguide/pyguide.html) on all project Python
# modules: 80-column line limit (guide section 3.4), Google docstring
# convention, and PEP 8 naming. Local reference checkouts under the ignored
# `refs/` directory keep their own per-repository style enforcement.
line-length = 80
target-version = "py311"
extend-exclude = [
    "refs",
    "target",
    ".venv",
    # Preserve upstream style for the vendored FlashInfer MegaMoE sources.
    "uniserve_kernels/src/uniserve_kernels/megamoe",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "N", "C4", "UP"]
ignore = [
    # Docstring presence is not enforced; the format of every docstring is
    # checked.
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D417",
    # Rules incompatible with the Google docstring convention; mirrors the set
    # ruff disables when only `convention = "google"` drives the selection.
    "D203", "D204", "D213", "D215", "D400", "D401", "D404", "D406", "D407",
    "D408", "D409", "D413",
    # `import torch.nn.functional as F` is the established PyTorch alias
    # convention; the Google guide does not prohibit it. pep8-naming's blanket
    # ban on uppercase aliases conflicts with it, so the alias case is waived.
    "N812",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# Use the invoking Python version so installed dependency stubs match CI's runtime.
files = ["uniserve", "uniserve_eval"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["uniserve", "uniserve_eval"]
exclude = ["refs", "target", ".venv"]
reportMissingImports = "warning"
