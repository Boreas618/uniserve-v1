# The `memcheck` engine package: an implementation of the engine interface
# whose executable runs the tree's engine under compute-sanitizer's memcheck
# (`memcheck-engine`). The sanitizer workflow installs it at each test module's
# Build Server and selects it with `worker_config.engine=memcheck`.

op = "engine"
backend = "memcheck"
# The engine interface of the engine it runs (`crates/engine/package.toml`): the daemon refuses an
# engine package of another version than it speaks.
interface_version = 8

# The executable is stored as it is: nothing compiles it.
[toolchain]
kind = "none"
version = ""

[module]
form = "executable"

[source]
kind = "executable"
files = ["memcheck-engine"]
