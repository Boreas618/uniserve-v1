# OmniRef on four GPUs of one host: a Ulysses4 transformer_ref denoiser and a
# TP4 text encoder.

[[worker_groups]]
id = "model"
ranks = ["cuda:0-3"]
queue_depth = 6

[worker_groups.blocks.transformer_ref]
sequence_parallel = { kind = "ulysses", ulysses_degree = 4 }

[worker_groups.blocks.text_encoder]
tensor_parallel_size = 4

[worker_groups.blocks.video_decoder]

[worker_groups.blocks.audio_decoder]
distribution = "temporal_units"

[worker_groups.blocks.latent_encoder]
distribution = "temporal_units"

# The media components are placed on this group's CUDA ranks: the codecs encode and assemble on
# the host inside the main process (the worker's `Media` lane), and a main process serves CUDA
# devices only - a rank on `cpu` is refused when the node is launched. `video_codec` takes one
# unit per rank (the resolver inserts its temporal distribution); the muxer and the reader serve
# on one rank, as an ordinary component with a one-rank world.
[worker_groups.blocks.video_codec]

[worker_groups.blocks.muxer]
ranks = [0]

[worker_groups.blocks.media_reader]
ranks = [0]
