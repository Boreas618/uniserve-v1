# FastH3 on four GPUs of one host: a Ulysses4 denoiser and a TP4 text encoder.
#
# The denoiser's projection is `exchange`: each rank projects its own rows for all heads with
# whole weights and sends each member that member's head shard. `gather`, the protocol's default,
# gathers every member's rows once and projects a rank's own heads with its share of the weights.

[[worker_groups]]
id = "model"
ranks = ["cuda:0-3"]
queue_depth = 6

[worker_groups.components.transformer]
sequence_parallel = { kind = "ulysses", ulysses_degree = 4, projection = "exchange" }

[worker_groups.components.text_encoder]
tensor_parallel_size = 4

[worker_groups.components.video_decoder]

[worker_groups.components.audio_decoder]
distribution = "temporal_units"

[worker_groups.components.latent_encoder]
distribution = "temporal_units"

# The media components are placed on this group's CUDA ranks: the codecs encode and assemble on
# the host inside the main process (the executor's `Media` lane), and a main process serves CUDA
# devices only - a rank on `cpu` is refused when the node is launched. `video_codec` takes one
# unit per rank (the resolver inserts its temporal distribution); the muxer and the reader serve
# on one rank, as an ordinary component with a one-rank world.
[worker_groups.components.video_codec]

[worker_groups.components.muxer]
ranks = [0]

[worker_groups.components.media_reader]
ranks = [0]
