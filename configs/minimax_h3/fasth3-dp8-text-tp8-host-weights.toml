[[worker_groups]]
id = "text"
ranks = ["cuda:0-7"]
queue_depth = 24
mem_fraction_static = 0.18

[worker_groups.blocks.text_encoder]
tensor_parallel_size = 8
[[worker_groups]]
id = "flow"
replicas = 8
ranks = ["cuda:0-7"]
queue_depth = 6
mem_fraction_static = 0.81

[worker_groups.blocks.transformer]
weights = "host"

[worker_groups.blocks.video_decoder]

[worker_groups.blocks.audio_decoder]
distribution = "temporal_units"

[worker_groups.blocks.latent_encoder]
distribution = "temporal_units"

# The media components are placed on this group's CUDA ranks, one set per replica: a request's
# encode, mux and read are host calls the main process of the rank that serves it runs (the
# executor's `Media` lane), and a main process serves CUDA devices only - a rank on `cpu` is
# refused when the node is launched. `video_codec` takes one unit per rank (the resolver inserts
# its temporal distribution); the muxer and the reader serve on one rank.
[worker_groups.blocks.video_codec]

[worker_groups.blocks.muxer]
ranks = [0]

[worker_groups.blocks.media_reader]
ranks = [0]
