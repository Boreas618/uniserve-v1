[[worker_groups]]
id = "model"
ranks = ["rank-0/cuda:0-3", "rank-1/cuda:0-3"]
queue_depth = 6

[worker_groups.components.transformer_ref]
sequence_parallel = { kind = "ulysses", ulysses_degree = 8, projection = "exchange" }

[worker_groups.components.text_encoder]
ranks = [0, 1, 2, 3]
tensor_parallel_size = 4

[worker_groups.components.video_decoder]

[worker_groups.components.audio_decoder]
distribution = "temporal_units"

[worker_groups.components.latent_encoder]
ranks = [4, 5, 6, 7, 0, 1, 2, 3]
distribution = "temporal_units"

# The media components are placed on this group's CUDA ranks: the codecs encode and assemble on
# the host inside the main process (the executor's `Media` lane), and a main process serves CUDA
# devices only. `video_codec` takes one unit per rank (the resolver inserts its temporal
# distribution), so each rank encodes the units of the requests it serves.
[worker_groups.components.video_codec]


# The muxer assembles a response's video and audio into one container. It runs on the leader's host,
# which is where the deployment's read of a request's condition media happens too: a request served
# by a rank of another host submits its media calls to that rank, and its mux has no runner there -
# this file places media on the leader's host and states it here rather than on a `cpu` rank the
# node refuses.
[[worker_groups]]
id = "muxer"
ranks = ["rank-0/cuda:0"]
queue_depth = 6

[worker_groups.components.muxer]

[[worker_groups]]
id = "reader"
ranks = ["rank-0/cuda:0"]
queue_depth = 6
mem_fraction_static = 0.04

[worker_groups.components.media_reader]
