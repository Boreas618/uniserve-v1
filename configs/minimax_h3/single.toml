# FastH3 on one GPU of one host: no sequence parallelism and a single-rank text
# encoder. This is the smallest deployment that serves a `t2va` request whole -
# one denoiser rank, one decoder, one encoder - and it is what a first end-to-end
# run uses, because nothing about it depends on a second device.
#
# Every component is placed on this rank, the media ones included: `video_codec`, `muxer` and
# `media_reader` encode and assemble on the host inside the main process (the executor's `Media`
# lane, `MediaStage`), and a main process serves CUDA devices only - a rank on `cpu` is refused
# when the node is launched. So a media component is a component of this group; what it runs on
# is the host, and where it is placed is this rank.
[[worker_groups]]
id = "model"
ranks = ["cuda:0"]
queue_depth = 6

[worker_groups.components.transformer]

[worker_groups.components.text_encoder]
tensor_parallel_size = 1

[worker_groups.components.video_decoder]

[worker_groups.components.audio_decoder]
distribution = "temporal_units"

[worker_groups.components.latent_encoder]
distribution = "temporal_units"

[worker_groups.components.video_codec]

[worker_groups.components.muxer]

[worker_groups.components.media_reader]
