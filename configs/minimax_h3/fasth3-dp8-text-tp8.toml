# FastH3 on eight GPUs of one host: eight one-GPU denoiser replicas sharing one
# TP8 text encoder.

[[worker_groups]]
id = "text"
ranks = ["cuda:0-7"]
queue_depth = 24
mem_fraction_static = 0.18

[worker_groups.components.text_encoder]
tensor_parallel_size = 8

[[worker_groups]]
id = "flow"
replicas = 8
ranks = ["cuda:0-7"]
queue_depth = 6
mem_fraction_static = 0.81

[worker_groups.components.transformer]

[worker_groups.components.video_decoder]

[worker_groups.components.audio_decoder]
distribution = "temporal_units"

[worker_groups.components.latent_encoder]
distribution = "temporal_units"

[[worker_groups]]
id = "encoder"
replicas = 8
ranks = ["cpu*8"]
queue_depth = 6

[worker_groups.components.video_codec]

[[worker_groups]]
id = "reader"
ranks = ["cpu"]
queue_depth = 24

[worker_groups.components.media_reader]

[[worker_groups]]
id = "muxer"
ranks = ["cpu"]
queue_depth = 24

[worker_groups.components.muxer]
